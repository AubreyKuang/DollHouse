<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素小屋 · 测试模式</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="test">
<header class="topbar">
  <h1>像素小屋 <small class="test-badge">测试模式</small></h1>
  <div class="clock" title="游戏时间">
    <span id="dayLabel">1 年 1 月</span>
    <span id="clock">00:00</span>
    <span id="timeIcon">🌙</span>
  </div>
  <div class="clock fund-pill" title="家庭基金">🏦 <span id="fundTop"></span></div>
  <nav class="modes" aria-label="模式">
    <button class="mode on" data-mode="live">🏠 生活</button>
    <button class="mode" data-mode="build">🪑 布置</button>
    <button id="btnWardrobe">👗 衣橱</button>
    <button type="button" id="dailyPaper" class="paper-button" aria-haspopup="dialog">📰 小屋月报</button>
  </nav>
  <div class="speed" aria-label="速度">
    <button data-speed="0" title="暂停">⏸</button>
    <button data-speed="1" class="on" title="正常">▶</button>
    <button data-speed="3" title="快进">⏩</button>
    <button id="btnSound" title="声音">🔇</button>
  </div>
</header>

<main class="layout">
  <div id="stageWrap">
    <div class="scene-frame">
      <div id="stage">
        <canvas id="cv" width="316" height="310" aria-label="两层像素小洋房与院子"></canvas>
        <div id="overlay"></div>
      </div>
    </div>
    <p id="hint" class="hint">👆 先点一位小人，再点家具安排活动 · 拖到另一位身边可互动</p>
    <section id="picnicNotice" class="picnic-notice" hidden aria-label="野餐遇雨">
      <strong>🌧 野餐下雨了，主人要怎么安排？</strong>
      <div id="picnicPlans"></div>
    </section>
  </div>

  <details id="side" open>
    <summary>住户与生活日志</summary>
    <div class="resident-panel">
    <div id="dollList"></div>
    <div id="dollInfo" class="card" hidden></div>
    <div class="community-panel">
      <button id="btnCommunity" class="btn ghost" aria-haspopup="dialog">🎉 串门与派对</button>
      <button id="btnNeighbor" class="btn ghost" aria-haspopup="dialog">🏡 隔壁麦麦家</button>
      <button id="btnKeepsakes" class="btn ghost" aria-haspopup="dialog">🧵 小屋手记</button>
      <p id="communityStatus" class="community-status" aria-live="polite" hidden></p>
    </div>
    <button id="btnAddDoll" aria-haspopup="dialog" class="btn ghost">＋ 邀请新住户</button>
    <div class="card log-card">
      <div class="log-head"><h3>📜 生活日志</h3><button id="btnLogClear" class="btn small ghost">清空</button></div>
      <div id="logList" class="log-list"></div>
    </div>
    </div>
  </details>
</main>

<dialog id="paperDialog" class="paper-dialog" aria-labelledby="paperTitle">
  <header class="paper-head">
    <h2 id="paperTitle">小屋月报</h2>
    <form method="dialog"><button class="btn small ghost" aria-label="关闭月报">关闭</button></form>
  </header>
  <nav class="paper-issues" aria-label="月报期数">
    <button id="paperOlder" class="btn small ghost" type="button">‹ 上一期</button>
    <span id="paperMonth" aria-live="polite"></span>
    <button id="paperNewer" class="btn small ghost" type="button">下一期 ›</button>
  </nav>
  <section id="paperText" aria-label="本期故事" aria-live="polite"></section>
  <div class="paper-actions">
    <button type="button" id="paperCopy" class="btn small ghost">复制本期</button>
    <button type="button" id="paperCard" class="btn small ghost">保存纪念卡</button>
  </div>
  <details class="paper-settings">
    <summary>设置</summary>
    <label><input id="paperAuto" type="checkbox"> 每月自动打开</label>
    <label><input id="paperOffline" type="checkbox"> 关掉页面后，小屋继续过日子（最多补一天）</label>
  </details>
  <details class="rewind-box">
    <summary>🕰 时光回溯</summary>
    <p class="hint">每月开始时会留一份快照，最多保留 4 个月。回到那个月初后，之后的事会重新发生。</p>
    <div id="rewindList" class="rewind-list"></div>
  </details>
</dialog>
<dialog id="communityDialog" class="paper-dialog community-dialog" aria-labelledby="communityTitle">
  <header class="paper-head">
    <h2 id="communityTitle">串门与派对</h2>
    <form method="dialog"><button class="btn small ghost">关闭</button></form>
  </header>
  <label for="communityHost">邀请人</label>
  <select id="communityHost" class="mbti-picker"></select>
  <p id="communityHelp" class="hint" aria-live="polite"></p>
  <div id="communityChoices" class="community-choices"></div>
</dialog>
<dialog id="neighborDialog" class="paper-dialog community-dialog" aria-labelledby="neighborTitle">
  <header class="paper-head">
    <h2 id="neighborTitle">麦麦家</h2>
    <form method="dialog"><button class="btn small ghost">关闭</button></form>
  </header>
  <div class="neighbor-porch" id="neighborPorch" aria-label="隔壁家门廊"></div>
  <p id="neighborStatus" aria-live="polite"></p>
  <label for="neighborVisitor">去串门的住户</label>
  <select id="neighborVisitor" class="mbti-picker"></select>
  <p id="neighborTie" class="hint"></p>
  <button id="neighborGo" type="button" class="btn small">去麦麦家坐坐</button>
</dialog>
<dialog id="keepsakesDialog" class="paper-dialog community-dialog" aria-labelledby="keepsakesTitle">
  <header class="paper-head">
    <h2 id="keepsakesTitle">小屋手记</h2>
    <form method="dialog"><button class="btn small ghost">关闭</button></form>
  </header>
  <h3>一起做花架</h3>
  <p id="keepsakeStatus" class="hint" aria-live="polite"></p>
  <div class="keepsake-fields">
    <label>第一位住户<select id="keepsakeMaker1" class="mbti-picker"></select></label>
    <label>第二位住户<select id="keepsakeMaker2" class="mbti-picker"></select></label>
    <label>花架颜色<select id="keepsakeFinish" class="mbti-picker"></select></label>
  </div>
  <button id="keepsakeStart" class="btn small" type="button">一起做花架</button>
  <h3>小角落与两人的传统</h3>
  <ul id="keepsakeNotes" class="keepsake-notes"></ul>
  <h3>手作纪念物</h3>
  <ul id="keepsakePieces" class="keepsake-notes"></ul>
</dialog>
<dialog id="applicationsDialog" class="paper-dialog community-dialog" aria-labelledby="applicationsTitle">
  <header class="paper-head">
    <h2 id="applicationsTitle">邀请新住户</h2>
    <form method="dialog"><button class="btn small ghost">关闭</button></form>
  </header>
  <p id="applicationSpace" class="hint"></p>
  <h3>入住申请</h3>
  <div id="applicationList"></div>
  <button id="btnRandomResident" class="btn small ghost">邀请一位新朋友</button>
</dialog>
<section id="buildBar" hidden>
  <div class="shop-bar">
    <span class="fund">🏦 家庭基金 <b id="fundAmt"></b></span>
    <span class="house" id="houseLv"></span>
    <span class="spacer"></span>
    <button id="btnCrowd" class="btn small">📣 号召大家凑钱</button>
    <button id="btnExpand" class="btn small"></button>
  </div>
  <div class="tabs" role="group" aria-label="布置分类">
    <button class="tab on" data-tab="essentials" aria-pressed="true">生活家具</button>
    <button class="tab" data-tab="decor" aria-pressed="false">装饰摆件</button>
    <button class="tab" data-tab="hobbies" aria-pressed="false">兴趣家具</button>
    <button class="tab" data-tab="yard" aria-pressed="false">院子家具</button>
    <button class="tab" data-tab="keepsakes" aria-pressed="false">纪念物</button>
    <button class="tab" data-tab="wall" aria-pressed="false">墙纸</button>
    <button class="tab" data-tab="floor" aria-pressed="false">地板</button>
    <span class="spacer"></span>
    <button id="btnTrash" class="btn small" title="点击家具删除">🗑 删除模式</button>
    <button id="btnReset" class="btn small ghost">恢复默认</button>
  </div>
  <div id="palette" class="palette"></div>
  <p id="buildHint" class="hint">选择家具后点击房间放置 · 点已有家具可以拿起移动 · 右键/Esc 取消</p>
</section>

<div id="wardrobe" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>👗 衣橱</h2>
      <div id="wdTabs" class="wd-tabs"></div>
      <button id="wdClose" class="btn small" aria-label="关闭">✕</button>
    </div>
    <div class="wd-body">
      <div class="wd-preview">
        <canvas id="wdCanvas" width="20" height="24"></canvas>
        <div id="wdSaved" class="wd-saved" aria-live="polite"></div>
        <div class="wd-dir">
          <button data-dir="left">◀</button>
          <button data-dir="down">●</button>
          <button data-dir="right">▶</button>
          <button data-dir="up">▲</button>
        </div>
        <label class="wd-name">名字 <input id="wdName" maxlength="8"></label>
        <button id="wdRandom" class="btn small">🎲 随机搭配</button>
        <button id="wdRemove" class="btn small ghost">请 TA 搬走</button>
      </div>
      <div id="wdOptions" class="wd-options"></div>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

</body>
