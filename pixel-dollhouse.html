/* ---------------- 家具与格子 ---------------- */
function addFurniture(id, x, y) {
  const f = { uid: G.uid++, id, x, y, active: false, users: [] };
  G.furniture.push(f);
  return f;
}
const layerOf = id => FURNITURE[id].layer || 'solid';

function canPlace(id, x, y, ignore) {
  const d = FURNITURE[id], L = layerOf(id);
  if (x < 0 || x + d.w > COLS) return false;
  if (d.outdoor ? y < ROWS + 1 || y + d.h >= YARD_END : y >= ROWS) return false;
  if (L === 'solid' && blocksStairs({ id, x, y })) return false;
  if(y<FLOOR_SPLIT&&y+d.h>FLOOR_SPLIT)return false;
  if (L === 'wall') {
    const start = y < 0 ? UPPER_WALL : 0;
    if (y < start || y + d.h > start + WALL_ROWS) return false;
    if (id === 'door' && y !== WALL_ROWS - 2) return false;
  }
  else if (y < WALL_ROWS || (!d.outdoor && y + d.h > ROWS)) return false;
  if (straddles(x, y, d.w)) return false;
  if (L === 'solid' && blocksDoor({ x, y }, d)) return false;
  for (const f of G.furniture) {
    if (f === ignore || layerOf(f.id) !== L) continue;
    const e = FURNITURE[f.id];
    if (x < f.x + e.w && x + d.w > f.x && y < f.y + e.h && y + d.h > f.y) return false;
  }
  return true;
}

// 能走的格子：地板区域里没有实心家具
function blockedMap() {
  const m = [];
  for (let x = 0; x < COLS; x++) { m[x] = []; for (let y = 0; y < YARD_END; y++) m[x][y] = y < WALL_ROWS; }
  for (const f of G.furniture) {
    if (layerOf(f.id) !== 'solid') continue;
    const d = FURNITURE[f.id];
    for (let i = 0; i < d.w; i++) for (let j = 0; j < d.h; j++) m[f.x + i][f.y + j] = true;
  }
  return m;
}
let BLOCK = null;
function rebuild() {
  BLOCK = blockedMap();
  // 被家具压住的小人挪到最近的空地
  for (const d of G.dolls) {
    if (d.state === 'away' || (d.state === 'act' && d.act.onFurn)) continue;
    if (BLOCK[d.tx] && BLOCK[d.tx][d.ty]) { const p = nearestFree(d.tx, d.ty); if (p) placeDollAt(d, p.x, p.y); }
    if (d.state === 'walk' || d.state === 'arrive') endAct(d);
    d.path = [];
  }
}
const free = (x, y) => x >= 0 && y >= 0 && x < COLS && y < YARD_END && !BLOCK[x][y];

function nearestFree(x, y, floor) {
  const first = floor === 3 ? ROWS : floor === 2 ? FLOOR_SPLIT : WALL_ROWS;
  const end = floor === 1 ? FLOOR_SPLIT : floor === 2 ? ROWS : YARD_END;
  x = Math.max(0, Math.min(COLS - 1, x)); y = Math.max(first, Math.min(end - 1, y));
  const seen = new Set([x + ',' + y]), q = [[x, y]];
  while (q.length) {
    const [cx, cy] = q.shift();
    if (free(cx, cy)) return { x: cx, y: cy };
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy, k = nx + ',' + ny;
      if (nx < 0 || ny < first || nx >= COLS || ny >= end || seen.has(k)) continue;
      seen.add(k); q.push([nx, ny]);
    }
  }
  return null;
}

// BFS 寻路：从 (sx,sy) 走到 goals 里任意一个格子
function findPath(sx, sy, goals) {
  const goalSet = new Set(goals.filter(g => free(g.x, g.y)).map(g => g.x + ',' + g.y));
  if (!goalSet.size) return null;
  const prev = new Map([[sx + ',' + sy, null]]), q = [[sx, sy]];
  while (q.length) {
    const [cx, cy] = q.shift(), k = cx + ',' + cy;
    if (goalSet.has(k)) {
      const path = []; let cur = k;
      while (cur) { const [a, b] = cur.split(',').map(Number); path.unshift({ x: a, y: b }); cur = prev.get(cur); }
      path.shift(); return path;
    }
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]].sort(() => Math.random() - 0.5);
    const neighbors = dirs.map(([dx, dy]) => [cx + dx, cy + dy])
      .filter(([nx, ny]) => !wallBetween(cx, cy, nx, ny));
    if (cx === stairsColumn() && cy === LOWER_LANDING) neighbors.push([cx, UPPER_LANDING]);
    if (cx === stairsColumn() && cy === UPPER_LANDING) neighbors.push([cx, LOWER_LANDING]);
    if (yardGate(cx) && cy === FLOOR_SPLIT - 1) neighbors.push([cx, ROWS]);
    if (yardGate(cx) && cy === ROWS) neighbors.push([cx, FLOOR_SPLIT - 1]);
    for (const [nx, ny] of neighbors) {
      const nk = nx + ',' + ny;
      if (!free(nx, ny) || prev.has(nk)) continue;
      prev.set(nk, k); q.push([nx, ny]);
    }
  }
  return null;
}

// 使用家具时站的位置：优先家具正下方，其次左右两侧
function approachTiles(f) {
  const d = FURNITURE[f.id], out = [];
  const end = f.y < FLOOR_SPLIT ? FLOOR_SPLIT : f.y < ROWS ? ROWS : YARD_END;
  const front = f.y + d.h < end;
  if (front) for (let i = 0; i < d.w; i++) out.push({ x: f.x + i, y: f.y + d.h });
  if (d.mode === 'on' || !front) for (let j = 0; j < d.h; j++) {
    const y = f.y + j, right = f.x + d.w;
    if (!wallBetween(f.x, y, f.x - 1, y)) out.push({ x: f.x - 1, y });
    if (!wallBetween(right - 1, y, right, y)) out.push({ x: right, y });
  }
  if (!front && f.y - 1 >= (f.y < FLOOR_SPLIT ? WALL_ROWS : FLOOR_SPLIT)) {
    for (let i = 0; i < d.w; i++) out.push({ x: f.x + i, y: f.y - 1 });
  }
  return out;
}

/* ---------------- 小人 ---------------- */
function addDoll(src) {
  const d = {
    uid: G.uid++, guest: !!src.guest, pid: src.pid || Math.random().toString(36).slice(2, 10), name: src.name, persona: Object.hasOwn(PERSONAS, src.persona) ? src.persona : 'genki', look: { ...src.look },
    needs: src.needs ? { ...src.needs } : { energy: 60 + Math.random() * 40, hunger: 50 + Math.random() * 40, fun: 50 + Math.random() * 40, social: 50 + Math.random() * 40 },
    x: 0, y: 0, tx: 0, ty: 0, dir: 'down', frame: 0, ft: 0, state: 'idle', path: [], act: null,
    routineTimes: { ...src.routineTimes },
    think: Math.random() * 2, bubble: null, blink: 0, blinkT: 2 + Math.random() * 3, hop: 0, happy: 0,
    gender: src.gender || (Math.random() < 0.5 ? 'f' : 'm'), heart: src.heart || 'normal',
    // 老存档没有星座/MBTI：开局的四位用设定好的，其他人随机
    zodiac: src.zodiac || (DEFAULT_SAVE.dolls.find(o => o.pid === src.pid) || {}).zodiac || randomZodiac(),
    mbti: src.mbti || (DEFAULT_SAVE.dolls.find(o => o.pid === src.pid) || {}).mbti || randomMbti(),
    job: src.job || 'none', money: src.money ?? Math.round((START_MONEY[src.job || 'none'] || 600) + Math.random() * 500), awayUntil: src.awayUntil || 0, lastWorkDay: src.lastWorkDay || 0, leaveJitter: src.leaveJitter || 0, overtime: !!src.overtime,
    vain: typeof src.vain === 'boolean' ? src.vain : undefined,
  };
  isVain(d);
  if (TEST_MODE) d.money = Math.max(d.money, 1000000);
  d.needs.bladder ??= 85;
  G.dolls.push(d);
  if (!BLOCK) BLOCK = blockedMap();
  const p = nearestFree(2 + ((Math.random() * (COLS - 4)) | 0), WALL_ROWS + 1 + ((Math.random() * (ROWS - WALL_ROWS - 2)) | 0));
  if (p) placeDollAt(d, p.x, p.y);
  if(Number.isInteger(src.tx)&&Number.isInteger(src.ty)&&free(src.tx,src.ty))placeDollAt(d,src.tx,src.ty);
  if(src.dir)d.dir=src.dir;
  if (src.away) d.state = 'away';
  return d;
}
function placeDollAt(d, x, y) { d.tx = x; d.ty = y; d.x = x * T + 8; d.y = y * T + 14; }

function say(d, text, dur = 2.6) { if (text) { d.bubble = { text, t: dur, id: Math.random() }; SFX.play('pop'); } }
const pick = a => a[(Math.random() * a.length) | 0];

function takingStairs(d) {
  return d.state === 'walk' && d.path.length > 0 && d.ty < ROWS && d.path[0].y < ROWS && Math.abs(d.path[0].y - d.ty) > 1;
}
const takingYardPath = d => d.state === 'walk' && d.path.length > 0 && (d.ty >= ROWS) !== (d.path[0].y >= ROWS);

function endAct(d) {
  if (takingStairs(d) || takingYardPath(d)) placeDollAt(d, d.tx, d.ty);
  const a = d.act;
  if (G.community.active && ['visitGather', 'visitStay'].includes(a?.type)) delete G.community.active.reserved[d.pid];
  if (a && a.furn) {
    a.furn.users = a.furn.users.filter(u => u !== d);
    a.furn.active = a.furn.users.length > 0;
    if (a.onFurn) placeDollAt(d, a.back.x, a.back.y);
  }
  if (a && a.partner && a.partner.act && a.partner.act.partner === d) { a.partner.act = null; a.partner.state = 'idle'; a.partner.think = 1; }
  d.act = null; d.state = 'idle'; d.hop = 0; d.ft = 0; d.think = 1 + Math.random() * 2;
}

function decide(d) {
  if (joinGetTogether(d)) return;
  const P = PERSONAS[d.persona], N = d.needs, opts = [];
  const want = (gain) => Object.entries(gain).reduce((s, [k, v]) => s + Math.max(0, v) * Math.pow(1 - N[k] / 100, 1.5) * 3, 0);
  for (const f of G.furniture) {
    const F = FURNITURE[f.id];
    if (!F.use || (d.guest && F.use === 'sleep')) continue;
    const cap = F.cap ?? (f.id === 'sofa' || f.id === 'bigbed' ? 2 : 1);
    if (f.users.length >= cap) continue;
    if (PRICES[F.use] && !canAfford(d, PRICES[F.use])) continue;   // 买不起就不去了
    const lover = loverOf(d);
    // 双人床只和恋人一起睡
    if (f.id === 'bigbed' && f.users.length && !f.users.every(u => u === lover)) continue;
    let s = want(F.need) + (P.like[F.use] || 0) + traitBonus(d, F.use) + Math.random() * 25 * noiseMul(d);   // 性格 + 星座/MBTI + 随机
    if (F.outdoor) {
      if (G.weather === 'rain' || G.night) continue;
      s += F.use === 'swing' && ['active', 'genki'].includes(d.persona) ? 24 : 13;
    }
    if (F.use === 'toilet') {
      if (N.bladder >= 48) continue;
      s += N.bladder < 20 ? 75 : 20;
    }
    if (F.use === 'sleep') s += G.night ? 70 : (N.energy > 45 ? -60 : 0);
    else if (G.night && N.energy < 60) s -= 20;
    if (f.id === 'bigbed' && lover) s += f.users.includes(lover) ? 60 : 20;
    if (F.use === 'paint' && d.job === 'artist') s += 40;          // 画家要画画才卖得出画
    if (F.use === 'study' && d.job === 'student') s += 15;
    if (['exercise', 'boxPractice'].includes(F.use) && N.energy < 30) s -= 40;
    if (d.recentFurniture?.use === F.use && d.recentFurniture.at + 125 > absNow() && !['sleep', 'toilet', 'snack', 'cook', 'meal'].includes(F.use)) s -= 25;
    if (F.use === 'party') s += isHolidayParty() ? 50 : -10;           // 圣诞节大家围着圣诞树过节
    if(F.use==='meal'){
      const evening=G.time>=17*60&&G.time<21*60;
      s+=evening?18+f.users.length*12:0;
    }
    if(F.use==='groom')s+=groomBonus(d);              // 爱美的人更常去照镜子
    s+=companionBonus(d,f,F.use);                      // 饭搭子、游戏搭子在用，就想凑过去
    if(inPrivateRoomTile(f)&&!isE(d))s+=6;             // 内向的人喜欢待在卧室里
    const distance = f.y >= ROWS && d.ty < FLOOR_SPLIT ? f.y - ROWS + FLOOR_SPLIT - d.ty : Math.abs(f.y - d.ty);
    s -= (Math.abs(f.x - d.tx) + distance) * 1.2;
    opts.push({ s, type: F.use, furn: f });
  }
  // 只有闲着、闲逛、或在做不重要的小事的人可以被拉去聊天；表演中的人只能被围观
  const others = G.dolls.filter(o => o !== d && (o.state === 'idle' || (o.state === 'walk' && o.act && o.act.type === 'wander') ||
    (o.state === 'act' && o.act && !o.act.onFurn && !Object.hasOwn(ROUTINES, o.act.type) && !JOIN[o.act.type] && o.act.type !== 'chat' && o.act.type !== 'join' && o.act.type !== 'visitStay'))
    && canDisturb(d, o));   // 卧室里的人只会被同屋的人或恋人打扰
  if (others.length) {
    const p = pickPartner(d, others), r = rel(d, p);
    opts.push({ s: want({ social: 30 }) + (P.like.chat || 0) + traitBonus(d, 'chat') + Math.random() * 25 * noiseMul(d) + Math.max(0, r.f) * 0.12 + r.l * 0.15 + (r.lovers ? 15 : 0) + (G.furniture.some(f=>f.id==='sofa'&&Math.hypot(f.x-d.tx,f.y-d.ty)<5)?12:0), type: 'chat', partner: p });
  }
  // 恋人在家就想黏在一起；花心的人会去找暧昧对象，对象不在家时更大胆
  const lover = loverOf(d), lvBusy = lover && (lover.state === 'away' || lying(lover));
  if (d.jealousOf && d.jealousOf.until > absNow() && others.includes(d.jealousOf.who)) opts.push({ s: 999, type: 'chat', partner: d.jealousOf.who, kind: 'argue', jealous: true });
  if (lover && others.includes(lover)) opts.push({ s: want({ social: 30 }) + 28 + rel(d, lover).l * 0.25 + Math.random() * 20, type: 'chat', partner: lover });
  if (d.heart === 'fickle') {
    const crush = others.filter(o => o !== lover && rel(d, o).l >= 15).sort((a, b) => rel(d, b).l - rel(d, a).l)[0];
    if (crush) opts.push({ s: 18 + rel(d, crush).l * 0.5 + (lvBusy ? 30 : lover ? 0 : 10) + Math.random() * 20, type: 'chat', partner: crush });
    if (crush && canTryst(d, crush)) opts.push({ s: 30 + rel(d, crush).l * 0.6 + (lvBusy ? 25 : 0) + Math.random() * 20, type: 'tryst', partner: crush });
  }
  for (const o of G.dolls) {
    if (o === d || !joinable(o) || !canSee(d,o)) continue;
    const J = JOIN[o.act.type], r = rel(d, o);
    const buddy = o.act.type === 'game' && bondTagged(d, o, 'game') ? 25 : 0;
    opts.push({ s: want({ fun: 16, social: 12 }) + (P.like[J.like] || 0) * 0.7 + (P.like.chat || 0) * 0.4 + r.f * 0.25 + r.l * 0.2 + 8 + buddy + traitBonus(d, 'join') + Math.random() * 20 * noiseMul(d) - (G.night ? 15 : 0), type: 'join', target: o });
  }
  opts.push({ s: want({ fun: 10 }) + (P.like.dance || 0) + traitBonus(d, 'dance') + Math.random() * 15 * noiseMul(d) - (G.night ? 20 : 0), type: 'dance' });
  opts.push({ s: 12 + (P.like.wander || 0) + traitBonus(d, 'wander') + Math.random() * 20 * noiseMul(d), type: 'wander' });
  opts.push(...routineOptions(d, want));
  opts.sort((a, b) => b.s - a.s);
  for (const o of opts.slice(0, 4)) if (startAct(d, o)) return;
  d.think = 2;
}

// 让小人去做某件事；成功规划路线返回 true
function startAct(d, o) {
  if (Object.hasOwn(ROUTINES, o.type)) return startRoutine(d, o);
  if (o.type === 'dance') { d.state = 'act'; d.act = { type: 'dance', t: 9 + Math.random() * 4 }; nudgeAudience(d); say(d, pick(ACT_LINES.dance)); return true; }
  if (o.type === 'wander') {
    const goal = nearestFree((Math.random() * COLS) | 0, WALL_ROWS + ((Math.random() * (ROWS - WALL_ROWS)) | 0));
    const path = goal && findPath(d.tx, d.ty, [goal]);
    if (!path || !path.length) return false;
    d.path = path; d.state = 'walk'; d.act = { type: 'wander' };
    if (Math.random() < 0.25) say(d, pick(PERSONAS[d.persona].lines));
    return true;
  }
  if (o.type === 'join') return startJoin(d, o.target);
  if (o.type === 'tryst') return startTryst(d, o.partner);
  if (o.type === 'chat') {
    // 优先站到对方左右两边，这样两个人不会上下叠在一起
    const p = o.partner, side = [[1, 0], [-1, 0]].map(([a, b]) => ({ x: p.tx + a, y: p.ty + b }));
    const path = findPath(d.tx, d.ty, side) || findPath(d.tx, d.ty, [[0, 1], [0, -1]].map(([a, b]) => ({ x: p.tx + a, y: p.ty + b })));
    if (!path) return false;
    d.path = path; d.state = 'walk'; d.act = { type: 'chat', partner: p, pending: true, kind: o.kind, jealous: o.jealous };
    if (o.jealous) { d.jealousOf = null; say(d, `${p.name}，你过来一下！`); }
    if (p.state === 'idle' || (p.state === 'walk' && p.act && p.act.type === 'wander')) { p.path = []; p.act = null; p.state = 'wait'; p.waitT = 8; }
    return true;
  }
  const f = o.furn, F = FURNITURE[f.id];
  const capacity=F.cap ?? (f.id==='sofa'||f.id==='bigbed'?2:1);
  if(f.users.length>=capacity)return false;
  const distinct = F.cap > 1;
  const tiles = approachTiles(f).filter(tile=>!distinct || !f.users.some(user=>{
    const destination=user.path.at(-1)||user;
    return tile.x===(destination.tx??destination.x)&&tile.y===(destination.ty??destination.y);
  }));
  const here = tiles.find(t => t.x === d.tx && t.y === d.ty);
  const path = here ? [] : findPath(d.tx, d.ty, tiles);
  if (!path) return false;
  f.users.push(d);
  d.path = path; d.state = path.length ? 'walk' : 'arrive';
  d.act = { type: F.use, furn: f, gain: F.need, mode: F.mode };
  return true;
}

function arrive(d) {
  const a = d.act;
  if (a?.type === 'visitLeave') { finishGuestDeparture(); return; }
  if (a?.type === 'visitGather') { arriveAtGathering(d); return; }
  if (a && Object.hasOwn(ROUTINES, a.type)) { beginRoutine(d); return; }
  if (a && a.type === 'join') { arriveJoin(d); return; }
  if (a && a.type === 'leave') { exitHome(d); return; }
  if (a && a.type === 'tryst') { arriveTryst(d); return; }
  if (!a || a.type === 'wander') { d.act = null; d.state = 'idle'; d.think = 0.5 + Math.random() * 2; return; }
  if (a.type === 'chat') {
    const p = a.partner;
    if (!G.dolls.includes(p) || p.state === 'lift' || (p.act && p.act.onFurn)) { endAct(d); return; }
    if (p.act && (p.act.type === 'visitStay' || Object.hasOwn(ROUTINES, p.act.type) || (p.act.type === 'chat' && p.act.partner !== d))) { say(d, '在忙呢，下次吧'); endAct(d); return; }
    if (p.act && (p.act.furn || p.act.type === 'join')) endAct(p);
    startSocial(d, p);
    return;
  }
  const f = a.furn, F = FURNITURE[f.id];
  if (!G.furniture.includes(f)) { endAct(d); return; }
  if (PRICES[a.type] && !pay(d, PRICES[a.type], PRICE_NAME[a.type])) { say(d, '钱不够了……'); endAct(d); d.think = 4; return; }
  d.state = 'act';
  a.t = a.type === 'toilet' ? 4 : a.type === 'sleep' ? 28 + Math.random() * 10 : 7 + Math.random() * 5;
  if (JOIN[a.type] && a.type !== 'read') { a.t = 16 + Math.random() * 8; nudgeAudience(d); }
  const PDur = PERSONAS[d.persona].dur; if (PDur && PDur[a.type]) a.t *= PDur[a.type];
  a.t *= durMul(d);   // J 型更专注，P 型更容易换下一件事
  a.back = { x: d.tx, y: d.ty };
  f.active = true;
  if (F.mode === 'on') {
    a.onFurn = true;
    if (f.id === 'sofa' || f.id === 'bigbed') {
      const left = !f.users.some(u => u !== d && u.act && u.act.seat === 0); a.seat = left ? 0 : 1;
      if (f.id === 'sofa') { d.x = f.x * T + 8 + a.seat * 16; d.y = f.y * T + 13; }
    }
    else if (f.id === 'chair' || f.id === 'beanbag') { d.x = f.x * T + 8; d.y = f.y * T + (f.id === 'chair' ? 10 : 12); }
    else if (F.outdoor) {
      a.seat = f.users.some(o => o !== d && o.act?.seat === 0) ? 1 : 0;
      d.x = f.x * T + (f.id === 'gardenSwing' ? 14 : 8) + a.seat * 16;
      d.y = f.y * T + 10;
    }
    d.dir = 'down';
    if (f.id === 'treadmill') { d.x = f.x * T + 18; d.y = f.y * T + 11; d.dir = 'left'; }
  } else {
    // 站在家具前：朝家具的方向
    const cx = (f.x + F.w / 2) * T, cy = (f.y + F.h / 2) * T;
    face(d, cx, cy);
  }
  d.recentFurniture = { use: a.type, at: absNow() };
  countHouseActivity(a.type,d.name);
  if ((F.outdoor || a.type === 'puzzle') && F.cap > 1) {
    const companion = f.users.find(o => o !== d && o.state === 'act');
    if (companion) {
      bump(d, companion, 3);
      addLog(`🌿 ${d.name} 和 ${companion.name} 一起${ACT_NAMES[a.type]}`);
    }
  }
  if(a.type==='meal'){
    if(f.users.some(o=>o!==d&&o.state==='act'))addLog(`🍲 ${d.name} 和室友一起用餐`);
    noteSharedMeal(d,f);
    if(G.time>=17*60&&G.time<21*60)helpWithMeal(d,f);
  }
  if(a.type==='groom')afterGroom(d);
  if (a.type === 'chess') {
    const opponent = f.users.find(o => o !== d && o.state === 'act');
    if (opponent) {
      bump(d, opponent, 2);
      countHouseActivity('chess', `${opponent.name} 和 ${d.name}`);
      addLog(`♟ ${opponent.name} 和 ${d.name} 下了一局棋`);
    }
  }
  const mate = f.id === 'bigbed' && f.users.find(u => u !== d && lying(u));
  say(d, mate ? pick(['晚安～💕', '往里挪一点嘛', '抱着睡～']) : pick(ACT_LINES[a.type] || ['…']));
  if (f.id === 'bigbed' && !mate) inviteLover(d, f);
  if (mate && !(f.coupleLogAt > absNow() - 600)) { f.coupleLogAt = absNow(); addLog(`🛏 ${mate.name} 和 ${d.name} 一起睡了`); }   // 一晚只记一次
  const snd = { snack: 'eat', cook: 'cook', piano: 'piano', game: 'game', bath: 'splash', shower: 'splash', wash: 'splash', cat: 'meow', water: 'splash' }[a.type];
  if (snd) SFX.play(snd);
}

function face(d, x, y) {
  const dx = x - d.x, dy = y - d.y;
  d.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

/* ---------------- 每帧更新 ---------------- */
function updateDoll(d, dt) {
  const P = PERSONAS[d.persona], N = d.needs;
  for (const k in P.decay) N[k] = Math.max(0, N[k] - P.decay[k] * decayMul(d, k) * MIN_PER_SEC / 60 * dt);
  if (G.furniture.some(f => f.id === 'toilet')) N.bladder = Math.max(0, N.bladder - 11 * MIN_PER_SEC / 60 * dt);
  d.blinkT -= dt; if (d.blinkT < 0) { d.blink = 0.15; d.blinkT = 2 + Math.random() * 4; }
  if (d.blink > 0) d.blink -= dt;
  if (d.happy > 0) d.happy -= dt;
  if (d.bubble) { d.bubble.t -= dt; if (d.bubble.t <= 0) d.bubble = null; }
  if (d.state === 'lift') { d.ft += dt; if (d.ft > 0.2) { d.ft = 0; d.frame = (d.frame + 1) % 2; } return; }
  if (workTick(d, dt)) return;

  if (d.state === 'wait') { d.waitT -= dt; if (d.waitT <= 0) d.state = 'idle'; return; }
  if (d.state === 'arrive') { arrive(d); return; }

  if (d.state === 'walk') {
    const n = d.path[0];
    if (!n) { arrive(d); return; }
    if (!free(n.x, n.y)) { endAct(d); d.path = []; return; }
    const gx = n.x * T + 8, gy = n.y * T + 14, dx = gx - d.x, dy = gy - d.y, dist = Math.hypot(dx, dy);
    const onStairs = takingStairs(d);
    const sp = P.speed * T * dt * (N.energy < 20 ? 0.6 : 1) * (takingYardPath(d) ? 6 : onStairs ? 2 : 1);
    if (onStairs) d.dir = n.y === UPPER_LANDING ? 'up' : 'down';
    else if (dist > 0.01) face(d, gx, gy);
    if (dist <= sp) { d.x = gx; d.y = gy; d.tx = n.x; d.ty = n.y; d.path.shift(); if (!d.path.length) arrive(d); }
    else { d.x += dx / dist * sp; d.y += dy / dist * sp; }
    d.ft += dt; if (d.ft > 0.13) { d.ft = 0; d.frame = (d.frame + 1) % 4; }
    return;
  }
  d.frame = 0;

  if (d.state === 'act') {
    const a = d.act;
    if (a.gain) for (const k in a.gain) N[k] = Math.max(0, Math.min(100, N[k] + a.gain[k] / (a.type === 'sleep' ? 10 : 8) * dt));
    if (a.type === 'sleep') N.energy = Math.min(100, N.energy + 2.2 * dt);
    if (a.type === 'visitStay') {
      d.ft += dt;
      if (a.dance) { d.frame = Math.floor(d.ft * 5) % 4; d.hop = d.frame % 2; }
      if (a.theme === 'music' && G.community.active?.hostPid === d.pid && Math.random() < dt * .8) SFX.play('piano');
    }
    if (a.type === 'dance') { d.ft += dt; if (d.ft > 0.25) { d.ft = 0; d.frame = (d.frame + 1) % 4; d.dir = ['down', 'right', 'up', 'left'][d.frame]; } d.hop = d.frame % 2 ? 2 : 0; N.fun = Math.min(100, N.fun + 2 * dt); }
    if (a.type === 'chat') tickSocial(d, dt);
    if (a.type === 'join') { tickJoin(d, dt); if (!d.act) return; }
    if (a.type !== 'chat' && a.type !== 'join' && a.type !== 'sleep' && Math.random() < dt * 0.12) say(d, pick(ACT_LINES[a.type] || ['♪']));
    if (a.type === 'sleep' && Math.random() < dt * 0.15) { d.bubble = { text: 'Zzz…', t: 2, id: Math.random() }; SFX.play('snore'); }
    if (a.type === 'sleep' && a.furn.id === 'bigbed') {
      const mate = a.furn.users.find(u => u !== d && lying(u));
      if (mate && rel(d, mate).lovers) { const r = rel(d, mate); r.l = Math.min(100, r.l + 0.3 * dt); if (Math.random() < dt * 0.08) spawnHeart(d, '💕'); }
    }
    if ((a.type === 'piano' || a.type === 'strum') && Math.random() < dt * 3) SFX.play('piano');
    if (a.type === 'exercise' || a.type === 'boxPractice' || a.type === 'yoga' || ROUTINES[a.type]?.motion === 'stretch') {
      d.ft += dt;
      const interval = a.type === 'exercise' ? .09 : a.type === 'yoga' ? .45 : .23;
      d.frame = Math.floor(d.ft / interval) % 4;
      if (a.type === 'clapGame' || a.type === 'rehearse') d.hop = d.frame % 2;
    }
    if (a.type === 'paint' && d.job === 'artist') d.paintedDay = G.day;
    if (a.type === 'music' && Math.random() < dt * 2) SFX.play('game');
    if (a.type === 'game' && Math.random() < dt * 2) SFX.play('game');
    a.t -= dt;
    const wake = a.type === 'sleep' && !G.night && N.energy > 92;
    if (a.type === 'toilet' && a.t <= 0) N.bladder = 100;
    if (a.t <= 0 || wake) endAct(d);
    return;
  }

  // 发呆中：偶尔自言自语，到时间就决定下一件事
  d.think -= dt;
  // 懒懒会站着打盹
  if (d.persona === 'lazy' && Math.random() < dt * 0.04) { d.blink = 3; d.think += 3; say(d, pick(['💤 呼……', '（站着睡着了）', 'zzz'])); }
  if (Math.random() < dt * 0.04) {
    const low = Object.entries(N).sort((a, b) => a[1] - b[1])[0];
    const sad = { bladder: '想去一下洗手间…', energy: '好困……', hunger: '肚子咕咕叫', fun: '好无聊～', social: '有点寂寞' };
    say(d, low[1] < 25 ? sad[low[0]] : (Math.random() < 0.3 && wishLine(d)) || pick(P.lines));
  }
  if (d.think <= 0) decide(d);
}

const hearts = [];
function spawnHeart(d, txt = '❤') {
  hearts.push({ doll: d, dx: Math.random() * 8 - 4, t: 1, txt });
}

function petDoll(d) {
  if (d.state === 'lift' || d.state === 'away') return;
  if (d.act && d.act.type === 'sleep') { say(d, '唔……别吵'); return; }
  d.needs.fun = Math.min(100, d.needs.fun + 12); d.needs.social = Math.min(100, d.needs.social + 15);
  d.happy = 2; say(d, pick(ACT_LINES.pet)); spawnHeart(d); spawnHeart(d); SFX.play('love');
  addLog(`🤚 你摸了摸 ${d.name} 的头`);
}

// 选中的小人被点到的家具上去
function orderUse(d, f) {
  const F = FURNITURE[f.id];
  if (!F.use) { say(d, '这个不能用哦'); return false; }
  if (d.state === 'lift' || d.state === 'away' || (d.guest && F.use === 'sleep')) return false;
  if (d.act) endAct(d);
  if (!startAct(d, { type: F.use, furn: f })) { say(d, '过不去呀…'); SFX.play('deny'); return false; }
  say(d, '好的～', 1.2);
  return true;
}

/* ---------------- 时间与天色 ---------------- */
const SKY = [[0, '#1d2348'], [5, '#2b3366'], [6.2, '#f6b38a'], [8, '#9fd3f0'], [17, '#9fd3f0'], [18.6, '#f59a7a'], [20, '#3a3a78'], [24, '#1d2348']];
const DARK = [[0, .55], [5, .5], [7, 0], [17, 0], [19, .25], [21, .5], [24, .55]];
function lerpKeys(keys, h, mix) {
  for (let i = 0; i < keys.length - 1; i++) {
    const [h0, v0] = keys[i], [h1, v1] = keys[i + 1];
    if (h >= h0 && h <= h1) return mix(v0, v1, (h - h0) / (h1 - h0));
  }
  return keys[0][1];
}
const mixNum = (a, b, t) => a + (b - a) * t;
const mixHex = (a, b, t) => {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) + (((pb >> s) & 255) - ((pa >> s) & 255)) * t);
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
};

let saveT = 0;
function update(realDt) {
  const dt = realDt * G.speed;
  G.t += realDt;
  if (dt > 0 && !document.getElementById('paperDialog')?.open) {
    if (G.monthEvents !== G.day) {
      startHouseMonth();
      save();
    }
    G.time += dt * MIN_PER_SEC;
    if (G.time >= 1440) {
      finishHouseMonth();
      G.time -= 1440;
      G.day++;
      HOOK.toast(`☀️ ${monthLabel(G.day)}开始啦`);
      nightlyBills();
      startHouseMonth();
      save();
      snapshotHouseMonth();
      SFX.play('newday');
    }
    const h = G.time / 60;
    G.sky = lerpKeys(SKY, h, mixHex); G.dark = lerpKeys(DARK, h, mixNum);
    G.night = h >= 21 || h < 6;
    seasonTick();
    communityTick();
    for (const d of G.dolls) updateDoll(d, dt);
  }
  updateDoors(realDt);
  if (dt > 0 && !document.getElementById('paperDialog')?.open) { socialTick(dt); trystTick(); bondsTick(dt); }
  for (let i = hearts.length - 1; i >= 0; i--) { hearts[i].t -= realDt; if (hearts[i].t <= 0) hearts.splice(i, 1); }
  saveT += realDt; if (saveT > 5) { saveT = 0; save(); }
}
</script>
<script>
// 人际关系与多人互动：友好度 / 恋爱度、聊天打闹拥抱表白吵架、围观别人弹琴打游戏
// 关系存在 G.rel 里，键是两个小人的永久 id（pid）排序后拼起来

const REL_LEVELS = [[90, '挚友'], [70, '好友'], [40, '朋友'], [20, '认识'], [0, '陌生'], [-100, '不和']];
const LOVE_LEVELS = [[75, '喜欢'], [45, '心动'], [20, '有好感'], [-100, '']];

// 别人正在做这些事时，可以凑过去一起
const JOIN = {
  piano: { verb: '听{n}弹琴', like: 'piano', dance: 0.5, lines: ['好好听～', '🎵 ♪', '再来一首！', '是新曲子吗？'], back: ['谢谢捧场！', '为你弹的～'] },
  dance: { verb: '和{n}一起跳舞', like: 'dance', dance: 1, lines: ['一起跳！', '💃 转圈圈', '跟上节奏！'], back: ['跳得不错嘛！', '耶～'] },
  game:  { verb: '围观{n}打游戏', like: 'game', dance: 0, lines: ['加油加油！', '左边左边！', '好厉害！', '下一局我来！'], back: ['看我的！', '别吵别吵'] },
  tv:    { verb: '陪{n}看电视', like: 'tv', dance: 0, lines: ['这集我看过！', '哈哈哈哈', '📺 嘘——'], back: ['一起看嘛', '零食呢？'] },
  cook:  { verb: '等{n}做饭', like: 'snack', dance: 0, lines: ['好香啊～', '能分我一口吗？', '🤤', '我来帮忙！'], back: ['马上就好～', '给你留了一份'] },
  read:  { verb: '凑过去看{n}的书', like: 'read', dance: 0, lines: ['在看什么书？', '这本好看吗？', '借我看看'], back: ['嘘……', '看完借你'] },
};

// 两人面对面的互动种类
const SOCIAL = {
  chat:  { verb: '和{n}聊天', a: ['你好呀！', '聊点什么呢', '今天天气真好', '真的吗？！'], b: ['嗯嗯！', '哈哈哈', '我也觉得！', '然后呢？'] },
  joke:  { verb: '和{n}打闹', a: ['看招！', '哈哈哈哈', '😂 你好好笑'], b: ['哎呀别闹～', '😆', '哈哈哈停不下来'] },
  hug:   { verb: '和{n}抱抱', a: ['抱一个！', '🤗'], b: ['嘿嘿～', '❤'] },
  flirt: { verb: '向{n}表白', a: ['我……我有话想说', '你今天真好看……', '要不要一起看星星？'], b: [] },
  kiss:  { verb: '和{n}亲亲', a: ['💋', '最喜欢你了'], b: ['❤ ❤', '我也是～'] },
  argue: { verb: '和{n}吵架', a: ['💢 哼！', '都怪你！', '你才是！'], b: ['💢 不理你了', '明明是你！', '哼！'] },
};

function relKey(a, b) { return a.pid < b.pid ? a.pid + '|' + b.pid : b.pid + '|' + a.pid; }
const arePartners = (a, b) => a !== b && G.rel[relKey(a, b)]?.lovers === true;
const confirmedPartners = d => G.dolls.filter(o => arePartners(d, o));
function rel(a, b) {
  const k = relKey(a, b);
  if (!G.rel[k]) G.rel[k] = { f: 10 + Math.round(Math.random() * 15), l: 0, chem: +(0.6 + Math.random() * 0.9).toFixed(2), lovers: false };
  return G.rel[k];
}
const levelOf = (v, table) => table.find(([min]) => v >= min)[1];
function relLabel(r) {
  if (r.lovers) return '💕 恋人';
  if (r.secret) return '🤫 偷偷暧昧';
  const love = levelOf(r.l, LOVE_LEVELS), tags = typeof bondTagsText === 'function' ? bondTagsText(r) : '';
  return levelOf(r.f, REL_LEVELS) + (love ? ' · ' + love : '') + (tags ? ' · ' + tags : '');
}
function loverOf(d) { return G.dolls.find(o => o !== d && rel(d, o).lovers) || null; }

// 改变关系值，跨过关键门槛时弹提示
// 只要有一方是学生，就不进入任何恋爱剧情（表白、亲亲、暧昧、偷情、恋人、吃醋），只当朋友
const isStudent = d => d.job === 'student';
const canRomance = (a, b) => !a.guest && !b.guest && !isStudent(a) && !isStudent(b);
function clearRomance(d) {
  for (const o of G.dolls) if (o !== d) { const r = rel(d, o); r.l = 0; r.lovers = false; r.secret = false; }
  for (const o of G.dolls) if (o.jealousOf && o.jealousOf.who === d) o.jealousOf = null;
  d.jealousOf = null;
}

function bump(a, b, df, dl = 0) {
  if (!canRomance(a, b)) dl = 0;
  const r = rel(a, b), before = levelOf(r.f, REL_LEVELS);
  const cp = compat(a, b);                                    // 星座 + MBTI 缘分
  if (df < 0 && !isF(a) && !isF(b)) df *= 0.7;                // 两个 T 型吵完架不太记仇
  r.f = Math.max(-100, Math.min(100, r.f + (df > 0 ? df * r.chem * cp : df)));
  r.l = Math.max(0, Math.min(100, r.l + (dl > 0 ? dl * r.chem * cp * (isF(a) || isF(b) ? 1.15 : 1) : dl)));
  const after = levelOf(r.f, REL_LEVELS);
  if (after !== before && df > 0 && ['朋友', '好友', '挚友'].includes(after)) HOOK.toast(`🤝 ${a.name} 和 ${b.name} 成为${after}了`);
  if (after === '不和' && before !== '不和') HOOK.toast(`💢 ${a.name} 和 ${b.name} 闹翻了……`);
  if (r.lovers && r.l < 30) { r.lovers = false; HOOK.toast(`💔 ${a.name} 和 ${b.name} 分手了……`); }
}

function weighted(list) {
  const total = list.reduce((s, [, w]) => s + Math.max(0, w), 0);
  let x = Math.random() * total;
  for (const [v, w] of list) { x -= Math.max(0, w); if (x <= 0) return v; }
  return list[0][0];
}

// 挑一个想去找的人：越熟、越喜欢越容易被挑中
function pickPartner(d, others) {
  const lv = loverOf(d), lvAway = lv && (lv.state === 'away' || lying(lv));
  return weighted(others.map(o => {
    const r = rel(d, o);
    let w = 12 + Math.max(0, r.f) * 0.6 + r.l * 0.6 + (r.lovers ? 40 : 0);
    if (d.heart === 'fickle' && lv && o !== lv) w += r.l * (lvAway ? 1.6 : 0.5);   // 花心的人趁对象不在去找暧昧对象
    return [o, Math.max(1, w + 5 * NPCMemory.influence(G, d.pid, o.pid)) * compat(d, o)];
  }));
}

function chooseKind(d, p) {
  const r = rel(d, p), cranky = d.needs.fun < 25 || p.needs.fun < 25 || d.needs.hunger < 15;
  // 有对象的人只有“花心”才会去撩别人；对方有对象也只有花心的才会接招
  const ld = loverOf(d), lp = loverOf(p);
  const free_ = (x, l, other) => !l || l === other || x.heart === 'fickle';
  const canFlirt = !r.lovers && r.f >= 45 && r.l >= 15 && free_(d, ld, p) && (free_(p, lp, d) || p.heart !== 'loyal');
  const sneaky = ld && ld !== p && d.heart === 'fickle';
  return weighted([
    ['chat', 34],
    ['joke', 14 + (d.persona === 'genki' ? 12 : 0) + (r.f > 40 ? 8 : 0)],
    ['hug', r.f >= 55 ? 16 + (d.persona === 'social' ? 8 : 0) : 0],
    ['flirt', canFlirt && canRomance(d, p) ? (sneaky ? 14 : 6) + r.l * 0.7 : 0],
    ['kiss', !canRomance(d, p) ? 0 : r.lovers ? 26 : r.secret ? 18 : 0],
    ['argue', (r.f < 15 ? 10 : 1) + (cranky ? 7 : 0)],
  ]);
}

// 两人到齐后开始互动（由 game.js 的 arrive 调用）
function startSocial(d, p) {
  const jealousTalk = !!(d.act && d.act.jealous);   // 吃醋后来“算账”的那次吵架
  let kind = (d.act && d.act.kind) || chooseKind(d, p);
  if (!canRomance(d, p) && (kind === 'kiss' || kind === 'flirt')) kind = 'chat';
  const S = SOCIAL[kind], r = rel(d, p);
  const t = 5 + Math.random() * 3;
  d.state = 'act'; d.act = { type: 'chat', kind, partner: p, t, gain: { social: 26, fun: 6 } };
  p.state = 'act'; p.path = []; p.act = { type: 'chat', kind, partner: d, t, gain: { social: 22, fun: 5 }, passive: true };
  face(d, p.x, p.y); face(p, d.x, d.y);
  for (const x of [d, p]) if (!isE(x)) x.needs.energy = Math.max(0, x.needs.energy - 3);   // 内向的人社交会累
  const PD = PERSONAS[d.persona], PP = PERSONAS[p.persona];
  d.act.t = p.act.t = t * ((PD.dur && PD.dur.chat) || 1);
  // 普通聊天用各自性格的台词，一听就知道是谁
  say(d, kind === 'chat' && PD.chat ? pick(PD.chat) : kind === 'flirt' && loverOf(d) && loverOf(d) !== p ? pick(['你今天……特别好看', '别告诉别人哦', '我们去没人的地方聊聊？']) : pick(S.a));
  let reply = kind === 'chat' && PP.chat ? pick(PP.chat) : pick(S.b.length ? S.b : ['……']);

  const spark = r.f >= 45 ? 1 : 0;   // 足够熟了，日常相处也会慢慢心动
  // 信任是单向的：被拿来开玩笑的人会记仇，吵架两边都会少一分信任
  if (kind === 'chat') { addTrust(d, p, 1); addTrust(p, d, 1); }
  if (kind === 'hug' || kind === 'kiss') { addTrust(d, p, 2); addTrust(p, d, 2); }
  if (kind === 'joke') addTrust(p, d, -3);
  if (kind === 'argue') { addTrust(d, p, -6); addTrust(p, d, -6); }
  if (kind === 'chat') bump(d, p, 5, 1.5 * spark);
  if (kind === 'joke') { bump(d, p, 6, 1.2 * spark); d.needs.fun = Math.min(100, d.needs.fun + 8); p.needs.fun = Math.min(100, p.needs.fun + 8); }
  if (kind === 'hug') { bump(d, p, 5, 3 + 3 * spark); spawnHeart(d); spawnHeart(p); }
  if (kind === 'kiss') { bump(d, p, 2, r.secret ? 8 : 6); for (let i = 0; i < 3; i++) spawnHeart(i % 2 ? d : p, '💕'); d.happy = p.happy = 4; }
  if (kind === 'argue') {
    bump(d, p, -9, -5); d.needs.fun = Math.max(0, d.needs.fun - 6); p.needs.fun = Math.max(0, p.needs.fun - 6);
    d.act.gain = p.act.gain = { social: 6 }; spawnHeart(d, '💢'); spawnHeart(p, '💢'); SFX.play('deny');
  }
  let flirtOk = false;
  if (kind === 'flirt') {
    const lp = loverOf(p), ld = loverOf(d);
    let chance = Math.min(0.9, (0.15 + r.l / 140 + r.f / 260) * r.chem * compat(d, p));
    if (lp && lp !== d) chance = p.heart === 'fickle' ? chance : p.heart === 'loyal' ? 0 : chance * 0.4;
    if (lp && lp !== d && p.heart === 'loyal') {
      bump(d, p, -6, -8); reply = pick(['我已经有对象了！', `我心里只有${lp.name}`, '请你自重一点']);
      spawnHeart(p, '💢');
    } else if (Math.random() < chance) {
      bump(d, p, 3, 14); reply = pick(['嗯……我也是 💕', '其实我也注意你很久了', '好呀 ❤']); flirtOk = true;
      d.happy = p.happy = 4; for (let i = 0; i < 4; i++) spawnHeart(i % 2 ? d : p, '💗');
      if (ld && ld !== p || lp && lp !== d) {
        // 背着对象暧昧：变成“地下情”，玩家能看到，但当事人的恋人不知道……除非被撞见
        if (!r.secret) HOOK.toast(`🤫 ${d.name} 和 ${p.name} 背着别人偷偷暧昧……`);
        r.secret = true; SFX.play('love');
        // 新欢比旧爱更喜欢了：花心的一方干脆变心
        for (const [x, old] of [[d, ld], [p, lp]]) {
          if (old && old !== (x === d ? p : d) && x.heart === 'fickle' && r.l >= 70 && r.l > rel(x, old).l) {
            const o = rel(x, old); o.lovers = false; o.l = Math.max(0, o.l - 40); o.f = Math.max(-100, o.f - 20);
            HOOK.toast(`💔 ${x.name} 变心了，甩了 ${old.name}`);
            const rival = x === d ? p : d;
            NPCMemory.record(G,{type:'breakup',time:absNow(),participants:[x.pid,old.pid],outcome:'left'},[
              {person:old.pid,subject:x.pid,emotion:-1,impact:100,interpretation:`我被${x.name}抛下了`}
            ]);
            NPCMemory.record(G,{type:'rival',time:absNow(),participants:[old.pid,rival.pid,x.pid],outcome:'remembered'},[
              {person:old.pid,subject:rival.pid,emotion:-.9,impact:95,interpretation:`${rival.name}抢走了${x.name}`}
            ]);
            addTrust(old, x, -35); addTrust(old, rival, -30); addJealousy(old, rival, 60);
            say(old, '……怎么会这样'); spawnHeart(old, '💔');
          }
        }
        if (r.l >= 70 && !loverOf(d) && !loverOf(p)) { r.lovers = true; r.secret = false; HOOK.toast(`💕 ${d.name} 和 ${p.name} 在一起了！`); }
      } else if (r.l >= 70 && !r.lovers) { r.lovers = true; HOOK.toast(`💕 ${d.name} 和 ${p.name} 在一起了！`); SFX.play('newday'); }
      else SFX.play('love');
    } else {
      bump(d, p, -2, -4); reply = pick(['诶？我们还是做朋友吧', '让我想想……', '你、你在说什么呀']);
      d.needs.fun = Math.max(0, d.needs.fun - 10);
      setTimeout(() => d.act && d.act.kind === 'flirt' && say(d, '呜……'), 2600);
    }
  }
  // 恋人看到另一半和别人亲密：抱一抱会吃醋；亲亲或地下情就是当场撞破
  if (jealousTalk) say(d, pick(['刚才那是怎么回事？', '😤 你给我解释清楚', '你是不是喜欢上别人了？']));
  const LOGK = { hug: `🤗 ${d.name} 抱了抱 ${p.name}`, kiss: `💋 ${d.name} 亲了 ${p.name}`, argue: `💢 ${d.name} 和 ${p.name} 吵了一架` };
  // 恋人之间的日常亲昵太频繁，几小时内只记一次，免得刷屏
  const routine = r.lovers && (kind === 'hug' || kind === 'kiss') && r.logAt > absNow() - 240;
  if (r.lovers && (kind === 'hug' || kind === 'kiss') && !routine) r.logAt = absNow();
  countHouseActivity('social',d.name+' × '+p.name);
  if(kind==='chat'&&Math.random()<.32)shareHouseNews(d,p);
  if (!routine && ['argue', 'hug', 'kiss', 'flirt', 'joke'].includes(kind)) {
    const outcome = kind === 'flirt' ? (flirtOk ? 'accepted' : 'rejected') : 'completed';
    const emotion = kind === 'joke' ? -.38 : kind === 'argue' ? -.9 : outcome === 'rejected' ? -.85 : .55;
    const impact = kind === 'argue' || kind === 'flirt' ? 90 : 45;
    const descriptions = {
      joke: [`我当着大家的面和${p.name}开了玩笑`,`${d.name}拿我开玩笑，我有点难堪`],
      argue: [`我找${p.name}理论，结果吵了起来`, `${d.name}来找我理论，我们吵了一架`],
      hug: [`我拥抱了${p.name}`, `${d.name}拥抱了我`],
      kiss: [`我亲了${p.name}`, `${d.name}亲了我`],
      flirt: [`我向${p.name}表白，${flirtOk ? '对方答应了' : '我被拒绝了'}`,
        `${d.name}向我表白，${flirtOk ? '我接受了' : '我拒绝了'}`]
    };
    const views = [
      { person: d.pid, subject: p.pid, interpretation: descriptions[kind][0], emotion:kind==='joke'?.22:emotion, impact },
      { person: p.pid, subject: d.pid, interpretation: descriptions[kind][1],
        emotion: outcome === 'rejected' ? -.35 : emotion, impact }
    ];
    if (kind === 'argue' || kind === 'joke' || kind === 'kiss') {
      for (const observer of G.dolls) {
        if (observer === d || observer === p || ['away', 'lift'].includes(observer.state) || lying(observer)) continue;
        if (Math.abs(observer.tx - d.tx) + Math.abs(observer.ty - d.ty) > 4 ||
            !canSee(observer, d) || !canSee(observer, p)) continue;
        views.push({ person: observer.pid, subject: d.pid, channel: 'witness',
          interpretation: `我看到${d.name}和${p.name}${kind==='kiss'?'亲吻':kind==='joke'?'开玩笑':'争吵'}`, emotion: kind==='kiss'?-.15:-.3, impact: 55, confidence: .8 });
      }
    }
    NPCMemory.record(G, {
      type: kind, time: absNow(), location: { x: d.x, y: d.y },
      participants: [d.pid, p.pid], outcome
    }, views);
  }
  if (LOGK[kind] && !routine) addLog(jealousTalk ? `😤 ${d.name} 吃醋，找 ${p.name} 吵了一架` : LOGK[kind]);
  if (kind === 'flirt') addLog(`💌 ${d.name} 向 ${p.name} 表白${flirtOk ? '，对方答应了' : '，被拒绝了'}`);
  if (['hug', 'kiss', 'flirt'].includes(kind) && !r.lovers && canRomance(d, p)) witness(d, p, r.secret || kind === 'kiss' ? 'caught' : 'jealous');
  setTimeout(() => p.act && p.act.partner === d && say(p, reply), 1300);
  SFX.play(kind === 'argue' ? 'deny' : 'chat');
}

// 有人背着恋人和别人亲密时，看看恋人在不在附近——在的话就被撞见了
function witness(a, b, how = 'caught') {
  for (const [cheater, third] of [[a, b], [b, a]]) {
    const L = loverOf(cheater);
    if (!L || L === third || L.state === 'away' || L.state === 'lift' || lying(L)) continue;
    if (Math.abs(L.tx - cheater.tx) + Math.abs(L.ty - cheater.ty) > 6) continue;
    if (!canSee(L, cheater)) continue;              // 卧室门关着，外面的人看不见
    if (how === 'jealous') jealous(L, cheater, third); else caught(L, cheater, third);
    return;
  }
}

function jealous(L, cheater, third) {
  const r = rel(L, cheater);
  r.l = Math.max(0, r.l - 6); r.f = Math.max(-100, r.f - 3);
  const t = rel(L, third); t.f = Math.max(-100, t.f - 10);
  L.needs.fun = Math.max(0, L.needs.fun - (isF(L) ? 20 : 12) * (zodiacOf(L).el === 'water' ? 1.3 : 1));   // F 型、水象更受伤
  face(L, cheater.x, cheater.y);
  say(L, pick(['😤 哼！抱那么久干嘛', '……我吃醋了', `你和${third.name}关系很好嘛？`]), 3);
  spawnHeart(L, '😤');
  // 记下来：等这次互动结束，就去找恋人算账
  L.jealousOf = { who: cheater, until: absNow() + 240 };
  addJealousy(L, third, 30); addTrust(L, cheater, -6);
  if (L.state === 'idle' || (L.act && !L.act.onFurn && L.act.type !== 'chat')) { if (L.act) endAct(L); L.state = 'idle'; L.think = 0.5; }
  HOOK.toast(`😤 ${L.name} 看到 ${cheater.name} 和 ${third.name} 很亲密，吃醋了`);
}

function caught(L, cheater, third) {
  const r = rel(L, cheater), r3 = rel(cheater, third);
  r.f = Math.max(-100, r.f - 35); r.l = Math.max(0, r.l - 45);
  const t3 = rel(L, third); t3.f = Math.max(-100, t3.f - 40); t3.l = 0;
  r3.secret = false;
  L.needs.fun = Math.max(0, L.needs.fun - 40);
  face(L, cheater.x, cheater.y);
  say(L, pick(['💢 你们在干什么！', `${cheater.name}！你太过分了！`, '我都看见了！']), 3);
  spawnHeart(L, '💔'); spawnHeart(L, '💢');
  setTimeout(() => say(cheater, pick(['我、我可以解释！', '不是你想的那样……', '……'])), 1200);
  setTimeout(() => say(third, pick(['……', '对不起……', '我先走了'])), 2200);
  SFX.play('deny');
  if (r.l < 30 && r.lovers) {
    r.lovers = false;
    HOOK.toast(`💔 ${L.name} 撞见 ${cheater.name} 和 ${third.name}，两人分手了！`);
  } else HOOK.toast(`💢 ${L.name} 撞见 ${cheater.name} 和 ${third.name} 在一起！`);
  NPCMemory.record(G, {
    type: 'caught-affair', time: absNow(), location: { x: L.x, y: L.y },
    participants: [L.pid, cheater.pid, third.pid], outcome: r.lovers ? 'confronted' : 'separated'
  }, [
    { person: L.pid, subject: cheater.pid, channel: 'witness',
      interpretation: `我撞见${cheater.name}和${third.name}亲密`, emotion: -1, impact: 100 },
    { person: cheater.pid, subject: L.pid,
      interpretation: `${L.name}撞见了我和${third.name}`, emotion: -.9, impact: 90 },
    { person: third.pid, subject: L.pid,
      interpretation: `${L.name}撞见了我和${cheater.name}`, emotion: -.7, impact: 80 }
  ]);
  // 恋人单独记下“第三者”：这份记忆的主角是抢走恋人的人
  NPCMemory.record(G, {
    type: 'rival', time: absNow(), participants: [L.pid, third.pid, cheater.pid], outcome: 'remembered'
  }, [
    { person: L.pid, subject: third.pid, channel: 'witness',
      interpretation: `${third.name}想抢走${cheater.name}`, emotion: -.95, impact: 95 }
  ]);
  addTrust(L, cheater, -40); addTrust(L, third, -30); addJealousy(L, third, 60);
}

// 能被打断去做别的事（不在睡觉、不在聊天、不在出门路上）
const interruptible = x => x.state === 'idle' || (x.state === 'walk' && x.act && x.act.type === 'wander') ||
  (x.state === 'act' && x.act && !x.act.onFurn && !Object.hasOwn(ROUTINES, x.act.type) && x.act.type !== 'chat' && x.act.type !== 'leave' && x.act.type !== 'visitStay');

// 每帧：花心的人对恋人的感情会慢慢变淡；专一的人反而越来越深
function socialTick(dt) {
  // 保险：学生和任何人之间都不留恋爱关系
  for (const d of G.dolls) if (isStudent(d)) for (const o of G.dolls) if (o !== d) {
    const r = rel(d, o); if (r.l || r.lovers || r.secret) { r.l = 0; r.lovers = false; r.secret = false; }
  }
  // 吃醋的人：等双方都有空，就立刻去找恋人算账
  for (const d of G.dolls) {
    const j = d.jealousOf;
    if (!j) continue;
    if (j.until < absNow() || !G.dolls.includes(j.who)) { d.jealousOf = null; continue; }
    if (!interruptible(d) || !interruptible(j.who)) continue;
    if (d.act) endAct(d);
    d.state = 'idle'; d.path = [];
    startAct(d, { type: 'chat', partner: j.who, kind: 'argue', jealous: true });
  }
  for (const k in G.rel) {
    const r = G.rel[k];
    if (!r.lovers && !r.secret) continue;
    const [pa, pb] = k.split('|');
    const a = G.dolls.find(d => d.pid === pa), b = G.dolls.find(d => d.pid === pb);
    if (!a || !b) continue;
    const fickle = (a.heart === 'fickle') + (b.heart === 'fickle');
    if (r.lovers && fickle) r.l = Math.max(0, r.l - 0.05 * fickle * dt);
    if (r.lovers && !fickle && a.heart === 'loyal' && b.heart === 'loyal') r.l = Math.min(100, r.l + 0.02 * dt);
    if (r.lovers && r.l < 30) { r.lovers = false; HOOK.toast(`💔 ${a.name} 和 ${b.name} 感情淡了，分手了`); }
  }
}

// 互动进行中：偶尔再说一句、冒爱心
function tickSocial(d, dt) {
  const a = d.act, S = SOCIAL[a.kind] || SOCIAL.chat;
  if (a.passive || Math.random() > dt * 0.45) return;
  const who = Math.random() < 0.5 ? d : a.partner;
  const lines = who === d ? S.a : (S.b.length ? S.b : S.a);
  say(who, pick(lines), 1.8);
  if (a.kind === 'argue') spawnHeart(who, '💢');
  else if (a.kind !== 'chat' || rel(d, a.partner).l > 40) spawnHeart(who, rel(d, a.partner).lovers ? '💕' : '❤');
}

// 先躺上双人床的人会叫恋人一起来睡
function inviteLover(d, f) {
  const lv = loverOf(d);
  if (!lv || f.users.length >= 2 || lv.state === 'lift' || lying(lv)) return;
  if (!G.night && lv.needs.energy > 70) return;
  if (lv.act && (lv.act.type === 'chat' || lv.act.onFurn)) return;
  if (lv.act) endAct(lv);
  lv.path = []; lv.state = 'idle';
  if (startAct(lv, { type: 'sleep', furn: f })) {
    setTimeout(() => say(d, `${lv.name}，一起睡吧～`), 900);
    setTimeout(() => lv.act && say(lv, pick(['来啦 💕', '马上就来～', '好～'])), 2000);
  }
}

/* ---------- 围观 / 一起玩 ---------- */
function joinable(o) { return o.state === 'act' && o.act && JOIN[o.act.type] && o.act.t > 3; }

function startJoin(d, o) {
  const goals = [];
  for (let dx = -2; dx <= 2; dx++) for (let dy = -1; dy <= 2; dy++) {
    if (!dx && !dy) continue;
    goals.push({ x: o.tx + dx, y: o.ty + dy });
  }
  goals.sort((a, b) => Math.hypot(a.x - o.tx, a.y - o.ty) - Math.hypot(b.x - o.tx, b.y - o.ty));
  const taken = new Set(G.dolls.filter(x => x !== d).map(x => x.tx + ',' + x.ty));
  const path = findPath(d.tx, d.ty, goals.filter(g => !taken.has(g.x + ',' + g.y)));
  if (!path) return false;
  d.path = path; d.state = path.length ? 'walk' : 'arrive';
  d.act = { type: 'join', target: o, what: o.act.type };
  return true;
}

// 有人开始表演时，闲着的人会更快拿主意（更可能过来凑热闹）
function nudgeAudience(performer) {
  for (const o of G.dolls) if (o !== performer && canSee(o,performer) && (o.state === 'idle' || (o.state === 'walk' && o.act && o.act.type === 'wander'))) {
    if (o.state === 'walk') { o.path = []; o.state = 'idle'; o.act = null; }
    o.think = Math.min(o.think, 0.3 + Math.random() * 1.2);
  }
}

function arriveJoin(d) {
  const a = d.act, o = a.target;
  if (!G.dolls.includes(o) || !o.act || o.act.type !== a.what || o.state !== 'act') { say(d, '诶，结束了？'); endAct(d); return; }
  // 位置被别人占了就换个空位（只换一次）
  if (!a.moved && G.dolls.some(x => x !== d && x.tx === d.tx && x.ty === d.ty && x.state !== 'lift')) {
    a.moved = true;
    if (startJoin(d, o)) { d.act.moved = true; return; }
  }
  const J = JOIN[a.what];
  d.state = 'act'; a.t = Math.min(o.act.t + 1, 6 + Math.random() * 4);
  a.dance = Math.random() < J.dance + (d.persona === 'genki' ? 0.3 : 0);
  a.gain = { fun: 16, social: 10 };
  face(d, o.x, o.y);
  say(d, pick(J.lines));
  bump(d, o, 3, rel(d, o).f >= 45 ? 1.5 : 0);
  o.needs.social = Math.min(100, o.needs.social + 6);
  if (Math.random() < 0.6) setTimeout(() => o.act && say(o, pick(J.back)), 1400);
  if (a.what === 'game') countTogether('game', d, o);
  if (a.what === 'piano') notePianoCrowd(o);
  if(a.what==='game'||a.what==='piano'){
    addTrust(o, d, 2);
    countHouseActivity(a.what==='piano'?'audience':'partners',o.name);
    NPCMemory.record(G,{type:'company',time:absNow(),participants:[o.pid,d.pid],outcome:a.what},[
      {person:o.pid,subject:d.pid,emotion:.55,impact:55,interpretation:`${d.name}来陪我${a.what==='game'?'玩游戏':'弹琴'}`},
      {person:d.pid,subject:o.pid,emotion:.55,impact:55,interpretation:`我和${o.name}一起${a.what==='game'?'玩游戏':'听钢琴'}`}
    ]);
  }
  if (a.what === 'piano' && !o.act.logged) { o.act.logged = true; addLog(`🎵 ${o.name} 弹起了钢琴，${d.name} 过来听`); }
}

function tickJoin(d, dt) {
  const a = d.act, o = a.target;
  if (!o.act || o.act.type !== a.what) { endAct(d); return; }
  if (a.dance) {
    d.ft += dt;
    if (d.ft > 0.25) { d.ft = 0; d.frame = (d.frame + 1) % 4; d.dir = ['down', 'right', 'up', 'left'][d.frame]; }
    d.hop = d.frame % 2 ? 2 : 0;
  } else face(d, o.x, o.y);
  if (Math.random() < dt * 0.3) { say(d, pick(JOIN[a.what].lines), 2); if (rel(d, o).l > 50) spawnHeart(d); }
}

// 状态卡上显示“正在做什么”
function socialDoing(d) {
  const a = d.act;
  if (a.type === 'join') return JOIN[a.what].verb.replace('{n}', a.target.name);
  if (a.type === 'chat' && a.partner) {
    if (a.kind === 'flirt' && a.passive) return `被${a.partner.name}表白`;
    return (SOCIAL[a.kind] || SOCIAL.chat).verb.replace('{n}', a.partner.name);
  }
  return null;
}

<script>
// 职业与作息：到点从大门出门，在外面待一段时间，每月回家的时间都不太一样
// 绝对分钟跨月连续累计，夜班在次月清晨结束。

const absNow = () => (G.day - 1) * 1440 + G.time;
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

// start/end 是时钟分钟，end < start 表示次月下班，off 是休息月份。
const JOBS = {
  student: { name: '学生', icon: '🎒', start: 480, end: 960, off: [7, 8], verb: '上学', wage: 40, wageName: '拿到零花钱',
    go: ['去上学啦！', '书包带了吗……带了！', '要迟到啦！'], back: ['放学啦～', '今天学了好多', '作业好多……'], tired: '今天考试……' },
  office: { name: '上班族', icon: '💼', start: 540, end: 1080, off: [2], verb: '上班', wage: 320,
    go: ['上班去了……', '又是元气满满的一天（假的）', '挤地铁去咯'], back: ['终于下班了！', '我回来啦', '今天开了好多会'], tired: '加班好累……' },
  baker: { name: '面包师', icon: '🥐', start: 330, end: 780, off: [1], verb: '烤面包', wage: 240,
    go: ['去烤面包！', '面团在等我', '早起的面包师有面包吃'], back: ['带了面包回来～', '香喷喷地回来啦', '今天的可颂很成功'], tired: '今天订单好多' },
  barista: { name: '咖啡师', icon: '☕', start: 600, end: 1140, off: [3], verb: '做咖啡', wage: 210,
    go: ['去咖啡店啦', '今天也要好好拉花', '出门咯～'], back: ['今天拉花很成功！', '一身咖啡香地回来了', '我回来啦～'], tired: '客人好多……' },
  night: { name: '夜班店员', icon: '🌙', start: 1320, end: 360, off: [6], verb: '值夜班', wage: 280,
    go: ['值夜班去了', '晚上见……不对，早上见', '出门啦'], back: ['困死了……', '天亮了，我回来了', '要去补觉了'], tired: '今晚好多客人' },
  artist: { name: '自由画家', icon: '🎨', start: null, verb: '在家画画' },
  none: { name: '宅在家', icon: '🏠', start: null, verb: '宅家' },
};

const isWorkMonth = (job, cycle) => job.start != null && !job.off.includes(monthOf(cycle));
const doorOf = () => G.furniture.find(f => f.id === 'door');
function doorTile() {
  const d = doorOf();
  return d ? { x: d.x, y: WALL_ROWS } : { x: Math.floor(COLS / 2), y: WALL_ROWS };
}

// 老存档没有门：找一块墙边空位装上
function ensureDoor() {
  if (doorOf()) return;
  const b = blockedMap();
  for (const x of [6, 3, 7, 11, 12, 10, 1, 14, 0, 15, 2, 4, 5, 8, 9, 13])
    if (canPlace('door', x, 1, null) && !b[x][WALL_ROWS]) { addFurniture('door', x, 1); return; }
  for (let x = 0; x < COLS; x++) if (canPlace('door', x, 1, null)) { addFurniture('door', x, 1); return; }
}

// 本月应该出门的时间（绝对分钟），不用上班返回 null
function leaveAbs(d) {
  const J = JOBS[d.job] || JOBS.none;
  if (!isWorkMonth(J, G.day) || d.lastWorkDay === G.day) return null;
  return (G.day - 1) * 1440 + J.start - 30 + (d.leaveJitter || 0);
}

function startLeave(d) {
  const J = JOBS[d.job];
  if (d.act) endAct(d);
  d.path = [];
  const t = doorTile();
  const goals = [t, { x: t.x - 1, y: t.y }, { x: t.x + 1, y: t.y }, { x: t.x, y: t.y + 1 }];
  const path = (d.tx === t.x && d.ty === t.y) ? [] : findPath(d.tx, d.ty, goals);
  if (!path) { d.state = 'idle'; d.think = 3; return; }
  d.path = path; d.state = path.length ? 'walk' : 'arrive';
  d.act = { type: 'leave' };
  say(d, G.weather === 'rain' ? pick(['下雨了，带上伞！', '雨好大……']) : G.weather === 'snow' ? pick(['外面好冷……', '围巾戴好！']) : pick(J.go));
}

function exitHome(d) {
  const J = JOBS[d.job], door = doorOf();
  d.act = null; d.path = []; d.bubble = null;
  d.state = 'away'; d.lastWorkDay = G.day;
  if (door) door.openT = 0.8;
  // 回家时间：正常下班后 0~80 分钟到家，偶尔早退，15% 概率加班
  const startAbs = (G.day - 1) * 1440 + J.start;
  let len = (J.end - J.start + 1440) % 1440;
  let back = startAbs + len + 15 + Math.random() * 65;
  d.overtime = Math.random() < 0.15;
  if (d.overtime) back += 120 + Math.random() * 60;
  else if (Math.random() < 0.15) back -= 60 + Math.random() * 40;
  d.awayUntil = Math.round(back);
  d.leaveJitter = leaveJitterFor(d);  // 下月出门时间也稍微变一变：J 型准时，P 型常常踩点
  SFX.play('open');
  HOOK.toast(`${J.icon} ${d.name} ${J.verb}去了，大约 ${returnTime(d)} 回家`);
  if (G.sel === d.uid) HOOK.select();
}

function comeHome(d) {
  const J = JOBS[d.job], door = doorOf(), t = doorTile();
  const p = free(t.x, t.y) ? t : nearestFree(t.x, t.y);
  if (p) placeDollAt(d, p.x, p.y);
  d.state = 'idle'; d.dir = 'down'; d.think = 2 + Math.random() * 2; d.away = false;
  if (door) door.openT = 0.8;
  say(d, d.overtime ? J.tired : pick(J.back));
  if (G.weather === 'rain' && Math.random() < 0.4) { d.needs.fun = Math.max(0, d.needs.fun - 8); setTimeout(() => say(d, '淋湿了……阿嚏！'), 1600); }
  payday(d);
  SFX.play('newday');
  HOOK.toast(`🏠 ${d.name} 回家了`);
  // 在家的人打招呼；恋人会过来抱抱
  const lover = loverOf(d);
  for (const o of G.dolls) {
    if (o === d || o.state === 'away' || lying(o) || o.state === 'lift') continue;
    if (o === lover && (o.state === 'idle' || (o.act && !o.act.onFurn && o.act.type !== 'chat'))) {
      if (o.act) endAct(o);
      o.state = 'idle';
      if (startAct(o, { type: 'chat', partner: d })) { o.act.kind = 'hug'; say(o, '欢迎回家 💕'); d.path = []; d.state = 'wait'; d.waitT = 8; }
    } else if (rel(d, o).f >= 40 && Math.random() < 0.6) {
      setTimeout(() => o.state !== 'away' && say(o, pick(['欢迎回来～', '回来啦！', `${d.name}辛苦啦`])), 600 + Math.random() * 900);
    }
  }
  if (G.sel === d.uid) HOOK.select();
}

// 每帧在 updateDoll 里调用；返回 true 表示这帧不用再做别的
function workTick(d, dt) {
  if (d.guest) return false;
  const N = d.needs;
  if (d.state === 'away') {
    // 在外面：会累、会饿，但和同事也算有社交
    N.energy = Math.max(0, N.energy - 3 * MIN_PER_SEC / 60 * dt);
    N.hunger = Math.max(0, N.hunger - 1.5 * MIN_PER_SEC / 60 * dt);
    N.social = Math.min(100, N.social + 6 * MIN_PER_SEC / 60 * dt);
    if (absNow() >= d.awayUntil) comeHome(d);
    return true;
  }
  if (d.state === 'lift' || (d.act && d.act.type === 'leave')) return false;
  const la = leaveAbs(d), now = absNow();
  if (la != null && now >= la && now < la + 180) {
    if (lying(d)) say(d, '要迟到啦！');
    startLeave(d);
    return true;
  }
  return false;
}

function updateDoors(dt) { for (const f of G.furniture) if (f.openT > 0) f.openT -= dt; }

// 状态卡里的作息说明
function jobLine(d) {
  const J = JOBS[d.job] || JOBS.none;
  if (J.start == null) return `${J.icon} ${J.name}`;
  const off = J.off.map(month => `${month} 月`).join('、');
  return `${J.icon} ${J.name} · ${hhmm(J.start)}–${hhmm(J.end)} · ${off}休息 · ${J.wageName ? '零花钱' : '月薪'} ${yuan(J.wage)}`;
}
function returnTime(d) {
  const cycle = Math.floor(d.awayUntil / 1440) + 1;
  const time = hhmm(d.awayUntil);
  return cycle > G.day ? `${monthLabel(cycle)} ${time}` : time;
}
function awayText(d) {
  const J = JOBS[d.job] || JOBS.none;
  return `${J.verb}中，约 ${returnTime(d)} 回家`;
}

/* ---------------- 收入与储蓄 ----------------
   上班的人每月下班领月薪（加班多拿 50%），学生有零花钱，自由画家偶尔卖画；
   吃零食、买菜要花钱，每晚 0 点每人交房租水电。钱不够时，恋人或好朋友会帮忙付。 */
const PRICES = { snack: 12, cook: 25 };
const PRICE_NAME = { snack: '零食钱', cook: '买菜钱' };
const RENT = 50;
const START_MONEY = { office: 4000, baker: 2500, barista: 2000, night: 2500, student: 300, artist: 1500, none: 600 };
const yuan = n => (n < 0 ? '-¥' : '¥') + Math.abs(Math.round(n)).toLocaleString('en-US');

function helperFor(d, amount) {
  return G.dolls
    .filter(o => o !== d && !o.guest && o.state !== 'away' && o.money >= amount && (rel(d, o).lovers || rel(d, o).f >= 50))
    .sort((a, b) => (rel(d, b).lovers - rel(d, a).lovers) || (rel(d, b).f - rel(d, a).f))[0];
}
const canAfford = (d, amount) => TEST_MODE || d.money >= amount || !!helperFor(d, amount);

function pay(d, amount, what) {
  if (TEST_MODE) return true;
  if (d.money >= amount) { d.money -= amount; return true; }
  const h = helperFor(d, amount);
  if (!h) return false;
  h.money -= amount; bump(d, h, 3);
  setTimeout(() => say(h, pick(['我来付吧', '这顿我请～', '拿去用，不用还'])), 400);
  addLog(`💸 ${d.name} 钱不够，${h.name} 帮忙付了${what} ${yuan(amount)}`);
  return true;
}

function payday(d) {
  const J = JOBS[d.job];
  if (!J.wage) return;
  const w = Math.round(J.wage * (d.overtime ? 1.5 : 1));
  const c = d.job === 'student' ? 0 : Math.round(w * FUND_SHARE);   // 工资的 20% 存进家庭基金
  d.money += w - c; G.fund += c;
  addLog(`💰 ${d.name} ${J.wageName || '领到工资'} ${yuan(w)}${d.overtime ? '（含加班费）' : ''}${c ? `，${yuan(c)} 存进家庭基金` : ''}，个人存款 ${yuan(d.money)}`);
}

function nightlyBills() {
  const payers = TEST_MODE ? [] : residents().filter(d => d.job !== 'student');   // 学生不用交房租
  for (const d of payers) d.money -= RENT;
  if (payers.length) addLog(`🏠 ${payers.map(d => d.name).join('、')} 交了房租水电，每人 ${yuan(RENT)}`);
  const sb = seasonBill();
  if (sb && payers.length) { for (const d of payers) d.money -= sb[1]; addLog(`${sb[0] === '暖气费' ? '🔥' : '🧊'} 每人还交了${sb[0]} ${yuan(sb[1])}`); }
  for (const d of residents()) if (d.job === 'artist' && Math.random() < (d.paintedDay >= G.day - 1 ? 0.7 : 0.25)) {
    const v = 200 + Math.round(Math.random() * 6) * 100;
    d.money += v; addLog(`🎨 ${d.name} 的画卖出去了，收入 ${yuan(v)}`);
  }
  // 欠债太多的人会出去找工作
  for (const d of residents()) if ((d.job === 'none' || d.job === 'artist') && d.money < -500 && Math.random() < 0.3) {
    d.job = pick(['barista', 'night', 'office']);
    addLog(`💼 ${d.name} 欠了 ${yuan(-d.money)}，终于去找了份工作：${JOBS[d.job].name}`);
  }
  const broke = residents().filter(d => d.money < 0);
  for (const d of broke) d.needs.fun = Math.max(0, d.needs.fun - 20);
  if (broke.length) addLog(`😰 ${broke.map(d => d.name).join('、')} 的存款见底了`);
}

<script>
// 家庭基金、家具商店、仓库、扩建
// 上班的人领工资时自动存 20% 进家庭基金；玩家每月还能号召一次大家凑钱。
// 家具要用基金买，删掉的家具收进仓库可以再拿出来；扩建会让房子真的变宽，并解锁新家具。

// [价格, 需要的房屋等级]
const SHOP = {
  bed: [800, 1], bigbed: [1500, 1], sofa: [900, 1], chair: [150, 1], table: [400, 1], fridge: [1200, 1],
  stove: [1000, 1], shelf: [600, 1], tv: [1500, 1], arcade: [1300, 1], piano: [2500, 1], bath: [1600, 1],
  plant: [120, 1], lamp: [200, 1], catbed: [300, 1], rug: [250, 1], rug2: [200, 1],
  window: [500, 1], painting: [300, 1], clock: [150, 1], poster: [80, 1],
  beanbag: [300, 1], coffee: [450, 1], aquarium: [700, 1], shelfwall: [180, 1], mirror: [200, 1],
  desk: [500, 2], pc: [1600, 2], speaker: [900, 2], garland: [220, 2],
  easel: [800, 3], treadmill: [1800, 3],
  toilet: [240, 1], washstand: [180, 1], shower: [520, 1], cloudBed: [740, 1],
  moonLamp: [130, 1], bunnyPicture: [85, 1], cloudMobile: [120, 1], tulips: [95, 1], pawRug: [160, 1],
  recordPlayer: [420, 1], chessTable: [360, 1], knitting: [140, 1], ukulele: [280, 1],
  vanity: [380, 1], laundry: [150, 1], yogaMat: [180, 1], punchingBag: [420, 1],
  craftBench: [420, 1], toolbox: [250, 1], scrapbook: [300, 1], herbStand: [210, 1],
  corkboard: [110, 1], plushRabbit: [130, 1], paperLantern: [120, 1], teaTray: [260, 1],
};

const FURNITURE_GROUPS = {
  essentials: ['toilet', 'washstand', 'shower', 'bath', 'cloudBed', 'bed', 'bigbed',
    'sofa', 'beanbag', 'chair', 'table', 'fridge', 'stove', 'coffee', 'mirror', 'vanity', 'laundry', 'teaTray'],
  decor: ['moonLamp', 'bunnyPicture', 'cloudMobile', 'tulips', 'pawRug',
    'plant', 'lamp', 'rug', 'rug2', 'window', 'painting', 'clock', 'poster',
    'shelfwall', 'garland', 'xmastree', 'lantern', 'corkboard', 'plushRabbit', 'paperLantern'],
  hobbies: ['recordPlayer', 'chessTable', 'puzzleDesk', 'knitting', 'ukulele', 'piano', 'shelf',
    'desk', 'arcade', 'aquarium', 'tv', 'catbed', 'pc', 'speaker', 'easel', 'treadmill', 'yogaMat', 'punchingBag', 'craftBench', 'toolbox', 'scrapbook', 'herbStand'],
  yard: ['gardenSwing', 'gardenBench', 'flowerBox', 'picnicTable'],
};

const LEVELS = [null,
  { name: '小屋',     cols: 16, cap: 5 },
  { name: '温馨小家', cols: 20, cap: 6, cost: 3000 },
  { name: '梦想之家', cols: 24, cap: 8, cost: 8000 },
];

const FUND_SHARE = 0.2;                                       // 工资里存进基金的比例
const GENEROSITY = { genki: 0.15, lazy: 0.05, nerd: 0.12, foodie: 0.2, social: 0.25 };

// 房子变宽：改世界宽度，画布跟着变
function setWorldSize(cols) {
  COLS = cols; W = COLS * T;
  HOOK.resize();
  BLOCK = blockedMap();
}

// 放一件家具前调用：优先用仓库里的，否则从基金里买
function acquire(id) {
  if (TEST_MODE) return Object.hasOwn(SHOP, id);
  if ((G.inv[id] || 0) > 0) { G.inv[id]--; return true; }
  const [price, lv] = SHOP[id];
  if (lv > G.level) { HOOK.toast(`🔒 扩建成「${LEVELS[lv].name}」才能买${FURNITURE[id].name}`, true); return false; }
  if (G.fund < price) { HOOK.toast(`🏦 家庭基金不够，${FURNITURE[id].name}要 ${yuan(price)}`, true); return false; }
  G.fund -= price;
  addLog(`🛒 用家庭基金买了${FURNITURE[id].name}，花了 ${yuan(price)}`);
  return true;
}
function stash(id) { G.inv[id] = (G.inv[id] || 0) + 1; }

// 号召大家凑钱：每人按性格拿出“闲钱”（留 ¥300 生活费）的一部分
function crowdfund() {
  if (G.crowdDay === G.day) { HOOK.toast('本月已经凑过钱了，下个月再来吧', true); return; }
  G.crowdDay = G.day;
  let total = 0; const parts = [];
  for (const d of residents()) {
    const spare = d.money - 300;
    const amt = spare > 0 ? Math.round(spare * (GENEROSITY[d.persona] || 0.1) / 10) * 10 : 0;
    const home = d.state !== 'away';
    if (amt >= 10) {
      d.money -= amt; total += amt; parts.push(`${d.name} ${yuan(amt)}`);
      if (home) say(d, pick([`我出 ${yuan(amt)}！`, '为了更好的家！', '拿去吧～']));
    } else if (home) say(d, pick(['我……没钱', '下次一定', '钱包空空的']));
  }
  G.fund += total;
  if (total) { addLog(`📣 大家凑钱：${parts.join('、')}，家庭基金 +${yuan(total)}`); HOOK.toast(`📣 凑到了 ${yuan(total)}！`, true); SFX.play('love'); }
  else HOOK.toast('大家都没什么钱了……', true);
  HOOK.refresh();
}

function expand() {
  const next = LEVELS[G.level + 1];
  if (!next) return;
  if (G.fund < next.cost) { HOOK.toast(`🏦 扩建需要 ${yuan(next.cost)}，家庭基金还差 ${yuan(next.cost - G.fund)}`, true); SFX.play('deny'); return; }
  G.fund -= next.cost; G.level++;
  setWorldSize(next.cols);
  const unlocked = Object.keys(SHOP).filter(id => SHOP[id][1] === G.level).map(id => FURNITURE[id].name);
  addLog(`🔨 小屋扩建成「${next.name}」！房子变大了，解锁了${unlocked.join('、')}`);
  HOOK.toast(`🔨 扩建成「${next.name}」！`, true); SFX.play('newday');
  for (const d of G.dolls) if (d.state !== 'away') { say(d, pick(['哇，房子变大了！', '好宽敞！', '可以买新家具了！'])); d.happy = 3; }
  HOOK.refresh(); HOOK.select();
}

// 小人会念叨想要的家具，提示玩家下一步买什么
function wishLine(d) {
  const owned = new Set(G.furniture.map(f => FURNITURE[f.id].use));
  const wants = Object.entries(PERSONAS[d.persona].like)
    .filter(([use, v]) => v >= 20 && !owned.has(use))
    .map(([use]) => Object.keys(SHOP).find(id => FURNITURE[id].use === use))
    .filter(Boolean);
  return wants.length ? `要是家里有${FURNITURE[pick(wants)].name}就好了` : null;
}

<script>
// 卧室：一面带门的隔墙把房子分成左边的卧室和右边的客厅
// 门关上时外面看不到里面——花心的人会趁机把暧昧对象叫进卧室；恋人走进来就会撞破

const BX = 8;
const DY = 5;
const UPPER_DOOR_Y = 16;
const BATH_X = 4;
const BATH_DOOR_Y = 17;
G.bedDoor = true;

const roomOf = d => d.ty >= ROWS ? 'yard' : d.ty >= FLOOR_SPLIT
  ? (G.bathroom && d.tx < BATH_X ? 'bathroom' : d.tx < BX ? 'upperBedroom' : 'study')
  : (d.tx < BX ? 'bed' : 'living');
const inBedroom = d => d.state !== 'away' && roomOf(d) === 'bed';
const canSee = (a, b) => roomOf(a) === roomOf(b) || (a.ty < FLOOR_SPLIT && b.ty < FLOOR_SPLIT && G.bedDoor);
const passageRow = y => y < FLOOR_SPLIT ? DY : UPPER_DOOR_Y;
const crossesDivider = (x1, x2, divider) => Math.min(x1, x2) === divider - 1 && Math.max(x1, x2) === divider;
const wallBetween = (x1, y1, x2, y2) =>
  ((y1 >= ROWS || y2 >= ROWS) ? (y1 >= ROWS) !== (y2 >= ROWS) :
  ((y1 < FLOOR_SPLIT) !== (y2 < FLOOR_SPLIT)) ||
  (crossesDivider(x1, x2, BX) && y1 !== passageRow(y1)) ||
  (G.bathroom && y1 >= FLOOR_SPLIT && crossesDivider(x1, x2, BATH_X) && y1 !== BATH_DOOR_Y));
const isDoorTile = (x, y) => (y === passageRow(y) && (x === BX - 1 || x === BX)) ||
  (G.bathroom && y === BATH_DOOR_Y && (x === BATH_X - 1 || x === BATH_X));
const straddles = (x, y, w) => y < ROWS && ((x < BX && x + w > BX) ||
  (G.bathroom && (y < 0 || y >= FLOOR_SPLIT) && x < BATH_X && x + w > BATH_X));

function blocksDoor({ x, y }, { w, h }) {
  for (let row = y; row < y + h; row++) for (let col = x; col < x + w; col++) {
    if (isDoorTile(col, row)) return true;
  }
  return false;
}

function blocksStairs(f) {
  const { w, h } = FURNITURE[f.id], column = stairsColumn();
  return f.x <= column && column < f.x + w &&
    [LOWER_LANDING, UPPER_LANDING].some(row => f.y <= row && row < f.y + h);
}

function fitHouseFurniture() {
  for (const f of [...G.furniture]) {
    const F = FURNITURE[f.id], layer = layerOf(f.id);
    const wall = layer === 'wall';
    const upper = f.y < 0 || f.y >= FLOOR_SPLIT;
    const first = wall ? (upper ? UPPER_WALL : 0) : (upper ? FLOOR_SPLIT : WALL_ROWS);
    const end = wall ? first + WALL_ROWS : (upper ? ROWS : FLOOR_SPLIT);
    if (!straddles(f.x, f.y, F.w) && !(layer === 'solid' && (blocksDoor(f, F) || blocksStairs(f)))) continue;

    let best = null;
    for (let y = first; y + F.h <= end; y++) for (let x = 0; x + F.w <= COLS; x++) {
      const distance = Math.abs(x - f.x) + Math.abs(y - f.y);
      if ((!best || distance < best.distance) && canPlace(f.id, x, y, f)) best = { x, y, distance };
    }
    if (best) {
      f.x = best.x; f.y = best.y;
      addLog(`🧳 为隔墙或楼梯腾出空间，${F.name}移到了同层的空位`);
    } else {
      G.furniture = G.furniture.filter(other => other !== f);
      stash(f.id);
      addLog(`🧳 为隔墙或楼梯腾出空间，${F.name}收进了仓库`);
    }
  }
}

function doorOpenNow() { return G.bedDoor || G.dolls.some(d => d.state !== 'away' && d.ty === DY && (d.tx === BX - 1 || d.tx === BX)); }

// The dividing wall is shown as a full-height cut edge. Its door and
// threshold stay at the real crossing tile further inside the room.
function bedroomDoorRect() {
  const floor = STOREYS[0];
  return { x: HOUSE_X + BX * T, y: houseY(DY * T, floor) };
}

function partitionDrawables(c) {
  const { x, y } = bedroomDoorRect();
  const drawables = [{ y: y + FLOOR_STEP, draw: () => {
    R(c, x - 5, y + 2, 10, 2, '#b29a81');
    if (!doorOpenNow()) {
      R(c, x - 5, y - 16, 6, 18, '#78645d');
      R(c, x - 4, y - 15, 4, 16, '#bf9a7f');
      R(c, x - 2, y - 7, 1, 1, '#f7d390');
    }
  } }];
  if (G.bathroom) {
    const bx = HOUSE_X + BATH_X * T, by = houseY(BATH_DOOR_Y * T, STOREYS[1]);
    drawables.push({ y: by + FLOOR_STEP, draw: () => R(c, bx - 5, by + 2, 10, 2, '#ddcfaf') });
  }
  return drawables;
}

function hitBedDoor(p) {
  const { x, y } = bedroomDoorRect();
  return Math.abs(p.x - x) <= 7 && p.y >= y - 16 && p.y <= y + 7;
}
function toggleBedDoor() {
  G.bedDoor = !G.bedDoor;
  SFX.play(G.bedDoor ? 'pick' : 'place');
  HOOK.toast(G.bedDoor ? '🚪 卧室门打开了' : '🚪 卧室门关上了', true);
}

/* ---------------- 卧室约会（地下情） ---------------- */
function bigbedInBedroom() { return G.furniture.find(f => f.id === 'bigbed' && f.y < FLOOR_SPLIT && f.x + FURNITURE.bigbed.w <= BX); }
// 卧室里除了这两个人没有别人（睡着的也算有人）
function bedroomEmptyFor(a, b) { return !G.dolls.some(o => o !== a && o !== b && inBedroom(o)); }

function canTryst(d, p) {
  if (!canRomance(d, p)) return false;
  const r = rel(d, p);
  if (r.trystAt > absNow() - 480) return false;            // 一次之后要隔几个小时
  return d.heart === 'fickle' && !r.lovers && (r.secret || r.l >= 40) && r.f >= 30 &&
    bigbedInBedroom() && bedroomEmptyFor(d, p) && interruptible(p) && !(p.heart === 'loyal' && loverOf(p));
}

function startTryst(d, p) {
  const bb = bigbedInBedroom(); if (!bb) return false;
  const spots = approachTiles(bb).filter(t => t.x < BX && free(t.x, t.y) && !isDoorTile(t.x, t.y));
  if (spots.length < 2) return false;
  const pa = findPath(d.tx, d.ty, [spots[0]]), pb = findPath(p.tx, p.ty, [spots[1]]);
  if (!pa || !pb) return false;
  if (d.act) endAct(d); if (p.act) endAct(p);
  d.path = pa; d.state = pa.length ? 'walk' : 'arrive'; d.act = { type: 'tryst', partner: p, since: absNow() };
  p.path = pb; p.state = pb.length ? 'walk' : 'arrive'; p.act = { type: 'tryst', partner: d, since: absNow() };
  say(d, pick(['跟我来一下～', '我们去卧室聊？', '这边没人……']));

function traitBonus(d, use) {

  planChess: { label: '研究残局', personas: ['nerd'], furniture: ['chessTable'], motion: 'book',
    gain: { fun: 13 }, line: '如果先走这枚棋子呢？' },
  skyNotes: { label: '在窗边记星图', personas: ['nerd', 'maker'], furniture: ['window'], motion: 'book',
    gain: { fun: 13 }, when: () => G.night && G.weather === 'sunny', line: '那一颗比昨晚还亮' },
  recipeBook: { label: '抄写食谱', personas: ['foodie', 'tidy'], furniture: ['desk', 'table', 'scrapbook'],
    motion: 'book', gain: { fun: 12 }, line: '下次少放一点糖' },
  smellHerbs: { label: '闻闻香草', personas: ['foodie', 'tidy'], furniture: ['herbStand', 'plant'],
    motion: 'watch', gain: { fun: 10 }, line: '闻起来像刚泡好的薄荷茶' },
  recipeSwap: { label: '交换食谱', personas: ['foodie', 'maker'], partner: true, motion: 'book',
    gain: { fun: 8, social: 10 }, when: () => G.time >= 660 && G.time <= 1260, recipient: p => p.persona === 'foodie' || p.needs.hunger <= 80,
    line: '你要不要试试这份配方？', reply: '好呀，下次做给你尝尝' },
  compliment: { label: '夸室友的穿搭', personas: ['social', 'stylist'], partner: true, motion: 'spark',
    gain: { fun: 7, social: 9 }, line: '你今天这一身配色很好看！', reply: '谢谢，我挑了好一会儿呢' },
  checkIn: { label: '问问室友近况', personas: ['social'], partner: true, motion: 'spark',
    gain: { fun: 5, social: 12 }, recipient: p => p.needs.fun <= 68 || p.needs.social <= 65,
    line: '今天过得怎么样？我可以陪你聊一会儿', reply: '有人听我说说，心里好多了' },
  writeCard: { label: '写小卡片', personas: ['social', 'maker', 'stylist'], furniture: ['desk', 'table', 'craftBench'],
    motion: 'book', gain: { fun: 11 }, line: '留一句话，晚点给室友看' },
};

for (const [id, routine] of Object.entries(ROUTINES)) {
  ACT_NAMES[id] = routine.label;
  ACT_LINES[id] = [routine.line];
}

function routineDistance(d, x, y) {
  return Math.abs(d.tx - x) + Math.abs(d.ty - y);
}

function routineAvailable(d, id) {
  const routine = ROUTINES[id];
  const likes = (MBTI_INTERESTS[mb(d)] || []).includes(id);
  return !!routine && (routine.personas.includes(d.persona) || likes)
    && d.needs.energy >= 24 && d.needs.hunger >= 20 && (d.needs.bladder >= 16 || !G.furniture.some(f => f.id === 'toilet'))
    && (d.routineTimes[id] ?? -Infinity) + 220 <= absNow()
    && (!routine.when || routine.when(d));
}

function routinePartnerAvailable(d, p, id) {
  const routine = ROUTINES[id];
  return p !== d && p.state === 'idle' && roomOf(d) === roomOf(p)
    && routineDistance(d, p.tx, p.ty) >= 1 && routineDistance(d, p.tx, p.ty) <= 3 && p.needs.energy >= 24
    && p.needs.hunger >= 20 && (p.needs.bladder >= 16 || !G.furniture.some(f => f.id === 'toilet')) && rel(d, p).f >= 25
    && (p.routineTimes[id] ?? -Infinity) + 220 <= absNow()
    && (!routine.recipient || routine.recipient(p));
}

function routineFurnitureRow(f) {
  return layerOf(f.id) === 'wall' ? (f.y < 0 ? FLOOR_SPLIT : WALL_ROWS) : f.y;
}

function routineOptions(d, want) {
  const out = [];
  for (const [type, routine] of Object.entries(ROUTINES)) {
    if (!routineAvailable(d, type)) continue;
    const s = 45 + want(routine.gain) + traitBonus(d, type) + Math.random() * 16 * noiseMul(d);
    if (routine.partner) {
      const partner = G.dolls.filter(p => routinePartnerAvailable(d, p, type))
        .sort((a, b) => rel(d, b).f - rel(d, a).f)[0];
      if (partner) out.push({ type, partner, s });
    } else if (routine.furniture) {
      const venues = G.furniture.filter(f => routine.furniture.includes(f.id) && !f.users.length);
      if (venues.length) out.push({ type, venues, s: s - 1.5 * Math.min(...venues.map(f => routineDistance(d, f.x, routineFurnitureRow(f)))) });
    } else {
      out.push({ type, s });
    }
  }
  return out;
}

function startRoutine(d, { type, partner, venues = [] }) {
  if (!routineAvailable(d, type)) return false;
  const routine = ROUTINES[type];
  if (routine.partner && (!partner || !routinePartnerAvailable(d, partner, type))) return false;
  if (routine.furniture) {
    for (const f of venues.slice().sort((a, b) =>
      routineDistance(d, a.x, routineFurnitureRow(a)) - routineDistance(d, b.x, routineFurnitureRow(b)))) {
      if (!G.furniture.includes(f) || f.users.length) continue;
      const row = routineFurnitureRow(f);
      const targets = layerOf(f.id) === 'wall'
        ? Array.from({ length: FURNITURE[f.id].w }, (_, i) => [{ x: f.x + i, y: row }, { x: f.x + i, y: row + 1 }]).flat()
        : approachTiles(f);
      const route = findPath(d.tx, d.ty, targets);
      if (!route) continue;
      f.users.push(d);
      d.path = route;
      d.act = { type, furn: f };
      d.state = route.length ? 'walk' : 'arrive';
      if (!route.length) beginRoutine(d);
      return true;
    }
    return false;
  }
  d.act = { type, partner };
  beginRoutine(d);
  return true;
}

function beginRoutine(d) {
  const { type, furn, partner } = d.act, routine = ROUTINES[type];
  if (!routineAvailable(d, type)) { endAct(d); return; }
  const t = (routine.seat ? 11 : 5 + Math.random() * 3) * durMul(d);
  d.state = 'act';
  d.ft = 0;
  Object.assign(d.act, { t, gain: routine.gain });
  d.routineTimes[type] = absNow();
  if (furn) {
    furn.active = true;
    face(d, furn.x * T + FURNITURE[furn.id].w * T / 2, routineFurnitureRow(furn) * T);
    if (routine.seat) {
      d.act.back = { x: d.tx, y: d.ty };
      d.act.onFurn = true;
      d.x = furn.x * T + 8; d.y = furn.y * T + 13; d.dir = 'down';
    }
  }
  const accessory = partner && OUTFIT.acc[partner.look.acc];
  const line = type === 'compliment' && accessory && partner.look.acc !== 'none'
    ? `你戴的${accessory}真好看！` : routine.line;
  say(d, line);
  if (partner) {
    partner.ft = 0;
    partner.state = 'act';
    partner.act = { type, partner: d, t, gain: routine.gain };
    partner.routineTimes[type] = absNow();
    face(d, partner.x, partner.y); face(partner, d.x, d.y);
    bump(d, partner, 2);
    const replyAct = partner.act;
    setTimeout(() => { if (partner.act === replyAct) say(partner, routine.reply); }, 850);
  }
  countHouseActivity('routine', partner ? `${d.name}与${partner.name} · ${routine.label}` : `${d.name} · ${routine.label}`);
}
