<script>
// Two cutaway storeys over the existing simulation grid. The front edges
// are shallow in screen space while the back walls and sprites stay upright.
const HOUSE_X = 14;
const HOUSE_HEIGHT = 310;
const HOUSE_MARGIN = 60;
const FLOOR_STEP = 3;
const WALL_STEP = 18;
const STOREYS = [
  { wall: 165, back: 225, front: 252, row: WALL_ROWS, wallRow: 0,
    rooms: ['#edbdb7', '#f4d9ae'], floors: ['#c99783', '#c69669'] },
  { wall: 74, back: 134, front: 158, row: FLOOR_SPLIT, wallRow: UPPER_WALL,
    rooms: ['#625a76', '#d7b9c6'], floors: ['#766481', '#a4ad8c'] },
];
const YARD = { wall: 258, back: 258, front: 300, row: ROWS, step: 7 };
const storeyOf = row => row >= ROWS ? YARD : STOREYS[+(row < 0 || row >= FLOOR_SPLIT)];

function houseY(y, storey) {
  return storey.back + (y - storey.row * T) * (storey.step || FLOOR_STEP) / T;
}

function stairPoint(progress) {
  const x = HOUSE_X + stairsColumn() * T + 8;
  const edge = HOUSE_X + W;
  const top = houseY(UPPER_LANDING * T + 14, STOREYS[1]);
  const bottom = houseY(LOWER_LANDING * T + 14, STOREYS[0]);
  if (progress < .2) return { x: mixNum(x, edge + 8, progress / .2), y: top };
  if (progress > .8) return { x: mixNum(edge + 28, x, (progress - .8) / .2), y: bottom };
  const t = (progress - .2) / .6;
  return { x: mixNum(edge + 8, edge + 28, t), y: mixNum(top, bottom, t) };
}

function houseDollPoint(d) {
  if (d.state === 'lift') return { x: d.liftX, y: d.liftY };
  if (takingStairs(d)) {
    return stairPoint((UPPER_LANDING * T + 14 - d.y) / ((UPPER_LANDING - LOWER_LANDING) * T));
  }
  if (takingYardPath(d)) {
    const inside = FLOOR_SPLIT - 1, outside = ROWS;
    const progress = (d.y - (inside * T + 14)) / ((outside - inside) * T);
    return { x: HOUSE_X + d.x, y: mixNum(houseY(inside * T + 14, STOREYS[0]), houseY(outside * T + 14, YARD), progress) };
  }
  if (d.act?.onFurn) {
    const f = d.act.furn;
    const offset = f.id === 'gardenSwing' ? swingOffset(G.t) : 0;
    return { x: HOUSE_X + d.x, y: houseFurnitureRect(f).y + d.y - f.y * T + offset };
  }
  return { x: HOUSE_X + d.x, y: houseY(d.y, storeyOf(d.ty)) };
}

function houseFurnitureRect(f) {
  const F = FURNITURE[f.id], storey = storeyOf(f.y);
  const x = HOUSE_X + f.x * T, w = F.w * T;
  const layer = layerOf(f.id);
  const wall = layer === 'wall';
  const bottom = wall ? storey.wall + 5 + (f.y - storey.wallRow) * WALL_STEP + F.h * T : houseY((f.y + F.h) * T, storey);
  const y = bottom - F.h * (layer === 'floor' ? FLOOR_STEP : T);
  return { x, y, w, bottom, top: y - (layer === 'solid' ? TALL[f.id] || 0 : 0), storey };
}

function houseTile(p, id) {
  const storey = p.y >= YARD.back ? YARD : p.y < STOREYS[0].wall ? STOREYS[1] : STOREYS[0];
  const F = id && FURNITURE[id];
  const wall = F && layerOf(id) === 'wall';
  const x = F ? Math.round((p.x - HOUSE_X) / T - F.w / 2) : Math.floor((p.x - HOUSE_X) / T);
  if (p.x < HOUSE_X || p.x >= HOUSE_X + W || p.y < storey.wall || p.y >= storey.front) return null;
  if (wall) {
    if (p.y >= storey.back) return null;
    const row = Math.round((p.y - storey.wall - 5 - F.h * T / 2) / WALL_STEP);
    return { x, y: storey.wallRow + Math.max(0, Math.min(WALL_ROWS - F.h, row)) };
  }
  if (p.y < storey.back) return null;
  const y = storey.row + (p.y - storey.back) / (storey.step || FLOOR_STEP);
  const end = storey === YARD ? YARD_END : storey === STOREYS[1] ? ROWS : FLOOR_SPLIT;
  return { x, y: F ? Math.max(storey.row, Math.min(end - F.h, Math.round(y - F.h / 2))) : Math.floor(y) };
}

function housePath(c, points) {
  c.beginPath();
  c.moveTo(...points[0]);
  for (const point of points.slice(1)) c.lineTo(...point);
  c.closePath();
}

function housePoly(c, color, ...points) {
  c.fillStyle = color;
  housePath(c, points);
  c.fill();
}

function drawHouseGarden(c, left, right) {
  const width = W + HOUSE_MARGIN;

  const season = seasonOf(G.day).id;

  sky.addColorStop(1, G.night ? '#b59bc35b' : '#ffefd496');
  c.fillStyle = sky;
  c.fillRect(0, 0, width, 230);
  const horizon = snowy ? '#b9c9ca' : '#a6baa2';
  housePoly(c, horizon, [0, 213], [19, 196], [63, 224], [right - 18, 213],
    [right + 22, 194], [width, 211], [width, 239], [0, 239]);
  R(c, 0, 229, width, HOUSE_HEIGHT - 229, grass);
  for (const [x, y, size] of [[-13, 171, 42], [right + 2, 165, 37], [right + 21, 197, 40]]) {
    R(c, x + 14, y - 4, 6, 231 - y, '#785749');
    R(c, x + 16, y - 3, 2, 229 - y, '#aa8061');
    for (const [dx, dy, w] of [[0, -13, size], [4, -19, size - 6], [8, -25, size - 14], [13, -29, size - 22]]) {
      R(c, x + dx, y + dy, w, 14, canopy);

    }
    for (let i = 0; i < 9; i++) {
      const dx = 5 + Math.floor(rnd(x + i * 17) * (size - 14)), dy = -10 - Math.floor(rnd(x + i * 41) * 12);
      R(c, x + dx, y + dy, 4, 2, i % 3 ? leaf : leafLight);
      detail(c, x + dx + 1, y + dy - .5, 2, .5, leafLight);
    }
  }
  const lawn = c.createLinearGradient(0, YARD.back, 0, YARD.front);
  lawn.addColorStop(0, shade(grass, -.045));
  lawn.addColorStop(.5, shade(grass, .055));
  lawn.addColorStop(1, shade(grass, .09));
  c.fillStyle = lawn;

  }
  for (const x of [left - 7, right + 5]) {

  }
  for (const [x, y] of [[3, 43], [right + 12, 57], [right - 25, 8]]) {

    R(c, x, y + 8, 32, 4, underside);

  for (let i = 0; i < 44; i++) {
    const x = Math.round(rnd(i + 690) * width), y = Math.round(261 + rnd(i + 810) * 36);
    if (Math.abs(x - gate - 8) < 18) continue;
    R(c, x, y + 1, 2, 1, grassDark);
    if (i % 5 !== 0 || snowy) continue;
    detail(c, x + .5, y - 1, .5, 3, grassDark);
    R(c, x - 1, y - 1, 3, 1, i % 2 ? '#fff4d9' : '#f2c0b6');
    detail(c, x + .5, y - 2, .5, 3, '#fff0d3');
    detail(c, x + .5, y - 1, .5, .5, '#ddae6a');
  }
  const picnic = G.community?.active;
  if (G.weather === 'rain' || (picnic?.showerAt && absNow() >= picnic.showerAt)) {
    for (let i = 0; i < 26; i++) {
      const x = rnd(i + 460) * width, y = 252 + (rnd(i + 361) * 58 + G.t * 85) % 58;

}

function drawHouseRoof(c, left, right) {
  const peak = left + Math.round(W * .58), eave = 70;
  const pitch = (color, outer, inner) => housePoly(c, color, ...outer, ...[...inner].reverse());
  const ridge = [[left - 7, eave], [peak, 7], [right + 9, 32]];
  const rim = [[left - 3, eave + 1], [peak, 13], [right + 8, 38]];
  const face = [[left + 8, eave + 1], [peak, 20], [right + 1, 44]];
  const underside = [[left + 17, eave + 1], [peak, 25], [right - 5, 47]];
  housePoly(c, '#f8ddba', ...ridge, [right + 9, eave]);
  pitch('#684450', ridge, rim);
  pitch('#ab6b6d', rim, face);
  pitch('#dca68d', face, underside);
  const glint = [[left + 2, eave], [peak, 15], [right + 7, 40]];
  pitch('#d19488', rim, glint);
  R(c, right + 1, 37, 8, 32, '#80525a');

  c.save();
  housePath(c, [...underside, [right - 5, eave], [left + 17, eave]]);
  c.clip();
  const plaster = c.createLinearGradient(0, 20, 0, eave);
  plaster.addColorStop(0, '#f1c395');
  plaster.addColorStop(.65, '#ffe4be');
  plaster.addColorStop(1, '#edc198');
  c.fillStyle = plaster;
  c.fillRect(left, 20, W, eave - 20);
  housePoly(c, '#ce9b7666', [left + 13, eave], [left + 67, 49], [left + 67, eave]);
  for (let x = left + 72; x < right; x += 24) detail(c, x, 23, .5, 45, '#bc886818');
  c.restore();
  R(c, left + 65, 49, 3, 21, '#a38877');
  R(c, left + 69, 62, W - 76, 8, '#d7b18c');
  for (let y = 63; y < eave; y += 2) R(c, left + 69, y, W - 76, 1, '#c5a07f');
  for (const [x, y, w, h] of [[peak - 48, 52, 24, 14], [peak - 22, 45, 15, 21], [peak - 3, 41, 22, 25], [right - 42, 54, 18, 12], [right - 23, 48, 15, 18]]) {
    bevel(c, x, y, w, h, '#bb8962', '#9a674f');
    R(c, x + 1, y + 1, w - 2, 2, '#e4b48a');
    R(c, x + w - 5, y + 3, 4, h - 4, '#a47455');
    detail(c, x + 2, y + h - 3, w - 8, .5, '#d29b73');
    R(c, x + 3, y + 3, w - 10, 1, '#d9b489');
    R(c, x + w - 9, y + 5, 3, 2, '#a27b62');
    detail(c, x + w - 9, y + 5, 2.5, .5, '#ebc292');
  }
  box(c, peak + 26, 31, 13, 15, '#f5e9d5', '#9b8074');

  R(c, peak + 28, 37, 9, 1, '#f5e9d5');
  R(c, peak + 24, 46, 17, 2, '#b38e76');
}

function drawRoomDetails(c, x, right, top, back, storey, i) {
  if (i === 0) {
    const upper = storey === STOREYS[1];
    const start = x + 10, stop = right - 10, y = top + 11;
    const fabric = upper ? '#4a4963' : '#fff1e5';
    for (let j = 0; j < 3; j++) {
      const a = start + (stop - start) * j / 3, b = start + (stop - start) * (j + 1) / 3;
      housePoly(c, fabric, [a, y], [a + 6, y + 4], [b - 6, y + 4], [b, y],
        [b - 5, y + 7], [a + 5, y + 7]);
      R(c, a - 1, y - 1, 3, 3, upper ? '#b9a6c8' : '#cc858b');
    }
    R(c, stop - 1, y - 1, 3, 3, upper ? '#b9a6c8' : '#cc858b');
    if (!upper) {
      const lampX = x + Math.floor((right - x) * .5);
      R(c, lampX, top + 2, 1, 11, '#976b61');
      R(c, lampX - 8, top + 12, 17, 2, '#976b61');
      for (const [j, dx] of [-8, 0, 8].entries()) {
        const drop = j === 1 ? 6 : 3;
        R(c, lampX + dx, top + 13, 1, drop, '#a77962');
        bevel(c, lampX + dx - 2, top + 13 + drop, 5, 5, '#ffe4ae', '#c89174');
        R(c, lampX + dx - 1, top + 14 + drop, 2, 2, '#fff4cf');
      }
      R(c, x + 14, back - 31, 42, 4, '#cc8d97');
      housePoly(c, '#fff2e5', [x + 14, back - 28], [x + 19, back - 28],
        [x + 18, back - 11], [x + 13, back - 9]);
      housePoly(c, '#fff2e5', [x + 51, back - 28], [x + 56, back - 28],
        [x + 57, back - 9], [x + 52, back - 11]);
    }
  } else {
    const ink = storey === STOREYS[1] ? '#f2e0df' : '#fff2db';
    for (let px = x + 12; px + 19 < right; px += 32) {
      R(c, px, top + 15, 18, 1, ink);
      R(c, px, top + 15, 1, 26, ink);
      R(c, px + 17, top + 15, 1, 26, ink);
    }
  }
}

function drawRoomFloor(c, x, end, back, front, base, pattern) {
  const width = end - x;
  const edge = shade(base, -.085), light = shade(base, .055);
  R(c, x, back, width, front - back, base);
  if (pattern === 'tile') {
    for (let y = back; y < front; y += 5) {
      R(c, x, y, width, 1, '#abc9bb');
      for (let px = x + (y - back) % 2 * 5; px < end; px += 10) {
        R(c, px, y, 1, 5, '#b7d1c4');
        R(c, px + 1, y + 1, 7, 1, '#deebe1');
      }
    }
  } else if (pattern === 'plank' && cottageArtReady()) {
    c.save();
    c.globalAlpha *= .62;
    c.beginPath();
    c.rect(x, back, width, front - back);
    c.clip();
    for (let px = x; px < end; px += 56) drawCottageSprite(c, 'oak', px, back, 56, front - back);
    c.restore();
  } else if (pattern === 'plank') {
    for (let y = back; y < front; y += 5) {
      detail(c, x, y, width, .5, edge);
      detail(c, x, y + .5, width, .5, light);
      for (let px = x + 7 + ((y - back) * 7) % 36; px < end; px += 36) {
        detail(c, px, y + .5, .5, 4.5, edge);
        const span = 5 + Math.floor(rnd(px + y) * 13);
        detail(c, px + 3, y + 2.5, span, .5, light);
        if ((px + y) % 3 === 0) detail(c, px + 5, y + 3.5, 3, .5, edge);
      }
    }
  } else {
    for (let i = 0; i < width / 2; i++) {
      const px = x + rnd(i + 7) * width, y = back + rnd(i + 39) * (front - back);
      detail(c, px, y, i % 3 === 0 ? 1.5 : .5, .5, i % 4 ? light : edge);
    }
  }
  const contact = c.createLinearGradient(0, back, 0, back + 11);
  contact.addColorStop(0, '#4b354344');
  contact.addColorStop(1, '#4b354300');
  c.fillStyle = contact;
  c.fillRect(x, back, width, 11);
}

function drawStorey(c, storey, wall, floor) {
  const left = HOUSE_X, right = left + W, mid = left + BX * T;
  const { back, front, wall: top } = storey;
  const bathEdge = G.bathroom && storey === STOREYS[1] ? left + BATH_X * T : left;
  const spans = [[0, bathEdge, mid], [1, mid, right]];
  if (bathEdge > left) spans.unshift([2, left, bathEdge]);
  for (const [i, x, end] of spans) {
    const bath = i === 2;
    const base = bath ? '#b5d8ce' : wall.id === 'cream' ? storey.rooms[i] : shade(wall.base, i ? .01 : -.05);
    const alt = wall.id === 'cream' ? shade(base, .032) : wall.alt;
    const floorBase = bath ? '#d1e4dd' : floor.id === 'oak' ? storey.floors[i] : floor.base;
    const inset = 9;

    c.save();
    housePath(c, [[x, front], [x + inset, back], [end - inset, back], [end, front]]);
    c.clip();
    if (bath || floor.id === 'oak') {
      const pattern = bath ? 'tile' : (i === 0 && storey === STOREYS[1]) ? 'carpet' : 'plank';
      drawRoomFloor(c, x, end, back, front, floorBase, pattern);
    } else {
      c.translate(left, back);
      c.scale(1, FLOOR_STEP / T);
      c.translate(0, -storey.row * T);
      drawFloor(c, { ...floor, base: floorBase, alt: shade(floorBase, -.09) },
        storey.row * T, (storey === STOREYS[1] ? ROWS : FLOOR_SPLIT) * T);
    }
    c.restore();

    R(c, x, top, end - x, back - top, base);
    c.save();
    c.beginPath();
    c.rect(x + inset, top, end - x - inset * 2, back - top - 1);
    c.clip();
    c.translate(left, top);
    if (bath) {
      R(c, x - left, back - top - 36, end - x, 36, '#e4eee6');
      for (let row = back - top - 36; row < back - top; row += 8) {
        R(c, x - left, row, end - x, 1, '#a9cbc4');
        for (let col = x - left + (row % 16); col < end - left; col += 16) R(c, col, row, 1, 8, '#b7d4ca');
      }
      R(c, x - left, back - top - 37, end - x, 1, '#83b4aa');
    } else drawWall(c, { ...wall, base, alt }, back - top);
    c.restore();
    housePoly(c, shade(base, -.10), [x, top], [x + inset, top + 6], [x + inset, back], [x, front]);
    housePoly(c, shade(base, -.045), [end, top], [end - inset, top + 6], [end - inset, back], [end, front]);
    const panelWidth = end - x - inset * 2;
    R(c, x + inset, back - 12, panelWidth, 10, shade(base, .08));
    for (let px = x + inset + 4; px + 11 < end - inset; px += 16) {
      const border = shade(base, -.025), face = shade(base, .11);
      bevel(c, px, back - 10, 12, 7, face, border);
      detail(c, px + 2, back - 9, 8, .5, shade(base, .17));
    }
    R(c, x + inset, back - 13, end - x - inset * 2, 1, shade(base, -.09));
    R(c, x + inset, back - 2, end - x - inset * 2, 2, shade(base, -.13));
    const ceilingShade = c.createLinearGradient(0, top, 0, top + 14);
    ceilingShade.addColorStop(0, '#56334442');
    ceilingShade.addColorStop(1, '#56334400');
    c.fillStyle = ceilingShade;
    c.fillRect(x, top, end - x, 14);
    R(c, x + inset, back - 14, end - x - inset * 2, 1, '#fff0d38e');
    if (!bath && wall.id === 'cream') drawRoomDetails(c, x, end, top, back, storey, i);
  }
  for (const x of bathEdge > left ? [bathEdge, mid] : [mid]) {
    R(c, x - 2, top, 5, front - top, '#8a615c');
    R(c, x - 2, top, 1, front - top, '#d1a68a');
    R(c, x + 2, top, 1, front - top, '#67454d');
  }
}

function drawHouseStairs(c) {
  const edge = HOUSE_X + W;
  const top = stairPoint(0).y, bottom = stairPoint(1).y;
  R(c, edge + 4, top - 10, 29, bottom - top + 15, '#ad846b');
  R(c, edge + 33, top - 10, 3, 252 - top + 10, '#80605c');
  R(c, edge + 33, top - 10, 1, 252 - top + 10, '#d0a386');
  R(c, edge - 5, top - 1, 17, 4, '#c4a384');
  R(c, edge - 5, bottom - 1, 38, 4, '#c4a384');
  housePoly(c, '#a08272', [edge + 2, top], [edge + 14, top],
    [edge + 33, bottom], [edge + 22, bottom]);
  for (let i = 0; i <= 16; i++) {
    const p = stairPoint(.2 + .6 * i / 16);
    R(c, p.x - 5, p.y - 1, 11, 2, '#f2d1a9');
    R(c, p.x - 5, p.y + 1, 11, 2, '#957768');
    if (i % 4 === 0) R(c, p.x + 4, p.y - 9, 1, 9, '#826b63');
  }
  housePoly(c, '#76625e', [edge + 12, top - 10], [edge + 32, bottom - 10],
    [edge + 32, bottom - 8], [edge + 12, top - 8]);
}

function drawHouseShell(c, wall, floor) {
  const l = HOUSE_X, r = l + W;
  drawHouseGarden(c, l, r);
  drawHouseRoof(c, l, r);
  for (const storey of STOREYS) drawStorey(c, storey, wall, floor);
  for (const [y, h] of [[69, 5], [158, 7], [252, 6]]) {
    R(c, l - 4, y, W + 8, h, '#76504c');
    R(c, l - 3, y + 1, W + 6, 2, '#dfb18d');
    detail(c, l - 3, y + 1, W + 6, .5, '#f3c9a2');
    R(c, l - 3, y + 3, W + 6, 1, '#b47e65');
    if (h > 5) {
      for (let x = l + 4; x < r - 12; x += 27) detail(c, x, y + 4.5, 10, .5, '#a36e59');
      detail(c, l - 2, y + h - 1, W + 4, .5, '#d09170');
    }
  }
  for (const x of [l - 4, r]) {
    for (const { wall: y, front } of STOREYS) {
      R(c, x, y, 4, front - y, '#a97c65');
      detail(c, x + .5, y, .5, front - y, '#e9bd99');
      detail(c, x + 3, y, 1, front - y, '#744f4c');
    }
  }
  drawHouseStairs(c);
}

// Furniture keeps its identity when moved. These records contain only saveable IDs.

  return {
    nextFurniture: saved?.nextFurniture || 1,
    corners: saved?.corners || {},
    pieces: saved?.pieces || [],
    traditions: saved?.traditions || {},

}

const KEEPSAKE_FINISHES = { rose: ['莓果粉', '#cf8e9e'], sage: ['鼠尾草绿', '#91ad93'], honey: ['蜂蜜木色', '#d5aa79'] };
const cornerDistance = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const cornerRoom = f => roomOf({ tx: f.x, ty: f.y < 0 ? FLOOR_SPLIT : Math.max(f.y, WALL_ROWS) });

function cornerKind(f) {
  if (G.keepsakes.corners[f.key]?.kind) return G.keepsakes.corners[f.key].kind;
  if (f.id === 'teaTray') return 'tea';
  if (f.id === 'piano') return 'music';
  if (f.id === 'shelf') return 'read';
  if (f.id === 'chair' && G.furniture.some(w => w.id === 'window' && cornerRoom(w) === cornerRoom(f) &&
      Math.abs(w.x + 1 - f.x) <= 3)) return 'read';
  return null;
}

const CORNER_NAMES = { tea: '茶角', music: '练琴角', read: '阅读角' };
const cornerOwner = f => G.keepsakes.corners[f.key]?.owner;
const cornerRegular = (f, d) => G.keepsakes.corners[f.key]?.regulars?.includes(d.pid);

function noteCornerUse(d, f) {
  const kind = cornerKind(f);
  if (!kind || d.guest) return;
  const record = G.keepsakes.corners[f.key] ||= { kind, visits: {}, regulars: [] };
  const last = record.visits[d.pid];
  const companion = kind === 'tea' ? f.users.find(other => other !== d && other.state === 'act' && cornerRegular(f, other)) :
    kind === 'read' && record.owner && G.dolls.find(other => other !== d && other.state === 'act' && other.act?.furn &&
      cornerOwner(other.act.furn) === other.pid && cornerKind(other.act.furn) === 'read' &&
      cornerRoom(other.act.furn) === cornerRoom(f) && cornerDistance(other.act.furn, f) <= 3);
  if (companion && cornerRegular(f, d) && record.sharedMonth !== G.day) {
    record.sharedMonth = G.day;
    if (kind === 'read') G.keepsakes.corners[companion.act.furn.key].sharedMonth = G.day;
    bump(d, companion, 3);
    addLog(`🫖 ${d.name}和${companion.name}又在老地方一起${kind === 'tea' ? '喝茶' : '看书'}。`);
  }
  if (last?.month === G.day) return;
  const months = (last?.months || 0) + 1;
  record.visits[d.pid] = { month: G.day, months };
  if (months < 2 || record.regulars.includes(d.pid)) return;
  record.regulars.push(d.pid);
  if (!record.owner || !communityDoll(record.owner)) {
    record.owner = d.pid;
    addLog(`📖 ${d.name}有了自己的${CORNER_NAMES[kind]}，下次还想来这里。`);
  } else {
    const owner = communityDoll(record.owner);
    if (owner) addLog(`🫖 ${d.name}也常来${owner.name}的${CORNER_NAMES[kind]}，两人习惯给彼此留个位置。`);
  }
}

function drawCornerMark(c, f, x, y) {
  const owner = cornerOwner(f);
  if (!owner || !communityDoll(owner)) return;
  if (f.id === 'piano') {
    bevel(c, x + 20, y - 10, 6, 5, '#f1d7a5', '#937481');
    detail(c, x + 21, y - 8, 3.5, .5, '#b48388');
  } else if (f.id === 'teaTray') {
    bevel(c, x + 4, y - 3, 5, 4, '#f1d7b1', '#9d7780');
    if (G.keepsakes.corners[f.key].regulars.length > 1) detail(c, x + 3, y - 1.5, 1, 1, '#a5847d');
  } else if (f.id === 'chair' || f.id === 'shelf') {
    const bx = x + (f.id === 'chair' ? 4 : 24), by = y + (f.id === 'chair' ? 2 : 3);
    bevel(c, bx, by, 6, 4, '#ca8a9b', '#795661');
    detail(c, bx + 1, by + 2, 4, .5, '#f2d3aa');
  }
}

function pairRoutes(a, b, tiles) {
  const routes = d => tiles.map(tile => ({ tile, path: findPath(d.tx, d.ty, [tile]) })).filter(r => r.path);
  let best = null;
  for (const left of routes(a)) for (const right of routes(b)) {
    if (left.tile === right.tile || cornerDistance(left.tile, right.tile) !== 1) continue;
    const cost = left.path.length + right.path.length;
    if (!best || cost < best.cost) best = { cost, routes: [left.path, right.path] };
  }
  return best?.routes;
}

function sendKeepsakePair(pair, routes, type, key) {
  for (const [i, d] of pair.entries()) {
    if (d.act) endAct(d);
    d.path = routes[i];
    d.act = { type, keepsakeKey: key };
    d.state = d.path.length ? 'walk' : 'arrive';
  }
}

function readyForKeepsake(d) {
  return d && d.state !== 'away' && d.state !== 'lift' && !takingStairs(d) && !takingYardPath(d) &&
    !lying(d) && d.needs.energy >= 25 && d.needs.bladder >= 18 && !['leave', 'neighborLeave', 'visitLeave', 'makeKeepsake', 'rainTea'].includes(d.act?.type);
}

function startKeepsakeProject(a, b, finish) {
  if (G.keepsakes.project || !a || !b || a === b || a.guest || b.guest ||
      !Object.hasOwn(KEEPSAKE_FINISHES, finish) || ![a, b].every(readyForKeepsake)) return false;
  const bench = G.furniture.find(f => f.id === 'craftBench' && f.users.every(d => d === a || d === b) &&
    pairRoutes(a, b, approachTiles(f)));
  if (!bench) return false;
  G.keepsakes.project = { people: [a.pid, b.pid], finish, bench: bench.key, expires: absNow() + 240, work: 0 };
  tickKeepsakes(0);
  save();
  return true;
}

function finishKeepsake(project, pair) {
  const names = pair.map(d => d.name);
  G.keepsakes.pieces.push({ key: 'piece-' + G.keepsakes.nextFurniture++, finish: project.finish,
    makers: names, month: G.day });
  const text = `${names.join('和')}一起做成了${KEEPSAKE_FINISHES[project.finish][0]}花架。`;
  rememberKeepsakePair(pair, 'shared-craft', text);
  addLog(`🪴 ${text}成品已收进布置里的纪念物。`);
  G.keepsakes.project = null;
  pair.forEach(endAct);
  HOOK.refresh();
  save();
}

function rememberKeepsakePair(pair, type, text) {
  const [a, b] = pair;
  bump(a, b, 5);
  addTrust(a, b, 3);
  addTrust(b, a, 3);
  NPCMemory.record(G, { type, time: absNow(), participants: [a.pid, b.pid], outcome: 'shared' },
    pair.map((d, i) => ({ person: d.pid, subject: pair[1 - i].pid, emotion: .7, impact: 70, interpretation: text })));
}

function arriveKeepsake(d) {
  const work = d.act.type === 'makeKeepsake';
  d.state = 'act';
  d.act.t = 60;
  d.act.gain = { fun: 8, social: 10 };
  d.dir = 'up';
  say(d, work ? ({
    maker: '我来把木边磨圆。', stylist: '这里再添一点颜色。', genki: '我已经想好放什么花了！',
    tidy: '我把螺丝都排好了。', nerd: '我量一量，两边得一样高。',
  })[d.persona] || '我来扶住这边。' : '给你留了一杯热茶。');
}

function noteRainTradition(a, b) {
  const key = relKey(a, b);
  G.keepsakes.traditions[key] ||= { people: [a.pid, b.pid], first: G.day, last: G.day };
}

function startRainTea(key, pair) {
  const tiles = [];
  for (const f of G.furniture) {
    if (!['teaTray', 'chair', 'shelf'].includes(f.id) || cornerRoom(f) !== 'study') continue;
    tiles.push(...approachTiles(f));
  }
  const backup = [];
  for (let y = FLOOR_SPLIT; y < ROWS; y++) for (let x = BX; x < COLS; x++) backup.push({ x, y });
  const open = candidates => [...new Map(candidates.map(tile => [`${tile.x},${tile.y}`, tile])).values()]
    .filter(tile => tile.x >= BX && tile.y >= FLOOR_SPLIT && tile.y < ROWS && free(tile.x, tile.y) &&
      !isDoorTile(tile.x, tile.y) && !(tile.x === stairsColumn() && tile.y === UPPER_LANDING));
  const routes = pairRoutes(...pair, open(tiles)) || pairRoutes(...pair, open(backup));
  if (!routes) return false;
  sendKeepsakePair(pair, routes, 'rainTea', key);
  return true;
}

function tickKeepsakes(dt) {
  const k = G.keepsakes;
  const project = k.project;
  if (project) {
    const pair = project.people.map(communityDoll);
    const bench = G.furniture.find(f => f.key === project.bench);
    const assigned = d => d?.act?.type === 'makeKeepsake' && d.act.keepsakeKey === project.bench;
    if (!bench || pair.some(d => !d) || absNow() >= project.expires) {
      pair.filter(assigned).forEach(endAct);
      k.project = null;
      addLog('🪵 手工暂时搁下了，有空可以再约。');
      save();
    } else if (pair.every(assigned)) {
      if (pair.every(d => d.state === 'act')) {
        project.work += dt;
        if (project.work >= 5) finishKeepsake(project, pair);
      }
    } else {
      pair.filter(assigned).forEach(endAct);
      if (pair.every(readyForKeepsake) && bench.users.every(d => pair.includes(d))) {
        const routes = pairRoutes(...pair, approachTiles(bench));
        if (routes) sendKeepsakePair(pair, routes, 'makeKeepsake', bench.key);
      }
    }
  }

  // Once a rain-day ritual has begun, finish it only if both actually reach the study.
  for (const [key, tie] of Object.entries(k.traditions)) {
    const pair = tie.people.map(communityDoll);
    const assigned = d => d?.act?.type === 'rainTea' && d.act.keepsakeKey === key;
    if (pair.every(assigned)) {
      if (!pair.every(d => d.state === 'act')) continue;
      tie.last = G.day;
      const text = `又下雨了，${pair[0].name}给${pair[1].name}在二楼留了一杯茶，两人又在书房坐到了一起。`;
      rememberKeepsakePair(pair, 'rain-tea-tradition', text);
      addLog(`🫖 ${text}`);
      for (const d of pair) {
        d.act.t = 5;
        d.act.keepsakeKey = null;
      }
      save();
      continue;
    }
    pair.filter(assigned).forEach(endAct);
    if (tie.last >= G.day || G.weather !== 'rain' || G.time < 13 * 60 || G.time >= 20 * 60) continue;
    if (pair.every(readyForKeepsake) && !G.community.outing && !G.community.active?.leavingAt && !G.community.active?.rainDeadline) {
      if (G.community.active && G.community.active.guestPid !== pair.find(d => d.guest)?.pid) continue;
      startRainTea(key, pair);
    } else if (!G.community.active && !G.community.outing && tie.invited !== G.day) {
      const host = pair.find(d => d && !d.guest && readyForKeepsake(d));
      const friend = G.community.friends.find(f => tie.people.includes(f.pid) && !communityDoll(f.pid));
      if (host && friend && startGetTogether(host, 'visit', { friend })) {
        tie.invited = G.day;
        save();
      }
    }
  }
}

function keepsakeLabel(piece) {
  return `${KEEPSAKE_FINISHES[piece.finish][0]}花架 · ${piece.makers.join('和')}一起做 · ${monthLabel(piece.month)}`;
}

function keepsakePiece(key) { return G.keepsakes.pieces.find(p => p.key === key); }
function unplacedKeepsakes() {
  const inRoom = new Set(G.furniture.map(f => f.piece));
  if (G.build.placing?.moved) inRoom.add(G.build.placing.piece);
  return G.keepsakes.pieces.filter(p => !inRoom.has(p.key));
}

FURNITURE.handmadePlanter = { name: '手作花架', w: 1, h: 1, fixed: true };
TALL.handmadePlanter = 10;
DRAW.handmadePlanter = (c, x, y, f) => {
  const finish = KEEPSAKE_FINISHES[keepsakePiece(f?.piece)?.finish] || KEEPSAKE_FINISHES.honey;
  contactShadow(c, x + 1, y + 13, 14);
  for (const px of [x + 2, x + 12]) R(c, px, y - 1, 2, 15, '#785247');
  for (const [i, row] of [-3, 6].entries()) {
    bevel(c, x + 1, y + row + 4, 14, 4, finish[1], '#795b5c');
    bevel(c, x + 4 + i * 2, y + row, 6, 5, i ? '#d9a68a' : '#e5cbae', '#94716f');
    R(c, x + 6 + i * 2, y + row - 4, 1, 5, '#689071');
    R(c, x + 4 + i * 2, y + row - 5, 5, 2, i ? '#e5a7ac' : '#f3d68e');
    detail(c, x + 6 + i * 2, y + row - 4.5, 1, .5, '#fff0c8');
  }
};

FURNITURE.teaTray.cap = 2;
ACT_NAMES.makeKeepsake = '一起做花架';
ACT_NAMES.rainTea = '在书房喝雨天茶';
ACT_LINES.makeKeepsake = ['漆快干了，再等一会儿。'];
ACT_LINES.rainTea = ['雨声和上次一样。'];
</script>
<script>
// 画面渲染 + 指针交互（拎小人、摆家具）
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
// Keep the artwork grid independent of the display buffer. Sloped edges are
// rasterized at higher resolution; CSS can then downsample at any zoom.
const SCENE_SCALE = 4;
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
// 扩建后画布跟着变宽
HOOK.resize = () => {
  cv.width = lightCv.width = (W + HOUSE_MARGIN) * SCENE_SCALE;
  cv.height = lightCv.height = HOUSE_HEIGHT * SCENE_SCALE;
  ctx.scale(SCENE_SCALE, SCENE_SCALE);
  lctx.scale(SCENE_SCALE, SCENE_SCALE);
  ctx.imageSmoothingEnabled = false;
  document.getElementById('stage').style.setProperty('--scene-ratio', cv.width / cv.height);
};
const overlay = document.getElementById('overlay');

const wallSpec = () => WALLS.find(w => w.id === G.wall) || WALLS[0];
const floorSpec = () => FLOORS.find(f => f.id === G.floor) || FLOORS[0];

function dollPose(d) {
  if (d.state === 'lift') return 'lift';
  if (d.state === 'walk') return 'walk';
  if (d.act && d.state === 'act' && d.act.type === 'exercise') return 'walk';
  if (d.state === 'act' && (['yoga', 'boxPractice'].includes(d.act?.type) || ROUTINES[d.act?.type]?.motion === 'stretch')) return 'dance';
  if (d.act && d.state === 'act' && (d.act.type === 'dance' || (['join', 'visitStay'].includes(d.act.type) && d.act.dance))) return 'dance';
  if (d.act && d.act.onFurn && d.state === 'act') return 'sit';
  return 'stand';
}
function drawDollObj(c, d) {
  const { x, y } = houseDollPoint(d);
  drawDoll(c, x, y, d.look, {
    dir: d.dir, frame: d.frame, pose: dollPose(d), hop: d.hop,
    blink: (d.state === 'act' && d.act?.type === 'couchNap') || d.blink > 0 || (d.act && d.act.type === 'read' && d.state === 'act' && Math.sin(G.t * 2) > 0.7),
    happy: d.happy > 0 || (d.act && d.state === 'act' && (['dance', 'game', 'tv', 'snack', 'cat', 'join', 'visitStay'].includes(d.act.type) || (d.act.type === 'chat' && d.act.kind !== 'argue'))),
  });
  if (d.state !== 'act') return;
  if (d.act?.type === 'rainTea') {
    const px = Math.round(x + 7), py = Math.round(y - 10);
    bevel(c, px, py, 6, 5, '#fff0d4', '#95777b');
    detail(c, px + 5, py + 1, 1.5, 2, '#d4a195');
    if (Math.floor(G.t * 3) % 2) detail(c, px + 2, py - 3, .5, 2, '#fff8e4');
  }
  if (d.act?.type === 'makeKeepsake' && Math.floor(G.t * 3) % 2) {
    const px = Math.round(x + 5), py = Math.round(y - 16);
    detail(c, px, py - 1, .5, 3, '#e7bb7f');
    detail(c, px - 1, py, 2.5, .5, '#e7bb7f');
  }
  if (d.act?.type === 'visitStay') {
    const px = x + 8, py = y - 13 - Math.floor(d.ft * 2) % 3;
    if (d.act.theme === 'music') {
      R(c, px + 2, py - 5, 1, 6, '#f4b6cb');
      R(c, px, py, 3, 2, '#f4b6cb');
      R(c, px + 2, py - 5, 3, 1, '#f8d9e3');
    } else if (d.act.theme === 'games') {
      box(c, px, py, 5, 5, '#f8e6c7', '#8e6d82');
      R(c, px + 2, py + 2, 1, 1, '#a67696');
    } else if (d.act.theme === 'tea' || d.act.theme === 'picnic') {
      box(c, px, py, 6, 5, '#ffefdc', '#a0747e');
      R(c, px + 6, py + 1, 2, 2, '#f6c8b5');
    } else if (d.act.theme === 'umbrella') {
      R(c, x + 6, y - 28, 1, 13, '#76564f');
      R(c, x - 7, y - 30, 24, 4, '#e4879d');
      R(c, x - 3, y - 33, 16, 4, '#f6b2bf');
      R(c, x + 2, y - 35, 6, 3, '#fbd2d5');
    }
  }
  const motion = ROUTINES[d.act?.type]?.motion;
  if (motion === 'book') {
    const side = d.dir === 'left' ? -1 : 1;
    box(c, x + side * 9 - 3, y - 12, 7, 5, '#fff1d7', '#8e6d82');
    R(c, x + side * 9, y - 11, 1, 3, '#c69eb4');
  }
  if (motion === 'doze') {
    R(c, x + 7, y - 23, 4, 1, '#f4e5ff');
    R(c, x + 8, y - 22, 2, 1, '#f4e5ff');
    R(c, x + 7, y - 21, 4, 1, '#f4e5ff');
  }
  if (motion === 'spark') {
    R(c, x + 9, y - 18, 1, 5, '#f7d485');
    R(c, x + 7, y - 16, 5, 1, '#f7d485');
  }
}

// Keep the light on the floor of the window's room, below furniture and dolls.
function drawWindowLight(c) {
  if (G.weather !== 'sunny' || G.time < 8 * 60 || G.time >= 18 * 60) return;
  const afternoon = G.time >= 13 * 60;
  const bright = afternoon ? '#ffd29a7b' : '#fff3cc5c';
  const pale = afternoon ? '#ffc98837' : '#fff3cc30';
  for (const f of G.furniture) {
    if (f.id !== 'window') continue;
    const { x, w, storey } = houseFurnitureRect(f);
    const split = HOUSE_X + BX * T;
    const bath = G.bathroom && storey === STOREYS[1] ? HOUSE_X + BATH_X * T : HOUSE_X;
    const center = x + w / 2;
    const left = center >= split ? split : center >= bath ? bath : HOUSE_X;
    const right = center >= split ? HOUSE_X + W : center >= bath ? split : bath;
    const { back, front } = storey;
    c.save();
    housePath(c, [[left, front], [left + 9, back], [right - 9, back], [right, front]]);
    c.clip();
    const direction = afternoon ? -1 : 1;
    const start = center - 12, depth = front - back, end = start + direction * depth * .58;
    const light = c.createLinearGradient(0, back, 0, front);
    light.addColorStop(0, bright);
    light.addColorStop(1, pale);
    for (const [offset, width] of [[0, 10], [12, 10]]) {
      housePoly(c, light, [start + offset, back], [start + offset + width, back],
        [end + offset + width + 2, front], [end + offset - 1, front]);
    }
    c.restore();
  }
}

function render() {
  const c = ctx, t = G.t;
  drawHouseShell(c, wallSpec(), floorSpec());
  drawWindowLight(c);

  for (const f of G.furniture) if (layerOf(f.id) !== 'solid') drawHouseFurniture(c, f, t);

  if (G.mode === 'build') {
    for (const storey of [...STOREYS, YARD]) {
      const { back, front } = storey;
      R(c, HOUSE_X, back, W, front - back, '#48323810');
      for (let x = T; x < W; x += T) R(c, HOUSE_X + x, back, 1, front - back, '#48323824');
      const step = storey.step || FLOOR_STEP;
      for (let y = back + step; y < front; y += step) R(c, HOUSE_X, y, W, 1, '#48323824');
    }
  }

  // Sort by projected feet so characters and objects can pass behind each other.
  const list = [];
  for (const f of G.furniture) {
    if (layerOf(f.id) !== 'solid') continue;
    const { bottom } = houseFurnitureRect(f);
    const sleepers = f.users.filter(u => lying(u) && u.act.furn === f);
    f.occ = sleepers.length ? (slot, hx, hy) => {
      const sleeper = sleepers.find(u => (u.act.seat || 0) === slot);
      if (sleeper) drawDoll(c, hx, hy + 1, sleeper.look, { pose: 'head', dir: 'down' });
    } : null;
    list.push({ y: bottom, draw: () => drawHouseFurniture(c, f, t) });
  }
  for (const d of G.dolls) {
    if (d.state === 'lift' || d.state === 'away' || lying(d)) continue;
    const y = d.act?.onFurn ? houseFurnitureRect(d.act.furn).bottom + .5 : houseDollPoint(d).y;
    list.push({ y, draw: () => drawDollObj(c, d) });
  }
  list.push(...partitionDrawables(c));
  list.sort((a, b) => a.y - b.y).forEach(o => o.draw());

  // 夜晚：整体压暗，台灯/电视/游戏机处“挖洞”透光
  if (G.dark > 0.01) {
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, W + HOUSE_MARGIN, HOUSE_HEIGHT);
    lctx.fillStyle = `rgba(18,14,48,${G.dark})`; lctx.fillRect(0, 0, W + HOUSE_MARGIN, HOUSE_HEIGHT);
    lctx.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r, a = 1) => {
      const g = lctx.createRadialGradient(x, y, 2, x, y, r);
      g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = g; lctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    for (const f of G.furniture) {
      const { x, y, storey } = houseFurnitureRect(f);
      lctx.save();
      lctx.beginPath();
      lctx.rect(HOUSE_X, storey.wall, W, storey.front - storey.wall);
      lctx.clip();
      if (f.id === 'lamp') hole(x + 8, y - 10, 54);
      if (f.id === 'moonLamp' || f.id === 'paperLantern') hole(x + 8, y + 8, 34, .85);
      if (f.id === 'garland') for (let i = 0; i < 8; i += 2) hole(x + 4 + i * 6, y + 9, 16, .55);
      if (f.id === 'aquarium') hole(x + 16, y - 6, 22, .5);
      if (f.id === 'xmastree') hole(x + 8, y - 2, 30, .8);
      if (f.id === 'lantern') hole(x + 8, y + 9, 22, .7);
      if ((f.id === 'pc' || f.id === 'speaker') && f.active) hole(x + 12, y - 10, 24, .7);
      if (f.id === 'tv' && f.active) hole(x + 16, y - 4, 34, .8);
      if (f.id === 'arcade') hole(x + 8, y - 8, 20, f.active ? .8 : .4);
      if (f.id === 'stove' && f.active) hole(x + 8, y - 6, 22, .7);
      if (f.id === 'fridge' && f.active) hole(x + 8, y, 24, .7);
      lctx.restore();
    }
    c.drawImage(lightCv, 0, 0, W + HOUSE_MARGIN, HOUSE_HEIGHT);
    c.globalCompositeOperation = 'lighter';
    for (const f of G.furniture) if (f.id === 'lamp') {
      const { x, y, storey } = houseFurnitureRect(f);
      const g = c.createRadialGradient(x + 8, y - 10, 1, x + 8, y - 10, 36);
      g.addColorStop(0, `rgba(255,190,90,${0.35 * G.dark})`); g.addColorStop(1, 'rgba(255,190,90,0)');
      c.fillStyle = g;
      const top = Math.max(storey.wall, y - 48);
      c.fillRect(Math.max(HOUSE_X, x - 30), top, Math.min(HOUSE_X + W, x + 46) - Math.max(HOUSE_X, x - 30), Math.min(storey.front, y + 28) - top);
    }
    c.globalCompositeOperation = 'source-over';
  }

  // 选中的小人头上跳动的小箭头
  const sel = G.dolls.find(d => d.uid === G.sel);
  if (sel && sel.state !== 'lift' && sel.state !== 'away' && G.mode === 'live') {
    const point = houseHeadPoint(sel);
    const ax = point.x, ay = point.y - 7 + Math.round(Math.sin(t * 6));
    R(c, ax - 3, ay, 7, 1, INK); R(c, ax - 2, ay + 1, 5, 1, INK); R(c, ax - 1, ay + 2, 3, 1, INK); R(c, ax, ay + 3, 1, 1, INK);
    R(c, ax - 2, ay, 5, 1, '#ffd35c'); R(c, ax - 1, ay + 1, 3, 1, '#ffd35c');
  }

  if (G.mode === 'build') drawBuildOverlay(c, t);

  // 被拎起来的小人画在最上面
  for (const d of G.dolls) if (d.state === 'lift') {
    if (d.liftShadow) {
      const { x, y } = houseDollPoint(d.liftShadow);
      R(c, x - 4, y - 1, 8, 2, 'rgba(0,0,0,.25)');
    }
    drawDollObj(c, d);
  }
  updateOverlay();
}

function drawHouseFurniture(c, f, t) {
  const { x, y, bottom } = houseFurnitureRect(f);
  if (layerOf(f.id) === 'floor') {
    c.save();
    c.translate(x, bottom - FURNITURE[f.id].h * FLOOR_STEP);
    c.scale(1, FLOOR_STEP / T);
    DRAW[f.id](c, 0, 0, f, t);
    c.restore();
    return;
  }
  DRAW[f.id](c, x, y, f, t);
  if (!f.users?.length) drawCornerMark(c, f, x, y);
}

function houseHeadPoint(d) {
  if (!lying(d)) {
    const { x, y } = houseDollPoint(d);
    return { x, y: y - 24 };
  }
  const f = d.act.furn, { y } = houseFurnitureRect(f);
  return { x: HOUSE_X + headPos(d).x - (f.id === 'bath' ? 2 : 0), y: y + (f.id === 'bath' ? -6 : 11) };
}

function drawBuildOverlay(c, t) {
  const B = G.build, hv = B.hover;
  if (B.placing && hv) {
    const { id, piece } = B.placing, f = { id, piece, ...hv };
    const F = FURNITURE[id], rect = houseFurnitureRect(f);
    const wall = layerOf(id) === 'wall';
    const x = rect.x, w = rect.w, bottom = rect.bottom;
    const h = F.h * (wall ? T : rect.storey.step || FLOOR_STEP);
    const y = bottom - h;
    const ok = canPlace(id, hv.x, hv.y, null);
    c.globalAlpha = .75;
    drawHouseFurniture(c, f, t);
    c.globalAlpha = 1;
    R(c, x, y, w, h, ok ? '#7cc57659' : '#e26d6d73');
    c.strokeStyle = ok ? '#4f9a4a' : '#c24d4d';
    c.strokeRect(x + .5, y + .5, w - 1, h - 1);
  } else if (hv?.furn) {
    const { x, w, top, bottom } = houseFurnitureRect(hv.furn);
    R(c, x, top, w, bottom - top, B.trash ? '#e26d6d66' : '#ffd35c4d');
  }
}

/* ---------- DOM 浮层：对话气泡、名字、爱心 ---------- */
const domBubbles = new Map();
function positionOverlay(el, x, y) {
  el.style.left = `${100 * x / (W + HOUSE_MARGIN)}%`;
  el.style.top = `${100 * y / HOUSE_HEIGHT}%`;
}
function updateOverlay() {
  const alive = new Set();
  const selected = G.dolls.find(d => d.uid === G.sel);
  const invite = press?.moved && G.mode === 'live' ? dropInteraction(press.point, press.d) : null;
  for (const d of G.dolls) {
    let el = domBubbles.get(d.uid);
    if (!el) { el = { b: document.createElement('div'), n: document.createElement('div'), id: null }; el.b.className = 'bubble'; el.n.className = 'nametag'; overlay.append(el.b, el.n); domBubbles.set(d.uid, el); }
    alive.add(d.uid);
    const { x: hx, y: hy } = houseHeadPoint(d);
    if (d.bubble && d.state !== 'away') {
      if (el.id !== d.bubble.id) { el.b.textContent = d.bubble.text; el.id = d.bubble.id; el.b.style.animation = 'none'; void el.b.offsetWidth; el.b.style.animation = ''; }
      el.b.style.display = ''; positionOverlay(el.b, hx, hy - 2);
    } else el.b.style.display = 'none';
    const partner = selected && arePartners(selected, d);
    const dropTarget = invite?.target === d;
    const showName = d.state !== 'away' && (d === selected || d.uid === hoverDoll || partner || dropTarget);
    el.n.style.display = showName ? '' : 'none';
    if (showName) {
      const np = lying(d) ? { x: hx, y: hy + 20 } : houseDollPoint(d);
      const paired = partner || G.dolls.some(o => arePartners(d, o));
      const label = dropTarget ? (invite.spot ? `💬 放下和${d.name}互动` : invite.reason) : paired ? `♥ ${d.name}` : d.name;
      if (el.n.textContent !== label) el.n.textContent = label;
      el.n.classList.toggle('couple-name', paired);
      el.n.classList.toggle('drop-target', dropTarget);
      positionOverlay(el.n, np.x, np.y + 2);
    }
  }
  for (const [uid, el] of domBubbles) if (!alive.has(uid)) { el.b.remove(); el.n.remove(); domBubbles.delete(uid); }
  for (const h of hearts) {
    if (!h.el) { h.el = document.createElement('div'); h.el.className = 'heart'; h.el.textContent = h.txt; overlay.append(h.el); const { x, y } = houseHeadPoint(h.doll); positionOverlay(h.el, x + h.dx, y); }
  }
  for (const el of overlay.querySelectorAll('.heart')) if (!hearts.some(h => h.el === el)) el.remove();
}

/* ---------- 指针交互 ---------- */
let hoverDoll = null, press = null;
function toScene(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * (W + HOUSE_MARGIN), y: (e.clientY - r.top) / r.height * HOUSE_HEIGHT };
}

function dollAt(p, exclude) {
  let best = null;
  for (const d of G.dolls) {
    if (d === exclude || d.state === 'away' || d.state === 'lift') continue;
    const { x, y: top } = houseHeadPoint(d);
    const y = lying(d) ? top + 12 : houseDollPoint(d).y;
    // 点击判定比小人本身大一圈：小人只有 16×24 像素，照着画很难点中
    if (Math.abs(p.x - x) <= 11 && p.y >= top - 6 && p.y <= y + 3 && (!best || y > best.y)) best = { d, y };
  }
  return best?.d;
}

function dropInteraction(point, carried) {
  const direct = dollAt(point, carried);
  const column = Math.floor((point.x - HOUSE_X) / T);
  if (column < 0 || column >= COLS) return null;
  let target = null, closest = Infinity;
  for (const d of G.dolls) {
    if (d === carried || ['away', 'lift'].includes(d.state) || takingStairs(d) || takingYardPath(d)) continue;
    if (d === direct) { target = d; break; }
    if (direct || roomOf(d) !== roomOf({ tx: column, ty: d.ty })) continue;
    const head = houseHeadPoint(d);
    const feet = lying(d) ? head.y + 12 : houseDollPoint(d).y;
    if (Math.abs(point.x - head.x) > T * 1.35 || point.y < head.y - 4 || point.y > feet + 5) continue;
    const distance = Math.hypot(point.x - head.x, point.y - head.y - 10);
    if (distance < closest) { target = d; closest = distance; }
  }
  if (!target) return null;
  if (target.state === 'wait' || ['chat', 'tryst', 'leave', 'visitLeave', 'sleep', 'couchNap', 'bath', 'toilet', 'shower'].includes(target.act?.type)) {
    return { target, reason: `${target.name} 正在忙` };
  }

  // Prefer a free tile beside the partner. The cutaway projects depth to only a few pixels.
  const room = roomOf(target);
  const spots = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => ({ x: target.tx + dx, y: target.ty + dy, dx }));
  spots.sort((a, b) => Math.abs(b.dx) - Math.abs(a.dx) || Math.abs(a.x - column) - Math.abs(b.x - column));
  const spot = spots.find(({ x, y }) => free(x, y) && !wallBetween(target.tx, target.ty, x, y) &&
    roomOf({ tx: x, ty: y }) === room && !isDoorTile(x, y) && !G.dolls.some(o => o !== carried && o.state !== 'away' && o.tx === x && o.ty === y));
  return { target, spot, reason: `${target.name} 身边没有空位` };
}

function furnAt(p) {
  let best = null;
  for (const f of G.furniture) {
    const { x, w, top, bottom } = houseFurnitureRect(f);
    if (p.x < x || p.x >= x + w || p.y < top || p.y >= bottom) continue;
    const priority = { floor: 0, wall: 1, solid: 2 }[layerOf(f.id)];
    if (!best || priority > best.priority || (priority === best.priority && bottom >= best.bottom)) best = { f, bottom, priority };
  }
  return best?.f;
}

function removeFurniture(f) {
  for (const u of [...f.users]) endAct(u);
  G.furniture = G.furniture.filter(o => o !== f);
}

// 玩家正在操作吗？月报等不该在这时候抢焦点
function playerBusy() {
  if (press) return true;
  if (G.dolls.some(d => d.state === 'lift')) return true;
  const wd = document.getElementById('wardrobe');
  if (wd && wd.hidden === false) return true;
  return typeof document.querySelector === 'function' && !!document.querySelector('dialog[open]');
}

// 把拎着的小人放到一件家具上：先站到家具旁边的空位，再让 TA 去用
// 成功返回 null；失败返回原因，小人会回到原处，不会悄悄弹回去
function dropOnFurniture(d, f) {
  const F = FURNITURE[f.id];
  if (d.guest && F.use === 'sleep') return '访客不在这里睡觉哦';
  const spot = approachTiles(f).find(t => free(t.x, t.y) &&
    !G.dolls.some(o => o !== d && o.state !== 'away' && o.tx === t.x && o.ty === t.y));
  if (!spot) return `${F.name}旁边没有空位`;
  const ox = d.tx, oy = d.ty;
  placeDollAt(d, spot.x, spot.y);
  d.state = 'idle'; d.think = 1.5; d.frame = 0; d.liftShadow = null; d.bubble = null;
  if (!orderUse(d, f)) { placeDollAt(d, ox, oy); d.state = 'idle'; d.think = 1.5; d.frame = 0; return '过不去呀…'; }
  return null;
}

cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelPlacing(); });
cv.addEventListener('pointerdown', e => {
  if (press || e.button !== 0) return;
  const p = toScene(e);
  cv.setPointerCapture(e.pointerId);
  if (G.mode === 'live') {
    const d = dollAt(p);
    if (!d && hitBedDoor(p)) { toggleBedDoor(); return; }
    press = { p, d, pointerId: e.pointerId, moved: false, furn: d ? null : furnAt(p) };
    return;
  }
  // 布置模式
  const B = G.build;
  if (B.placing) {
    const g = houseTile(p, B.placing.id);
    if (g && canPlace(B.placing.id, g.x, g.y, null)) {
      // 要花钱的新家具：第一次点只是确认意向，第二次点同一格才真的扣钱
      const price = B.placing.moved ? 0 : purchasePrice(B.placing.id);
      if (price > 0 && !(B.placing.confirm && B.placing.confirm.x === g.x && B.placing.confirm.y === g.y)) {
        B.placing.confirm = { x: g.x, y: g.y };
        const hint = document.getElementById('buildHint');
        if (hint) hint.textContent = `再点一下同一格，确认花 ${yuan(price)} 买「${FURNITURE[B.placing.id].name}」· 点别处换位置，右键取消`;
        HOOK.toast(`再点一次确认购买「${FURNITURE[B.placing.id].name}」${yuan(price)}`, true);
        SFX.play('click');
        return;
      }
      B.placing.confirm = null;
      if (!B.placing.moved && !B.placing.piece && !acquire(B.placing.id)) { SFX.play('deny'); return; }   // 新放的家具要从仓库拿或者花钱买
      const placed = B.placing;
      addFurniture(placed.id, g.x, g.y, placed);
      if (placed.moved || placed.piece) B.placing = null;
      HOOK.refresh(); rebuild(); SFX.play('place'); save();
      const hint = document.getElementById('buildHint');
      if (hint) hint.textContent = '选择家具后点击房间放置 · 点已有家具可以拿起移动 · 右键/Esc 取消';
    } else SFX.play('deny');
    return;
  }
  const f = furnAt(p);
  if (!f) return;
  if (f.id === 'door' && B.trash) { HOOK.toast('大门不能拆哦，可以拿起来换个位置', true); SFX.play('deny'); return; }
  if (B.trash) { removeFurniture(f); delete G.keepsakes.corners[f.key]; if (!f.piece) stash(f.id); rebuild(); SFX.play('trash'); save(); HOOK.toast(`「${FURNITURE[f.id].name}」收进仓库了`, true); HOOK.refresh(); }
  else { removeFurniture(f); rebuild(); B.placing = { id: f.id, key: f.key, piece: f.piece, moved: true, orig: { x: f.x, y: f.y } }; B.hover = houseTile(p, f.id); SFX.play('pick'); HOOK.refresh(); }
});
cv.addEventListener('pointermove', e => {
  if (press && press.pointerId !== e.pointerId) return;
  const p = toScene(e);
  if (G.mode === 'build') {
    const B = G.build;
    B.hover = B.placing ? houseTile(p, B.placing.id) : { furn: furnAt(p) };
    cv.style.cursor = B.placing ? 'copy' : B.hover?.furn ? (B.trash ? 'not-allowed' : 'grab') : 'default';
    return;
  }
  const hd = dollAt(p); hoverDoll = hd ? hd.uid : null;
  cv.style.cursor = press && press.d ? 'grabbing' : hd ? 'grab' : (G.sel && furnAt(p) && FURNITURE[furnAt(p).id].use ? 'pointer' : 'default');
  if (!press || !press.d) return;
  const d = press.d;
  if (!press.moved && Math.hypot(p.x - press.p.x, p.y - press.p.y) > 3) {
    press.moved = true;
    if (d.act) endAct(d);
    d.path = []; d.state = 'lift'; d.dir = 'down'; G.sel = d.uid; HOOK.select();
    say(d, pick(ACT_LINES.lift), 1.5); SFX.play('lift');
  }
  if (press.moved) {
    press.point = p;
    d.liftX = p.x;
    d.liftY = p.y + 12;
    const g = dropTile(p);
    d.liftShadow = g && { x: g.x * T + 8, y: g.y * T + 14, ty: g.y };
  }
});
cv.addEventListener('pointerup', e => {
  if (!press || press.pointerId !== e.pointerId) return;
  if (G.mode !== 'live') { cancelDollDrag(e); return; }
  const p = toScene(e), d = press.d;
  // 拖得很快、中间没触发 pointermove 时：落点离按下处够远也算一次拖拽
  if (d && !press.moved && Math.hypot(p.x - press.p.x, p.y - press.p.y) > 6) {
    press.moved = true;
    if (d.act) endAct(d);
    d.path = []; d.state = 'lift'; d.dir = 'down'; G.sel = d.uid; HOOK.select();
  }
  if (d && press.moved) {
    // 落点规则：先看是不是拖到另一位身边（互动）；
    // 再看是不是家具（能用的就安排活动）；再看是不是空地（放下）；
    // 都不是就回到原处，并告诉玩家为什么。
    const invite = dropInteraction(p, d);
    const furn = invite ? null : furnAt(p);
    const settle = () => { d.state = 'idle'; d.think = 1.5; d.frame = 0; d.liftShadow = null; d.bubble = null; SFX.play('drop'); };
    if (invite?.spot) {
      placeDollAt(d, invite.spot.x, invite.spot.y);
      settle();
      const partner = invite.target;
      if (partner.act) endAct(partner);
      placeDollAt(partner, partner.tx, partner.ty);
      startSocial(d, partner, true);
      HOOK.select();
    } else if (invite) {
      placeDollAt(d, d.tx, d.ty);
      settle();
      HOOK.toast(invite.reason, true);
    } else if (furn && FURNITURE[furn.id].use) {
      const reason = dropOnFurniture(d, furn);
      if (reason) { placeDollAt(d, d.tx, d.ty); settle(); HOOK.toast(reason, true); }
      else { SFX.play('drop'); HOOK.toast(`✅ ${d.name}去${ACT_NAMES[FURNITURE[furn.id].use] || FURNITURE[furn.id].name}`, true); }
    } else if (furn) {
      placeDollAt(d, d.tx, d.ty);
      settle();
      HOOK.toast(`「${FURNITURE[furn.id].name}」只是摆设，不能用哦`, true);
    } else {
      const g = dropTile(p);
      if (g) { placeDollAt(d, g.x, g.y); settle(); HOOK.toast(`📍 已把${d.name}放到这里`, true); }
      else { placeDollAt(d, d.tx, d.ty); settle(); HOOK.toast('这里放不下，TA 回到了原处', true); }
    }
  } else if (d) {
    G.sel = d.uid; SFX.play('click'); HOOK.select(true);
  } else if (press.furn?.piece) {
    const piece = keepsakePiece(press.furn.piece);
    if (piece) HOOK.toast(keepsakeLabel(piece), true);
  } else if (press.furn && G.sel) {
    const sd = G.dolls.find(o => o.uid === G.sel);
    if (sd) orderUse(sd, press.furn);
  } else if (press.furn) {
    HOOK.toast('先点一位居民，再点家具安排活动', true);
    SFX.play('deny');
  } else { G.sel = null; HOOK.select(); }
  press = null;
});
function cancelDollDrag(e) {
  if (!press || press.pointerId !== e.pointerId) return;
  const d = press?.d;
  if (d?.state === 'lift') {
    placeDollAt(d, d.tx, d.ty);
    d.state = 'idle';
    d.liftShadow = null;
  }
  press = null;
}
cv.addEventListener('pointercancel', cancelDollDrag);
cv.addEventListener('lostpointercapture', cancelDollDrag);
cv.addEventListener('pointerleave', () => { hoverDoll = null; if (G.mode === 'build') G.build.hover = null; });

const rawDropTile = p => houseTile({ x: p.x, y: p.y + 12 }) || houseTile(p);
function dropTile(p) {
  const tile = rawDropTile(p);
  return tile && nearestFree(tile.x, tile.y, tile.y >= ROWS ? 3 : tile.y >= FLOOR_SPLIT ? 2 : 1);
}

function cancelPlacing() {
  const B = G.build;
  if (B.placing && B.placing.moved && B.placing.orig) {
    const o = B.placing.orig;
    if (canPlace(B.placing.id, o.x, o.y, null)) addFurniture(B.placing.id, o.x, o.y, B.placing);
    rebuild();
  }
  B.placing = null; HOOK.refresh();
  const hint = document.getElementById('buildHint');
  if (hint) hint.textContent = '选择家具后点击房间放置 · 点已有家具可以拿起移动 · 右键/Esc 取消';
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') cancelPlacing(); });
</script>
<script>
// 一次只展示一期。复制与纪念卡使用同一期的内容。
let housePaperIndex = -1;
function currentHousePaper() { return paperIssue(G.paper[housePaperIndex]); }

const paperStoryTitle = (story, i) => story.label && (i === 0 ? '本月头条' : story.label);

function paperPortrait(person) {
  const portrait = document.createElement('canvas');
  portrait.width = 20; portrait.height = 24;
  dollPortrait(portrait, person.look);
  return portrait;
}

function showHousePaper() {
  G.paperPending = false;
  updateHousePaperButton();
  const dialog = document.getElementById('paperDialog');
  renderHousePaper(G.paper.length - 1);
  if (!dialog.open) dialog.showModal();
}

function renderHousePaper(index) {
  housePaperIndex = Math.max(-1, Math.min(index, G.paper.length - 1));
  const issue = currentHousePaper();
  const target = document.getElementById('paperText');
  document.getElementById('paperMonth').textContent = issue?.month || monthLabel(G.day);
  document.getElementById('paperOlder').disabled = housePaperIndex <= 0;
  document.getElementById('paperNewer').disabled = housePaperIndex >= G.paper.length - 1;
  document.getElementById('paperCopy').disabled = !issue;
  document.getElementById('paperCopy').textContent = '复制本期';
  document.getElementById('paperCard').disabled = !issue;
  if (!issue) { target.textContent = '本期月报会在下月 00:00 出炉。'; return; }

  target.replaceChildren(...issue.stories.map((story, index) => {
    const article = document.createElement('article');
    article.className = index === 0 ? 'paper-story paper-lead' : 'paper-story';
    const people = document.createElement('div');
    people.className = 'paper-cast';
    if (story.people?.length) {
      if (index === 0) article.classList.add('paper-feature');
      for (const person of story.people) {
        const figure = document.createElement('figure');
        const portrait = paperPortrait(person);
        const caption = document.createElement('figcaption');
        portrait.setAttribute('aria-hidden', 'true');
        caption.textContent = person.name;
        figure.append(portrait, caption);
        people.append(figure);
      }
    } else {
      people.textContent = story.icon;
      people.setAttribute('aria-hidden', 'true');
    }
    const body = document.createElement('div');
    const title = document.createElement('small');
    title.textContent = paperStoryTitle(story, index);
    const text = document.createElement(index === 0 ? 'h3' : 'p');
    text.textContent = story.text;
    if (title.textContent) body.append(title);
    body.append(text);
    if (story.steps?.length) {
      const detail = document.createElement('details');
      detail.className = 'paper-chain';
      const summary = document.createElement('summary');
      summary.textContent = '事情的经过';
      const list = document.createElement('ol');
      for (const step of story.steps) {
        const item = document.createElement('li');
        item.textContent = step;
        list.append(item);
      }
      detail.append(summary, list);
      body.append(detail);
    }
    article.append(people, body);
    return article;
  }));
}

function housePaperText(issue) {
  return [issue.month, ...issue.stories.map((story, i) =>
    [paperStoryTitle(story, i), story.text].filter(Boolean).join(' · '))].join('\n');
}

function drawHousePaperCard(issue) {
  const feature = issue.stories[0]?.people?.length ? 106 : 0;
  const W = 360, H = 128 + issue.stories.length * 92 + feature, S = 2;
  const c = document.createElement('canvas'); c.width = W * S; c.height = H * S;
  const ctx = c.getContext('2d'); ctx.scale(S, S); ctx.imageSmoothingEnabled = false;
  const sans = '"PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = '#583c4b'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff4e4'; ctx.fillRect(8, 8, W - 16, H - 16);
  ctx.fillStyle = '#ce718e';
  for (let x = 12; x < W - 12; x += 8) { ctx.fillRect(x, 10, 4, 3); ctx.fillRect(x, H - 13, 4, 3); }
  ctx.fillStyle = '#583c4b'; ctx.textAlign = 'center';
  ctx.font = `700 28px ${sans}`; ctx.fillText('小屋月报', W / 2, 53);
  ctx.font = `14px ${sans}`; ctx.fillText(issue.month, W / 2, 76);
  ctx.textAlign = 'left';
  issue.stories.forEach((story, i) => {
    const y = 94 + i * 92 + (i ? feature : 0);
    const hero = i === 0 && feature;
    ctx.fillStyle = i ? '#f5e4d6' : '#f6dbe3'; ctx.fillRect(24, y, W - 48, 82 + (hero || 0));
    const people = story.people || [];
    if (hero) {
      ctx.textAlign = 'center';
      for (const [index, person] of people.entries()) {
        const x = W / 2 + (index - (people.length - 1) / 2) * 84;
        ctx.fillStyle = '#e9bacb'; ctx.fillRect(x - 28, y + 75, 56, 5);
        ctx.drawImage(paperPortrait(person), x - 30, y + 8, 60, 72);
        ctx.fillStyle = '#583c4b'; ctx.font = `12px ${sans}`; ctx.fillText(person.name, x, y + 98, 80);
      }
      ctx.textAlign = 'left';
    } else if (people.length) {
      const size = people.length === 3 ? 23 : 30;
      for (const [index, person] of people.entries()) {
        ctx.drawImage(paperPortrait(person), 30 + index * (size - 2), y + 25, size, size * 1.2);
      }
    } else {
      ctx.font = `27px ${sans}`; ctx.fillText(story.icon, 48, y + 51);
    }
    const left = hero ? 38 : 104;
    const baseline = y + (hero || 0);
    ctx.fillStyle = '#8a3d59'; ctx.font = `700 12px ${sans}`;
    ctx.fillText(paperStoryTitle(story, i), left, baseline + 16);
    ctx.fillStyle = '#3d2733'; ctx.font = `${i === 0 ? '700 16px' : '14px'} ${sans}`;
    let row = '', line = 0;
    for (const char of story.text) {
      if (ctx.measureText(row + char).width > 322 - left) {
        if (line === 2) { ctx.fillText(row.slice(0, -1) + '…', left, baseline + 37 + line * 18); return; }
        ctx.fillText(row, left, baseline + 37 + line++ * 18); row = '';
      }
      row += char;
    }
    ctx.fillText(row, left, baseline + 37 + line * 18);
  });
  return c;
}

function saveHousePaperCard(issue) {
  drawHousePaperCard(issue).toBlob(blob => {
    if (!blob) return;
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = `小屋月报-${issue.month}.png`; link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }, 'image/png');
}

$('#wdName').oninput = e => { const d = wdDoll(); if (d) { d.name = e.target.value.trim() || '无名'; renderWdTabs(); } };
$('#wdName').onchange = () => wdSaved();
$('#wdRandom').onclick = () => {
  const d = wdDoll(); if (!d) return;
  d.look = randomLook(); SFX.play('love'); renderWardrobe(); wdSaved();
};
$('#wdRemove').onclick = () => {
  const d = wdDoll(); if (!d) return;
  if (residents().length <= 1) { HOOK.toast('至少要留一位住户哦', true); return; }
  if (!confirm(`真的要让 ${d.name} 搬走吗？`)) return;
  if (d.act) endAct(d);
  for (const o of G.dolls) if (o.act && o.act.partner === d) endAct(o);
  G.dolls = G.dolls.filter(o => o !== d);
  if (G.sel === d.uid) G.sel = null;
  HOOK.toast(`${d.name} 挥挥手搬走了`); wdUid = residents()[0].uid; renderWardrobe(); HOOK.select(); save();
};

function renderWdTabs() {
  const box = $('#wdTabs'); box.innerHTML = '';
  for (const d of residents()) {
    const b = el('button', d.uid === wdUid ? 'on' : '', esc(d.name));
    b.onclick = () => { wdUid = d.uid; SFX.play('click'); renderWardrobe(); };
    box.append(b);
  }
}

function renderWardrobe() {
  const d = wdDoll(); if (!d) return;
  renderWdTabs();
  $('#wdName').value = d.name;
  const box = $('#wdOptions'); box.innerHTML = '';
  const section = (title, node) => { const s = el('div', 'opt'); s.append(el('h4', null, title), node); box.append(s); };
  const chips = (obj, key) => {
    const w = el('div', 'chips');
    for (const [k, name] of Object.entries(obj)) {
      const b = el('button', 'chip' + (d.look[key] === k ? ' on' : ''), name);
      b.onclick = () => { d.look[key] = k; SFX.play('pop'); renderWardrobe(); wdSaved(); };
      w.append(b);
    }
    return w;
  };
  const swatches = (cols, key) => {
    const w = el('div', 'chips');
    cols.forEach((col, i) => {
      const b = el('button', 'swatch' + (d.look[key] === i ? ' on' : ''));
      b.style.background = col; b.setAttribute('aria-label', col);
      b.onclick = () => { d.look[key] = i; SFX.play('pop'); renderWardrobe(); wdSaved(); };
      w.append(b);
    });
    return w;
  };
  const pers = el('div', 'chips');
  for (const [k, P] of Object.entries(PERSONAS)) {
    const b = el('button', 'chip' + (d.persona === k ? ' on' : ''), `${P.icon} ${P.name}<small>${P.desc}</small>`);
    b.onclick = () => { d.persona = k; SFX.play('pop'); say(d, pick(P.lines)); renderWardrobe(); wdSaved(); };
    pers.append(b);
  }
  section('性格', pers);
  const jobs = el('div', 'chips');
  for (const [k, J] of Object.entries(JOBS)) {
    const sub = J.start == null ? (k === 'artist' ? '不用出门 · 偶尔卖画' : '不用出门 · 没有收入') : `${hhmm(J.start)}–${hhmm(J.end)} · ${yuan(J.wage)}/月${k === 'student' ? ' · 不谈恋爱' : ''}`;
    const b = el('button', 'chip' + (d.job === k ? ' on' : ''), `${J.icon} ${J.name}<small>${sub}</small>`);
    b.onclick = () => {
      d.job = k; SFX.play('pop');
      if (k === 'student') { clearRomance(d); HOOK.toast('学生不参与恋爱剧情，和 TA 有关的恋爱关系已清零', true); }
      renderWardrobe(); wdSaved();
    };
    jobs.append(b);
  }
  section('职业', jobs);
  const gen = el('div', 'chips');
  for (const [k, n] of Object.entries(GENDERS)) {
    const b = el('button', 'chip' + (d.gender === k ? ' on' : ''), n);
    b.onclick = () => { d.gender = k; SFX.play('pop'); renderWardrobe(); wdSaved(); };
    gen.append(b);
  }
  section('性别', gen);
  const zs = el('div', 'chips');
  for (const z of ZODIAC) {
    const b = el('button', 'chip' + (d.zodiac === z.id ? ' on' : ''), `${z.icon} ${z.name}<small>${ELEMENTS[z.el].icon}${ELEMENTS[z.el].name}</small>`);
    b.onclick = () => { d.zodiac = z.id; SFX.play('pop'); renderWardrobe(); wdSaved(); };
    zs.append(b);
  }
  section('星座', zs);
  const mbtiPicker = el('select', 'mbti-picker');
  mbtiPicker.setAttribute('aria-label', 'MBTI 类型');
  for (const [code, name] of Object.entries(MBTI_NAMES)) {
    const option = el('option', null, `${code} · ${name}`);
    option.value = code;
    mbtiPicker.append(option);
  }
  mbtiPicker.value = mb(d);
  mbtiPicker.onchange = () => { d.mbti = mbtiPicker.value; SFX.play('pop'); renderWardrobe(); wdSaved(); };
  const mbtiBox = el('div', 'mbti-settings');
  mbtiBox.append(mbtiPicker, el('small', 'hint', `常见偏好 · ${MBTI_INTERESTS[mb(d)].map(use => ACT_NAMES[use]).join('、')}`));
  section('MBTI', mbtiBox);
  const hearts = el('div', 'chips');
  for (const [k, H] of Object.entries(HEARTS)) {
    const b = el('button', 'chip' + (d.heart === k ? ' on' : ''), `${H.icon} ${H.name}<small>${H.desc}</small>`);
    b.onclick = () => { d.heart = k; SFX.play('pop'); renderWardrobe(); wdSaved(); };
    hearts.append(b);
  }
  section('感情观', hearts);
  section('肤色', swatches(OUTFIT.skin, 'skin'));
  section('发型', chips(OUTFIT.hair, 'hair'));
  section('发色', swatches(OUTFIT.hairColor, 'hairColor'));
  section('上衣', chips(OUTFIT.top, 'top'));
  section('上衣颜色', swatches(OUTFIT.clothColor, 'topColor'));
  if (d.look.top !== 'dress') section('下装', chips(OUTFIT.bottom, 'bottom'));
  section(d.look.top === 'overall' ? '背带颜色' : '下装颜色', swatches(OUTFIT.clothColor, 'bottomColor'));
  section('鞋子', swatches(OUTFIT.shoes, 'shoes'));
  section('配饰', chips(OUTFIT.acc, 'acc'));
  drawWdPreview();
}
function drawWdPreview() { const d = wdDoll(); if (d) dollPortrait($('#wdCanvas'), d.look, wdDir, wdFrame, 'walk'); }

// 衣橱里每次换装都在预览下方显示一句确认，1.5 秒后消失
let wdSavedTimer = 0;
function wdSaved() {
  const s = $('#wdSaved');
  if (!s) return;
  s.textContent = '✓ 已换好';
  clearTimeout(wdSavedTimer);
  wdSavedTimer = setTimeout(() => { s.textContent = ''; }, 1500);
}

/* ---------- 串门、派对与入住 ---------- */
function updateCommunityStatus() {
  const event = G.community.active;
  const status = $('#communityStatus');
  const pending = G.community.deferredPicnic;
  const outing = G.community.outing;
  status.hidden = !event && !pending && !outing;
  $('#picnicNotice').hidden = !event?.rainDeadline;
  if ($('#neighborDialog').open) updateNeighborDialog();
  if (!event) {
    status.textContent = outing ? `🏡 ${communityDoll(outing.pid)?.name || '住户'}${outing.phase === 'leaving' ? '准备去隔壁' : '正在麦麦家做客'}` : pending ? '🧺 野餐已改期，等天晴再开场' : '';
    return;
  }
  const style = GET_TOGETHERS[event.kind], host = communityDoll(event.hostPid), guest = communityDoll(event.guestPid);
  const plan = event.rainMode && PICNIC_PLANS[event.rainMode];
  const label = event.leavingAt ? `👋 ${guest?.name || '朋友'} 正在回家` : `${style.icon} ${event.exchange ? '邻居来访' : style.name} · ${host?.name || '住户'}和${guest?.name || '朋友'} · ${event.joined.length} 人参与${plan ? ' · ' + plan : ''}`;
  if (status.textContent !== label) status.textContent = label;
}
HOOK.community = updateCommunityStatus;

for (const [plan, label] of Object.entries(PICNIC_PLANS)) {
  const button = el('button', 'btn small', label);
  button.type = 'button';
  button.onclick = () => {
    if (!choosePicnicPlan(plan)) HOOK.toast('现在客厅没有足够的可达空位，可以换一个安排。', true);
  };
  $('#picnicPlans').append(button);
}

function updateNeighborDialog() {
  const select = $('#neighborVisitor');
  const d = communityDoll(select.value), tie = d && neighborTie(d);
  const outing = G.community.outing;
  const visitor = outing?.phase === 'visiting' && communityDoll(outing.pid);
  const neighbor = communityDoll(NEIGHBOR_PID) || neighborProfile();
  const text = visitor ? `${visitor.name}正在门廊陪麦麦吃点心。` : neighborSchedule();
  $('#neighborStatus').textContent = text;
  const porch = $('#neighborPorch');
  const key = JSON.stringify([text, neighbor.look, visitor && visitor.look]);
  if (porch.dataset.scene !== key) {
    porch.dataset.scene = key;
    const cast = [neighbor, visitor].filter(Boolean);
    porch.replaceChildren(...cast.map(person => {
      const figure = el('figure');
      const portrait = el('canvas');
      portrait.width = 20; portrait.height = 24;
      dollPortrait(portrait, person.look, 'down', 0, visitor ? 'sit' : 'stand');
      const caption = el('figcaption'); caption.textContent = person.name;
      figure.append(portrait, caption);
      return figure;
    }));
  }
  $('#neighborTie').textContent = tie
    ? `来往了 ${tie.months} 个月 · 一起吃过 ${tie.meals} 次饭${tie.invited && G.day < tie.inviteMonth ? ' · 下个月可以赴约' : ''}`
    : '麦麦下午回家，有时会来送面包或借工具。';
  $('#neighborGo').disabled = !canVisitNeighbor(d);
}

$('#btnNeighbor').onclick = () => {
  const select = $('#neighborVisitor');
  select.replaceChildren(...residents().map(d => {
    const option = el('option'); option.value = d.pid; option.textContent = d.name; return option;
  }));
  const selected = residents().find(d => d.uid === G.sel);
  if (selected) select.value = selected.pid;
  else {
    const acquainted = residents().find(d => neighborTie(d)?.invited);
    if (acquainted) select.value = acquainted.pid;
  }
  updateNeighborDialog();
  $('#neighborDialog').showModal();
};
$('#neighborVisitor').onchange = updateNeighborDialog;
$('#neighborGo').onclick = () => {
  if (!startNeighborOuting(communityDoll($('#neighborVisitor').value))) HOOK.toast('现在走不到门口，稍后再去吧。', true);
};

$('#btnCommunity').onclick = () => {
  const hosts = availableHosts();
  const select = $('#communityHost');
  select.innerHTML = '';
  for (const d of hosts) {
    const option = el('option');
    option.value = d.pid; option.textContent = d.name; select.append(option);
  }
  if (hosts.some(d => d.uid === G.sel)) select.value = hosts.find(d => d.uid === G.sel).pid;
  const event = G.community.active;
  const ready = !event && !G.community.outing && absNow() >= G.community.nextEventAt && hosts.length > 0;
  $('#communityHelp').textContent = event ? `正在进行${GET_TOGETHERS[event.kind].name}，结束后可以再邀请朋友。`
    : !hosts.length ? '现在没有在家且醒着的住户。'
    : !ready ? '刚送走朋友，让小屋休息一会儿吧。'
    : '选一位住户做东。朋友会从门口进来，有空的室友可以加入派对。';
  const choices = $('#communityChoices');
  choices.innerHTML = '';
  for (const [kind, style] of Object.entries(GET_TOGETHERS)) {
    const button = el('button', 'btn small', `${style.icon} ${kind === 'visit' ? '请朋友来玩' : '办' + style.name}`);
    button.disabled = !ready;
    button.onclick = () => {
      if (startGetTogether(communityDoll(select.value), kind)) $('#communityDialog').close();
      else $('#communityHelp').textContent = '现在办不了。确认主人在家，门口和一楼客厅有通道和空位。';
    };
    choices.append(button);
  }
  $('#communityDialog').showModal();
};

function welcomeResident(d) {
  if (!d) { renderApplications(); return; }
  $('#applicationsDialog').close();
  G.sel = d.uid;
  say(d, '大家好，请多关照！');
  spawnHeart(d);
  SFX.play('love');
  HOOK.select();
  HOOK.toast(`${d.name} 搬进来啦！`);
  save();
}

function renderApplications() {
  const canMove = residents().length < residentLimit();
  $('#applicationSpace').textContent = `住户 ${residents().length} / ${residentLimit()}${canMove ? '' : ' · 小屋已住满，可以扩建或留待有空位时再邀请。'}`;
  const list = $('#applicationList');
  list.innerHTML = '';
  for (const application of G.community.applications) {
    const friend = G.community.friends.find(f => f.pid === application.pid);
    if (!friend) continue;
    const entry = el('div', 'application-row');
    const portrait = el('canvas'); portrait.width = 20; portrait.height = 24;
    dollPortrait(portrait, friend.look);
    const info = el('div', 'application-info');
    const title = el('strong'); title.textContent = friend.name;
    const host = communityDoll(friend.hostPid);
    const detail = el('small');
    detail.textContent = `${PERSONAS[friend.persona].name} · ${host ? host.name + '的朋友' : '来访过的朋友'} · 来访 ${friend.visits} 次`;
    info.append(title, detail);
    const button = el('button', 'btn small', '邀请入住');
    button.setAttribute('aria-label', `邀请 ${friend.name} 入住`);
    button.disabled = !canMove;
    button.onclick = () => welcomeResident(moveInApplicant(friend.pid));
    entry.append(portrait, info, button); list.append(entry);
  }
  if (!list.children.length) list.append(el('p', 'hint', '还没有入住申请。朋友来玩得开心，就可能在离开时留下申请。'));
  $('#btnRandomResident').disabled = !canMove;
}
$('#btnAddDoll').onclick = () => { renderApplications(); $('#applicationsDialog').showModal(); };
$('#btnRandomResident').onclick = () => {
  if (residents().length < residentLimit()) welcomeResident(addDoll(newcomerProfile()));
};

function updateKeepsakeDialog(reset = false) {
  if (reset) {
    for (const [i, id] of ['keepsakeMaker1', 'keepsakeMaker2'].entries()) {
      const select = $('#' + id);
      select.replaceChildren(...residents().map(d => {
        const option = el('option', null, '');
        option.textContent = d.name;
        option.value = d.pid;
        return option;
      }));
      select.selectedIndex = Math.min(i, residents().length - 1);
    }
    $('#keepsakeFinish').replaceChildren(...Object.entries(KEEPSAKE_FINISHES).map(([id, [name]]) => {
      const option = el('option', null, name);
      option.value = id;
      return option;
    }));
  }
  const project = G.keepsakes.project;
  const bench = G.furniture.some(f => f.id === 'craftBench');
  $('#keepsakeStatus').textContent = project ? project.people.map(pid => communityDoll(pid)?.name).join('和') +
    (project.work ? '正在给花架上色。' : '正准备去手工台。') : bench ?
    '选两位住户和一种颜色。等他们一起到手工台，成品就会放进「布置 → 纪念物」。' :
    '先到「布置 → 兴趣家具」摆一张奶糖手工台，台前给两位住户留出空位。';
  $('#keepsakeStart').disabled = !bench || !!project || residents().length < 2;
  const nameOf = pid => (communityDoll(pid) || G.community.friends.find(p => p.pid === pid))?.name;
  const notes = [];
  for (const f of G.furniture) {
    const record = G.keepsakes.corners[f.key], name = nameOf(record?.owner);
    if (!name) continue;
    const companions = record.regulars.filter(pid => pid !== record.owner).map(nameOf).filter(Boolean);
    notes.push(`${name}的${CORNER_NAMES[cornerKind(f) || 'read']} · ${FURNITURE[f.id].name}${companions.length ? ' · 也常来的有 ' + companions.join('、') : ''}`);
  }
  for (const tie of Object.values(G.keepsakes.traditions)) {
    const names = tie.people.map(nameOf);
    if (names.every(Boolean)) notes.push(`${names.join('和')} · 下雨时想再去书房喝茶`);
  }
  const list = (selector, items, empty) => {
    const nodes = (items.length ? items : [empty]).map(text => {
      const item = el('li', null, '');
      item.textContent = text;
      return item;
    });
    $(selector).replaceChildren(...nodes);
  };
  list('#keepsakeNotes', notes, '常来坐坐，过几个月就会有属于自己的小角落。');
  list('#keepsakePieces', G.keepsakes.pieces.map(keepsakeLabel), '还没有一起做过的纪念物。');
}

$('#btnKeepsakes').onclick = () => {
  updateKeepsakeDialog(true);
  $('#keepsakesDialog').showModal();
};
$('#keepsakeStart').onclick = () => {
  const pair = ['#keepsakeMaker1', '#keepsakeMaker2'].map(id => communityDoll($(id).value));
  if (startKeepsakeProject(...pair, $('#keepsakeFinish').value)) {
    $('#keepsakesDialog').close();
    HOOK.toast('🧵 两位住户要去手工台做花架了', true);
  } else $('#keepsakeStatus').textContent = '请选择两位不同的住户。两人要在家有空，手工台前也要有两个能走到的空位。';
};

/* ---------- 主循环 ---------- */
load(); rebuild(); HOOK.select(); updateClock(); renderLog(); renderShopBar();
let last = performance.now(), uiT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  // 月报曾因玩家正忙（拖小人、衣橱、别的弹窗）而挂起：等空闲了再弹出来
  if (G.paperPending && typeof playerBusy === 'function' && !playerBusy()) { G.paperPending = false; updateHousePaperButton(); showHousePaper(); }
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; updateClock(); tickInfo(); renderShopBar(); if ($('#neighborDialog').open) updateNeighborDialog(); }
  if (!$('#wardrobe').hidden) { wdTimer += dt; if (wdTimer > 0.18) { wdTimer = 0; wdFrame = (wdFrame + 1) % 4; drawWdPreview(); } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('beforeunload', save);

document.getElementById('dailyPaper').onclick=showHousePaper;
document.getElementById('paperOlder').onclick = () => renderHousePaper(housePaperIndex - 1);
document.getElementById('paperNewer').onclick = () => renderHousePaper(housePaperIndex + 1);
document.getElementById('paperCopy').onclick = async () => {
  const issue = currentHousePaper();
  if (!issue) return;
  try {
    await navigator.clipboard.writeText(housePaperText(issue));
    HOOK.toast('已复制本期月报', true);
  } catch { HOOK.toast('可以选中月报文字手动复制', true); }
};
const paperAuto=document.getElementById('paperAuto');
const paperPreference = TEST_MODE ? 'house-test-paper-auto' : 'house-paper-auto';
paperAuto.checked=true;
try{paperAuto.checked=localStorage.getItem(paperPreference)!=='off';}catch{}
paperAuto.onchange=()=>{try{localStorage.setItem(paperPreference,paperAuto.checked?'on':'off');}catch{}};
updateHousePaperButton();

const paperOffline=document.getElementById('paperOffline');
paperOffline.checked=offlineEnabled();
paperOffline.onchange=()=>{try{localStorage.setItem(OFFLINE_KEY,paperOffline.checked?'on':'off');}catch{}};
document.getElementById('paperCard').onclick = () => {
  const issue = currentHousePaper();
  if (issue) saveHousePaperCard(issue);
};
function renderRewind(){
  const list=document.getElementById('rewindList');
  const snaps=SaveManager.snapshots(localStorage,SAVE_KEY).sort((a,b)=>b.day-a.day);
  list.replaceChildren(...snaps.map(snap=>{
    const row=el('div','rewind-row',`<span>${monthLabel(snap.day)} 月初${snap.day===G.day?' · 本月':''}</span>`);
    const button=el('button','btn small ghost','回到这里');
    button.onclick=()=>{
      if(!confirm(`回到${monthLabel(snap.day)}月初？之后发生的事都会被改写。`))return;
      if(restoreHouseSnapshot(snap.index)){
        document.getElementById('paperDialog').close();
        HOOK.select();updateClock();renderLog();renderShopBar();updateHousePaperButton();
        HOOK.toast(`🕰 回到了${monthLabel(G.day)}月初`,true);
      }else HOOK.toast('这份快照读不出来了',true);
    };
    row.append(button);return row;
  }));
  if(!snaps.length)list.textContent='还没有快照。';
}
document.querySelector('.rewind-box').addEventListener('toggle',renderRewind);

// 离线模拟：补上关掉页面期间的生活
const away=catchUpOffline();
if(away){renderLog();HOOK.select();updateClock();if(away.hours>=1)HOOK.toast(`🌙 你不在的 ${away.hours} 小时里，小屋发生了 ${away.happened} 件事`,true);}
</script>
