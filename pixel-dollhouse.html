<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素小屋</title>
<style>
:root{
  --bg:#f4e9d8;
  --bg-2:#ead9bf;
  --panel:#fffaf0;
  --panel-2:#f6ead6;
  --ink:#3b2a2f;
  --muted:#8a7366;
  --line:#3b2a2f;
  --accent:#e26d7d;
  --accent-ink:#fff;
  --couple-ink:#9b365c;
  --sel:#ffd35c;
  --good:#7cc576;
  --warn:#f0a64a;
  --bad:#e26d6d;
  --shadow:#3b2a2f;
  --backdrop:rgba(40,28,34,.5);
  --font-display:"PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-pixel:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221b26;--bg-2:#2c2332;--panel:#2f2637;--panel-2:#3b3044;--ink:#f3e8da;--muted:#b6a394;
    --line:#120d15;--shadow:#0a070c;--backdrop:rgba(5,3,8,.65);--couple-ink:#f3a5c0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221b26;--bg-2:#2c2332;--panel:#2f2637;--panel-2:#3b3044;--ink:#f3e8da;--muted:#b6a394;
  --line:#120d15;--shadow:#0a070c;--backdrop:rgba(5,3,8,.65);--couple-ink:#f3a5c0;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(var(--bg-2) 1.5px,transparent 1.5px);
  background-size:18px 18px;
  color:var(--ink);font-family:var(--font-body);
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0}

.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);
  border-bottom:3px solid var(--line);
}
.topbar h1{font-size:24px;letter-spacing:2px;color:var(--accent)}
.clock{font-family:var(--font-pixel);font-size:14px;display:flex;gap:8px;align-items:center;
  background:var(--panel-2);border:2px solid var(--line);padding:3px 10px;border-radius:6px}
.clock #dayLabel{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.modes,.speed{display:flex;gap:6px}
.modes{margin-left:auto}
.modes button,.speed button,.btn,.tab{
  background:var(--panel-2);border:2px solid var(--line);border-radius:6px;
  padding:6px 12px;box-shadow:0 3px 0 var(--shadow);transition:transform .05s;
}
.modes button:active,.speed button:active,.btn:active,.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.modes button.on,.speed button.on,.tab.on{background:var(--sel);color:#3b2a2f}
.speed button{padding:6px 9px}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger,.btn.on{background:var(--accent);color:var(--accent-ink)}

.layout{flex:1 0 auto;position:relative;display:flex;flex-direction:column;min-width:0;padding:12px}
#stageWrap{display:flex;flex:1 0 auto;flex-direction:column;min-width:0}
.scene-frame{display:grid;place-items:center;min-width:0}
#stage{
  --scene-ratio:1.01935484;
  position:relative;width:100%;min-width:0;aspect-ratio:var(--scene-ratio);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;
  box-shadow:0 3px 0 var(--shadow);background:#9fd3f0;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#cv{width:100%;height:100%;display:block;image-rendering:auto}
#overlay{position:absolute;inset:0;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}
/* 主画面下的操作提示要一眼看到：不只是底部一行小字 */
#hint{font-size:14px;font-weight:650;color:var(--ink);background:var(--panel);
  border:2px solid var(--line);border-radius:6px;padding:7px 10px}

.bubble{
  position:absolute;transform:translate(-50%,-100%);
  background:#fffaf0;color:#3b2a2f;border:2px solid #3b2a2f;border-radius:8px;
  padding:3px 8px;font-size:13px;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.25);animation:pop .18s ease-out;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;
  border:5px solid transparent;border-top-color:#3b2a2f;border-bottom:0}
.nametag{position:absolute;transform:translate(-50%,0);font-size:11px;padding:1px 6px;border-radius:4px;
  background:rgba(59,42,47,.8);color:#fff;white-space:nowrap}
.nametag.couple-name{background:#883858;color:#fff3f7}
.nametag.drop-target{background:#fff2bd;color:#432e30;border:1px solid #614248;font-weight:700;z-index:1}
.heart{position:absolute;font-size:14px;animation:floatUp 1s ease-out forwards}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
@keyframes floatUp{to{transform:translateY(-28px);opacity:0}}

#side{position:absolute;z-index:3;top:22px;right:22px;width:max-content;max-width:calc(100% - 44px)}
#side summary{width:max-content;margin-left:auto;cursor:pointer;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:650}
.resident-panel{display:grid;gap:9px;width:min(300px,calc(100vw - 44px));max-height:max(140px,calc(100dvh - 150px));overflow:auto;margin-top:7px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 3px 0 var(--shadow)}
#dollList{display:flex;flex-direction:column;gap:6px}
.doll-row{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--panel);
  border:2px solid var(--line);border-radius:6px;cursor:pointer;text-align:left;width:100%}
.doll-row.sel{background:var(--sel);color:#3b2a2f}
.doll-row.away canvas{opacity:.35}
.g-m{color:#4a8fd8}.g-f{color:#e26d7d}
.doll-row.sel .g-m,.doll-row.sel .g-f{color:inherit}
.doll-row.away .meta b::after{content:" · 外出";font-weight:400;font-size:12px;opacity:.7}
.doll-row canvas{width:30px;height:36px;image-rendering:auto;flex:none}
.doll-row .meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.doll-row .meta b{font-weight:600}
.doll-row .meta small{opacity:.75;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doll-row .meta .couple-label{color:var(--couple-ink);font-weight:700;opacity:1}
.doll-row.sel .meta .couple-label{color:#812f4d}
.partner-list{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 9px}
.partner-list[hidden]{display:none}
.partner-link{padding:3px 8px;border:1px solid #d792ab;border-radius:5px;background:#ffe9f0;
  color:#87304f;font:inherit;font-size:12px;font-weight:700;cursor:pointer;text-align:left}
.partner-link:hover,.partner-link:focus-visible{background:#ffd8e6}
.card{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px;box-shadow:0 4px 0 var(--shadow)}
.card h3{margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:18px}
.card .persona{font-size:13px;color:var(--muted);margin-bottom:8px}
.need{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center;font-size:12px;margin:5px 0}
.bar{height:10px;border:2px solid var(--line);border-radius:3px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.card .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card .doing{font-size:13px;margin:6px 0 2px}
.card .money{font-size:13px;margin:-2px 0 8px}
.card .money b{font-family:var(--font-pixel);color:#4f9a4a}
.card .money b.neg{color:var(--bad)}
.rels{margin-top:10px;border-top:2px dashed var(--panel-2);padding-top:8px}
.rels h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.rel{margin:0 0 8px}
.rel-top{display:flex;justify-content:space-between;font-size:13px}
.rel-top small{color:var(--muted)}
.couple-rel{border-left:3px solid #d8789d;padding-left:6px}
.couple-rel .rel-top small{color:var(--couple-ink);font-weight:700}
.rel-top .stars{color:#e8a33a;font-size:11px;letter-spacing:-1px}
.mbti-sep{align-self:center;color:var(--muted)}
.rel-bars{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px;align-items:center;font-size:11px;margin-top:2px}
.rel-bars .bar{height:8px}

.log-card{padding:10px 12px}
.log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.log-head h3{margin:0}
.log-list{max-height:300px;overflow-y:auto;font-size:13px;line-height:1.4;padding-right:4px}
.log-day{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:12px;font-weight:600;padding:6px 0 3px;border-bottom:2px solid var(--panel-2)}
.log-item{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:4px 0;border-bottom:1px dashed var(--panel-2)}
.log-item time{font-family:var(--font-pixel);color:var(--muted);font-size:12px}
.log-empty{color:var(--muted);font-size:13px;padding:8px 0}
.shop-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-bottom:8px}
.shop-bar .fund b{font-family:var(--font-pixel);color:#4f9a4a}
.shop-bar .house{color:var(--muted);font-size:13px}
.shop-bar .spacer{flex:1}
.shop-bar button:disabled{opacity:.5;cursor:default}
#btnExpand.ready{background:var(--good);color:#fff}
.fund-pill{font-size:13px}
.item small.price{font-size:11px;font-family:var(--font-pixel);color:var(--muted)}
.item small.price.own{color:#4f9a4a}
.item small.price.poor{color:var(--bad)}
.item.locked{opacity:.5}
.item.locked canvas{filter:grayscale(1)}
#buildBar{flex:none;min-width:0;background:var(--panel);border-top:3px solid var(--line);padding:10px 16px 12px}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs .spacer{flex:1}
.palette{display:flex;gap:9px;overflow-x:auto;padding:10px 2px 7px}
.palette[data-category="essentials"]{--item-art:#e3eee2}
.palette[data-category="decor"]{--item-art:#f4dfe8}
.palette[data-category="hobbies"]{--item-art:#e9e2f5}
.palette[data-category="yard"]{--item-art:#e4eccf}
.item{flex:none;width:94px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:12px}
.item-name{font-weight:650}
.item-purpose{color:var(--muted);font-size:10px}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item.on{background:var(--sel);color:#3b2a2f}
.item canvas{width:56px;height:56px;image-rendering:auto;background:var(--item-art,transparent);border-radius:8px}

.modal{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal[hidden],#buildBar[hidden],.card[hidden]{display:none}
.modal-card{background:var(--panel);border:3px solid var(--line);border-radius:8px;box-shadow:0 8px 0 var(--shadow);
  width:min(820px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.wd-tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.wd-tabs button{background:var(--panel-2);border:2px solid var(--line);border-radius:6px;padding:3px 10px}
.wd-tabs button.on{background:var(--sel);color:#3b2a2f}
.wd-body{display:flex;gap:16px;padding:14px;overflow:auto;flex-wrap:wrap}
.wd-preview{flex:0 0 200px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto;
  position:sticky;top:0;align-self:flex-start;background:var(--panel);z-index:1;padding-bottom:8px}
.wd-saved{min-height:18px;font-size:13px;font-weight:700;color:#4f9a4a}
#wdCanvas{width:200px;height:240px;image-rendering:auto;border:2px solid var(--line);border-radius:6px;
  background:repeating-conic-gradient(var(--panel-2) 0 25%,var(--panel) 0 50%) 0 0/20px 20px}
.wd-dir{display:flex;gap:4px}
.wd-dir button{border:2px solid var(--line);background:var(--panel-2);border-radius:4px;width:34px;height:28px}
.wd-name{font-size:13px;display:flex;gap:6px;align-items:center}
.wd-name input{width:110px;font:inherit;padding:3px 6px;border:2px solid var(--line);border-radius:4px;background:var(--panel-2);color:var(--ink)}
.wd-options{flex:1 1 360px;display:flex;flex-direction:column;gap:12px;min-width:0}
.opt h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 10px;font-size:13px}
.chip.on{background:var(--sel);color:#3b2a2f}
.chip small{display:block;font-size:11px;opacity:.7}
.swatch{width:26px;height:26px;border:2px solid var(--line);border-radius:5px;padding:0}
.swatch.on{outline:3px solid var(--accent);outline-offset:1px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:6px;font-size:14px;
  transition:all .25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:701px), (orientation:landscape){
  body{height:100dvh}
  .topbar{flex:none}
  .layout{flex:1 0 0;min-height:min(280px,72dvh)}
  #stageWrap{flex:1 0 0;min-height:0}
  .scene-frame{flex:1 0 0;min-height:0;container-type:size}
  #stage{width:min(100%,calc(100cqh * var(--scene-ratio)))}
}
@media (max-width:700px){
  .topbar{padding:8px 10px;gap:6px}
  .topbar h1{font-size:20px}
  .modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-left:0;order:3;width:100%}
  .modes button{min-width:0;min-height:40px;padding:5px 3px;font-size:12px;overflow-wrap:anywhere}
  .modes .paper-button{white-space:normal}
  .speed button{min-width:34px;min-height:34px;padding:4px 6px}
  .layout{padding:8px}
  #buildBar{padding:8px}
  .tabs .spacer,.shop-bar .spacer{display:none}
  .bubble{font-size:11px;padding:2px 6px}
}
@media (max-width:700px) and (orientation:portrait){
  #side{position:static;width:100%;max-width:none;margin-top:10px}
  #side summary{margin-left:0;min-height:40px}
  .resident-panel{width:100%;max-height:none}
}
@media (orientation:landscape) and (max-height:520px){
  .topbar{padding-block:5px;gap:6px}
  .topbar h1{font-size:18px}
  .layout{padding:6px}
  #side{top:12px;right:12px}
  .modal-card{max-height:calc(100dvh - 24px)}
}

.paper-button{white-space:nowrap;background:var(--sel)!important;color:#3b2a2f}
.paper-dialog{width:min(560px,calc(100% - 24px));max-height:85vh;padding:20px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
.paper-dialog::backdrop{background:var(--backdrop)}
.paper-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.paper-head h2{font-weight:600}
.paper-dialog label{font-size:14px}
.paper-issues{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.paper-issues span{font-weight:650;text-align:center;font-size:14px}
.paper-issues button:disabled,.paper-actions button:disabled{opacity:.4;cursor:default}
#paperText{display:grid;gap:7px;overflow-wrap:anywhere;line-height:1.45}
.paper-story{display:grid;grid-template-columns:minmax(48px,auto) 1fr;align-items:center;gap:10px;padding:8px 10px;background:var(--panel-2);border-radius:8px}
.paper-lead{background:#f8dce5;color:#542d40;padding:12px 10px}
.paper-story small{display:block;font-size:11px;font-weight:650;opacity:.78;margin-bottom:2px}
.paper-story h3,.paper-story p{margin:0}
.paper-story h3{font-size:clamp(15px,4vw,20px);font-weight:730}
.paper-story p{font-size:14px}
.paper-cast{display:flex;align-items:center;justify-content:center;gap:2px;color:inherit;font-size:25px}
.paper-cast figure{display:grid;justify-items:center;margin:0;min-width:0}
.paper-cast figcaption{font-size:10px;max-width:6em;overflow-wrap:anywhere;text-align:center}
.paper-cast canvas{display:block;width:24px;height:29px;image-rendering:auto}
.paper-feature{grid-template-columns:1fr;gap:8px}
.paper-feature .paper-cast{gap:clamp(8px,4vw,22px);padding:7px 4px 4px;background:#fff1e866;border-radius:6px;border-bottom:2px dashed #dba7b7}
.paper-feature .paper-cast canvas{width:60px;height:72px;animation:paper-hop 560ms ease-out both}
.paper-feature figcaption{font-size:12px;font-weight:650;margin-top:2px}
.paper-feature figure:nth-child(2) canvas{animation-delay:90ms}
.paper-feature figure:nth-child(3) canvas{animation-delay:180ms}
.paper-chain{margin-top:7px;font-size:13px}
.paper-chain summary{cursor:pointer;font-weight:650;width:max-content}
.paper-chain ol{margin:5px 0 0;padding-inline-start:22px}
@keyframes paper-hop{from{transform:translateY(4px);opacity:.55}45%{transform:translateY(-5px)}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.paper-feature .paper-cast canvas{animation:none}}

.test-badge{display:inline-block;margin-inline-start:5px;padding:3px 7px;border-radius:5px;
  background:#e8c9f4;color:#452d52;font-size:12px;vertical-align:middle;white-space:nowrap}

.mbti-settings{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mbti-picker{background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;font:inherit}
.mbti-settings .hint{margin:0}


.community-panel{display:grid;gap:6px}
.picnic-notice{margin:8px 0 0;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;font-size:13px}
#picnicPlans{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.neighbor-porch{min-height:134px;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:16px 12px 10px;border:2px solid #956d60;border-top:8px solid #9d605c;border-radius:8px;background:repeating-linear-gradient(90deg,#ba9272 0 1px,transparent 1px 17px) bottom/100% 28px no-repeat,linear-gradient(#f2d4b2 0 76%,#dcab83 76%);color:#513b3a}
.neighbor-porch figure{display:grid;justify-items:center;margin:0;font-size:12px;font-weight:700}
.neighbor-porch canvas{width:60px;height:72px;image-rendering:auto}
#neighborTie{margin:8px 0}
.community-status{font-size:12px;line-height:1.4;margin:0;padding:7px 9px;border-radius:7px;background:var(--panel);color:var(--ink)}
.guest-tag{font-size:10px;font-style:normal;font-weight:600;border-radius:5px;padding:2px 5px;background:#ecd6f3;color:#59355e}
.community-dialog h3{margin:14px 0 6px;font-size:15px}
.community-choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.community-choices button:disabled,.community-dialog button:disabled{opacity:.55;cursor:default}
.application-row{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:8px 0;background:var(--panel)}
.application-row canvas{width:30px;height:36px;image-rendering:auto}
.application-info{display:grid;gap:3px;flex:1;min-width:0}
.application-info small{color:var(--muted)}
#btnRandomResident{margin-top:12px}
.paper-settings{margin-top:10px;font-size:13px}
.paper-settings summary{cursor:pointer}
.paper-settings label{display:block;margin:4px 0}
.paper-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rewind-box{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}.rewind-box summary{cursor:pointer;font-weight:600}
.rewind-list{display:grid;gap:6px;margin-top:6px}.rewind-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}

.keepsake-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:10px 0}
.keepsake-fields label{display:grid;gap:4px;font-size:.9rem}
.keepsake-fields select{width:100%;min-width:0}
.keepsake-notes{margin:6px 0 16px;padding-left:1.3em;display:grid;gap:6px}
</style>
</head>
<body>
<header class="topbar">
  <h1>像素小屋</h1>
  <div class="clock" title="游戏时间">
    <span id="dayLabel">1 年 1 月</span>
    <span id="clock">00:00</span>

<script>
// 道具保持逻辑格尺寸，细节贴图由 Canvas 与动画合成。
const INK = '#493743';
const PIXEL_SCALE = 2;

const cottageAtlas = document.getElementById('cottageAtlas');
const COTTAGE_SPRITES = {
  bigbed: [0, 0, 120, 96], sofa: [128, 0, 128, 76], piano: [256, 0, 112, 99],
  shelf: [0, 128, 78, 112], window: [128, 128, 124, 105], oak: [256, 128, 128, 128],
  desk: [0, 256, 112, 90], arcade: [128, 256, 74, 112], plant: [256, 256, 82, 112],
  toilet: [0, 384, 88, 100], washstand: [128, 384, 78, 112], shower: [256, 384, 62, 112],
};
const cottageArtReady = () => Boolean(cottageAtlas?.complete && cottageAtlas.naturalWidth);

function drawCottageSprite(c, id, x, y, w, h) {
  if (!cottageArtReady()) return false;
  c.save();
  c.imageSmoothingEnabled = true;
  c.drawImage(cottageAtlas, ...COTTAGE_SPRITES[id], x, y, w, h);
  c.restore();
  return true;
}

// Fine details snap to the same half-tile-pixel grid in the house and portraits.
function detail(c, x, y, w, h, color) {
  c.fillStyle = color;
  c.fillRect(Math.round(x * PIXEL_SCALE) / PIXEL_SCALE, Math.round(y * PIXEL_SCALE) / PIXEL_SCALE, w, h);
}

function bevel(c, x, y, w, h, fill, line) {
  R(c, x + 1, y, w - 2, h, line);
  R(c, x, y + 1, w, h - 2, line);
  R(c, x + 1, y + 1, w - 2, h - 2, fill);
}

function contactShadow(c, x, y, w) {
  R(c, x + 1, y, w - 2, 2, '#4b364221');
  R(c, x, y + 1, w, 1, '#4b36421c');
}

function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); }
// 带描边的方块：先画深色外框，再往里缩一像素填色
function box(c, x, y, w, h, fill, line = INK) { R(c, x, y, w, h, line); R(c, x + 1, y + 1, w - 2, h - 2, fill); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + amt * 255)));
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
}
// 伪随机：同一个种子永远得到同样结果，用来给书本、草地这类细节配色
function rnd(seed) { const s = Math.sin(seed * 9301 + 49297) * 233280; return s - Math.floor(s); }

/* ---------------- 墙纸与地板 ---------------- */
function drawWall(c, wall, h = WALL_ROWS * T) {
  R(c, 0, 0, W, h, wall.base);
  const a = wall.alt;
  if (wall.pat === 'stripe') for (let x = 0; x < W; x += 8) R(c, x, 0, 3, h, a);
  if (wall.pat === 'dots') for (let y = 3; y < h; y += 8) for (let x = (y / 8 % 2) * 4 + 2; x < W; x += 8) R(c, x, y, 2, 2, a);
  if (wall.pat === 'diamond') for (let y = 0; y < h; y += 8) for (let x = (y / 8 % 2) * 4; x < W; x += 8) { R(c, x + 2, y + 1, 1, 1, a); R(c, x + 1, y + 2, 3, 1, a); R(c, x + 2, y + 3, 1, 1, a); }
  if (wall.pat === 'clouds') for (let i = 0; i < 9; i++) { const x = rnd(i) * W, y = 4 + rnd(i + 20) * (h - 16); R(c, x, y + 2, 14, 4, a); R(c, x + 3, y, 7, 3, a); }
  if (wall.pat === 'brick') for (let y = 0; y < h; y += 6) { R(c, 0, y + 5, W, 1, a); for (let x = (y / 6 % 2) * 6; x < W; x += 12) R(c, x, y, 1, 5, a); }
  if (wall.pat === 'plank') for (let x = 0; x < W; x += 10) { R(c, x, 0, 1, h, a); R(c, x + 4, (rnd(x) * h) | 0, 1, 3, a); }
  if (wall.pat === 'stars') for (let i = 0; i < 30; i++) { const x = rnd(i) * W, y = rnd(i + 50) * (h - 6); R(c, x, y, 1, 1, a); if (i % 4 === 0) { R(c, x - 1, y, 3, 1, a); R(c, x, y - 1, 1, 3, a); } }
  // 踢脚线
  R(c, 0, h - 4, W, 4, shade(wall.base, -0.25)); R(c, 0, h - 4, W, 1, shade(wall.base, 0.1)); R(c, 0, h, W, 1, INK);
}

function drawFloor(c, floor, y0 = WALL_ROWS * T + 1, end = H) {
  const h = end - y0;
  R(c, 0, y0, W, h, floor.base);
  const a = floor.alt;
  if (floor.pat === 'plank') for (let y = y0; y < end; y += 6) { R(c, 0, y + 5, W, 1, a); for (let x = (rnd(y) * 30) | 0; x < W; x += 30) R(c, x, y, 1, 5, a); }
  if (floor.pat === 'check') for (let y = y0; y < end; y += 8) for (let x = ((y - y0) / 8 % 2) * 8; x < W; x += 16) R(c, x, y, 8, 8, a);
  if (floor.pat === 'tile') for (let y = y0; y < end; y += 16) for (let x = 0; x < W; x += 16) { R(c, x, y, 16, 1, a); R(c, x, y, 1, 16, a); R(c, x + 2, y + 2, 2, 1, '#ffffff55'); }
  if (floor.pat === 'carpet') for (let i = 0; i < 260; i++) R(c, rnd(i) * W, y0 + rnd(i + 999) * h, 1, 1, a);
  if (floor.pat === 'grass') for (let i = 0; i < 200; i++) { const x = rnd(i) * W, y = y0 + rnd(i + 7) * h; R(c, x, y, 1, 2, a); if (i % 23 === 0) R(c, x, y, 2, 2, i % 2 ? '#fff6a0' : '#e6a9bb'); }
  // 墙脚阴影
  R(c, 0, y0, W, 2, 'rgba(0,0,0,.12)');
}

/* ---------------- 家具 ----------------
   每个函数参数：(c, px, py, f, t)，px/py 是占地格子左上角像素，
   高家具会往上画超出占地格；f 是家具实例（f.active 表示有人在用，f.occ 是躺/坐上去的小人回调） */
const WOOD = '#ae7856', WOOD_L = '#d7a77a', WOOD_D = '#785247';

function drawBed(c, x, y, f, double, linen = double ? '#cf849a' : '#9e92b6') {
  const w = double ? 48 : 32;
  if (double && cottageArtReady()) {
    contactShadow(c, x + 1, y + 30, 46);
    drawCottageSprite(c, 'bigbed', x + 1, y - 1, 46, 33);
    if (f?.occ) {
      for (const [slot, center] of [13, 35].entries()) f.occ(slot, x + center, y + 18);
      const [sx, sy, sw, sh] = COTTAGE_SPRITES.bigbed, quiltStart = 47;
      c.save();
      c.imageSmoothingEnabled = true;
      c.drawImage(cottageAtlas, sx, sy + quiltStart, sw, sh - quiltStart,
        x + 1, y - 1 + 33 * quiltStart / sh, 46, 33 * (sh - quiltStart) / sh);
      c.restore();
    }
    return;
  }
  const edge = '#623f46', walnut = '#a06d58', honey = '#d9a386';
  const hi = shade(linen, .13), dark = shade(linen, -.15);
  contactShadow(c, x + 1, y + 30, w - 2);
  bevel(c, x + 2, y + 3, w - 4, 26, walnut, edge);
  bevel(c, x + 6, y + 5, w - 12, 11, '#b48369', edge);
  R(c, x + 8, y + 6, w - 16, 1, honey);
  for (const post of [x + 2, x + w - 6]) {
    bevel(c, post, y + 2, 4, 30, walnut, edge);
    R(c, post + 1, y + 3, 2, 2, honey);
  }
  bevel(c, x + 3, y + 12, w - 6, 17, '#fff1dc', '#ab7c78');
  for (const [slot, center] of (double ? [13, 35] : [16]).entries()) {
    bevel(c, x + center - 8, y + 13, 16, 7, '#fbe5d5', '#b78c87');
    R(c, x + center - 6, y + 14, 11, 2, '#fff4e6');
    detail(c, x + center - 6, y + 18, 11, .5, '#d7afa0');
    f?.occ?.(slot, x + center, y + 19);
  }
  bevel(c, x + 2, y + 20, w - 4, 10, linen, dark);
  R(c, x + 4, y + 21, w - 8, 1, hi);
  for (let row = 0; row < 6; row++) {
    for (let px = 4; px < w - 4; px++) {
      const phase = (px + row) % 8, opposite = (px - row + 8) % 8;
      if (phase === 0 || opposite === 0) R(c, x + px, y + 22 + row, 1, 1, dark);
      else if (phase === 1 || opposite === 7) detail(c, x + px, y + 22 + row, .5, .5, hi);
    }
  }
  R(c, x + 4, y + 29, w - 8, 1, dark);
  R(c, x + 4, y + 30, w - 8, 1, honey);
}

const DRAW = {
  bed(c, x, y, f) { drawBed(c, x, y, f, false); },
  bigbed(c, x, y, f) { drawBed(c, x, y, f, true); },

    bevel(c, x + 6, y - 8, 20, 11, '#8db4a4', shadow);
    R(c, x + 8, y - 7, 16, 1, light);
    detail(c, x + 15.5, y - 6, .5, 6, shadow);
    bevel(c, x + 3, y + 2, 26, 11, shadow, edge);
    for (const seat of [x + 6, x + 16]) {
      bevel(c, seat, y + 1, 10, 7, '#a8c5b3', shadow);
      detail(c, seat + 2, y + 2, 6, .5, '#d4dfc6');

    for (const arm of [x, x + 25]) {
      bevel(c, arm + 1, y, 5, 11, body, edge);
      bevel(c, arm, y - 3, 7, 8, body, edge);
      bevel(c, arm + 1, y - 2, 5, 6, light, shadow);
      detail(c, arm + 2, y - .5, 3, 2.5, shadow);
      detail(c, arm + 2.5, y, 2, .5, '#d4dfc6');
      detail(c, arm + 3.5, y + .5, .5, 1, body);

  chair(c, x, y) {

    box(c, x + 2, y + 2, 12, 6, WOOD_L);
    R(c, x + 3, y + 8, 2, 7, WOOD_D); R(c, x + 11, y + 8, 2, 7, WOOD_D);

  table(c, x, y) {

    }
    bevel(c, x, y - 4, 32, 11, WOOD, WOOD_D);

    detail(c, x + 2, y + 3, 28, .5, '#efc396');

    bevel(c, x + 6, y - 3, 8, 5, '#fff4de', '#c4a78e');
    R(c, x + 8, y - 2, 4, 2, '#e7ae69');
    bevel(c, x + 21, y - 6, 5, 7, '#ce8d93', '#9b6673');
    detail(c, x + 26, y - 4.5, 1.5, 2.5, '#9b6673');
    detail(c, x + 22, y - 5, 2, .5, '#f0bcab');
  },
  fridge(c, x, y) {
    contactShadow(c, x + 1, y + 14, 14);
    bevel(c, x + 1, y - 18, 14, 33, '#eae8df', '#8e7d83');
    R(c, x + 3, y - 17, 9, 1, '#fffbec');

// 家具在 y 方向的视觉顶部（用于选中高亮、图标裁切）
const TALL = { sofa: 10, chair: 9, table: 6, fridge: 18, stove: 12, shelf: 22, tv: 17, arcade: 18, piano: 14, bath: 9, plant: 18, lamp: 21, catbed: 0 };

// 把一件家具画成调色板里的小图标
function furnitureIcon(id, size = 56, props = {}) {
  const d = FURNITURE[id], top = d.layer ? 0 : (TALL[id] || 0);
  const pw = d.w * T, ph = d.h * T + top;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size * PIXEL_SCALE;
  cv.style.width = cv.style.height = size + 'px';
  const c = cv.getContext('2d');
  c.imageSmoothingEnabled = false;
  const tmp = document.createElement('canvas');
  tmp.width = pw * PIXEL_SCALE;
  tmp.height = ph * PIXEL_SCALE;
  const tc = tmp.getContext('2d');
  tc.scale(PIXEL_SCALE, PIXEL_SCALE);
  DRAW[id](tc, 0, top, { color: null, ...props }, 0);
  const s = Math.min(size / pw, size / ph);
  const scale = s >= 1 ? Math.floor(s) : s;
  const w = Math.round(pw * PIXEL_SCALE * scale), h = Math.round(ph * PIXEL_SCALE * scale);
  c.drawImage(tmp, Math.floor((cv.width - w) / 2), Math.floor((cv.height - h) / 2), w, h);
  return cv;
}

function swatchIcon(spec, isWall, size = 56) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const c = cv.getContext('2d');
  c.save(); c.translate(0, isWall ? 0 : -(WALL_ROWS * T + 1));
  isWall ? drawWall(c, spec) : drawFloor(c, spec);
  c.restore();
  cv.style.width = cv.style.height = size + 'px';
  return cv;
}

/* o: { dir, frame, pose: stand|walk|sit|lift|dance|head, hop, blink, happy } */
function drawDoll(c, cx, by, L, o = {}) {

    blocks(C.skin, [[7, 9, 16, 2], [6, 11, 18, 7], [7, 18, 16, 3], [9, 21, 12, 1]]);

  drawDollAccessory(px, blocks, L, C, side, back);

function drawDollAccessory(px, blocks, L, C, side, back) {

    px(14, 0, 2, 1, '#cd8296');

}

// 给 DOM 里的小头像/试衣间画一张小人
const portraitSize = new WeakMap();

function dollPortrait(cv, L, dir = 'down', frame = 0, pose = 'stand') {
  if (!portraitSize.has(cv)) {
    portraitSize.set(cv, [cv.width, cv.height]);
    cv.width *= PIXEL_SCALE;
    cv.height = (cv.height + 4) * PIXEL_SCALE;
  }
  const [w, h] = portraitSize.get(cv);
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  c.save();
  c.scale(PIXEL_SCALE, PIXEL_SCALE);
  drawDoll(c, w / 2, h + 3, L, { dir, frame, pose, happy: true });
  c.restore();
}

function randomLook() {
  const keys = o => Object.keys(o), r = n => (Math.random() * n) | 0;
  const top = pick(keys(OUTFIT.top));
  return {
    skin: r(OUTFIT.skin.length), hair: pick(keys(OUTFIT.hair)), hairColor: r(OUTFIT.hairColor.length),
    top, topColor: r(OUTFIT.clothColor.length), bottom: pick(keys(OUTFIT.bottom)), bottomColor: r(OUTFIT.clothColor.length),
    shoes: r(OUTFIT.shoes.length), acc: pick(keys(OUTFIT.acc)),
  };
}

<script>
// 所有声音都用 WebAudio 振荡器和噪声现场合成，没有任何音频文件
const SFX = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let on = false, musicTimer = null, nextNote = 0, step = 0;
  let rainWanted = false, rainSrc = null, rainGain = null;

  // 下雨时的沙沙声：一段循环的带通白噪声
  function updateRain() {
    if (on && rainWanted && !rainSrc) {
      rainSrc = ctx.createBufferSource(); rainSrc.buffer = noiseBuf; rainSrc.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.6;
      rainGain = ctx.createGain(); rainGain.gain.value = 0.0001; rainGain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 1.5);
      rainSrc.connect(f); f.connect(rainGain); rainGain.connect(master); rainSrc.start();
    } else if ((!on || !rainWanted) && rainSrc) {
      rainSrc.stop(); rainSrc = null;
    }
  }

  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
    // 一秒白噪声，用来做“噗”“沙沙”的声音
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  const hz = n => 440 * Math.pow(2, (n - 69) / 12); // MIDI 音高 → 频率

  function tone(freq, t, dur, type = 'square', vol = 0.2, bus = sfxBus, slide = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.02);
  }

  function noise(t, dur, vol = 0.2, freq = 1200, q = 1) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.02);
  }

  const SOUNDS = {
    click: t => tone(hz(84), t, 0.05, 'square', 0.08),
    pop: t => tone(hz(79), t, 0.08, 'sine', 0.18, sfxBus, 1.6),
    place: t => { tone(hz(45), t, 0.12, 'triangle', 0.35, sfxBus, 0.6); noise(t, 0.08, 0.15, 400); },
    pick: t => tone(hz(67), t, 0.1, 'triangle', 0.2, sfxBus, 1.5),
    trash: t => { noise(t, 0.25, 0.3, 900, 0.7); tone(hz(60), t, 0.2, 'square', 0.08, sfxBus, 0.4); },
    deny: t => { tone(hz(50), t, 0.09, 'square', 0.1); tone(hz(47), t + 0.1, 0.12, 'square', 0.1); },
    lift: t => tone(hz(72), t, 0.18, 'sine', 0.2, sfxBus, 2),
    drop: t => { tone(hz(62), t, 0.1, 'sine', 0.2, sfxBus, 0.5); noise(t + 0.05, 0.05, 0.1, 500); },
    love: t => [76, 79, 84].forEach((n, i) => tone(hz(n), t + i * 0.07, 0.18, 'triangle', 0.18)),
    eat: t => [0, 0.12, 0.24].forEach(d => noise(t + d, 0.06, 0.18, 2500, 3)),
    cook: t => noise(t, 0.4, 0.08, 4000, 0.5),
    piano: t => { const sc = [60, 62, 64, 67, 69, 72]; tone(hz(sc[(Math.random() * 6) | 0]), t, 0.5, 'triangle', 0.2); },
    game: t => { const n = 72 + ((Math.random() * 12) | 0); tone(hz(n), t, 0.06, 'square', 0.07); tone(hz(n + 7), t + 0.06, 0.06, 'square', 0.07); },
    splash: t => noise(t, 0.3, 0.15, 1500, 0.8),
    meow: t => tone(hz(81), t, 0.3, 'sawtooth', 0.06, sfxBus, 0.75),
    chat: t => { for (let i = 0; i < 3; i++) tone(hz(70 + ((Math.random() * 8) | 0)), t + i * 0.07, 0.05, 'square', 0.05); },
    snore: t => noise(t, 0.6, 0.05, 300, 1),
    step: t => noise(t, 0.03, 0.04, 2000, 2),
    newday: t => [72, 76, 79, 84].forEach((n, i) => tone(hz(n), t + i * 0.1, 0.25, 'triangle', 0.15)),
    open: t => [67, 72].forEach((n, i) => tone(hz(n), t + i * 0.06, 0.1, 'triangle', 0.15)),
  };

  // 背景音乐：C–Am–F–G 的和弦循环，三角波低音 + 方波琶音 + 偶尔的旋律
  const CHORDS = [[48, 52, 55, 60], [45, 48, 52, 57], [41, 45, 48, 53], [43, 47, 50, 55]];
  const MELODY = [76, 0, 79, 0, 76, 74, 72, 0, 72, 0, 74, 76, 74, 0, 0, 0,
                  77, 0, 76, 0, 74, 72, 69, 0, 71, 0, 72, 74, 72, 0, 0, 0];
  function schedule() {
    const night = typeof G !== 'undefined' && G.night;
    const spb = night ? 0.28 : 0.2; // 每个十六分音符的秒数，晚上慢一点
    while (nextNote < ctx.currentTime + 0.3) {
      const chord = CHORDS[Math.floor(step / 16) % 4], s = step % 16;
      if (s % 8 === 0) tone(hz(chord[0] - 12), nextNote, spb * 7, 'triangle', 0.32, musicBus);
      if (s % 2 === 0) tone(hz(chord[(s / 2) % 4] + 12), nextNote, spb * 1.6, night ? 'sine' : 'square', night ? 0.08 : 0.035, musicBus);
      const m = MELODY[step % 32];
      if (m && !night) tone(hz(m), nextNote, spb * 1.8, 'triangle', 0.09, musicBus);
      if (!night && s % 4 === 2) noise(nextNote, 0.03, 0.03, 6000, 1);
      nextNote += spb; step++;
    }
  }

  return {
    get on() { return on; },
    setRain(v) { rainWanted = v; if (ctx) updateRain(); },
    play(name) {
      if (!on || !ctx || !SOUNDS[name]) return;
      SOUNDS[name](ctx.currentTime + 0.005);
    },
    toggle() {
      init();
      on = !on;
      if (on) {
        ctx.resume();
        nextNote = ctx.currentTime + 0.1;
        musicTimer = setInterval(schedule, 100);
        SOUNDS.open(ctx.currentTime);
      } else { clearInterval(musicTimer); musicTimer = null; }
      updateRain();
      return on;
    },
  };
})();

<script>
// Deterministic NPC memory. Store the ledger with the game's save data.
const NPCMemory = (() => {
  const SHORT_LIMIT = 32;
  const LONG_LIMIT = 50;
  const WEIGHTS = { emotion: .35, relationship: .2, impact: .25, novelty: .1, goal: .1 };
  const ledgers = new WeakMap();
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const empty = () => ({ short: [], long: [], life: [] });

  function ledger(world) {
    return world.npcMemory ||= { version: 1, sequence: 0, events: {}, people: {} };
  }

  function index(data, person) {
    if (!ledgers.has(data)) ledgers.set(data, new Map());
    const people = ledgers.get(data);
    if (!people.has(person)) {
      const bySubject = new Map();
      const memory = Object.hasOwn(data.people, person) ? data.people[person] : empty();
      for (const entry of [...memory.short, ...memory.long]) {
        if (!bySubject.has(entry.subject)) bySubject.set(entry.subject, []);
        bySubject.get(entry.subject).push(entry);
      }
      people.set(person, bySubject);
    }
    return people.get(person);
  }

  function promote(memory, entry) {
    memory.long.push(entry);
    memory.long.sort((a, b) => b.importance - a.importance || b.sequence - a.sequence);
    memory.long.length = Math.min(LONG_LIMIT, memory.long.length);
    memory.life = memory.long.slice(0, 8).map(({ sources, interpretation }) => ({
      sources, interpretation
    }));
  }

  function remember(data, event, view) {
    const person = String(view.person);
    if (!Object.hasOwn(data.people, person)) {
      Object.defineProperty(data.people, person, { value: empty(), enumerable: true });
    }
    const memory = data.people[person];
    const subject = String(view.subject);
    const related = index(data, person).get(subject) || [];
    const confidence = clamp(view.confidence ?? 1, 0, 1);
    const signals = {
      emotion: Math.abs(view.emotion) * 100,
      relationship: view.relationship ?? 50,
      impact: view.impact ?? 50,
      novelty: related.some(entry => entry.type === event.type) ? 15 : 90,
      goal: view.goal ?? 50
    };
    const importance = Math.round(Object.entries(WEIGHTS).reduce(
      (total, [key, weight]) => total + clamp(signals[key], 0, 100) * weight, 0));
    if (importance < 25) return;
    const entry = {
      sources: [event.id], sequence: event.sequence, time: event.time,
      type: event.type, subject, interpretation: view.interpretation,
      emotion: view.emotion, confidence, importance, channel: view.channel || 'participant'
    };
    if (importance >= 72) {
      promote(memory, entry);
    } else {
      memory.short.push(entry);
      const similar = memory.short.filter(item =>
        item.subject === subject && item.type === event.type &&
        Math.sign(item.emotion) === Math.sign(entry.emotion));
      if (similar.length >= 3) {
        const merged = {
          ...entry, sources: similar.flatMap(item => item.sources),
          importance: Math.max(60, ...similar.map(item => item.importance)),
          emotion: similar.reduce((sum, item) => sum + item.emotion, 0) / similar.length,
          confidence: Math.min(...similar.map(item => item.confidence)),
          interpretation: entry.interpretation,
          occurrences: similar.length
        };
        memory.short = memory.short.filter(item => !similar.includes(item));
        promote(memory, merged);
      }
      while (memory.short.length > SHORT_LIMIT) {
        memory.short.sort((a, b) => a.importance - b.importance || a.sequence - b.sequence);
        const oldest = memory.short.shift();
        if (oldest.importance >= 62) promote(memory, oldest);
      }
    }
    ledgers.get(data).delete(person);
  }

  function record(world, facts, views) {
    const data = ledger(world);
    const sequence = facts.sequence ?? data.sequence + 1;
    // Events arrive in order. The watermark also rejects duplicates after compaction.
    if (sequence <= data.sequence) return null;
    if (sequence !== data.sequence + 1) throw new Error('NPC memory event sequence gap');
    const event = { ...facts, id: `event-${sequence}`, sequence };
    data.sequence = sequence;
    data.events[event.id] = event;
    const observers = new Set();
    for (const view of views) {
      const person = String(view.person);
      if (observers.has(person)) continue;
      observers.add(person);
      remember(data, event, view);
    }
    // Keep all retained memory sources and the most recent objective events.
    if (sequence % 64 === 0) {
      const retained = new Set(Object.values(data.people).flatMap(memory =>
        [...memory.short, ...memory.long].flatMap(entry => entry.sources)));
      for (const [id, source] of Object.entries(data.events)) {
        if (source.sequence <= sequence - 64 && !retained.has(id)) delete data.events[id];
      }
    }
    return event;
  }

  function influence(world, person, subject) {
    if (!world.npcMemory) return 0;
    const entries = index(world.npcMemory, String(person)).get(String(subject)) || [];
    return clamp(entries.reduce((total, entry) =>
      total + entry.emotion * entry.confidence * entry.importance / 100 *
        (entry.importance >= 60 ? 2 : 1), 0), -4, 4);
  }

  function recall(world, person) {
    const memory = world.npcMemory?.people[String(person)];
    return memory ? [...memory.short, ...memory.long].sort((a, b) => b.sequence - a.sequence) : [];
  }

  return { record, influence, recall };
})();

<script>
/* Shared snapshot storage. The primary key remains readable by older builds.
   v2: older saves are migrated instead of rejected, and a few dated snapshots are kept for rewinding. */
const SaveManager = (() => {
  const version = 2;
  const SNAPSHOTS = 4;
  function decode(raw, valid, migrate) {
    try {
      let data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return null;
      const from = data.saveVersion ?? 1;
      if (from > version) return null;
      if (from < version && migrate) data = migrate(data, from);
      if (!data || !valid(data)) return null;
      return data;
    } catch {
      return null;
    }
  }

  function load(storage, key, valid, migrate) {
    try {
      return decode(storage.getItem(key), valid, migrate) || decode(storage.getItem(key + ':backup'), valid, migrate);
    } catch {
      return null;
    }
  }

  function save(storage, key, data, valid) {
    try {
      const next = JSON.stringify({ ...data, saveVersion: version });
      if (!decode(next, valid)) return false;
      const previous = storage.getItem(key);
      if (previous === next) return true;
      if (decode(previous, valid)) storage.setItem(key + ':backup', previous);
      storage.setItem(key, next);
      return true;
    } catch {
      return false;
    }
  }

  function readSnapshots(storage, key) {
    try {
      const list = JSON.parse(storage.getItem(key + ':snapshots') || '[]');
      return Array.isArray(list) ? list.filter(entry => entry && typeof entry.raw === 'string') : [];
    } catch {
      return [];
    }
  }
  // Keep one snapshot per label. Oldest go first when storage is full.
  function snapshot(storage, key, data, valid, meta = {}) {
    const raw = JSON.stringify({ ...data, saveVersion: version });
    if (!decode(raw, valid)) return false;
    let list = readSnapshots(storage, key).filter(entry => entry.label !== meta.label);
    list.push({ ...meta, savedAt: Date.now(), raw });
    list = list.slice(-SNAPSHOTS);
    while (list.length) {
      try {
        storage.setItem(key + ':snapshots', JSON.stringify(list));
        return true;
      } catch {
        list.shift();
      }
    }
    return false;
  }
  function snapshots(storage, key) {
    return readSnapshots(storage, key).map(({ raw, ...meta }, index) => ({ ...meta, index }));
  }
  function restore(storage, key, index, valid, migrate) {
    const entry = readSnapshots(storage, key)[index];
    return entry ? decode(entry.raw, valid, migrate) : null;
  }

  return { load, save, snapshot, snapshots, restore, version };
})();

<script>

const PAPER_EVENTS = [

  [/邻居.*(面包|螺丝刀|回赠|约.+家里|吃完一顿饭)/, '邻里往来', '🍞', 65],
  [/派对|邀请.+来玩|参加院子野餐/, '串门聚会', '🎉', 68],
  [/给饿着的|帮忙付了|终于去找了份工作|画卖出去了/, '生活片段', '🌷', 63],

  [/一起荡秋千|一起拼拼图|一起在院子里野餐|一起吃饭|下了一局棋|弹起了钢琴/, '一起玩', '🎵', 54],
];

function paperLogStory(text) {
  const match = PAPER_EVENTS.find(([pattern]) => pattern.test(text));
  if (!match) return null;
  const [, label, icon, score] = match;
  return { label, icon, score, text: text.replace(/^\s*[^\p{L}\p{N}]+/u, '').trim() };
}

function paperCast(text) {
  // Prefer the longest name at each position, so 小桃 is not counted again as 桃.
  const people = [...new Map([...(G.community?.friends || []), ...G.dolls].map(d => [d.pid, d])).values()]
    .filter(d => d.name && d.look).sort((a, b) => b.name.length - a.name.length);
  const names = [...new Set(people.map(d => d.name))];
  const cast = [];
  for (let i = 0; i < text.length && cast.length < 3; i++) {
    const name = names.find(n => text.startsWith(n, i));
    if (!name) continue;
    const matches = people.filter(d => d.name === name);
    if (matches.length === 1 && !cast.some(d => d.name === name)) cast.push({ name, look: { ...matches[0].look } });
    i += name.length - 1;
  }
  return cast;
}

// Only a resolved player introduction can seed a follow-up. Matching names or
// later activity logs alone never establish a link.
function recordPaperMeeting(a, b, kind, outcome) {
  const pair = `${a.name}和${b.name}`;
  const action = { chat: '聊了起来', joke: '开起了玩笑', hug: '抱了抱对方', kiss: '亲了亲对方', argue: '吵了一架', flirt: '聊起了彼此的心意' }[kind];
  const result = {
    together: ['感情动态', '💕', `${pair}确认了恋人关系。`, 110],
    breakup: ['关系转折', '💔', `${pair}分手了。`, 114],
    rejected: ['感情动态', '💌', `${a.name}的表白没被${b.name}接受。`, 96],
    argued: ['小屋插曲', '💢', `${pair}被拉到一起后，吵了一架。`, 66],
  }[outcome];
  const moments = (G.paperMoments ||= []);
  for (const old of moments) if (old.ids.includes(a.pid) && old.ids.includes(b.pid)) old.pending = false;
  const steps = [`你把${a.name}拖到了${b.name}身边。`, `${pair}${action}。`];
  if (result && outcome !== 'argued') steps.push(result[2]);
  moments.push({
    ids: [a.pid, b.pid], people: [a, b].map(d => ({ name: d.name, look: { ...d.look } })),
    month: G.day, until: absNow() + 180, pending: outcome !== 'rejected' && outcome !== 'argued' && outcome !== 'breakup',
    steps, result,
  });
  if (moments.length > 24) moments.shift();
}

const PAPER_SHARED_USES = new Set(['swing', 'puzzle', 'picnic', 'chess']);
const paperMomentPending = moment => moment.pending && moment.month === G.day && absNow() <= moment.until;

function paperFollowup(d, f) {
  if (!PAPER_SHARED_USES.has(FURNITURE[f.id].use) || !f.users.length) return null;
  return G.paperMoments?.findLast(moment => paperMomentPending(moment) && moment.ids.includes(d.pid) &&
    f.users.some(other => other !== d && other.state === 'act' && other.act?.furn === f && moment.ids.includes(other.pid))) || null;
}

function completePaperFollowup(d, f) {
  const moment = d.act.paperMoment;
  if (!moment || paperFollowup(d, f) !== moment) return;
  const pair = moment.people.map(person => person.name).join('和');
  const activity = ACT_NAMES[d.act.type];
  moment.steps.push(`${pair}后来又一起${activity}。`);
  moment.result ||= ['一起玩', '✨', `被你拉到一起后，${pair}又相约${activity}。`, 84];
  moment.pending = false;
}

function selectPaperStories(candidates) {
  const stories = [];
  for (const story of candidates.sort((a, b) => b.score - a.score)) {
    if (stories.some(s => s.label === story.label || s.text === story.text)) continue;
    const { score, ...content } = story;
    stories.push(content);
    if (stories.length === 3) break;
  }
  return stories.length ? stories : [{ label: '', icon: '🌙', text: '小屋平静地过了一个月。' }];
}

function paperIssue(saved) {
  if (typeof saved !== 'string') return saved;
  const [month, ...lines] = formatSavedPaper(saved).split('\n');
  const candidates = [];
  for (const line of lines) {
    if (line.startsWith('头条　')) candidates.push({ label: '头条', icon: '📰', score: 105, text: line.slice(3) });
    else if (line.startsWith('【特别版】')) candidates.push({ label: '特别版', icon: '✨', score: 80, text: line.slice(5) });
    else if (/^(新发现|小屋趣闻|集体用餐)　/.test(line)) {
      const [label, text] = line.split('　', 2);
      candidates.push({ label, icon: '✨', score: 40, text });
    } else if (!line.includes('　')) {
      const story = paperLogStory(line);
      if (story) candidates.push(story);
    }
  }
  return { month, stories: selectPaperStories(candidates).map(story => ({ ...story, people: paperCast(story.text) })) };
}

function finishHouseMonth() {
  const monthLog = G.log.filter(entry => entry.d === G.day);
  const candidates = monthLog.slice().reverse().map(e => paperLogStory(e.text)).filter(Boolean);
  const residents = G.dolls.filter(d => !d.guest && d.state !== 'away');

    const [label, icon, text, score] = moment.result;
    candidates.push({ label, icon, text, score, people: moment.people, steps: [...moment.steps] });

  G.paperMoments = [];

  // 等玩家空闲时由主循环打开；顶栏按钮会提示有新一期，也可以手动点开
  if (document.getElementById('paperAuto')?.checked) {

    else showHousePaper();

}

function shareHouseNews(speaker, listener) {

  const source=NPCMemory.recall(G,speaker.pid).find(entry=>

    !heard.some(memory=>memory.sources.some(id=>id===entry.sources[0]||G.npcMemory.events[id]?.original===entry.sources[0])));
  if(!source)return;
  const misunderstood=Math.random()<.25;
  // 听岔了：不是记不清，而是记成了另一件事、冤枉到别人头上
  const wrong=misunderstood&&typeof misheardRumor==='function'?misheardRumor(speaker,listener,source):null;
  NPCMemory.record(G,{type:'rumor',time:now,participants:[speaker.pid,listener.pid],original:source.sources[0],outcome:wrong?'misheard':'retold'},[
    {person:listener.pid,subject:wrong?wrong.subject:source.subject,channel:'hearsay',confidence:misunderstood?.35:.65,
      emotion:wrong?-.5:source.emotion,impact:65,interpretation:wrong?wrong.interpretation:misunderstood?'听说有人闹得很厉害，但详情我也不确定。':`听${speaker.name}说：${source.interpretation}`}
  ]);
  if(!wrong&&typeof heardRumor==='function')heardRumor(listener,source.subject,source.emotion);
  addLog(wrong?`💬 ${speaker.name} 向 ${listener.name} 说起一件旧事，${listener.name} 却听成了「${wrong.claim}」`:`💬 ${speaker.name} 向 ${listener.name} 说起了一件旧事`);
}

<script>
// 信任、醋意、饭搭子 / 游戏搭子、“爱美”特质、卧室隐私和会传错的谣言。
// 友好度和恋爱度是两人共享的；信任和醋意是单向的：团子可以信任阿懒，阿懒却未必信任团子。

const BOND_TAGS = { meal: { icon: '🍚', name: '饭搭子' }, game: { icon: '🎮', name: '游戏搭子' } };
const BOND_TAG_AT = 3;                 // 一起吃饭 / 打游戏满 3 次就成了搭子
const PRIVATE_ROOMS = new Set(['bed', 'upperBedroom']);
const clampBond = (v, min, max) => Math.max(min, Math.min(max, v));
const bondKey = (a, b) => a.pid + '>' + b.pid;

function trustOf(a, b) { return (G.trust || {})[bondKey(a, b)] || 0; }
function addTrust(a, b, delta) {
  if (!a || !b || a === b || !delta) return;
  G.trust ||= {};
  const k = bondKey(a, b);
  G.trust[k] = Math.round(clampBond((G.trust[k] || 0) + delta, -100, 100) * 10) / 10;
}
function jealousyOf(a, b) { return (G.jealousy || {})[bondKey(a, b)] || 0; }
function addJealousy(a, b, delta) {
  if (!a || !b || a === b) return;
  G.jealousy ||= {};
  const k = bondKey(a, b);
  G.jealousy[k] = clampBond((G.jealousy[k] || 0) + delta, 0, 100);
  if (G.jealousy[k] < 1) delete G.jealousy[k];
}
// 醋意会慢慢消下去，大约一天降 40 点
function bondsTick(dt) {
  if (!G.jealousy) return;
  for (const k of Object.keys(G.jealousy)) {
    G.jealousy[k] -= dt * 0.11;
    if (G.jealousy[k] <= 0) delete G.jealousy[k];
  }
}
function trustWord(v) {
  if (v >= 40) return '很信任';
  if (v >= 10) return '信任';
  if (v <= -40) return '很提防';
  if (v <= -10) return '不太信任';
  return '';
}

/* ---------- 搭子：一起吃饭、一起打游戏会慢慢变成习惯 ---------- */
function countTogether(kind, a, b) {
  if (!a || !b || a === b || a.guest || b.guest) return;
  G.habits ||= {};
  const store = G.habits[kind] ||= {};
  const k = relKey(a, b);
  store[k] = (store[k] || 0) + 1;
  const r = rel(a, b);
  r.tags ||= {};
  if (store[k] < BOND_TAG_AT || r.tags[kind]) return;
  r.tags[kind] = true;
  const { icon, name } = BOND_TAGS[kind];
  HOOK.toast(`${icon} ${a.name} 和 ${b.name} 成了${name}`);
  addLog(`${icon} ${a.name} 和 ${b.name} 成了${name}`);
  addTrust(a, b, 6); addTrust(b, a, 6);
  NPCMemory.record(G, { type: 'habit-' + kind, time: absNow(), participants: [a.pid, b.pid], outcome: kind }, [
    { person: a.pid, subject: b.pid, emotion: .5, impact: 70, interpretation: `我和${b.name}成了${name}` },
    { person: b.pid, subject: a.pid, emotion: .5, impact: 70, interpretation: `我和${a.name}成了${name}` }
  ]);
}
const bondTagged = (a, b, kind) => !!G.rel[relKey(a, b)]?.tags?.[kind];
function bondTagsText(r) {
  return Object.keys(r.tags || {}).filter(k => BOND_TAGS[k]).map(k => BOND_TAGS[k].icon + ' ' + BOND_TAGS[k].name).join(' · ');
}
// 一顿饭只记一次：同桌的人两两算一次
function noteSharedMeal(d, table) {
  const mates = table.users.filter(o => o !== d && o.state === 'act' && o.act?.type === 'meal');
  for (const o of mates) countTogether('meal', d, o);
  if (mates.length >= 2) {
    G.daily.groupMeal = (G.daily.groupMeal || 0) + 1;
    if (!table.groupLogAt || table.groupLogAt < absNow() - 300) {
      table.groupLogAt = absNow();
      addLog(`🍽 ${[d, ...mates].map(o => o.name).join('、')} 围着大餐桌一起吃饭`);
    }
  }
}
// 有搭子正在用这件家具时，更想凑过去
function companionBonus(d, f, use) {
  const kind = use === 'meal' ? 'meal' : use === 'game' ? 'game' : null;
  if (!kind) return 0;
  return f.users.some(o => o !== d && bondTagged(d, o, kind)) ? 22 : 0;
}

/* ---------- 爱美：镜子前停留更久，照完心情更好 ---------- */
function isVain(d) {
  if (typeof d.vain === 'boolean') return d.vain;
  let h = 0;
  for (const c of String(d.pid)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  d.vain = ['romantic', 'social'].includes(d.persona) ? h % 10 < 6 : h % 10 < 2;
  return d.vain;
}
function groomBonus(d) {
  if (isVain(d)) return 30;
  return ['romantic', 'social', 'genki'].includes(d.persona) ? 8 : 0;
}
function afterGroom(d) {
  if (!isVain(d)) return;
  d.needs.fun = Math.min(100, d.needs.fun + 10);
  if (Math.random() < 0.5) setTimeout(() => d.act && say(d, pick(['今天也很好看✨', '发型完美！', '再照一下下'])), 1600);
}

/* ---------- 卧室隐私：关起门来，别人不会进来打扰 ---------- */
const inPrivateRoom = d => d.state !== 'away' && PRIVATE_ROOMS.has(roomOf(d));
function inPrivateRoomTile(f) {
  if (f.y >= FLOOR_SPLIT) return f.x < BX && !(G.bathroom && f.x < BATH_X);
  return f.x < BX;
}
const canDisturb = (d, o) => !inPrivateRoom(o) || roomOf(d) === roomOf(o) || arePartners(d, o);

/* ---------- 钢琴围观：记下本月围得最多的一次 ---------- */
function notePianoCrowd(performer) {
  const act = performer.act;
  if (!act) return;
  act.crowd = (act.crowd || 0) + 1;
  const best = G.daily.crowdMax;
  if (!best || act.crowd > best.count) G.daily.crowdMax = { name: performer.name, count: act.crowd };
}

/* ---------- 谣言：转述时可能听岔，冤枉到另一个人头上 ---------- */
const MISHEARD = ['在背后说别人坏话', '偷偷和别人约会', '把大家的点心吃光了', '故意不理人'];
function misheardRumor(speaker, listener, source) {
  const pool = G.dolls.filter(o => ![speaker, listener].includes(o) && o.pid !== source.subject && !o.guest && o.state !== 'away');
  const wrong = pool.length ? pick(pool) : G.dolls.find(o => o.pid === source.subject);
  if (!wrong) return null;
  const claim = `${wrong.name}${pick(MISHEARD)}`;
  addTrust(listener, wrong, -6);
  G.daily.rumorWrong = (G.daily.rumorWrong || 0) + 1;
  G.daily.rumor = (G.daily.rumor || 0) + 1;
  return { subject: wrong.pid, interpretation: `听${speaker.name}说，${claim}`, claim, wrong };
}
function heardRumor(listener, subjectPid, emotion) {
  const subject = G.dolls.find(o => o.pid === subjectPid);
  if (subject) addTrust(listener, subject, emotion * 6);
  G.daily.rumor = (G.daily.rumor || 0) + 1;
}

/* ---------- 月报：头条、新发现、围观、信任变化、传闻 ---------- */
const DISCOVERY_VERBS = { study: '使用书桌', read: '看书', groom: '照镜子', piano: '弹钢琴', game: '打游戏', cook: '下厨', paint: '画画',
  exercise: '健身', pc: '用电脑', meal: '坐到大餐桌前吃饭', chess: '下棋', tv: '看电视', water: '浇花', cat: '撸猫' };
function trustSnapshot() { return { ...(G.trust || {}) }; }
function housePaperExtras() {
  const stories = [];
  let found = null;
  for (const [kind, verb] of Object.entries(DISCOVERY_VERBS)) {
    for (const [name, count] of Object.entries(G.daily[kind] || {})) {
      const before = G.lastDaily?.[kind]?.[name] || 0;
      if (count >= 3 && before <= 1 && (!found || count > found.count)) found = { name, verb, count };
    }

/* ---------------- 家具与格子 ---------------- */
function addFurniture(id, x, y, saved = {}) {

}
const layerOf = id => FURNITURE[id].layer || 'solid';

function canPlace(id, x, y, ignore) {
  const d = FURNITURE[id], L = layerOf(id);
  if (x < 0 || x + d.w > COLS) return false;
  if (d.outdoor ? y < ROWS + 1 || y + d.h >= YARD_END : y >= ROWS) return false;

  if (L === 'wall') {
    const start = y < 0 ? UPPER_WALL : 0;

function blockedMap() {

  for (let x = 0; x < COLS; x++) { m[x] = []; for (let y = 0; y < YARD_END; y++) m[x][y] = y < WALL_ROWS; }
  for (const f of G.furniture) {

const free = (x, y) => x >= 0 && y >= 0 && x < COLS && y < YARD_END && !BLOCK[x][y];

function nearestFree(x, y, floor) {
  const first = floor === 3 ? ROWS : floor === 2 ? FLOOR_SPLIT : WALL_ROWS;
  const end = floor === 1 ? FLOOR_SPLIT : floor === 2 ? ROWS : YARD_END;
  x = Math.max(0, Math.min(COLS - 1, x)); y = Math.max(first, Math.min(end - 1, y));
  const seen = new Set([x + ',' + y]), q = [[x, y]];
  while (q.length) {
    const [cx, cy] = q.shift();
    if (free(cx, cy)) return { x: cx, y: cy };
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy, k = nx + ',' + ny;
      if (nx < 0 || ny < first || nx >= COLS || ny >= end || seen.has(k)) continue;

}

// BFS 寻路：从 (sx,sy) 走到 goals 里任意一个格子
function findPath(sx, sy, goals) {
  const goalSet = new Set(goals.filter(g => free(g.x, g.y)).map(g => g.x + ',' + g.y));
  if (!goalSet.size) return null;
  const prev = new Map([[sx + ',' + sy, null]]), q = [[sx, sy]];
  while (q.length) {
    const [cx, cy] = q.shift(), k = cx + ',' + cy;
    if (goalSet.has(k)) {
      const path = []; let cur = k;
      while (cur) { const [a, b] = cur.split(',').map(Number); path.unshift({ x: a, y: b }); cur = prev.get(cur); }
      path.shift(); return path;
    }
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]].sort(() => Math.random() - 0.5);
    const neighbors = dirs.map(([dx, dy]) => [cx + dx, cy + dy])
      .filter(([nx, ny]) => !wallBetween(cx, cy, nx, ny));

    if (cx === stairsColumn() && cy === UPPER_LANDING) neighbors.push([cx, LOWER_LANDING]);
    if (yardGate(cx) && cy === FLOOR_SPLIT - 1) neighbors.push([cx, ROWS]);
    if (yardGate(cx) && cy === ROWS) neighbors.push([cx, FLOOR_SPLIT - 1]);
    for (const [nx, ny] of neighbors) {
      const nk = nx + ',' + ny;
      if (!free(nx, ny) || prev.has(nk)) continue;
      prev.set(nk, k); q.push([nx, ny]);
    }
  }
  return null;
}

// 使用家具时站的位置：优先家具正下方，其次左右两侧
function approachTiles(f) {
  const d = FURNITURE[f.id], out = [];
  const end = f.y < FLOOR_SPLIT ? FLOOR_SPLIT : f.y < ROWS ? ROWS : YARD_END;

  if (d.mode === 'on' || !front) for (let j = 0; j < d.h; j++) {

    if (!wallBetween(f.x, y, f.x - 1, y)) out.push({ x: f.x - 1, y });

/* ---------------- 小人 ---------------- */

}

function endAct(d) {
  if (takingStairs(d) || takingYardPath(d)) placeDollAt(d, d.tx, d.ty);

  if (G.community.active && ['visitGather', 'visitStay'].includes(a?.type)) delete G.community.active.reserved[d.pid];

function decide(d) {

    }
