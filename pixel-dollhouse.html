<script>
// Visiting friends keep their identity, relationships and housing application.
const residents = () => G.dolls.filter(d => !d.guest);
const residentLimit = () => LEVELS[G.level].cap;
const communityDoll = pid => G.dolls.find(d => d.pid === pid);

const GET_TOGETHERS = {
  visit: { name: '朋友来访', minutes: 120, icon: '☕', places: ['teaTray', 'sofa', 'table'] },
  tea: { name: '茶点派对', minutes: 175, icon: '🫖', places: ['teaTray', 'table', 'coffee', 'sofa'] },
  music: { name: '音乐派对', minutes: 175, icon: '🎵', places: ['recordPlayer', 'speaker', 'piano', 'ukulele'] },
  games: { name: '游戏派对', minutes: 175, icon: '🎲', places: ['chessTable', 'arcade', 'table'] },
};

Object.assign(ACT_NAMES, { visitGather: '去见朋友', visitStay: '和朋友相聚', visitLeave: '准备回家' });
ACT_LINES.visitStay = ['好久没这么热闹了', '有空再一起玩吧'];

function restoreCommunity(saved) {
  return {
    friends: saved?.friends || [],
    applications: saved?.applications || [],
    active: saved?.active || null,
    lastRoll: saved?.lastRoll || 0,
    nextEventAt: saved?.nextEventAt || 0,
  };
}

function newcomerProfile() {
  const used = new Set([...G.dolls, ...G.community.friends].map(d => d.name));
  const name = NAMES.find(n => !used.has(n)) || `新朋友${G.uid}`;
  return { name, persona: pick(Object.keys(PERSONAS)), job: pick(Object.keys(JOBS)), zodiac: randomZodiac(),
    mbti: randomMbti(), heart: pick(['loyal', 'normal', 'normal', 'fickle']), look: randomLook(),
    gender: Math.random() < .5 ? 'f' : 'm' };
}

function availableHosts() {
  return residents().filter(d => d.state !== 'away' && d.state !== 'lift' && !lying(d));
}

function friendFor(host) {
  let friend = G.community.friends.find(f => f.hostPid === host.pid && !communityDoll(f.pid));
  if (friend) return friend;
  friend = { ...newcomerProfile(), pid: `friend-${host.pid}-${G.uid++}-${absNow() | 0}`, hostPid: host.pid, visits: 0 };
  G.community.friends.push(friend);
  return friend;
}

function gatheringTiles(kind, origin) {
  const style = GET_TOGETHERS[kind];
  const furniture = style.places.map(id => G.furniture.find(f => f.id === id && roomOf({ tx: f.x, ty: f.y }) === 'living')).find(Boolean);
  const anchor = furniture ? { x: furniture.x, y: furniture.y + 1 } : { x: BX + 2, y: WALL_ROWS + 3 };
  const tiles = [];
  for (let y = WALL_ROWS + 1; y < FLOOR_SPLIT; y++) for (let x = BX; x < COLS; x++) {
    if (!free(x, y) || isDoorTile(x, y) || (x === stairsColumn() && y === LOWER_LANDING)) continue;
    tiles.push({ x, y, distance: Math.abs(x - anchor.x) + Math.abs(y - anchor.y) - (y - anchor.y) * 1.5 });
  }
  return tiles.sort((a, b) => a.distance - b.distance).slice(0, 22).filter(tile => findPath(origin.x, origin.y, [tile])).slice(0, 8);
}

function startGetTogether(host, kind) {
  const style = GET_TOGETHERS[kind], community = G.community;
  if (!style || !availableHosts().includes(host) || community.active || absNow() < community.nextEventAt) return false;
  const door = doorTile();
  const entry = free(door.x, door.y) ? door : nearestFree(door.x, door.y, 1);
  if (!entry) return false;
  const tiles = gatheringTiles(kind, entry);
  if (tiles.length < 2 || !findPath(host.tx, host.ty, tiles)) return false;

  const friend = friendFor(host);
  const guest = addDoll({ ...friend, guest: true, tx: entry.x, ty: entry.y,
    needs: { energy: 84, hunger: 80, fun: 74, social: 63, bladder: 90 } });
  const friendship = rel(host, guest);
  if (!friend.visits) friendship.f = 52;
  friend.visits++;
  community.active = { kind, hostPid: host.pid, guestPid: guest.pid, endsAt: absNow() + style.minutes,
    friendshipAtStart: friendship.f, tiles, joined: [], reserved: {} };
  community.nextEventAt = community.active.endsAt + 45;
  guest.think = .5;
  const entrance = doorOf();
  if (entrance) entrance.openT = .8;
  say(guest, '我来串门啦！');
  countHouseActivity('visitors', `${guest.name} · ${style.name}`);
  HOOK.toast(`${style.icon} ${host.name} 邀请 ${guest.name} 来${kind === 'visit' ? '玩' : '参加' + style.name}了`);
  HOOK.select();
  save();
  return true;
}

function joinGetTogether(d) {
  const event = G.community.active;
  if (!event || event.leavingAt || event.joined.includes(d.pid) || d.needs.energy < 34 || d.needs.hunger < 25
    || (d.needs.bladder < 18 && G.furniture.some(f => f.id === 'toilet'))) return false;
  const principal = d.pid === event.hostPid || d.pid === event.guestPid;
  const participants = new Set([...event.joined, ...Object.keys(event.reserved)]);
  const otherCount = [...participants].filter(pid => pid !== event.hostPid && pid !== event.guestPid).length;
  if (!principal && (event.kind === 'visit' || otherCount >= 3
    || (!isE(d) && d.needs.social > 58) || (isE(d) && d.needs.social > 88))) return false;
  if (absNow() + 12 >= event.endsAt) return false;
  const occupied = Object.values(event.reserved);
  const open = event.tiles.filter(tile => !occupied.some(spot => spot.x === tile.x && spot.y === tile.y));
  const spaced = open.filter(tile => !occupied.some(spot => spot.x === tile.x && Math.abs(spot.y - tile.y) < 3));
  let route = null;
  for (const tile of new Set([...spaced, ...open])) {
    route = findPath(d.tx, d.ty, [tile]);
    if (route) break;
  }
  if (!route) return false;
  const target = route.at(-1) || { x: d.tx, y: d.ty };
  event.reserved[d.pid] = target;
  d.act = { type: 'visitGather' };
  d.path = route;
  d.state = route.length ? 'walk' : 'arrive';
  return true;
}

function arriveAtGathering(d) {
  const event = G.community.active;
  if (!event || !event.reserved[d.pid]) { endAct(d); return; }
  const guest = communityDoll(event.guestPid);
  const host = communityDoll(event.hostPid);
  const companion = d === guest ? host : guest;
  if (companion) bump(d, companion, d === guest || d === host ? 4 : 2);
  event.joined.push(d.pid);
  d.state = 'act';
  d.ft = 0;
  const gain = event.kind === 'tea' ? { fun: 9, social: 12, hunger: 9 } : { fun: 11, social: 15 };
  d.act = { type: 'visitStay', t: event.kind === 'visit' ? 12 : 20,
    gain, theme: event.kind, dance: event.kind === 'music' && (isE(d) || d.persona === 'genki') };
  const lines = {
    visit: d === host ? '进来坐，想喝点什么？' : '你们家坐着真舒服',
    tea: '我给大家留了一份点心',
    music: d.act.dance ? '这首歌好适合跳舞！' : '我在旁边听一会儿',
    games: '这局谁先来？我想试试！',
  };
  say(d, lines[event.kind]);
  if (event.kind === 'music' && d === host) SFX.play('piano');
  if (event.kind === 'games') SFX.play('game');
  HOOK.community();
}

function finishGuestDeparture() {
  const event = G.community.active;
  if (!event) return;
  const guest = communityDoll(event.guestPid);
  G.community.active = null;
  if (guest) {
    const entrance = doorOf();
    if (entrance) entrance.openT = .8;
    for (const d of G.dolls) if (d.act && (d === guest || d.act.partner === guest || d.act.target === guest)) {
      endAct(d); d.path = [];
    }
    G.dolls = G.dolls.filter(d => d !== guest);
    if (G.sel === guest.uid) G.sel = null;
    addLog(`👋 ${guest.name} 结束来访，回家了`);
  }
  HOOK.select();
  save();
}

function sendGuestHome(guest) {
  const door = doorTile();
  const entry = free(door.x, door.y) ? door : nearestFree(door.x, door.y, 1);
  const route = entry && findPath(guest.tx, guest.ty, [entry]);
  if (!route?.length) { finishGuestDeparture(); return; }
  if (guest.act) endAct(guest);
  guest.act = { type: 'visitLeave' };
  guest.path = route;
  guest.state = 'walk';
}

function endGetTogether() {
  const community = G.community, event = community.active;
  if (!event || event.leavingAt) return;
  const guest = communityDoll(event.guestPid), host = communityDoll(event.hostPid);
  const friend = community.friends.find(f => f.pid === event.guestPid);
  if (guest && host && friend && event.joined.includes(guest.pid) &&
    (event.joined.includes(host.pid) || rel(guest, host).f >= event.friendshipAtStart + 4)) {
    const friendship = rel(guest, host).f;
    if (friendship >= 53 && guest.needs.fun >= 55 && !community.applications.some(a => a.pid === guest.pid) &&
      Math.random() < (event.kind === 'visit' ? .52 : .68)) {
      community.applications.push({ pid: guest.pid, requestedAt: absNow() });
      HOOK.toast(`📮 ${guest.name} 想搬进小屋，已经留下入住申请`);
    }
  }
  event.leavingAt = absNow() + 50;
  for (const d of G.dolls) if (d.act && ['visitGather', 'visitStay'].includes(d.act.type)) {
    endAct(d); d.path = [];
  }
  if (!guest) { finishGuestDeparture(); return; }
  say(guest, '今天玩得很开心，下次见！');
  sendGuestHome(guest);
  HOOK.select();
  save();
}

function communityTick() {
  const community = G.community;
  const event = community.active;
  if (event) {
    const guest = communityDoll(event.guestPid);
    if (!guest) { endGetTogether(); finishGuestDeparture(); return; }
    if (event.leavingAt) {
      if (absNow() >= event.leavingAt) finishGuestDeparture();
      else if (guest.act?.type !== 'visitLeave' && guest.state !== 'lift') sendGuestHome(guest);
    } else if (absNow() >= event.endsAt || !communityDoll(event.hostPid)) endGetTogether();
    return;
  }
  if (G.time < 17.5 * 60 || G.time >= 21 * 60 || community.lastRoll === G.day || absNow() < community.nextEventAt) return;
  const hosts = availableHosts();
  if (!hosts.length) return;
  community.lastRoll = G.day;
  if (Math.random() >= .67) return;
  const host = weighted(hosts.map(d => [d, isE(d) ? 2.5 : 1]));
  const party = isE(host) ? .48 : .22;
  const kind = Math.random() < party ? weighted([
    ['tea', ['foodie', 'lazy'].includes(host.persona) ? 3 : 1],
    ['music', ['genki', 'social', 'stylist'].includes(host.persona) ? 3 : 1],
    ['games', ['nerd', 'genki'].includes(host.persona) ? 3 : 1],
  ]) : 'visit';
  startGetTogether(host, kind);
}

function moveInApplicant(pid) {
  const community = G.community;
  const friend = community.friends.find(f => f.pid === pid);
  if (!friend || !community.applications.some(a => a.pid === pid) || residents().length >= residentLimit()) return null;
  let doll = communityDoll(pid);
  if (doll?.guest) doll.guest = false;
  else if (!doll) doll = addDoll(friend);
  else return null;
  community.applications = community.applications.filter(a => a.pid !== pid);
  community.friends = community.friends.filter(f => f.pid !== pid);
  if (community.active?.guestPid === pid) {
    community.active.guestPid = null;
    if (doll.act?.type === 'visitLeave') { endAct(doll); doll.path = []; }
    endGetTogether();
    finishGuestDeparture();
  }
  return doll;
}

<script>
// Two cutaway storeys over the existing simulation grid. The front edges
// are shallow in screen space while the back walls and sprites stay upright.
const HOUSE_X = 14;
const HOUSE_HEIGHT = 310;
const HOUSE_MARGIN = 60;
const FLOOR_STEP = 3;
const WALL_STEP = 18;
const STOREYS = [
  { wall: 165, back: 225, front: 252, row: WALL_ROWS, wallRow: 0,
    rooms: ['#efc5c3', '#f4e6cb'], floors: ['#d7b6af', '#bf9d73'] },
  { wall: 74, back: 134, front: 158, row: FLOOR_SPLIT, wallRow: UPPER_WALL,
    rooms: ['#666780', '#d9c5cc'], floors: ['#655c70', '#a7b9aa'] },
];
const YARD = { wall: 258, back: 258, front: 300, row: ROWS, step: 7 };
const storeyOf = row => row >= ROWS ? YARD : STOREYS[+(row < 0 || row >= FLOOR_SPLIT)];

function houseY(y, storey) {
  return storey.back + (y - storey.row * T) * (storey.step || FLOOR_STEP) / T;
}

function stairPoint(progress) {
  const x = HOUSE_X + stairsColumn() * T + 8;
  const edge = HOUSE_X + W;
  const top = houseY(UPPER_LANDING * T + 14, STOREYS[1]);
  const bottom = houseY(LOWER_LANDING * T + 14, STOREYS[0]);
  if (progress < .2) return { x: mixNum(x, edge + 8, progress / .2), y: top };
  if (progress > .8) return { x: mixNum(edge + 28, x, (progress - .8) / .2), y: bottom };
  const t = (progress - .2) / .6;
  return { x: mixNum(edge + 8, edge + 28, t), y: mixNum(top, bottom, t) };
}

function houseDollPoint(d) {
  if (d.state === 'lift') return { x: d.liftX, y: d.liftY };
  if (takingStairs(d)) {
    return stairPoint((UPPER_LANDING * T + 14 - d.y) / ((UPPER_LANDING - LOWER_LANDING) * T));
  }
  if (takingYardPath(d)) {
    const inside = FLOOR_SPLIT - 1, outside = ROWS;
    const progress = (d.y - (inside * T + 14)) / ((outside - inside) * T);
    return { x: HOUSE_X + d.x, y: mixNum(houseY(inside * T + 14, STOREYS[0]), houseY(outside * T + 14, YARD), progress) };
  }
  if (d.act?.onFurn) {
    const f = d.act.furn;
    const offset = f.id === 'gardenSwing' ? swingOffset(G.t) : 0;
    return { x: HOUSE_X + d.x, y: houseFurnitureRect(f).y + d.y - f.y * T + offset };
  }
  return { x: HOUSE_X + d.x, y: houseY(d.y, storeyOf(d.ty)) };
}

function houseFurnitureRect(f) {
  const F = FURNITURE[f.id], storey = storeyOf(f.y);
  const x = HOUSE_X + f.x * T, w = F.w * T;
  const layer = layerOf(f.id);
  const wall = layer === 'wall';
  const bottom = wall ? storey.wall + 5 + (f.y - storey.wallRow) * WALL_STEP + F.h * T : houseY((f.y + F.h) * T, storey);
  const y = bottom - F.h * (layer === 'floor' ? FLOOR_STEP : T);
  return { x, y, w, bottom, top: y - (layer === 'solid' ? TALL[f.id] || 0 : 0), storey };
}

function houseTile(p, id) {
  const storey = p.y >= YARD.back ? YARD : p.y < STOREYS[0].wall ? STOREYS[1] : STOREYS[0];
  const F = id && FURNITURE[id];
  const wall = F && layerOf(id) === 'wall';
  const x = F ? Math.round((p.x - HOUSE_X) / T - F.w / 2) : Math.floor((p.x - HOUSE_X) / T);
  if (p.x < HOUSE_X || p.x >= HOUSE_X + W || p.y < storey.wall || p.y >= storey.front) return null;
  if (wall) {
    if (p.y >= storey.back) return null;
    const row = Math.round((p.y - storey.wall - 5 - F.h * T / 2) / WALL_STEP);
    return { x, y: storey.wallRow + Math.max(0, Math.min(WALL_ROWS - F.h, row)) };
  }
  if (p.y < storey.back) return null;
  const y = storey.row + (p.y - storey.back) / (storey.step || FLOOR_STEP);
  const end = storey === YARD ? YARD_END : storey === STOREYS[1] ? ROWS : FLOOR_SPLIT;
  return { x, y: F ? Math.max(storey.row, Math.min(end - F.h, Math.round(y - F.h / 2))) : Math.floor(y) };
}

function housePath(c, points) {
  c.beginPath();
  c.moveTo(...points[0]);
  for (const point of points.slice(1)) c.lineTo(...point);
  c.closePath();
}

function housePoly(c, color, ...points) {
  c.fillStyle = color;
  housePath(c, points);
  c.fill();
}

function drawHouseGarden(c, left, right) {
  const width = W + HOUSE_MARGIN;
  R(c, 0, 0, width, HOUSE_HEIGHT, G.sky);
  const season = seasonOf(G.day).id;
  const grass = season === 'autumn' ? '#b9b47c' : G.weather === 'snow' ? '#cbdacc' : '#a5bf8d';
  R(c, 0, 229, width, HOUSE_HEIGHT - 229, grass);
  for (const [x, y, size] of [[1, 202, 25], [right + 26, 207, 28]]) {
    R(c, x + 9, y + 6, 4, size + 12, '#846d55');
    R(c, x, y - 10, size - 5, 22, '#739678');
    R(c, x + 3, y - 17, size - 9, 23, season === 'autumn' ? '#d5a367' : '#94b58a');
    R(c, x + 7, y - 14, size - 16, 7, '#b0c699');
  }
  R(c, left - 5, YARD.back, W + 10, YARD.front - YARD.back, shade(grass, .075));
  R(c, 0, 301, width, 9, '#c6bca0');
  R(c, 0, 301, width, 1, '#e0d3b5');
  for (let x = 0; x < width; x += 16) R(c, x, 303, 1, 6, '#b0a88e');
  const gate = left + 10 * T;
  housePoly(c, '#d2c2a2', [gate + 2, 253], [gate + 14, 253], [gate + 25, 301], [gate - 9, 301]);
  for (let y = 261; y < 300; y += 7) R(c, gate - 4, y, 24, 1, '#e7dcc3');
  for (const x of [left - 7, right + 5]) {
    R(c, x, 254, 3, 44, '#b69b7b');
    R(c, x + 1, 254, 1, 44, '#e8d2af');
    for (let y = 256; y < 300; y += 7) R(c, x - 1, y, 5, 3, '#d5bc99');
  }
  for (const [x, y] of [[4, 38], [right + 12, 62], [right - 28, 14]]) {
    R(c, x, y + 6, 22, 4, '#f4f6ebbb');
    R(c, x + 4, y + 2, 14, 6, '#f4f6ebbb');
    R(c, x + 8, y, 6, 3, '#f4f6ebbb');
  }
  for (let i = 0; i < 65; i++) {
    const x = rnd(i + 690) * width, y = 261 + rnd(i + 810) * 37;
    if (Math.abs(x - gate - 8) < 18) continue;
    R(c, x, y, 2, 1, i % 4 === 0 ? '#fff0cf' : shade(grass, -.14));
    if (i % 4 === 0) R(c, x, y + 1, 1, 2, shade(grass, -.18));
  }
}

function drawHouseRoof(c, left, right) {
  const peak = left + Math.round(W * .58), eave = 70;
  housePoly(c, '#60545b', [left - 7, eave], [peak, 7], [right + 9, 32], [right + 9, eave]);
  housePoly(c, '#946d70', [left - 4, eave], [peak, 11], [right + 6, 36], [right + 6, eave]);
  housePoly(c, '#e5c9a8', [left + 2, eave], [peak, 19], [right - 1, 41], [right - 1, eave]);
  housePoly(c, '#f4e0c3', [left + 13, eave], [peak, 23], [right - 8, 44], [right - 8, eave]);
  housePoly(c, '#cfad8c', [left + 13, eave], [left + 67, 49], [left + 67, eave]);
  R(c, left + 65, 49, 3, 21, '#a38877');
  R(c, left + 69, 62, W - 76, 8, '#d7b18c');
  for (let y = 63; y < eave; y += 2) R(c, left + 69, y, W - 76, 1, '#c5a07f');
  for (const [x, y, w, h] of [[peak - 48, 52, 24, 14], [peak - 22, 45, 15, 21], [peak - 3, 41, 22, 25], [right - 42, 54, 18, 12], [right - 23, 48, 15, 18]]) {
    R(c, x, y, w, h, '#b9916c');
    R(c, x, y, w, 2, '#d2ab81');
    R(c, x + w - 5, y + 2, 5, h - 2, '#987457');
    R(c, x + 3, y + 3, w - 10, 1, '#d9b489');
  }
  box(c, peak + 26, 31, 13, 15, '#f5e9d5', '#9b8074');
  R(c, peak + 28, 33, 9, 10, G.sky);
  R(c, peak + 32, 33, 1, 10, '#f5e9d5');
  R(c, peak + 28, 37, 9, 1, '#f5e9d5');
  R(c, peak + 24, 46, 17, 2, '#b38e76');
}

function drawRoomDetails(c, x, right, top, back, storey, i) {
  if (i === 0) {
    const upper = storey === STOREYS[1];
    const start = x + 10, stop = right - 10, y = top + 11;
    const fabric = upper ? '#4a4963' : '#fff1e5';
    for (let j = 0; j < 3; j++) {
      const a = start + (stop - start) * j / 3, b = start + (stop - start) * (j + 1) / 3;
      housePoly(c, fabric, [a, y], [a + 6, y + 4], [b - 6, y + 4], [b, y],
        [b - 5, y + 7], [a + 5, y + 7]);
      R(c, a - 1, y - 1, 3, 3, upper ? '#b9a6c8' : '#cc858b');
    }
    R(c, stop - 1, y - 1, 3, 3, upper ? '#b9a6c8' : '#cc858b');
    if (!upper) {
      R(c, x + 14, back - 31, 42, 4, '#cc8d97');
      housePoly(c, '#fff2e5', [x + 14, back - 28], [x + 19, back - 28],
        [x + 18, back - 11], [x + 13, back - 9]);
      housePoly(c, '#fff2e5', [x + 51, back - 28], [x + 56, back - 28],
        [x + 57, back - 9], [x + 52, back - 11]);
    }
  } else {
    const ink = storey === STOREYS[1] ? '#f2e0df' : '#fff2db';
    for (let px = x + 12; px + 19 < right; px += 32) {
      R(c, px, top + 15, 18, 1, ink);
      R(c, px, top + 15, 1, 26, ink);
      R(c, px + 17, top + 15, 1, 26, ink);
    }
  }
}

function drawStorey(c, storey, wall, floor) {
  const left = HOUSE_X, right = left + W, mid = left + BX * T;
  const { back, front, wall: top } = storey;
  const bathEdge = G.bathroom && storey === STOREYS[1] ? left + BATH_X * T : left;
  const spans = [[0, bathEdge, mid], [1, mid, right]];
  if (bathEdge > left) spans.unshift([2, left, bathEdge]);
  for (const [i, x, end] of spans) {
    const bath = i === 2;
    const base = bath ? '#b5d8ce' : wall.id === 'cream' ? storey.rooms[i] : shade(wall.base, i ? .01 : -.05);
    const alt = wall.id === 'cream' ? shade(base, .045) : wall.alt;
    const floorBase = bath ? '#d1e4dd' : floor.id === 'oak' ? storey.floors[i] : floor.base;
    const inset = 9;

    c.save();
    housePath(c, [[x, front], [x + inset, back], [end - inset, back], [end, front]]);
    c.clip();
    c.translate(left, back);
    c.scale(1, FLOOR_STEP / T);
    c.translate(0, -storey.row * T);
    drawFloor(c, { pat: bath ? 'check' : floor.pat, base: floorBase, alt: shade(floorBase, -.09) },
      storey.row * T, (storey === STOREYS[1] ? ROWS : FLOOR_SPLIT) * T);
    c.restore();

    R(c, x, top, end - x, back - top, base);
    c.save();
    c.beginPath();
    c.rect(x + inset, top, end - x - inset * 2, back - top - 1);
    c.clip();
    c.translate(left, top);
    if (bath) {
      R(c, x - left, back - top - 36, end - x, 36, '#e4eee6');
      for (let row = back - top - 36; row < back - top; row += 8) {
        R(c, x - left, row, end - x, 1, '#a9cbc4');
        for (let col = x - left + (row % 16); col < end - left; col += 16) R(c, col, row, 1, 8, '#b7d4ca');
      }
      R(c, x - left, back - top - 37, end - x, 1, '#83b4aa');
    } else drawWall(c, { ...wall, base, alt }, back - top);
    c.restore();
    housePoly(c, shade(base, -.10), [x, top], [x + inset, top + 6], [x + inset, back], [x, front]);
    housePoly(c, shade(base, -.045), [end, top], [end - inset, top + 6], [end - inset, back], [end, front]);
    R(c, x + inset, back - 12, end - x - inset * 2, 10, shade(base, .085));
    for (let px = x + inset + 3; px < end - inset; px += 5) R(c, px, back - 10, 1, 7, shade(base, -.025));
    R(c, x + inset, back - 13, end - x - inset * 2, 1, shade(base, -.09));
    R(c, x + inset, back - 2, end - x - inset * 2, 2, shade(base, -.13));
    R(c, x, top, end - x, 3, '#49364d28');
    if (!bath && wall.id === 'cream') drawRoomDetails(c, x, end, top, back, storey, i);
  }
  for (const x of bathEdge > left ? [bathEdge, mid] : [mid]) {
    R(c, x - 2, top, 5, front - top, '#928482');
    R(c, x - 2, top, 1, front - top, '#c7b5a9');
    R(c, x + 2, top, 1, front - top, '#6f656c');
  }
}

function drawHouseStairs(c) {
  const edge = HOUSE_X + W;
  const top = stairPoint(0).y, bottom = stairPoint(1).y;
  R(c, edge + 4, top - 10, 29, bottom - top + 15, '#b6a596');
  R(c, edge + 33, top - 10, 3, 252 - top + 10, '#897a77');
  R(c, edge + 33, top - 10, 1, 252 - top + 10, '#c5b2a2');
  R(c, edge - 5, top - 1, 17, 4, '#c4a384');
  R(c, edge - 5, bottom - 1, 38, 4, '#c4a384');
  housePoly(c, '#a08272', [edge + 2, top], [edge + 14, top],
    [edge + 33, bottom], [edge + 22, bottom]);
  for (let i = 0; i <= 16; i++) {
    const p = stairPoint(.2 + .6 * i / 16);
    R(c, p.x - 5, p.y - 1, 11, 2, '#f2d1a9');
    R(c, p.x - 5, p.y + 1, 11, 2, '#957768');
    if (i % 4 === 0) R(c, p.x + 4, p.y - 9, 1, 9, '#826b63');
  }
  housePoly(c, '#76625e', [edge + 12, top - 10], [edge + 32, bottom - 10],
    [edge + 32, bottom - 8], [edge + 12, top - 8]);
}

function drawHouseShell(c, wall, floor) {
  const l = HOUSE_X, r = l + W;
  drawHouseGarden(c, l, r);
  drawHouseRoof(c, l, r);
  for (const storey of STOREYS) drawStorey(c, storey, wall, floor);
  for (const [y, h] of [[69, 5], [158, 7], [252, 6]]) {
    R(c, l - 4, y, W + 8, h, '#807471');
    R(c, l - 3, y + 1, W + 6, 2, '#c6b6ab');
    R(c, l - 3, y + 3, W + 6, 1, '#a3948d');
    if (h > 5) for (let x = l + 1; x < r; x += 9) R(c, x, y + 4, 1, 2, '#938480');
  }
  for (const x of [l - 4, r]) {
    R(c, x, STOREYS[1].wall, 4, STOREYS[0].front - STOREYS[1].wall, '#958684');
    R(c, x + 1, STOREYS[1].wall, 1, STOREYS[0].front - STOREYS[1].wall, '#c7b5a9');
  }
  drawHouseStairs(c);
}

<script>
// 画面渲染 + 指针交互（拎小人、摆家具）
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
// 扩建后画布跟着变宽
HOOK.resize = () => {
  cv.width = lightCv.width = W + HOUSE_MARGIN;
  cv.height = lightCv.height = HOUSE_HEIGHT;
  ctx.imageSmoothingEnabled = false;
  document.getElementById('stage').style.setProperty('--scene-ratio', cv.width / cv.height);
};
const overlay = document.getElementById('overlay');

const wallSpec = () => WALLS.find(w => w.id === G.wall) || WALLS[0];
const floorSpec = () => FLOORS.find(f => f.id === G.floor) || FLOORS[0];

function dollPose(d) {
  if (d.state === 'lift') return 'lift';
  if (d.state === 'walk') return 'walk';
  if (d.act && d.state === 'act' && d.act.type === 'exercise') return 'walk';
  if (d.state === 'act' && (['yoga', 'boxPractice'].includes(d.act?.type) || ROUTINES[d.act?.type]?.motion === 'stretch')) return 'dance';
  if (d.act && d.state === 'act' && (d.act.type === 'dance' || (['join', 'visitStay'].includes(d.act.type) && d.act.dance))) return 'dance';
  if (d.act && d.act.onFurn && d.state === 'act') return 'sit';
  return 'stand';
}
function drawDollObj(c, d) {
  const { x, y } = houseDollPoint(d);
  drawDoll(c, x, y, d.look, {
    dir: d.dir, frame: d.frame, pose: dollPose(d), hop: d.hop,
    blink: (d.state === 'act' && d.act?.type === 'couchNap') || d.blink > 0 || (d.act && d.act.type === 'read' && d.state === 'act' && Math.sin(G.t * 2) > 0.7),
    happy: d.happy > 0 || (d.act && d.state === 'act' && (['dance', 'game', 'tv', 'snack', 'cat', 'join', 'visitStay'].includes(d.act.type) || (d.act.type === 'chat' && d.act.kind !== 'argue'))),
  });
  if (d.state !== 'act') return;
  if (d.act?.type === 'visitStay') {
    const px = x + 8, py = y - 13 - Math.floor(d.ft * 2) % 3;
    if (d.act.theme === 'music') {
      R(c, px + 2, py - 5, 1, 6, '#f4b6cb');
      R(c, px, py, 3, 2, '#f4b6cb');
      R(c, px + 2, py - 5, 3, 1, '#f8d9e3');
    } else if (d.act.theme === 'games') {
      box(c, px, py, 5, 5, '#f8e6c7', '#8e6d82');
      R(c, px + 2, py + 2, 1, 1, '#a67696');
    } else if (d.act.theme === 'tea') {
      box(c, px, py, 6, 5, '#ffefdc', '#a0747e');
      R(c, px + 6, py + 1, 2, 2, '#f6c8b5');
    }
  }
  const motion = ROUTINES[d.act?.type]?.motion;
  if (motion === 'book') {
    const side = d.dir === 'left' ? -1 : 1;
    box(c, x + side * 9 - 3, y - 12, 7, 5, '#fff1d7', '#8e6d82');
    R(c, x + side * 9, y - 11, 1, 3, '#c69eb4');
  }
  if (motion === 'doze') {
    R(c, x + 7, y - 23, 4, 1, '#f4e5ff');
    R(c, x + 8, y - 22, 2, 1, '#f4e5ff');
    R(c, x + 7, y - 21, 4, 1, '#f4e5ff');
  }
  if (motion === 'spark') {
    R(c, x + 9, y - 18, 1, 5, '#f7d485');
    R(c, x + 7, y - 16, 5, 1, '#f7d485');
  }
}

function render() {
  const c = ctx, t = G.t;
  drawHouseShell(c, wallSpec(), floorSpec());

  for (const f of G.furniture) if (layerOf(f.id) !== 'solid') drawHouseFurniture(c, f, t);

  if (G.mode === 'build') {
    for (const storey of [...STOREYS, YARD]) {
      const { back, front } = storey;
      R(c, HOUSE_X, back, W, front - back, '#48323810');
      for (let x = T; x < W; x += T) R(c, HOUSE_X + x, back, 1, front - back, '#48323824');
      const step = storey.step || FLOOR_STEP;
      for (let y = back + step; y < front; y += step) R(c, HOUSE_X, y, W, 1, '#48323824');
    }
  }

  // Sort by projected feet so characters and objects can pass behind each other.
  const list = [];
  for (const f of G.furniture) {
    if (layerOf(f.id) !== 'solid') continue;
    const { bottom } = houseFurnitureRect(f);
    const sleepers = f.users.filter(u => lying(u) && u.act.furn === f);
    f.occ = sleepers.length ? (slot, hx, hy) => {
      const sleeper = sleepers.find(u => (u.act.seat || 0) === slot);
      if (sleeper) drawDoll(c, hx, hy + 1, sleeper.look, { pose: 'head', dir: 'down' });
    } : null;
    list.push({ y: bottom, draw: () => drawHouseFurniture(c, f, t) });
  }
  for (const d of G.dolls) {
    if (d.state === 'lift' || d.state === 'away' || lying(d)) continue;
    const y = d.act?.onFurn ? houseFurnitureRect(d.act.furn).bottom + .5 : houseDollPoint(d).y;
    list.push({ y, draw: () => drawDollObj(c, d) });
  }
  list.push(...partitionDrawables(c));
  list.sort((a, b) => a.y - b.y).forEach(o => o.draw());

  // 夜晚：整体压暗，台灯/电视/游戏机处“挖洞”透光
  if (G.dark > 0.01) {
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, cv.width, cv.height);
    lctx.fillStyle = `rgba(18,14,48,${G.dark})`; lctx.fillRect(0, 0, cv.width, cv.height);
    lctx.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r, a = 1) => {
      const g = lctx.createRadialGradient(x, y, 2, x, y, r);
      g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = g; lctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    for (const f of G.furniture) {
      const { x, y, storey } = houseFurnitureRect(f);
      lctx.save();
      lctx.beginPath();
      lctx.rect(HOUSE_X, storey.wall, W, storey.front - storey.wall);
      lctx.clip();
      if (f.id === 'lamp') hole(x + 8, y - 10, 54);
      if (f.id === 'moonLamp' || f.id === 'paperLantern') hole(x + 8, y + 8, 34, .85);
      if (f.id === 'garland') for (let i = 0; i < 8; i += 2) hole(x + 4 + i * 6, y + 9, 16, .55);
      if (f.id === 'aquarium') hole(x + 16, y - 6, 22, .5);
      if (f.id === 'xmastree') hole(x + 8, y - 2, 30, .8);
      if (f.id === 'lantern') hole(x + 8, y + 9, 22, .7);
      if ((f.id === 'pc' || f.id === 'speaker') && f.active) hole(x + 12, y - 10, 24, .7);
      if (f.id === 'tv' && f.active) hole(x + 16, y - 4, 34, .8);
      if (f.id === 'arcade') hole(x + 8, y - 8, 20, f.active ? .8 : .4);
      if (f.id === 'stove' && f.active) hole(x + 8, y - 6, 22, .7);
      if (f.id === 'fridge' && f.active) hole(x + 8, y, 24, .7);
      lctx.restore();
    }
    c.drawImage(lightCv, 0, 0);
    c.globalCompositeOperation = 'lighter';
    for (const f of G.furniture) if (f.id === 'lamp') {
      const { x, y, storey } = houseFurnitureRect(f);
      const g = c.createRadialGradient(x + 8, y - 10, 1, x + 8, y - 10, 36);
      g.addColorStop(0, `rgba(255,190,90,${0.35 * G.dark})`); g.addColorStop(1, 'rgba(255,190,90,0)');
      c.fillStyle = g;
      const top = Math.max(storey.wall, y - 48);
      c.fillRect(Math.max(HOUSE_X, x - 30), top, Math.min(HOUSE_X + W, x + 46) - Math.max(HOUSE_X, x - 30), Math.min(storey.front, y + 28) - top);
    }
    c.globalCompositeOperation = 'source-over';
  }

  // 选中的小人头上跳动的小箭头
  const sel = G.dolls.find(d => d.uid === G.sel);
  if (sel && sel.state !== 'lift' && sel.state !== 'away' && G.mode === 'live') {
    const point = houseHeadPoint(sel);
    const ax = point.x, ay = point.y - 7 + Math.round(Math.sin(t * 6));
    R(c, ax - 3, ay, 7, 1, INK); R(c, ax - 2, ay + 1, 5, 1, INK); R(c, ax - 1, ay + 2, 3, 1, INK); R(c, ax, ay + 3, 1, 1, INK);
    R(c, ax - 2, ay, 5, 1, '#ffd35c'); R(c, ax - 1, ay + 1, 3, 1, '#ffd35c');
  }

  if (G.mode === 'build') drawBuildOverlay(c, t);

  // 被拎起来的小人画在最上面
  for (const d of G.dolls) if (d.state === 'lift') {
    if (d.liftShadow) {
      const { x, y } = houseDollPoint(d.liftShadow);
      R(c, x - 4, y - 1, 8, 2, 'rgba(0,0,0,.25)');
    }
    drawDollObj(c, d);
  }
  updateOverlay();
}

function drawHouseFurniture(c, f, t) {
  const { x, y, bottom } = houseFurnitureRect(f);
  if (layerOf(f.id) === 'floor') {
    c.save();
    c.translate(x, bottom - FURNITURE[f.id].h * FLOOR_STEP);
    c.scale(1, FLOOR_STEP / T);
    DRAW[f.id](c, 0, 0, f, t);
    c.restore();
    return;
  }
  DRAW[f.id](c, x, y, f, t);
}

function houseHeadPoint(d) {
  if (!lying(d)) {
    const { x, y } = houseDollPoint(d);
    return { x, y: y - 24 };
  }
  const f = d.act.furn, { y } = houseFurnitureRect(f);
  return { x: HOUSE_X + headPos(d).x - (f.id === 'bath' ? 2 : 0), y: y + (f.id === 'bath' ? -6 : 11) };
}

function drawBuildOverlay(c, t) {
  const B = G.build, hv = B.hover;
  if (B.placing && hv) {
    const id = B.placing.id, f = { id, ...hv };
    const F = FURNITURE[id], rect = houseFurnitureRect(f);
    const wall = layerOf(id) === 'wall';
    const x = rect.x, w = rect.w, bottom = rect.bottom;
    const h = F.h * (wall ? T : rect.storey.step || FLOOR_STEP);
    const y = bottom - h;
    const ok = canPlace(id, hv.x, hv.y, null);
    c.globalAlpha = .75;
    drawHouseFurniture(c, f, t);
    c.globalAlpha = 1;
    R(c, x, y, w, h, ok ? '#7cc57659' : '#e26d6d73');
    c.strokeStyle = ok ? '#4f9a4a' : '#c24d4d';
    c.strokeRect(x + .5, y + .5, w - 1, h - 1);
  } else if (hv?.furn) {
    const { x, w, top, bottom } = houseFurnitureRect(hv.furn);
    R(c, x, top, w, bottom - top, B.trash ? '#e26d6d66' : '#ffd35c4d');
  }
}

/* ---------- DOM 浮层：对话气泡、名字、爱心 ---------- */
const domBubbles = new Map();
function positionOverlay(el, x, y) {
  el.style.left = `${100 * x / cv.width}%`;
  el.style.top = `${100 * y / cv.height}%`;
}
function updateOverlay() {
  const alive = new Set();
  const selected = G.dolls.find(d => d.uid === G.sel);
  const invite = press?.moved && G.mode === 'live' ? dropInteraction(press.point, press.d) : null;
  for (const d of G.dolls) {
    let el = domBubbles.get(d.uid);
    if (!el) { el = { b: document.createElement('div'), n: document.createElement('div'), id: null }; el.b.className = 'bubble'; el.n.className = 'nametag'; overlay.append(el.b, el.n); domBubbles.set(d.uid, el); }
    alive.add(d.uid);
    const { x: hx, y: hy } = houseHeadPoint(d);
    if (d.bubble && d.state !== 'away') {
      if (el.id !== d.bubble.id) { el.b.textContent = d.bubble.text; el.id = d.bubble.id; el.b.style.animation = 'none'; void el.b.offsetWidth; el.b.style.animation = ''; }
      el.b.style.display = ''; positionOverlay(el.b, hx, hy - 2);
    } else el.b.style.display = 'none';
    const partner = selected && arePartners(selected, d);
    const dropTarget = invite?.target === d;
    const showName = d.state !== 'away' && (d === selected || d.uid === hoverDoll || partner || dropTarget);
    el.n.style.display = showName ? '' : 'none';
    if (showName) {
      const np = lying(d) ? { x: hx, y: hy + 20 } : houseDollPoint(d);
      const paired = partner || G.dolls.some(o => arePartners(d, o));
      const label = dropTarget ? (invite.spot ? `💬 放下和${d.name}互动` : invite.reason) : paired ? `♥ ${d.name}` : d.name;
      if (el.n.textContent !== label) el.n.textContent = label;
      el.n.classList.toggle('couple-name', paired);
      el.n.classList.toggle('drop-target', dropTarget);
      positionOverlay(el.n, np.x, np.y + 2);
    }
  }
  for (const [uid, el] of domBubbles) if (!alive.has(uid)) { el.b.remove(); el.n.remove(); domBubbles.delete(uid); }
  for (const h of hearts) {
    if (!h.el) { h.el = document.createElement('div'); h.el.className = 'heart'; h.el.textContent = h.txt; overlay.append(h.el); const { x, y } = houseHeadPoint(h.doll); positionOverlay(h.el, x + h.dx, y); }
  }
  for (const el of overlay.querySelectorAll('.heart')) if (!hearts.some(h => h.el === el)) el.remove();
}

/* ---------- 指针交互 ---------- */
let hoverDoll = null, press = null;
function toScene(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * cv.width, y: (e.clientY - r.top) / r.height * cv.height };
}

function dollAt(p, exclude) {
  let best = null;
  for (const d of G.dolls) {
    if (d === exclude || d.state === 'away' || d.state === 'lift') continue;
    const { x, y: top } = houseHeadPoint(d);
    const y = lying(d) ? top + 12 : houseDollPoint(d).y;
    if (Math.abs(p.x - x) <= 7 && p.y >= top && p.y <= y + 1 && (!best || y > best.y)) best = { d, y };
  }
  return best?.d;
}

function dropInteraction(point, carried) {
  const direct = dollAt(point, carried);
  const column = Math.floor((point.x - HOUSE_X) / T);
  if (column < 0 || column >= COLS) return null;
  let target = null, closest = Infinity;
  for (const d of G.dolls) {
    if (d === carried || ['away', 'lift'].includes(d.state) || takingStairs(d) || takingYardPath(d)) continue;
    if (d === direct) { target = d; break; }
    if (direct || roomOf(d) !== roomOf({ tx: column, ty: d.ty })) continue;
    const head = houseHeadPoint(d);
    const feet = lying(d) ? head.y + 12 : houseDollPoint(d).y;
    if (Math.abs(point.x - head.x) > T * 1.35 || point.y < head.y - 4 || point.y > feet + 5) continue;
    const distance = Math.hypot(point.x - head.x, point.y - head.y - 10);
    if (distance < closest) { target = d; closest = distance; }
  }
  if (!target) return null;
  if (target.state === 'wait' || ['chat', 'tryst', 'leave', 'visitLeave', 'sleep', 'couchNap', 'bath', 'toilet', 'shower'].includes(target.act?.type)) {
    return { target, reason: `${target.name} 正在忙` };
  }

  // Prefer a free tile beside the partner. The cutaway projects depth to only a few pixels.
  const room = roomOf(target);
  const spots = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => ({ x: target.tx + dx, y: target.ty + dy, dx }));
  spots.sort((a, b) => Math.abs(b.dx) - Math.abs(a.dx) || Math.abs(a.x - column) - Math.abs(b.x - column));
  const spot = spots.find(({ x, y }) => free(x, y) && !wallBetween(target.tx, target.ty, x, y) &&
    roomOf({ tx: x, ty: y }) === room && !isDoorTile(x, y) && !G.dolls.some(o => o !== carried && o.state !== 'away' && o.tx === x && o.ty === y));
  return { target, spot, reason: `${target.name} 身边没有空位` };
}

function furnAt(p) {
  let best = null;
  for (const f of G.furniture) {
    const { x, w, top, bottom } = houseFurnitureRect(f);
    if (p.x < x || p.x >= x + w || p.y < top || p.y >= bottom) continue;
    const priority = { floor: 0, wall: 1, solid: 2 }[layerOf(f.id)];
    if (!best || priority > best.priority || (priority === best.priority && bottom >= best.bottom)) best = { f, bottom, priority };
  }
  return best?.f;
}

function removeFurniture(f) {
  for (const u of [...f.users]) endAct(u);
  G.furniture = G.furniture.filter(o => o !== f);
}

cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelPlacing(); });
cv.addEventListener('pointerdown', e => {
  if (press || e.button !== 0) return;
  const p = toScene(e);
  cv.setPointerCapture(e.pointerId);
  if (G.mode === 'live') {
    const d = dollAt(p);
    if (!d && hitBedDoor(p)) { toggleBedDoor(); return; }
    press = { p, d, pointerId: e.pointerId, moved: false, furn: d ? null : furnAt(p) };
    return;
  }
  // 布置模式
  const B = G.build;
  if (B.placing) {
    const g = houseTile(p, B.placing.id);
    if (g && canPlace(B.placing.id, g.x, g.y, null)) {
      if (!B.placing.moved && !acquire(B.placing.id)) { SFX.play('deny'); return; }   // 新放的家具要从仓库拿或者花钱买
      addFurniture(B.placing.id, g.x, g.y); HOOK.refresh(); rebuild(); SFX.play('place'); save();
      if (B.placing.moved) { B.placing = null; HOOK.refresh(); }
    } else SFX.play('deny');
    return;
  }
  const f = furnAt(p);
  if (!f) return;
  if (f.id === 'door' && B.trash) { HOOK.toast('大门不能拆哦，可以拿起来换个位置', true); SFX.play('deny'); return; }
  if (B.trash) { removeFurniture(f); stash(f.id); rebuild(); SFX.play('trash'); save(); HOOK.toast(`「${FURNITURE[f.id].name}」收进仓库了`, true); HOOK.refresh(); }
  else { removeFurniture(f); rebuild(); B.placing = { id: f.id, moved: true, orig: { x: f.x, y: f.y } }; B.hover = houseTile(p, f.id); SFX.play('pick'); HOOK.refresh(); }
});
cv.addEventListener('pointermove', e => {
  if (press && press.pointerId !== e.pointerId) return;
  const p = toScene(e);
  if (G.mode === 'build') {
    const B = G.build;
    B.hover = B.placing ? houseTile(p, B.placing.id) : { furn: furnAt(p) };
    cv.style.cursor = B.placing ? 'copy' : B.hover?.furn ? (B.trash ? 'not-allowed' : 'grab') : 'default';
    return;
  }
  const hd = dollAt(p); hoverDoll = hd ? hd.uid : null;
  cv.style.cursor = press && press.d ? 'grabbing' : hd ? 'grab' : (G.sel && furnAt(p) && FURNITURE[furnAt(p).id].use ? 'pointer' : 'default');
  if (!press || !press.d) return;
  const d = press.d;
  if (!press.moved && Math.hypot(p.x - press.p.x, p.y - press.p.y) > 3) {
    press.moved = true;
    if (d.act) endAct(d);
    d.path = []; d.state = 'lift'; d.dir = 'down'; G.sel = d.uid; HOOK.select();
    say(d, pick(ACT_LINES.lift), 1.5); SFX.play('lift');
  }
  if (press.moved) {
    press.point = p;
    d.liftX = p.x;
    d.liftY = p.y + 12;
    const g = dropTile(p);
    d.liftShadow = g && { x: g.x * T + 8, y: g.y * T + 14, ty: g.y };
  }
});
cv.addEventListener('pointerup', e => {
  if (!press || press.pointerId !== e.pointerId) return;
  if (G.mode !== 'live') { cancelDollDrag(e); return; }
  const p = toScene(e), d = press.d;
  if (d && press.moved) {
    const invite = dropInteraction(p, d);
    let g = invite?.spot || dropTile(p);
    // Don't leave a doll stacked on the target when an invitation can't start.
    if (invite && !invite.spot && g?.x === invite.target.tx && g.y === invite.target.ty) g = null;
    placeDollAt(d, g?.x ?? d.tx, g?.y ?? d.ty);
    d.state = 'idle'; d.think = 1.5; d.frame = 0; d.liftShadow = null; d.bubble = null; SFX.play('drop');
    if (invite?.spot) {
      const partner = invite.target;
      if (partner.act) endAct(partner);
      placeDollAt(partner, partner.tx, partner.ty);
      startSocial(d, partner);
      HOOK.select();
    } else if (invite) HOOK.toast(invite.reason, true);
  } else if (d) {
    G.sel = d.uid; SFX.play('click'); HOOK.select(true);
  } else if (press.furn && G.sel) {
    const sd = G.dolls.find(o => o.uid === G.sel);
    if (sd) orderUse(sd, press.furn);
  } else { G.sel = null; HOOK.select(); }
  press = null;
});
function cancelDollDrag(e) {
  if (!press || press.pointerId !== e.pointerId) return;
  const d = press?.d;
  if (d?.state === 'lift') {
    placeDollAt(d, d.tx, d.ty);
    d.state = 'idle';
    d.liftShadow = null;
  }
  press = null;
}
cv.addEventListener('pointercancel', cancelDollDrag);
cv.addEventListener('lostpointercapture', cancelDollDrag);
cv.addEventListener('pointerleave', () => { hoverDoll = null; if (G.mode === 'build') G.build.hover = null; });

const rawDropTile = p => houseTile({ x: p.x, y: p.y + 12 }) || houseTile(p);
function dropTile(p) {
  const tile = rawDropTile(p);
  return tile && nearestFree(tile.x, tile.y, tile.y >= ROWS ? 3 : tile.y >= FLOOR_SPLIT ? 2 : 1);
}

function cancelPlacing() {
  const B = G.build;
  if (B.placing && B.placing.moved && B.placing.orig) {
    const o = B.placing.orig;
    if (canPlace(B.placing.id, o.x, o.y, null)) addFurniture(B.placing.id, o.x, o.y);
    rebuild();
  }
  B.placing = null; HOOK.refresh();
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') cancelPlacing(); });
</script>
<script>
// 一次只展示一期。复制与纪念卡使用同一期的内容。
let housePaperIndex = -1;
function currentHousePaper() { return paperIssue(G.paper[housePaperIndex]); }

const paperStoryTitle = (story, i) => story.label && (i === 0 ? '本月头条' : story.label);

function showHousePaper() {
  const dialog = document.getElementById('paperDialog');
  renderHousePaper(G.paper.length - 1);
  if (!dialog.open) dialog.showModal();
}

function renderHousePaper(index) {
  housePaperIndex = Math.max(-1, Math.min(index, G.paper.length - 1));
  const issue = currentHousePaper();
  const target = document.getElementById('paperText');
  document.getElementById('paperMonth').textContent = issue?.month || monthLabel(G.day);
  document.getElementById('paperOlder').disabled = housePaperIndex <= 0;
  document.getElementById('paperNewer').disabled = housePaperIndex >= G.paper.length - 1;
  document.getElementById('paperCopy').disabled = !issue;
  document.getElementById('paperCopy').textContent = '复制本期';
  document.getElementById('paperCard').disabled = !issue;
  if (!issue) { target.textContent = '本期月报会在下月 00:00 出炉。'; return; }

  target.replaceChildren(...issue.stories.map((story, index) => {
    const article = document.createElement('article');
    article.className = index === 0 ? 'paper-story paper-lead' : 'paper-story';
    const people = document.createElement('div');
    people.className = 'paper-cast';
    if (story.people?.length) {
      for (const person of story.people) {
        const portrait = document.createElement('canvas');
        portrait.width = 20; portrait.height = 24;
        portrait.setAttribute('role', 'img');
        portrait.setAttribute('aria-label', person.name);
        portrait.title = person.name;
        dollPortrait(portrait, person.look);
        people.append(portrait);
      }
    } else {
      people.textContent = story.icon;
      people.setAttribute('aria-hidden', 'true');
    }
    const body = document.createElement('div');
    const title = document.createElement('small');
    title.textContent = paperStoryTitle(story, index);
    const text = document.createElement(index === 0 ? 'h3' : 'p');
    text.textContent = story.text;
    if (title.textContent) body.append(title);
    body.append(text);
    article.append(people, body);
    return article;
  }));
}

function housePaperText(issue) {
  return [issue.month, ...issue.stories.map((story, i) =>
    [paperStoryTitle(story, i), story.text].filter(Boolean).join(' · '))].join('\n');
}

function drawHousePaperCard(issue) {
  const W = 360, H = 140 + issue.stories.length * 98, S = 2;
  const c = document.createElement('canvas'); c.width = W * S; c.height = H * S;
  const ctx = c.getContext('2d'); ctx.scale(S, S); ctx.imageSmoothingEnabled = false;
  const sans = '"PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = '#583c4b'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff4e4'; ctx.fillRect(8, 8, W - 16, H - 16);
  ctx.fillStyle = '#ce718e';
  for (let x = 12; x < W - 12; x += 8) { ctx.fillRect(x, 10, 4, 3); ctx.fillRect(x, H - 13, 4, 3); }
  ctx.fillStyle = '#583c4b'; ctx.textAlign = 'center';
  ctx.font = `700 28px ${sans}`; ctx.fillText('小屋月报', W / 2, 53);
  ctx.font = `14px ${sans}`; ctx.fillText(issue.month, W / 2, 76);
  ctx.textAlign = 'left';
  issue.stories.forEach((story, i) => {
    const y = 94 + i * 98;
    ctx.fillStyle = i ? '#f5e4d6' : '#f6dbe3'; ctx.fillRect(24, y, W - 48, 86);
    const people = story.people || [];
    if (people.length) {
      const size = people.length === 3 ? 23 : 30;
      for (const [index, person] of people.entries()) {
        const portrait = document.createElement('canvas');
        portrait.width = 20; portrait.height = 24;
        dollPortrait(portrait, person.look);
        ctx.drawImage(portrait, 30 + index * (size - 2), y + 28, size, size * 1.2);
      }
    } else {
      ctx.font = `27px ${sans}`; ctx.fillText(story.icon, 48, y + 51);
    }
    const left = 104;
    ctx.fillStyle = '#8a3d59'; ctx.font = `700 12px ${sans}`;
    ctx.fillText(paperStoryTitle(story, i), left, y + 19);
    ctx.fillStyle = '#3d2733'; ctx.font = `${i === 0 ? '700 16px' : '14px'} ${sans}`;
    let row = '', line = 0;
    for (const char of story.text) {
      if (ctx.measureText(row + char).width > 214) {
        if (line === 2) { ctx.fillText(row.slice(0, -1) + '…', left, y + 39 + line * 18); return; }
        ctx.fillText(row, left, y + 39 + line++ * 18); row = '';
      }
      row += char;
    }
    ctx.fillText(row, left, y + 39 + line * 18);
  });
  return c;
}

function saveHousePaperCard(issue) {
  drawHousePaperCard(issue).toBlob(blob => {
    if (!blob) return;
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = `小屋月报-${issue.month}.png`; link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }, 'image/png');
}
</script>
<script>
// 界面：住户列表、状态卡、模式切换、布置面板、衣橱，以及主循环
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/* ---------- 提示 ---------- */
let toastTimer = 0;
HOOK.toast = (msg, quiet) => {
  if (!quiet && !msg.startsWith('☀️')) addLog(msg);   // quiet=true 的是纯界面提示，不进日志          // 新的一天用日志里的日期分隔，不重复记
  const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); };

/* ---------- 住户列表 + 状态卡 ---------- */
function doingText(d) {
  if (d.act?.type === 'visitStay') return GET_TOGETHERS[G.community.active?.kind]?.name || '和朋友相聚';
  if (d.state === 'lift') return '被你拎在手里';
  if (d.state === 'wait') return '在等人过来';
  if (d.state === 'away') return awayText(d);
  if (d.act && d.act.type === 'leave') return `出门${JOBS[d.job].verb}`;
  if (!d.act) return ACT_NAMES.idle;
  if (d.state === 'walk' && d.act.type === 'join') return `去找${d.act.target.name}凑热闹`;
  if (d.state === 'walk' && d.act.type === 'chat' && d.act.partner) return `去找${d.act.partner.name}`;
  const sd = d.state === 'act' && socialDoing(d);
  if (sd) return sd;
  const n = ACT_NAMES[d.act.type] || '忙碌中';
  if (d.state === 'walk') return d.act.type === 'wander' ? '闲逛' : `正要去${n.replace(/^在/, '')}`;
  if (d.act.type === 'chat' && d.act.partner) return `和${d.act.partner.name}聊天`;
  return n;
}

function renderDollList() {
  const box = $('#dollList'); box.innerHTML = '';
  for (const d of G.dolls) {
    const b = el('button', 'doll-row' + (d.uid === G.sel ? ' sel' : '') + (d.state === 'away' ? ' away' : ''));
    const c = el('canvas'); c.width = 20; c.height = 24; dollPortrait(c, d.look);
    const P = PERSONAS[d.persona];
    const m = el('div', 'meta', `<b>${esc(d.name)}${d.guest ? ' <em class="guest-tag">访客</em>' : ''} <span class="g-${d.gender}">${d.gender === 'm' ? '♂' : '♀'}</span> ${P.icon}</b><small class="couple-label" data-partners="${d.uid}" hidden></small><small data-doing="${d.uid}">${esc(doingText(d))}</small>`);
    b.append(c, m);
    b.onclick = () => { G.sel = d.uid === G.sel ? null : d.uid; SFX.play('click'); HOOK.select(); };
    box.append(b);
  }
  const count = G.community.applications.length;
  $('#btnAddDoll').textContent = count ? `＋ 邀请新住户 · ${count} 份申请` : '＋ 邀请新住户';
}

function tickInfo() {
  const d = G.dolls.find(o => o.uid === G.sel);
  if (d && !$('#dollInfo').hidden) {
    const partners = confirmedPartners(d), strip = $('#infoPartners');
    const signature = JSON.stringify(partners.map(o => [o.uid, o.name]));
    if (strip.dataset.pairing !== signature) {
      strip.dataset.pairing = signature;
      strip.hidden = !partners.length;
      strip.innerHTML = partners.map(o => `<button class="partner-link" type="button" data-partner="${o.uid}">♥ 恋人 · ${esc(o.name)}</button>`).join('');
    }
    for (const i of document.querySelectorAll('[data-need]')) i.style.width = d.needs[i.dataset.need].toFixed(0) + '%';
    const s = $('#infoDoing'); if (s) s.textContent = doingText(d);
    const m = $('#infoMoney'); if (m) { m.textContent = TEST_MODE ? '∞' : yuan(d.money); m.classList.toggle('neg', !TEST_MODE && d.money < 0); }
    for (const o of G.dolls) {
      if (o === d) continue;
      const r = rel(d, o), lab = document.querySelector(`[data-rl="${o.uid}"]`);
      if (!lab) continue;
      // 信任和醋意是单向的：这里显示的是“我”对 TA 的看法
      const trust = trustWord(trustOf(d, o)), envy = jealousyOf(d, o) >= 20 ? '😤 醋意' : '';
      lab.textContent = [relLabel(r), trust, envy].filter(Boolean).join(' · ');
      document.querySelector(`[data-rel-row="${o.uid}"]`).classList.toggle('couple-rel', arePartners(d, o));
      document.querySelector(`[data-rf="${o.uid}"]`).style.width = Math.max(0, r.f).toFixed(0) + '%';
      document.querySelector(`[data-rlv="${o.uid}"]`).style.width = r.l.toFixed(0) + '%';
    }
  }
  for (const s of document.querySelectorAll('[data-doing]')) {
    const o = G.dolls.find(x => x.uid === +s.dataset.doing); if (o) s.textContent = doingText(o);
  }
  for (const s of document.querySelectorAll('[data-partners]')) {
    const o = G.dolls.find(x => x.uid === +s.dataset.partners);
    if (!o) continue;
    const names = confirmedPartners(o).map(p => p.name).join('、');
    s.hidden = !names;
    const caption = names ? `♥ 恋人 · ${names}` : '';
    if (s.textContent !== caption) s.textContent = caption;
  }
}

HOOK.select = (reveal = false) => {
  if (reveal) $('#side').open = true;
  renderDollList(); renderInfo(); tickInfo(); updateCommunityStatus();
};

/* ---------- 生活日志 ---------- */
function renderLog() {
  const box = $('#logList'); box.innerHTML = '';
  if (!G.log.length) { box.append(el('div', 'log-empty', '还没有发生什么事～')); return; }
  let day = null;
  for (let i = G.log.length - 1; i >= 0; i--) {
    const e = G.log[i];
    if (e.d !== day) { day = e.d; box.append(el('div', 'log-day', monthLabel(e.d))); }
    box.append(el('div', 'log-item', `<time>${hhmm(e.t)}</time><span>${esc(e.text)}</span>`));
  }
}
HOOK.logged = renderLog;
$('#btnLogClear').onclick = () => { G.log = []; renderLog(); save(); };

/* ---------- 顶栏 ---------- */
function setMode(m) {
  if (G.mode === 'build' && m !== 'build') cancelPlacing();
  G.mode = m; G.build.trash = false; G.build.placing = null; G.build.hover = null;
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#buildBar').hidden = m !== 'build';
  $('#hint').textContent = m === 'build' ? '选「院子家具」可以布置屋外，住户会自己去使用。' : '点小人看状态，再点家具安排活动。拖到另一位身边可互动。';
  if (m === 'build') renderPalette();
  SFX.play('click');
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  G.speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(o => o.classList.toggle('on', o === b));
  SFX.play('click');
});
$('#btnSound').onclick = () => { const on = SFX.toggle(); $('#btnSound').textContent = on ? '🔊' : '🔇'; $('#btnSound').classList.toggle('on', on); };
$('#btnWardrobe').onclick = () => openWardrobe(G.sel || (G.dolls[0] && G.dolls[0].uid));

function updateClock() {
  const m = Math.floor(G.time), h = Math.floor(m / 60), mm = m % 60;
  $('#clock').textContent = `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  const S = seasonOf(G.day), Hd = holidayOf(G.day);
  $('#dayLabel').textContent = `${monthLabel(G.day)} · ${S.icon}${S.name}${Hd ? ' · ' + Hd.icon + Hd.name : ''}`;
  const sky = h >= 21 || h < 6 ? '🌙' : h < 8 ? '🌅' : h >= 18 ? '🌇' : '☀️';
  $('#timeIcon').textContent = G.weather && G.weather !== 'sunny' ? WEATHER[G.weather].icon : sky;
  $('#timeIcon').title = WEATHER[G.weather || 'sunny'].name;
}

/* ---------- 布置面板 ---------- */
let tab = 'essentials';
const catalogTabs = document.querySelectorAll('#buildBar [data-tab]');
catalogTabs.forEach(button => button.onclick = () => {
  if (tab === button.dataset.tab) return;
  if (G.build.placing) cancelPlacing();
  tab = button.dataset.tab;
  catalogTabs.forEach(option => {
    option.classList.toggle('on', option === button);
    option.setAttribute('aria-pressed', String(option === button));
  });
  renderPalette();
  SFX.play('click');
});
$('#btnTrash').onclick = () => {
  if (G.build.placing) cancelPlacing();
  G.build.trash = !G.build.trash; $('#btnTrash').classList.toggle('on', G.build.trash);
  $('#buildHint').textContent = G.build.trash ? '删除模式：点击房间里的家具把它移走' : '选择家具后点击房间放置 · 点已有家具可以拿起移动 · 右键/Esc 取消';
  SFX.play('click');
};
$('#btnReset').onclick = () => {
  if (!confirm('把房间恢复成默认布置吗？（住户会保留）')) return;
  const keepDolls = G.dolls.map(d => ({ guest: d.guest, pid: d.pid, name: d.name, gender: d.gender, heart: d.heart, zodiac: d.zodiac, mbti: d.mbti, persona: d.persona, job: d.job, money: d.money, look: d.look, needs: d.needs, routineTimes: d.routineTimes, away: d.state === 'away', awayUntil: d.awayUntil, lastWorkDay: d.lastWorkDay }));
  const keepRel = G.rel;
  const s = defaultHouseSave(); s.dolls = keepDolls; s.time = G.time; s.day = G.day; s.monthEvents = G.monthEvents;
  s.rel = keepRel; s.npcMemory = G.npcMemory; s.paper=G.paper; s.daily=G.daily; s.dayRelations=G.dayRelations; s.community=G.community; applySave(s); rebuild(); save(); HOOK.select(); renderPalette(); HOOK.toast('房间已恢复默认', true);
};

const iconCache = {};
function renderPalette() {
  const pal = $('#palette'); pal.innerHTML = '';
  $('#btnTrash').classList.toggle('on', G.build.trash);
  pal.dataset.category = tab;
  const group = FURNITURE_GROUPS[tab];
  if (group) {
    for (const id of group) {
      const F = FURNITURE[id];
      const [price, lv] = SHOP[id], have = G.inv[id] || 0, locked = lv > G.level && !have;
      const b = el('button', 'item' + (G.build.placing && G.build.placing.id === id && !G.build.placing.moved ? ' on' : '') + (locked ? ' locked' : ''));
      iconCache[id] = iconCache[id] || furnitureIcon(id);
      const c = el('canvas'); c.width = c.height = 56; c.getContext('2d').drawImage(iconCache[id], 0, 0);
      const tag = TEST_MODE ? '无限库存' : have ? `仓库 ×${have}` : locked ? `🔒 ${LEVELS[lv].name}` : yuan(price);
      const purpose = F.use ? ACT_NAMES[F.use] : F.layer === 'wall' ? '挂墙' : '摆在地面';
      b.append(c, el('span', 'item-name', F.name), el('small', 'item-purpose', purpose),
        el('small', 'price' + (TEST_MODE || have ? ' own' : price > G.fund && !locked ? ' poor' : ''), tag));
      b.title = `${F.name} · ${purpose}`;
      b.onclick = () => {
        if (locked) { HOOK.toast(`🔒 扩建成「${LEVELS[lv].name}」才能买${F.name}`, true); SFX.play('deny'); return; }
        if (G.build.placing && G.build.placing.moved) cancelPlacing();
        G.build.trash = false;
        G.build.placing = G.build.placing && G.build.placing.id === id ? null : { id };
        SFX.play('click'); renderPalette();
      };
      pal.append(b);
    }
  } else {
    const isWall = tab === 'wall', list = isWall ? WALLS : FLOORS;
    for (const s of list) {
      const b = el('button', 'item' + ((isWall ? G.wall : G.floor) === s.id ? ' on' : ''));
      b.append(swatchIcon(s, isWall), el('span', null, s.name));
      b.onclick = () => { if (isWall) G.wall = s.id; else G.floor = s.id; SFX.play('place'); save(); renderPalette(); };
      pal.append(b);
    }
  }
}
HOOK.refresh = () => { renderShopBar(); if (G.mode === 'build') renderPalette(); };

/* ---------- 家庭基金与扩建 ---------- */
function renderShopBar() {
  const fund = TEST_MODE ? '∞' : yuan(G.fund);
  $('#fundAmt').textContent = $('#fundTop').textContent = fund;
  const L = LEVELS[G.level], next = LEVELS[G.level + 1];
  $('#houseLv').textContent = `🏠 ${L.name}（Lv${G.level} · 最多 ${L.cap} 人）`;
  const ex = $('#btnExpand');
  ex.textContent = next ? `🔨 扩建成「${next.name}」${yuan(next.cost)}` : '🏰 已经是最大的房子了';
  ex.disabled = !next;
  ex.classList.toggle('ready', !!next && G.fund >= next.cost);
  $('#btnCrowd').disabled = TEST_MODE || G.crowdDay === G.day;
}
$('#btnCrowd').onclick = () => crowdfund();
$('#btnExpand').onclick = () => expand();

/* ---------- 衣橱 ---------- */
let wdUid = null, wdDir = 'down', wdFrame = 0, wdTimer = 0;
const wdDoll = () => G.dolls.find(d => d.uid === wdUid);

function openWardrobe(uid) {
  const resident = residents().find(d => d.uid === uid) || residents()[0];
  if (!resident) return;
  wdUid = resident.uid;
  $('#wardrobe').hidden = false; SFX.play('open');
  renderWardrobe();
}
function closeWardrobe() { $('#wardrobe').hidden = true; HOOK.select(); save(); }
$('#wdClose').onclick = closeWardrobe;
$('#wardrobe').addEventListener('pointerdown', e => { if (e.target.id === 'wardrobe') closeWardrobe(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#wardrobe').hidden) closeWardrobe(); });
document.querySelectorAll('.wd-dir button').forEach(b => b.onclick = () => { wdDir = b.dataset.dir; SFX.play('click'); });
$('#wdName').oninput = e => { const d = wdDoll(); if (d) { d.name = e.target.value.trim() || '无名'; renderWdTabs(); } };
$('#wdRandom').onclick = () => {
  const d = wdDoll(); if (!d) return;
  d.look = randomLook(); SFX.play('love'); renderWardrobe();
};
$('#wdRemove').onclick = () => {
  const d = wdDoll(); if (!d) return;
  if (residents().length <= 1) { HOOK.toast('至少要留一位住户哦', true); return; }
  if (!confirm(`真的要让 ${d.name} 搬走吗？`)) return;
  if (d.act) endAct(d);
  for (const o of G.dolls) if (o.act && o.act.partner === d) endAct(o);
  G.dolls = G.dolls.filter(o => o !== d);
  if (G.sel === d.uid) G.sel = null;
  HOOK.toast(`${d.name} 挥挥手搬走了`); wdUid = residents()[0].uid; renderWardrobe(); HOOK.select(); save();
};

function renderWdTabs() {
  const box = $('#wdTabs'); box.innerHTML = '';
  for (const d of residents()) {
    const b = el('button', d.uid === wdUid ? 'on' : '', esc(d.name));
    b.onclick = () => { wdUid = d.uid; SFX.play('click'); renderWardrobe(); };
    box.append(b);
  }
}

function renderWardrobe() {
  const d = wdDoll(); if (!d) return;
  renderWdTabs();
  $('#wdName').value = d.name;
  const box = $('#wdOptions'); box.innerHTML = '';
  const section = (title, node) => { const s = el('div', 'opt'); s.append(el('h4', null, title), node); box.append(s); };
  const chips = (obj, key) => {
    const w = el('div', 'chips');
    for (const [k, name] of Object.entries(obj)) {
      const b = el('button', 'chip' + (d.look[key] === k ? ' on' : ''), name);
      b.onclick = () => { d.look[key] = k; SFX.play('pop'); renderWardrobe(); };
      w.append(b);
    }
    return w;
  };
  const swatches = (cols, key) => {
    const w = el('div', 'chips');
    cols.forEach((col, i) => {
      const b = el('button', 'swatch' + (d.look[key] === i ? ' on' : ''));
      b.style.background = col; b.setAttribute('aria-label', col);
      b.onclick = () => { d.look[key] = i; SFX.play('pop'); renderWardrobe(); };
      w.append(b);
    });
    return w;
  };
  const pers = el('div', 'chips');
  for (const [k, P] of Object.entries(PERSONAS)) {
    const b = el('button', 'chip' + (d.persona === k ? ' on' : ''), `${P.icon} ${P.name}<small>${P.desc}</small>`);
    b.onclick = () => { d.persona = k; SFX.play('pop'); say(d, pick(P.lines)); renderWardrobe(); };
    pers.append(b);
  }
  section('性格', pers);
  const jobs = el('div', 'chips');
  for (const [k, J] of Object.entries(JOBS)) {
    const sub = J.start == null ? (k === 'artist' ? '不用出门 · 偶尔卖画' : '不用出门 · 没有收入') : `${hhmm(J.start)}–${hhmm(J.end)} · ${yuan(J.wage)}/月${k === 'student' ? ' · 不谈恋爱' : ''}`;
    const b = el('button', 'chip' + (d.job === k ? ' on' : ''), `${J.icon} ${J.name}<small>${sub}</small>`);
    b.onclick = () => {
      d.job = k; SFX.play('pop');
      if (k === 'student') { clearRomance(d); HOOK.toast('学生不参与恋爱剧情，和 TA 有关的恋爱关系已清零', true); }
      renderWardrobe();
    };
    jobs.append(b);
  }
  section('职业', jobs);
  const gen = el('div', 'chips');
  for (const [k, n] of Object.entries(GENDERS)) {
    const b = el('button', 'chip' + (d.gender === k ? ' on' : ''), n);
    b.onclick = () => { d.gender = k; SFX.play('pop'); renderWardrobe(); };
    gen.append(b);
  }
  section('性别', gen);
  const zs = el('div', 'chips');
  for (const z of ZODIAC) {
    const b = el('button', 'chip' + (d.zodiac === z.id ? ' on' : ''), `${z.icon} ${z.name}<small>${ELEMENTS[z.el].icon}${ELEMENTS[z.el].name}</small>`);
    b.onclick = () => { d.zodiac = z.id; SFX.play('pop'); renderWardrobe(); };
    zs.append(b);
  }
  section('星座', zs);
  const mbtiPicker = el('select', 'mbti-picker');
  mbtiPicker.setAttribute('aria-label', 'MBTI 类型');
  for (const [code, name] of Object.entries(MBTI_NAMES)) {
    const option = el('option', null, `${code} · ${name}`);
    option.value = code;
    mbtiPicker.append(option);
  }
  mbtiPicker.value = mb(d);
  mbtiPicker.onchange = () => { d.mbti = mbtiPicker.value; SFX.play('pop'); renderWardrobe(); };
  const mbtiBox = el('div', 'mbti-settings');
  mbtiBox.append(mbtiPicker, el('small', 'hint', `常见偏好 · ${MBTI_INTERESTS[mb(d)].map(use => ACT_NAMES[use]).join('、')}`));
  section('MBTI', mbtiBox);
  const hearts = el('div', 'chips');
  for (const [k, H] of Object.entries(HEARTS)) {
    const b = el('button', 'chip' + (d.heart === k ? ' on' : ''), `${H.icon} ${H.name}<small>${H.desc}</small>`);
    b.onclick = () => { d.heart = k; SFX.play('pop'); renderWardrobe(); };
    hearts.append(b);
  }
  section('感情观', hearts);
  section('肤色', swatches(OUTFIT.skin, 'skin'));
  section('发型', chips(OUTFIT.hair, 'hair'));
  section('发色', swatches(OUTFIT.hairColor, 'hairColor'));
  section('上衣', chips(OUTFIT.top, 'top'));
  section('上衣颜色', swatches(OUTFIT.clothColor, 'topColor'));
  if (d.look.top !== 'dress') section('下装', chips(OUTFIT.bottom, 'bottom'));
  section(d.look.top === 'overall' ? '背带颜色' : '下装颜色', swatches(OUTFIT.clothColor, 'bottomColor'));
  section('鞋子', swatches(OUTFIT.shoes, 'shoes'));
  section('配饰', chips(OUTFIT.acc, 'acc'));
  drawWdPreview();
}
function drawWdPreview() { const d = wdDoll(); if (d) dollPortrait($('#wdCanvas'), d.look, wdDir, wdFrame, 'walk'); }

/* ---------- 串门、派对与入住 ---------- */
function updateCommunityStatus() {
  const event = G.community.active;
  const status = $('#communityStatus');
  status.hidden = !event;
  if (!event) return;
  const style = GET_TOGETHERS[event.kind], host = communityDoll(event.hostPid), guest = communityDoll(event.guestPid);
  const label = event.leavingAt ? `👋 ${guest?.name || '朋友'} 正在回家` : `${style.icon} ${style.name} · ${host?.name || '住户'}邀请了${guest?.name || '朋友'} · ${event.joined.length} 人参与`;
  if (status.textContent !== label) status.textContent = label;
}
HOOK.community = updateCommunityStatus;

$('#btnCommunity').onclick = () => {
  const hosts = availableHosts();
  const select = $('#communityHost');
  select.innerHTML = '';
  for (const d of hosts) {
    const option = el('option');
    option.value = d.pid; option.textContent = d.name; select.append(option);
  }
  if (hosts.some(d => d.uid === G.sel)) select.value = hosts.find(d => d.uid === G.sel).pid;
  const event = G.community.active;
  const ready = !event && absNow() >= G.community.nextEventAt && hosts.length > 0;
  $('#communityHelp').textContent = event ? `正在进行${GET_TOGETHERS[event.kind].name}，结束后可以再邀请朋友。`
    : !hosts.length ? '现在没有在家且醒着的住户。'
    : !ready ? '刚送走朋友，让小屋休息一会儿吧。'
    : '选一位住户做东。朋友会从门口进来，有空的室友可以加入派对。';
  const choices = $('#communityChoices');
  choices.innerHTML = '';
  for (const [kind, style] of Object.entries(GET_TOGETHERS)) {
    const button = el('button', 'btn small', `${style.icon} ${kind === 'visit' ? '请朋友来玩' : '办' + style.name}`);
    button.disabled = !ready;
    button.onclick = () => {
      if (startGetTogether(communityDoll(select.value), kind)) $('#communityDialog').close();
      else $('#communityHelp').textContent = '现在办不了。确认主人在家，门口和一楼客厅有通道和空位。';
    };
    choices.append(button);
  }
  $('#communityDialog').showModal();
};

function welcomeResident(d) {
  if (!d) { renderApplications(); return; }
  $('#applicationsDialog').close();
  G.sel = d.uid;
  say(d, '大家好，请多关照！');
  spawnHeart(d);
  SFX.play('love');
  HOOK.select();
  HOOK.toast(`${d.name} 搬进来啦！`);
  save();
}

function renderApplications() {
  const canMove = residents().length < residentLimit();
  $('#applicationSpace').textContent = `住户 ${residents().length} / ${residentLimit()}${canMove ? '' : ' · 小屋已住满，可以扩建或留待有空位时再邀请。'}`;
  const list = $('#applicationList');
  list.innerHTML = '';
  for (const application of G.community.applications) {
    const friend = G.community.friends.find(f => f.pid === application.pid);
    if (!friend) continue;
    const entry = el('div', 'application-row');
    const portrait = el('canvas'); portrait.width = 20; portrait.height = 24;
    dollPortrait(portrait, friend.look);
    const info = el('div', 'application-info');
    const title = el('strong'); title.textContent = friend.name;
    const host = communityDoll(friend.hostPid);
    const detail = el('small');
    detail.textContent = `${PERSONAS[friend.persona].name} · ${host ? host.name + '的朋友' : '来访过的朋友'} · 来访 ${friend.visits} 次`;
    info.append(title, detail);
    const button = el('button', 'btn small', '邀请入住');
    button.setAttribute('aria-label', `邀请 ${friend.name} 入住`);
    button.disabled = !canMove;
    button.onclick = () => welcomeResident(moveInApplicant(friend.pid));
    entry.append(portrait, info, button); list.append(entry);
  }
  if (!list.children.length) list.append(el('p', 'hint', '还没有入住申请。朋友来玩得开心，就可能在离开时留下申请。'));
  $('#btnRandomResident').disabled = !canMove;
}
$('#btnAddDoll').onclick = () => { renderApplications(); $('#applicationsDialog').showModal(); };
$('#btnRandomResident').onclick = () => {
  if (residents().length < residentLimit()) welcomeResident(addDoll(newcomerProfile()));
};

/* ---------- 主循环 ---------- */
load(); rebuild(); HOOK.select(); updateClock(); renderLog(); renderShopBar();
let last = performance.now(), uiT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; updateClock(); tickInfo(); renderShopBar(); }
  if (!$('#wardrobe').hidden) { wdTimer += dt; if (wdTimer > 0.18) { wdTimer = 0; wdFrame = (wdFrame + 1) % 4; drawWdPreview(); } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('beforeunload', save);

document.getElementById('dailyPaper').onclick=showHousePaper;
document.getElementById('paperOlder').onclick = () => renderHousePaper(housePaperIndex - 1);
document.getElementById('paperNewer').onclick = () => renderHousePaper(housePaperIndex + 1);
document.getElementById('paperCopy').onclick = async () => {
  const issue = currentHousePaper();
  if (!issue) return;
  try {
    await navigator.clipboard.writeText(housePaperText(issue));
    HOOK.toast('已复制本期月报', true);
  } catch { HOOK.toast('可以选中月报文字手动复制', true); }
};
const paperAuto=document.getElementById('paperAuto');
const paperPreference = TEST_MODE ? 'house-test-paper-auto' : 'house-paper-auto';
paperAuto.checked=true;
try{paperAuto.checked=localStorage.getItem(paperPreference)!=='off';}catch{}
paperAuto.onchange=()=>{try{localStorage.setItem(paperPreference,paperAuto.checked?'on':'off');}catch{}};
updateHousePaperButton();

const paperOffline=document.getElementById('paperOffline');
paperOffline.checked=offlineEnabled();
paperOffline.onchange=()=>{try{localStorage.setItem(OFFLINE_KEY,paperOffline.checked?'on':'off');}catch{}};
document.getElementById('paperCard').onclick = () => {
  const issue = currentHousePaper();
  if (issue) saveHousePaperCard(issue);
};
function renderRewind(){
  const list=document.getElementById('rewindList');
  const snaps=SaveManager.snapshots(localStorage,SAVE_KEY).sort((a,b)=>b.day-a.day);
  list.replaceChildren(...snaps.map(snap=>{
    const row=el('div','rewind-row',`<span>${monthLabel(snap.day)} 月初${snap.day===G.day?' · 本月':''}</span>`);
    const button=el('button','btn small ghost','回到这里');
    button.onclick=()=>{
      if(!confirm(`回到${monthLabel(snap.day)}月初？之后发生的事都会被改写。`))return;
      if(restoreHouseSnapshot(snap.index)){
        document.getElementById('paperDialog').close();
        HOOK.select();updateClock();renderLog();renderShopBar();updateHousePaperButton();
        HOOK.toast(`🕰 回到了${monthLabel(G.day)}月初`,true);
      }else HOOK.toast('这份快照读不出来了',true);
    };
    row.append(button);return row;
  }));
  if(!snaps.length)list.textContent='还没有快照。';
}
document.querySelector('.rewind-box').addEventListener('toggle',renderRewind);

// 离线模拟：补上关掉页面期间的生活
const away=catchUpOffline();
if(away){renderLog();HOOK.select();updateClock();if(away.hours>=1)HOOK.toast(`🌙 你不在的 ${away.hours} 小时里，小屋发生了 ${away.happened} 件事`,true);}
</script>
</body>
