<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素小屋</title>
<style>
:root{
  --bg:#f4e9d8;
  --bg-2:#ead9bf;
  --panel:#fffaf0;
  --panel-2:#f6ead6;
  --ink:#3b2a2f;
  --muted:#8a7366;
  --line:#3b2a2f;
  --accent:#e26d7d;
  --accent-ink:#fff;
  --sel:#ffd35c;
  --good:#7cc576;
  --warn:#f0a64a;
  --bad:#e26d6d;
  --shadow:#3b2a2f;
  --backdrop:rgba(40,28,34,.5);
  --font-display:"PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-pixel:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221b26;--bg-2:#2c2332;--panel:#2f2637;--panel-2:#3b3044;--ink:#f3e8da;--muted:#b6a394;
    --line:#120d15;--shadow:#0a070c;--backdrop:rgba(5,3,8,.65);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221b26;--bg-2:#2c2332;--panel:#2f2637;--panel-2:#3b3044;--ink:#f3e8da;--muted:#b6a394;
  --line:#120d15;--shadow:#0a070c;--backdrop:rgba(5,3,8,.65);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(var(--bg-2) 1.5px,transparent 1.5px);
  background-size:18px 18px;
  color:var(--ink);font-family:var(--font-body);
  display:flex;flex-direction:column;min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0}

.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);
  border-bottom:3px solid var(--line);
}
.topbar h1{font-size:24px;letter-spacing:2px;color:var(--accent)}
.clock{font-family:var(--font-pixel);font-size:14px;display:flex;gap:8px;align-items:center;
  background:var(--panel-2);border:2px solid var(--line);padding:3px 10px;border-radius:6px}
.clock #dayLabel{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.modes,.speed{display:flex;gap:6px}
.modes{margin-left:auto}
.modes button,.speed button,.btn,.tab{
  background:var(--panel-2);border:2px solid var(--line);border-radius:6px;
  padding:6px 12px;box-shadow:0 3px 0 var(--shadow);transition:transform .05s;
}
.modes button:active,.speed button:active,.btn:active,.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.modes button.on,.speed button.on,.tab.on{background:var(--sel);color:#3b2a2f}
.speed button{padding:6px 9px}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger,.btn.on{background:var(--accent);color:var(--accent-ink)}

.layout{flex:1;display:flex;gap:16px;padding:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#stageWrap{flex:1 1 560px;max-width:900px;min-width:0}
#stage{
  position:relative;width:100%;aspect-ratio:4/3;
  border:3px solid var(--line);border-radius:6px;overflow:hidden;
  box-shadow:0 6px 0 var(--shadow);background:#000;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#overlay{position:absolute;inset:0;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}

.bubble{
  position:absolute;transform:translate(-50%,-100%);
  background:#fffaf0;color:#3b2a2f;border:2px solid #3b2a2f;border-radius:8px;
  padding:3px 8px;font-size:13px;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.25);animation:pop .18s ease-out;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;
  border:5px solid transparent;border-top-color:#3b2a2f;border-bottom:0}
.nametag{position:absolute;transform:translate(-50%,0);font-size:11px;padding:1px 6px;border-radius:4px;
  background:rgba(59,42,47,.8);color:#fff;white-space:nowrap}
.heart{position:absolute;font-size:14px;animation:floatUp 1s ease-out forwards}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
@keyframes floatUp{to{transform:translateY(-28px);opacity:0}}

#side{flex:0 1 270px;min-width:240px;display:flex;flex-direction:column;gap:10px}
#side h2{font-size:20px}
#dollList{display:flex;flex-direction:column;gap:6px}
.doll-row{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--panel);
  border:2px solid var(--line);border-radius:6px;cursor:pointer;text-align:left;width:100%}
.doll-row.sel{background:var(--sel);color:#3b2a2f}
.doll-row canvas{width:30px;height:36px;image-rendering:pixelated;flex:none}
.doll-row .meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.doll-row .meta b{font-weight:600}
.doll-row .meta small{opacity:.75;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px;box-shadow:0 4px 0 var(--shadow)}
.card h3{margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:18px}
.card .persona{font-size:13px;color:var(--muted);margin-bottom:8px}
.need{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center;font-size:12px;margin:5px 0}
.bar{height:10px;border:2px solid var(--line);border-radius:3px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.card .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card .doing{font-size:13px;margin:6px 0 2px}
.rels{margin-top:10px;border-top:2px dashed var(--panel-2);padding-top:8px}
.rels h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.rel{margin:0 0 8px}
.rel-top{display:flex;justify-content:space-between;font-size:13px}
.rel-top small{color:var(--muted)}
.rel-bars{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px;align-items:center;font-size:11px;margin-top:2px}
.rel-bars .bar{height:8px}

#buildBar{background:var(--panel);border-top:3px solid var(--line);padding:10px 16px 12px;position:sticky;bottom:0}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs .spacer{flex:1}
.palette{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px}
.item{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--panel-2);border:2px solid var(--line);border-radius:6px;padding:6px 4px;font-size:12px}
.item.on{background:var(--sel);color:#3b2a2f}
.item canvas{width:56px;height:56px;image-rendering:pixelated}

.modal{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal[hidden],#buildBar[hidden],.card[hidden]{display:none}
.modal-card{background:var(--panel);border:3px solid var(--line);border-radius:8px;box-shadow:0 8px 0 var(--shadow);
  width:min(820px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.wd-tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.wd-tabs button{background:var(--panel-2);border:2px solid var(--line);border-radius:6px;padding:3px 10px}
.wd-tabs button.on{background:var(--sel);color:#3b2a2f}
.wd-body{display:flex;gap:16px;padding:14px;overflow:auto;flex-wrap:wrap}
.wd-preview{flex:0 0 200px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto}
#wdCanvas{width:200px;height:240px;image-rendering:pixelated;border:2px solid var(--line);border-radius:6px;
  background:repeating-conic-gradient(var(--panel-2) 0 25%,var(--panel) 0 50%) 0 0/20px 20px}
.wd-dir{display:flex;gap:4px}
.wd-dir button{border:2px solid var(--line);background:var(--panel-2);border-radius:4px;width:34px;height:28px}
.wd-name{font-size:13px;display:flex;gap:6px;align-items:center}
.wd-name input{width:110px;font:inherit;padding:3px 6px;border:2px solid var(--line);border-radius:4px;background:var(--panel-2);color:var(--ink)}
.wd-options{flex:1 1 360px;display:flex;flex-direction:column;gap:12px;min-width:0}
.opt h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 10px;font-size:13px}
.chip.on{background:var(--sel);color:#3b2a2f}
.chip small{display:block;font-size:11px;opacity:.7}
.swatch{width:26px;height:26px;border:2px solid var(--line);border-radius:5px;padding:0}
.swatch.on{outline:3px solid var(--accent);outline-offset:1px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:6px;font-size:14px;
  transition:all .25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:700px){
  .topbar{padding:8px 16px;gap:8px}
  .topbar h1{font-size:20px}
  .modes{margin-left:0;order:3;width:100%}
  .modes button{flex:1;padding:6px 4px}
  .layout{padding:12px 16px;gap:12px}
  #side{flex:1 1 100%}
  .bubble{font-size:11px;padding:2px 6px}
}
</style>
</head>
<body>
<header class="topbar">
  <h1>像素小屋</h1>
  <div class="clock" title="游戏时间">
    <span id="dayLabel">第 1 天</span>
    <span id="clock">08:00</span>
    <span id="timeIcon">☀️</span>
  </div>
  <nav class="modes" aria-label="模式">
    <button class="mode on" data-mode="live">🏠 生活</button>
    <button class="mode" data-mode="build">🪑 布置</button>
    <button id="btnWardrobe">👗 衣橱</button>
  </nav>
  <div class="speed" aria-label="速度">
    <button data-speed="0" title="暂停">⏸</button>
    <button data-speed="1" class="on" title="正常">▶</button>
    <button data-speed="3" title="快进">⏩</button>
    <button id="btnSound" title="声音">🔇</button>
  </div>
</header>

<main class="layout">
  <div id="stageWrap">
    <div id="stage">
      <canvas id="cv" width="256" height="192"></canvas>
      <div id="overlay"></div>
    </div>
    <p id="hint" class="hint">点击小人查看状态，按住可以把 TA 拎起来放到别处～</p>
  </div>

  <aside id="side">
    <h2>住户</h2>
    <div id="dollList"></div>
    <div id="dollInfo" class="card" hidden></div>
    <button id="btnAddDoll" class="btn ghost">＋ 邀请新住户</button>
  </aside>
</main>

<section id="buildBar" hidden>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="furniture">家具</button>
    <button class="tab" data-tab="wall">墙纸</button>
    <button class="tab" data-tab="floor">地板</button>
    <span class="spacer"></span>
    <button id="btnTrash" class="btn small" title="点击家具删除">🗑 删除模式</button>
    <button id="btnReset" class="btn small ghost">恢复默认</button>
  </div>
  <div id="palette" class="palette"></div>
  <p id="buildHint" class="hint">选择家具后点击房间放置 · 点已有家具可以拿起移动 · 右键/Esc 取消</p>
</section>

<div id="wardrobe" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>👗 衣橱</h2>
      <div id="wdTabs" class="wd-tabs"></div>
      <button id="wdClose" class="btn small" aria-label="关闭">✕</button>
    </div>
    <div class="wd-body">
      <div class="wd-preview">
        <canvas id="wdCanvas" width="20" height="24"></canvas>
        <div class="wd-dir">
          <button data-dir="left">◀</button>
          <button data-dir="down">●</button>
          <button data-dir="right">▶</button>
          <button data-dir="up">▲</button>
        </div>
        <label class="wd-name">名字 <input id="wdName" maxlength="8"></label>
        <button id="wdRandom" class="btn small">🎲 随机搭配</button>
        <button id="wdRemove" class="btn small ghost">请 TA 搬走</button>
      </div>
      <div id="wdOptions" class="wd-options"></div>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>

    box(c, x + 2, y + 3, 12, 24, '#3d3a66');
    R(c, x + 7, y + 8, 2, 6, '#f2d16b'); R(c, x + 5, y + 10, 6, 2, '#f2d16b'); R(c, x + 6, y + 9, 4, 4, '#f2d16b');
    R(c, x + 4, y + 18, 8, 1, '#e26d7d'); R(c, x + 5, y + 21, 6, 1, '#ffffff'); R(c, x + 5, y + 23, 4, 1, '#ffffff');
    R(c, x + 7, y + 2, 2, 2, '#e26d7d');
  },
};

// 家具在 y 方向的视觉顶部（用于选中高亮、图标裁切）
const TALL = { bed: 8, sofa: 8, chair: 9, table: 6, fridge: 18, stove: 12, shelf: 22, tv: 17, arcade: 18, piano: 14, bath: 9, plant: 18, lamp: 21, catbed: 0 };

// 把一件家具画成调色板里的小图标
function furnitureIcon(id, size = 56) {
  const d = FURNITURE[id], top = d.layer ? 0 : (TALL[id] || 0);
  const pw = d.w * T, ph = d.h * T + top;
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
  const tmp = document.createElement('canvas'); tmp.width = pw; tmp.height = ph;
  const tc = tmp.getContext('2d');
  DRAW[id](tc, 0, top, { color: null }, 0);
  const s = Math.max(1, Math.floor(Math.min(size / pw, size / ph)));
  c.drawImage(tmp, (size - pw * s) / 2 | 0, (size - ph * s) / 2 | 0, pw * s, ph * s);
  return cv;
}

function swatchIcon(spec, isWall, size = 56) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const c = cv.getContext('2d');
  c.save(); c.translate(0, isWall ? 0 : -(WALL_ROWS * T + 1));

<script>
// 小人像素绘制：12×20 的小人，头身比偏大，按层叠画出 腿→身体→手→头→头发→配饰

function dollColors(L) {
  return {
    skin: OUTFIT.skin[L.skin] || OUTFIT.skin[0],
    hair: OUTFIT.hairColor[L.hairColor] || OUTFIT.hairColor[0],
    top: OUTFIT.clothColor[L.topColor] || OUTFIT.clothColor[0],
    bot: OUTFIT.clothColor[L.bottomColor] || OUTFIT.clothColor[0],
    shoe: OUTFIT.shoes[L.shoes] || OUTFIT.shoes[0],
  };
}

// 头发形状（相对小人左上角的矩形），会自动加一圈描边
const HAIR = {
  down: {
    base: [[1, 0, 10, 3], [1, 3, 1, 3], [10, 3, 1, 3]],
    short: [[2, 3, 3, 1], [7, 3, 2, 1]],
    long: [[2, 3, 3, 1], [7, 3, 2, 1], [0, 2, 2, 11], [10, 2, 2, 11]],
    twin: [[2, 3, 3, 1], [7, 3, 2, 1], [-2, 3, 3, 7], [11, 3, 3, 7]],
    bun: [[2, 3, 3, 1], [7, 3, 2, 1], [4, -3, 4, 3]],
    spiky: [[2, -2, 2, 2], [5, -3, 2, 3], [8, -2, 2, 2], [2, 3, 2, 1], [5, 3, 2, 1], [8, 3, 1, 1]],
    bob: [[2, 3, 8, 1], [0, 2, 2, 7], [10, 2, 2, 7]],
  },
  up: {
    base: [[1, 0, 10, 9]],
    short: [], long: [[0, 2, 12, 11]], twin: [[-2, 3, 3, 7], [11, 3, 3, 7]],
    bun: [[4, -3, 4, 3]], spiky: [[2, -2, 2, 2], [5, -3, 2, 3], [8, -2, 2, 2]], bob: [[0, 2, 12, 7]],
  },
  right: {
    base: [[1, 0, 10, 3], [1, 2, 4, 6], [8, 3, 2, 1]],
    short: [], long: [[0, 2, 4, 11]], twin: [[-2, 3, 3, 7]],
    bun: [[3, -3, 4, 3]], spiky: [[2, -2, 2, 2], [5, -3, 2, 3], [8, -2, 2, 2]], bob: [[0, 2, 5, 7], [6, 3, 4, 1]],
  },
};

function blob(c, x, y, rects, col) {
  for (const [a, b, w, h] of rects) R(c, x + a - 1, y + b - 1, w + 2, h + 2, INK);
  for (const [a, b, w, h] of rects) R(c, x + a, y + b, w, h, col);
}

/* o: { dir, frame, pose: stand|walk|sit|lift|dance|head, hop, blink, happy } */
function drawDoll(c, cx, by, L, o = {}) {
  const dir = o.dir || 'down', fr = o.frame || 0, pose = o.pose || 'stand';
  const C = dollColors(L);
  const x = Math.round(cx) - 6;
  let y = Math.round(by) - 20 - (o.hop || 0);
  const view = dir === 'left' ? 'right' : dir;

  if (pose !== 'lift' && pose !== 'sit' && pose !== 'head')
    R(c, x + 2, Math.round(by) - 1, 8, 2, 'rgba(0,0,0,.22)');

  c.save();
  if (dir === 'left') { c.translate(x * 2 + 12, 0); c.scale(-1, 1); }

  if (pose === 'head') { y = Math.round(by) - 9; drawHead(c, x, y, L, C, view, { sleep: true }); c.restore(); return; }

  const walking = pose === 'walk';
  const bob = walking && fr % 2 === 1 ? -1 : 0;
  const isDress = L.top === 'dress';
  const legCol = L.bottom === 'pants' && !isDress ? C.bot : C.skin;

  // 腿
  if (pose === 'sit') {
    R(c, x + 3, y + 15, 6, 2, legCol); R(c, x + 3, y + 17, 2, 1, C.shoe); R(c, x + 7, y + 17, 2, 1, C.shoe);
  } else {
    let upL = 0, upR = 0;
    if (walking) { upL = fr === 1 ? 1 : 0; upR = fr === 3 ? 1 : 0; }
    if (pose === 'lift') { upL = fr % 2; upR = 1 - fr % 2; }
    if (pose === 'dance') { upL = fr % 2 ? 2 : 0; }
    const leg = (lx, up) => {
      R(c, x + lx - 1, y + 15, 4, 5 - up, INK);
      R(c, x + lx, y + 15, 2, 4 - up, legCol);
      if (L.bottom === 'shorts' && !isDress) R(c, x + lx, y + 15, 2, 1, C.bot);
      R(c, x + lx, y + 19 - up, 2, 1, C.shoe);
    };
    if (view === 'right') { leg(4 + (walking ? (fr === 1 ? -1 : fr === 3 ? 1 : 0) : 0), upL); leg(6 - (walking ? (fr === 1 ? -1 : fr === 3 ? 1 : 0) : 0), upR); }
    else { leg(3, upL); leg(7, upR); }
  }

  // 身体
  const yb = y + bob;
  box(c, x + 2, yb + 9, 8, 7, C.top);
  const front = view === 'down';
  if (L.top === 'tee' && front) R(c, x + 5, yb + 10, 2, 1, C.skin);
  if (L.top === 'hoodie') { R(c, x + 3, yb + 13, 6, 1, shade(C.top, -0.15)); if (front) { R(c, x + 5, yb + 10, 1, 2, '#fff'); R(c, x + 7, yb + 10, 1, 2, '#fff'); } }
  if (L.top === 'stripe') { R(c, x + 3, yb + 11, 6, 1, '#ffffff'); R(c, x + 3, yb + 13, 6, 1, '#ffffff'); }
  if (L.top === 'overall') { R(c, x + 3, yb + 10, 6, 5, '#fffaf0'); R(c, x + 4, yb + 12, 4, 3, C.bot); R(c, x + 4, yb + 10, 1, 2, C.bot); R(c, x + 7, yb + 10, 1, 2, C.bot); }
  if (L.top === 'suit' && front) { R(c, x + 5, yb + 10, 2, 3, '#ffffff'); R(c, x + 5, yb + 11, 1, 2, '#e26d7d'); }
  // 下装（连衣裙自带裙摆）
  if (isDress || L.bottom === 'skirt') {
    const sc = isDress ? C.top : C.bot;
    R(c, x + 1, yb + 14, 10, 4, INK); R(c, x + 2, yb + 14, 8, 3, sc); R(c, x + 2, yb + 16, 8, 1, shade(sc, -0.15));
  } else if (pose !== 'sit') { R(c, x + 3, yb + 14, 6, 1, C.bot); }

  // 手臂
  const sleeve = L.top === 'hoodie' || L.top === 'suit' || L.top === 'stripe' ? 3 : 2;
  const arm = (ax, dy, up) => {
    if (up) { R(c, x + ax - 1, yb + 5, 3, 7, INK); R(c, x + ax, yb + 6, 1, 5, C.top); R(c, x + ax, yb + 5, 1, 1, C.skin); return; }
    R(c, x + ax - 1, yb + 9 + dy, 3, 6, INK);
    R(c, x + ax, yb + 10 + dy, 1, sleeve, L.top === 'overall' ? '#fffaf0' : C.top);
    R(c, x + ax, yb + 10 + dy + sleeve, 1, 4 - sleeve, C.skin);
  };
  const sw = walking ? (fr === 1 ? 1 : fr === 3 ? -1 : 0) : 0;
  if (view === 'right') arm(6, sw, pose === 'lift' || (pose === 'dance' && fr % 2));
  else {
    const upA = pose === 'lift' || (pose === 'dance' && fr % 2 === 0);
    const upB = pose === 'lift' || (pose === 'dance' && fr % 2 === 1);
    arm(1, sw, upA); arm(10, -sw, upB);
  }

  drawHead(c, x, yb, L, C, view, o);
  c.restore();
}

function drawHead(c, x, y, L, C, view, o) {
  box(c, x + 1, y + 1, 10, 9, C.skin);
  if (view === 'down') {
    if (L.acc === 'glasses') { R(c, x + 3, y + 4, 3, 3, INK); R(c, x + 6, y + 4, 3, 3, INK); R(c, x + 4, y + 5, 1, 1, '#cfeaf7'); R(c, x + 7, y + 5, 1, 1, '#cfeaf7'); }
    if (o.sleep || o.blink) { R(c, x + 3, y + 6, 2, 1, INK); R(c, x + 7, y + 6, 2, 1, INK); }
    else if (L.acc === 'glasses') { R(c, x + 4, y + 5, 1, 1, INK); R(c, x + 7, y + 5, 1, 1, INK); }
    else { R(c, x + 4, y + 5, 1, 2, INK); R(c, x + 7, y + 5, 1, 2, INK); }
    R(c, x + 2, y + 7, 2, 1, '#f59aa8'); R(c, x + 8, y + 7, 2, 1, '#f59aa8');
    if (o.happy) R(c, x + 5, y + 8, 2, 1, '#c0505a');
  } else if (view === 'right') {
    if (L.acc === 'glasses') { R(c, x + 6, y + 4, 3, 3, INK); R(c, x + 7, y + 5, 1, 1, '#cfeaf7'); }
    if (o.blink) R(c, x + 7, y + 6, 2, 1, INK); else R(c, x + 7, y + 5, 1, 2, L.acc === 'glasses' ? INK : INK);
    R(c, x + 8, y + 7, 2, 1, '#f59aa8');
    if (o.happy) R(c, x + 9, y + 8, 1, 1, '#c0505a');
  }

  const set = HAIR[view];
  const rects = set.base.concat(set[L.hair] || []);
  blob(c, x, y, rects, C.hair);
  if (view !== 'up') R(c, x + 3, y + 1, 3, 1, shade(C.hair, 0.18)); // 头发高光
  drawAcc(c, x, y, L, C, view);
}

function drawAcc(c, x, y, L, C, view) {
  const a = L.acc;
  if (a === 'cap') {
    blob(c, x, y, [[1, -1, 10, 3]], C.top);
    if (view === 'down') R(c, x + 1, y + 2, 10, 1, shade(C.top, -0.25));
    if (view === 'right') blob(c, x, y, [[9, 2, 4, 1]], shade(C.top, -0.2));
  } else if (a === 'bow') {
    const bx = view === 'right' ? 2 : 7;
    blob(c, x, y, [[bx, -1, 2, 3], [bx + 3, -1, 2, 3]], '#e26d7d'); R(c, x + bx + 2, y, 1, 1, '#c24d60');
  } else if (a === 'phones') {
    R(c, x + 1, y - 2, 10, 1, '#3b3a4a');
    if (view === 'down') { blob(c, x, y, [[0, 4, 1, 3], [11, 4, 1, 3]], C.top); }
    else if (view === 'right') blob(c, x, y, [[4, 3, 2, 3]], C.top);
  } else if (a === 'cat') {
    blob(c, x, y, [[1, -2, 3, 2], [8, -2, 3, 2]], C.hair);
    R(c, x + 2, y - 1, 1, 1, '#f59aa8'); R(c, x + 9, y - 1, 1, 1, '#f59aa8');
  } else if (a === 'flower') {
    const fx = view === 'right' ? 1 : 9;
    R(c, x + fx - 1, y - 1, 3, 3, '#f6b0c8'); R(c, x + fx, y - 2, 1, 5, '#f6b0c8'); R(c, x + fx - 2, y, 5, 1, '#f6b0c8');
    R(c, x + fx, y, 1, 1, '#f2d16b');
  } else if (a === 'crown') {
    blob(c, x, y, [[3, -2, 6, 2]], '#f2c33a');
    R(c, x + 3, y - 4, 1, 2, '#f2c33a'); R(c, x + 5, y - 5, 2, 3, '#f2c33a'); R(c, x + 8, y - 4, 1, 2, '#f2c33a');
    R(c, x + 5, y - 2, 2, 1, '#e26d7d');
  }
}

// 给 DOM 里的小头像/试衣间画一张小人
function dollPortrait(cv, L, dir = 'down', frame = 0, pose = 'stand') {
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  drawDoll(c, cv.width / 2, cv.height - 1, L, { dir, frame, pose, happy: true });
}

<script>
// 所有声音都用 WebAudio 振荡器和噪声现场合成，没有任何音频文件
const SFX = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let on = false, musicTimer = null, nextNote = 0, step = 0;

  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
    // 一秒白噪声，用来做“噗”“沙沙”的声音
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  const hz = n => 440 * Math.pow(2, (n - 69) / 12); // MIDI 音高 → 频率

  function tone(freq, t, dur, type = 'square', vol = 0.2, bus = sfxBus, slide = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.02);
  }

  function noise(t, dur, vol = 0.2, freq = 1200, q = 1) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.02);
  }

  const SOUNDS = {
    click: t => tone(hz(84), t, 0.05, 'square', 0.08),
    pop: t => tone(hz(79), t, 0.08, 'sine', 0.18, sfxBus, 1.6),
    place: t => { tone(hz(45), t, 0.12, 'triangle', 0.35, sfxBus, 0.6); noise(t, 0.08, 0.15, 400); },
    pick: t => tone(hz(67), t, 0.1, 'triangle', 0.2, sfxBus, 1.5),
    trash: t => { noise(t, 0.25, 0.3, 900, 0.7); tone(hz(60), t, 0.2, 'square', 0.08, sfxBus, 0.4); },
    deny: t => { tone(hz(50), t, 0.09, 'square', 0.1); tone(hz(47), t + 0.1, 0.12, 'square', 0.1); },
    lift: t => tone(hz(72), t, 0.18, 'sine', 0.2, sfxBus, 2),
    drop: t => { tone(hz(62), t, 0.1, 'sine', 0.2, sfxBus, 0.5); noise(t + 0.05, 0.05, 0.1, 500); },
    love: t => [76, 79, 84].forEach((n, i) => tone(hz(n), t + i * 0.07, 0.18, 'triangle', 0.18)),
    eat: t => [0, 0.12, 0.24].forEach(d => noise(t + d, 0.06, 0.18, 2500, 3)),
    cook: t => noise(t, 0.4, 0.08, 4000, 0.5),
    piano: t => { const sc = [60, 62, 64, 67, 69, 72]; tone(hz(sc[(Math.random() * 6) | 0]), t, 0.5, 'triangle', 0.2); },
    game: t => { const n = 72 + ((Math.random() * 12) | 0); tone(hz(n), t, 0.06, 'square', 0.07); tone(hz(n + 7), t + 0.06, 0.06, 'square', 0.07); },
    splash: t => noise(t, 0.3, 0.15, 1500, 0.8),
    meow: t => tone(hz(81), t, 0.3, 'sawtooth', 0.06, sfxBus, 0.75),
    chat: t => { for (let i = 0; i < 3; i++) tone(hz(70 + ((Math.random() * 8) | 0)), t + i * 0.07, 0.05, 'square', 0.05); },
    snore: t => noise(t, 0.6, 0.05, 300, 1),
    step: t => noise(t, 0.03, 0.04, 2000, 2),
    newday: t => [72, 76, 79, 84].forEach((n, i) => tone(hz(n), t + i * 0.1, 0.25, 'triangle', 0.15)),
    open: t => [67, 72].forEach((n, i) => tone(hz(n), t + i * 0.06, 0.1, 'triangle', 0.15)),
  };

  // 背景音乐：C–Am–F–G 的和弦循环，三角波低音 + 方波琶音 + 偶尔的旋律
  const CHORDS = [[48, 52, 55, 60], [45, 48, 52, 57], [41, 45, 48, 53], [43, 47, 50, 55]];
  const MELODY = [76, 0, 79, 0, 76, 74, 72, 0, 72, 0, 74, 76, 74, 0, 0, 0,
                  77, 0, 76, 0, 74, 72, 69, 0, 71, 0, 72, 74, 72, 0, 0, 0];
  function schedule() {
    const night = typeof G !== 'undefined' && G.night;
    const spb = night ? 0.28 : 0.2; // 每个十六分音符的秒数，晚上慢一点
    while (nextNote < ctx.currentTime + 0.3) {
      const chord = CHORDS[Math.floor(step / 16) % 4], s = step % 16;
      if (s % 8 === 0) tone(hz(chord[0] - 12), nextNote, spb * 7, 'triangle', 0.32, musicBus);
      if (s % 2 === 0) tone(hz(chord[(s / 2) % 4] + 12), nextNote, spb * 1.6, night ? 'sine' : 'square', night ? 0.08 : 0.035, musicBus);
      const m = MELODY[step % 32];
      if (m && !night) tone(hz(m), nextNote, spb * 1.8, 'triangle', 0.09, musicBus);
      if (!night && s % 4 === 2) noise(nextNote, 0.03, 0.03, 6000, 1);
      nextNote += spb; step++;
    }
  }

  return {
    get on() { return on; },
    play(name) {
      if (!on || !ctx || !SOUNDS[name]) return;
      SOUNDS[name](ctx.currentTime + 0.005);
    },
    toggle() {
      init();
      on = !on;
      if (on) {
        ctx.resume();
        nextNote = ctx.currentTime + 0.1;
        musicTimer = setInterval(schedule, 100);
        SOUNDS.open(ctx.currentTime);
      } else { clearInterval(musicTimer); musicTimer = null; }
      return on;
    },
  };
})();

<script>
// 游戏状态、房间格子、寻路、小人 AI、时间流逝
const SAVE_KEY = 'pixel-dollhouse-v1';
const MIN_PER_SEC = 4;               // 现实 1 秒 = 游戏 4 分钟，一天约 6 分钟
const HOOK = { refresh() {}, select() {}, toast() {} };

const G = {
  wall: 'cream', floor: 'oak', time: 480, day: 1, speed: 1, mode: 'live',
  furniture: [], dolls: [], sel: null, sky: '#9fd3f0', night: false, dark: 0,
  build: { placing: null, trash: false, hover: null }, rel: {},
  t: 0, uid: 1,
};

/* ---------------- 存档 ---------------- */
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      wall: G.wall, floor: G.floor, time: G.time, day: G.day,
      furniture: G.furniture.map(f => ({ id: f.id, x: f.x, y: f.y })),
      dolls: G.dolls.map(d => ({ pid: d.pid, name: d.name, persona: d.persona, look: d.look, needs: d.needs })),
      rel: G.rel,
    }));
  } catch (e) { /* 无痕模式等情况下存不了也没关系 */ }
}
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { s = null; }
  applySave(s && s.furniture ? s : JSON.parse(JSON.stringify(DEFAULT_SAVE)));
}
function applySave(s) {
  G.wall = s.wall; G.floor = s.floor; G.time = s.time ?? 480; G.day = s.day ?? 1;
  G.furniture = []; G.dolls = []; G.rel = s.rel || {};
  for (const f of s.furniture) if (FURNITURE[f.id]) addFurniture(f.id, f.x, f.y);
  for (const d of s.dolls) addDoll(d);
  G.sel = null;
}

/* ---------------- 家具与格子 ---------------- */
function addFurniture(id, x, y) {
  const f = { uid: G.uid++, id, x, y, active: false, users: [] };
  G.furniture.push(f);
  return f;
}
const layerOf = id => FURNITURE[id].layer || 'solid';

function canPlace(id, x, y, ignore) {
  const d = FURNITURE[id], L = layerOf(id);
  if (x < 0 || x + d.w > COLS) return false;
  if (L === 'wall') { if (y < 0 || y + d.h > WALL_ROWS) return false; }
  else if (y < WALL_ROWS || y + d.h > ROWS) return false;
  for (const f of G.furniture) {
    if (f === ignore || layerOf(f.id) !== L) continue;
    const e = FURNITURE[f.id];
    if (x < f.x + e.w && x + d.w > f.x && y < f.y + e.h && y + d.h > f.y) return false;
  }
  return true;
}

// 能走的格子：地板区域里没有实心家具
function blockedMap() {
  const m = [];
  for (let x = 0; x < COLS; x++) { m[x] = []; for (let y = 0; y < ROWS; y++) m[x][y] = y < WALL_ROWS; }
  for (const f of G.furniture) {
    if (layerOf(f.id) !== 'solid') continue;
    const d = FURNITURE[f.id];
    for (let i = 0; i < d.w; i++) for (let j = 0; j < d.h; j++) m[f.x + i][f.y + j] = true;
  }
  return m;
}
let BLOCK = null;
function rebuild() {
  BLOCK = blockedMap();
  // 被家具压住的小人挪到最近的空地
  for (const d of G.dolls) {
    if (d.state === 'act' && d.act.onFurn) continue;
    if (BLOCK[d.tx] && BLOCK[d.tx][d.ty]) { const p = nearestFree(d.tx, d.ty); if (p) placeDollAt(d, p.x, p.y); }
    d.path = []; if (d.state === 'walk') d.state = 'idle';
  }
}
const free = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !BLOCK[x][y];

function nearestFree(x, y) {
  x = Math.max(0, Math.min(COLS - 1, x)); y = Math.max(WALL_ROWS, Math.min(ROWS - 1, y));
  const seen = new Set([x + ',' + y]), q = [[x, y]];
  while (q.length) {
    const [cx, cy] = q.shift();
    if (free(cx, cy)) return { x: cx, y: cy };
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy, k = nx + ',' + ny;
      if (nx < 0 || ny < WALL_ROWS || nx >= COLS || ny >= ROWS || seen.has(k)) continue;
      seen.add(k); q.push([nx, ny]);
    }
  }
  return null;
}

// BFS 寻路：从 (sx,sy) 走到 goals 里任意一个格子
function findPath(sx, sy, goals) {
  const goalSet = new Set(goals.filter(g => free(g.x, g.y)).map(g => g.x + ',' + g.y));
  if (!goalSet.size) return null;
  const prev = new Map([[sx + ',' + sy, null]]), q = [[sx, sy]];
  while (q.length) {
    const [cx, cy] = q.shift(), k = cx + ',' + cy;
    if (goalSet.has(k)) {
      const path = []; let cur = k;
      while (cur) { const [a, b] = cur.split(',').map(Number); path.unshift({ x: a, y: b }); cur = prev.get(cur); }
      path.shift(); return path;
    }
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]].sort(() => Math.random() - 0.5);
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy, nk = nx + ',' + ny;
      if (!free(nx, ny) || prev.has(nk)) continue;
      prev.set(nk, k); q.push([nx, ny]);
    }
  }
  return null;
}

// 使用家具时站的位置：优先家具正下方，其次左右两侧
function approachTiles(f) {
  const d = FURNITURE[f.id], out = [];
  for (let i = 0; i < d.w; i++) out.push({ x: f.x + i, y: f.y + d.h });
  if (d.mode === 'on') for (let j = 0; j < d.h; j++) { out.push({ x: f.x - 1, y: f.y + j }); out.push({ x: f.x + d.w, y: f.y + j }); }
  return out;
}

/* ---------------- 小人 ---------------- */
function addDoll(src) {
  const d = {
    uid: G.uid++, pid: src.pid || Math.random().toString(36).slice(2, 10), name: src.name, persona: src.persona, look: { ...src.look },
    needs: src.needs ? { ...src.needs } : { energy: 60 + Math.random() * 40, hunger: 50 + Math.random() * 40, fun: 50 + Math.random() * 40, social: 50 + Math.random() * 40 },
    x: 0, y: 0, tx: 0, ty: 0, dir: 'down', frame: 0, ft: 0, state: 'idle', path: [], act: null,
    think: Math.random() * 2, bubble: null, blink: 0, blinkT: 2 + Math.random() * 3, hop: 0, happy: 0,
  };
  G.dolls.push(d);
  if (!BLOCK) BLOCK = blockedMap();
  const p = nearestFree(2 + ((Math.random() * (COLS - 4)) | 0), WALL_ROWS + 1 + ((Math.random() * (ROWS - WALL_ROWS - 2)) | 0));
  if (p) placeDollAt(d, p.x, p.y);
  return d;
}
function placeDollAt(d, x, y) { d.tx = x; d.ty = y; d.x = x * T + 8; d.y = y * T + 14; }

function say(d, text, dur = 2.6) { if (text) { d.bubble = { text, t: dur, id: Math.random() }; SFX.play('pop'); } }
const pick = a => a[(Math.random() * a.length) | 0];

function endAct(d) {
  const a = d.act;
  if (a && a.furn) {
    a.furn.users = a.furn.users.filter(u => u !== d);
    a.furn.active = a.furn.users.length > 0;
    if (a.onFurn) placeDollAt(d, a.back.x, a.back.y);
  }
  if (a && a.partner && a.partner.act && a.partner.act.partner === d) { a.partner.act = null; a.partner.state = 'idle'; a.partner.think = 1; }
  d.act = null; d.state = 'idle'; d.hop = 0; d.think = 1 + Math.random() * 2;
}

function decide(d) {
  const P = PERSONAS[d.persona], N = d.needs, opts = [];
  const want = (gain) => Object.entries(gain).reduce((s, [k, v]) => s + Math.max(0, v) * Math.pow(1 - N[k] / 100, 1.5) * 3, 0);
  for (const f of G.furniture) {
    const F = FURNITURE[f.id];
    if (!F.use) continue;
    const cap = f.id === 'sofa' ? 2 : 1;
    if (f.users.length >= cap) continue;
    let s = want(F.need) + (P.like[F.use] || 0) + Math.random() * 25;
    if (F.use === 'sleep') s += G.night ? 70 : (N.energy > 45 ? -60 : 0);
    else if (G.night && N.energy < 60) s -= 20;
    s -= (Math.abs(f.x - d.tx) + Math.abs(f.y - d.ty)) * 1.2;
    opts.push({ s, type: F.use, furn: f });
  }
  // 只有闲着、闲逛、或在做不重要的小事的人可以被拉去聊天；表演中的人只能被围观
  const others = G.dolls.filter(o => o !== d && (o.state === 'idle' || (o.state === 'walk' && o.act && o.act.type === 'wander') ||
    (o.state === 'act' && o.act && !o.act.onFurn && !JOIN[o.act.type] && o.act.type !== 'chat' && o.act.type !== 'join')));
  if (others.length) {
    const p = pickPartner(d, others), r = rel(d, p);
    opts.push({ s: want({ social: 30 }) + (P.like.chat || 0) + Math.random() * 25 + Math.max(0, r.f) * 0.12 + r.l * 0.15 + (r.lovers ? 15 : 0), type: 'chat', partner: p });
  }
  for (const o of G.dolls) {
    if (o === d || !joinable(o)) continue;
    const J = JOIN[o.act.type], r = rel(d, o);
    opts.push({ s: want({ fun: 16, social: 12 }) + (P.like[J.like] || 0) * 0.7 + (P.like.chat || 0) * 0.4 + r.f * 0.25 + r.l * 0.2 + 8 + Math.random() * 20 - (G.night ? 15 : 0), type: 'join', target: o });
  }
  opts.push({ s: want({ fun: 10 }) + (P.like.dance || 0) + Math.random() * 15 - (G.night ? 20 : 0), type: 'dance' });
  opts.push({ s: 12 + (P.like.wander || 0) + Math.random() * 20, type: 'wander' });
  opts.sort((a, b) => b.s - a.s);
  for (const o of opts.slice(0, 4)) if (startAct(d, o)) return;
  d.think = 2;
}

// 让小人去做某件事；成功规划路线返回 true
function startAct(d, o) {
  if (o.type === 'dance') { d.state = 'act'; d.act = { type: 'dance', t: 9 + Math.random() * 4 }; nudgeAudience(d); say(d, pick(ACT_LINES.dance)); return true; }
  if (o.type === 'wander') {
    const goal = nearestFree((Math.random() * COLS) | 0, WALL_ROWS + ((Math.random() * (ROWS - WALL_ROWS)) | 0));
    const path = goal && findPath(d.tx, d.ty, [goal]);
    if (!path || !path.length) return false;
    d.path = path; d.state = 'walk'; d.act = { type: 'wander' };
    if (Math.random() < 0.25) say(d, pick(PERSONAS[d.persona].lines));
    return true;
  }
  if (o.type === 'join') return startJoin(d, o.target);
  if (o.type === 'chat') {
    // 优先站到对方左右两边，这样两个人不会上下叠在一起
    const p = o.partner, side = [[1, 0], [-1, 0]].map(([a, b]) => ({ x: p.tx + a, y: p.ty + b }));
    const path = findPath(d.tx, d.ty, side) || findPath(d.tx, d.ty, [[0, 1], [0, -1]].map(([a, b]) => ({ x: p.tx + a, y: p.ty + b })));
    if (!path) return false;
    d.path = path; d.state = 'walk'; d.act = { type: 'chat', partner: p, pending: true };
    if (p.state === 'idle' || (p.state === 'walk' && p.act && p.act.type === 'wander')) { p.path = []; p.act = null; p.state = 'wait'; p.waitT = 8; }
    return true;
  }
  const f = o.furn, F = FURNITURE[f.id];
  const tiles = approachTiles(f);
  const here = tiles.find(t => t.x === d.tx && t.y === d.ty);
  const path = here ? [] : findPath(d.tx, d.ty, tiles);
  if (!path) return false;
  f.users.push(d);
  d.path = path; d.state = path.length ? 'walk' : 'arrive';
  d.act = { type: F.use, furn: f, gain: F.need, mode: F.mode };
  return true;
}

function arrive(d) {
  const a = d.act;
  if (a && a.type === 'join') { arriveJoin(d); return; }
  if (!a || a.type === 'wander') { d.act = null; d.state = 'idle'; d.think = 0.5 + Math.random() * 2; return; }
  if (a.type === 'chat') {
    const p = a.partner;
    if (!G.dolls.includes(p) || p.state === 'lift' || (p.act && p.act.onFurn)) { endAct(d); return; }
    if (p.act && p.act.type === 'chat' && p.act.partner !== d) { say(d, '在忙呢，下次吧'); endAct(d); return; }
    if (p.act && (p.act.furn || p.act.type === 'join')) endAct(p);
    startSocial(d, p);
    return;
  }
  const f = a.furn, F = FURNITURE[f.id];
  if (!G.furniture.includes(f)) { endAct(d); return; }
  d.state = 'act';
  a.t = a.type === 'sleep' ? 28 + Math.random() * 10 : 7 + Math.random() * 5;
  if (JOIN[a.type] && a.type !== 'read') { a.t = 16 + Math.random() * 8; nudgeAudience(d); }
  a.back = { x: d.tx, y: d.ty };
  f.active = true;
  if (F.mode === 'on') {
    a.onFurn = true;
    if (f.id === 'sofa') { const left = !f.users.some(u => u !== d && u.act && u.act.seat === 0); a.seat = left ? 0 : 1; d.x = f.x * T + 8 + a.seat * 16; d.y = f.y * T + 13; }
    else if (f.id === 'chair') { d.x = f.x * T + 8; d.y = f.y * T + 10; }
    d.dir = 'down';
  } else {
    // 站在家具前：朝家具的方向
    const cx = (f.x + F.w / 2) * T, cy = (f.y + F.h / 2) * T;
    face(d, cx, cy);
  }
  say(d, pick(ACT_LINES[a.type] || ['…']));
  const snd = { snack: 'eat', cook: 'cook', piano: 'piano', game: 'game', bath: 'splash', cat: 'meow', water: 'splash' }[a.type];
  if (snd) SFX.play(snd);
}

function face(d, x, y) {
  const dx = x - d.x, dy = y - d.y;
  d.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

/* ---------------- 每帧更新 ---------------- */
function updateDoll(d, dt) {
  const P = PERSONAS[d.persona], N = d.needs;
  for (const k in N) N[k] = Math.max(0, N[k] - P.decay[k] * MIN_PER_SEC / 60 * dt);
  d.blinkT -= dt; if (d.blinkT < 0) { d.blink = 0.15; d.blinkT = 2 + Math.random() * 4; }
  if (d.blink > 0) d.blink -= dt;
  if (d.happy > 0) d.happy -= dt;
  if (d.bubble) { d.bubble.t -= dt; if (d.bubble.t <= 0) d.bubble = null; }
  if (d.state === 'lift') { d.ft += dt; if (d.ft > 0.2) { d.ft = 0; d.frame = (d.frame + 1) % 2; } return; }

  if (d.state === 'wait') { d.waitT -= dt; if (d.waitT <= 0) d.state = 'idle'; return; }
  if (d.state === 'arrive') { arrive(d); return; }

  if (d.state === 'walk') {
    const n = d.path[0];
    if (!n) { arrive(d); return; }
    if (!free(n.x, n.y)) { d.path = []; if (d.act && d.act.furn) endAct(d); else { d.state = 'idle'; d.act = null; } return; }
    const gx = n.x * T + 8, gy = n.y * T + 14, dx = gx - d.x, dy = gy - d.y, dist = Math.hypot(dx, dy);
    const sp = P.speed * T * dt * (N.energy < 20 ? 0.6 : 1);
    if (dist > 0.01) face(d, gx, gy);
    if (dist <= sp) { d.x = gx; d.y = gy; d.tx = n.x; d.ty = n.y; d.path.shift(); if (!d.path.length) arrive(d); }
    else { d.x += dx / dist * sp; d.y += dy / dist * sp; }
    d.ft += dt; if (d.ft > 0.13) { d.ft = 0; d.frame = (d.frame + 1) % 4; }
    return;
  }
  d.frame = 0;

  if (d.state === 'act') {
    const a = d.act;
    if (a.gain) for (const k in a.gain) N[k] = Math.max(0, Math.min(100, N[k] + a.gain[k] / (a.type === 'sleep' ? 10 : 8) * dt));
    if (a.type === 'sleep') N.energy = Math.min(100, N.energy + 2.2 * dt);
    if (a.type === 'dance') { d.ft += dt; if (d.ft > 0.25) { d.ft = 0; d.frame = (d.frame + 1) % 4; d.dir = ['down', 'right', 'up', 'left'][d.frame]; } d.hop = d.frame % 2 ? 2 : 0; N.fun = Math.min(100, N.fun + 2 * dt); }
    if (a.type === 'chat') tickSocial(d, dt);
    if (a.type === 'join') { tickJoin(d, dt); if (!d.act) return; }
    if (a.type !== 'chat' && a.type !== 'join' && a.type !== 'sleep' && Math.random() < dt * 0.12) say(d, pick(ACT_LINES[a.type] || ['♪']));
    if (a.type === 'sleep' && Math.random() < dt * 0.15) { d.bubble = { text: 'Zzz…', t: 2, id: Math.random() }; SFX.play('snore'); }
    if (a.type === 'piano' && Math.random() < dt * 3) SFX.play('piano');
    if (a.type === 'game' && Math.random() < dt * 2) SFX.play('game');
    a.t -= dt;
    const wake = a.type === 'sleep' && !G.night && N.energy > 92;
    if (a.t <= 0 || wake) endAct(d);
    return;
  }

  // 发呆中：偶尔自言自语，到时间就决定下一件事
  d.think -= dt;
  if (Math.random() < dt * 0.04) {
    const low = Object.entries(N).sort((a, b) => a[1] - b[1])[0];
    const sad = { energy: '好困……', hunger: '肚子咕咕叫', fun: '好无聊～', social: '有点寂寞' };
    say(d, low[1] < 25 ? sad[low[0]] : pick(P.lines));
  }
  if (d.think <= 0) decide(d);
}

const hearts = [];
function spawnHeart(d, txt = '❤') { hearts.push({ x: d.x + (Math.random() * 8 - 4), y: d.y - 24, t: 1, txt, id: Math.random() }); }

function petDoll(d) {
  if (d.state === 'lift') return;
  if (d.act && d.act.type === 'sleep') { say(d, '唔……别吵'); return; }
  d.needs.fun = Math.min(100, d.needs.fun + 12); d.needs.social = Math.min(100, d.needs.social + 15);
  d.happy = 2; say(d, pick(ACT_LINES.pet)); spawnHeart(d); spawnHeart(d); SFX.play('love');
}

// 选中的小人被点到的家具上去
function orderUse(d, f) {
  const F = FURNITURE[f.id];
  if (!F.use) { say(d, '这个不能用哦'); return false; }
  if (d.state === 'lift') return false;
  if (d.act) endAct(d);
  if (!startAct(d, { type: F.use, furn: f })) { say(d, '过不去呀…'); SFX.play('deny'); return false; }
  say(d, '好的～', 1.2);
  return true;
}

/* ---------------- 时间与天色 ---------------- */
const SKY = [[0, '#1d2348'], [5, '#2b3366'], [6.2, '#f6b38a'], [8, '#9fd3f0'], [17, '#9fd3f0'], [18.6, '#f59a7a'], [20, '#3a3a78'], [24, '#1d2348']];
const DARK = [[0, .55], [5, .5], [7, 0], [17, 0], [19, .25], [21, .5], [24, .55]];
function lerpKeys(keys, h, mix) {
  for (let i = 0; i < keys.length - 1; i++) {
    const [h0, v0] = keys[i], [h1, v1] = keys[i + 1];
    if (h >= h0 && h <= h1) return mix(v0, v1, (h - h0) / (h1 - h0));
  }
  return keys[0][1];
}
const mixNum = (a, b, t) => a + (b - a) * t;
const mixHex = (a, b, t) => {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) + (((pb >> s) & 255) - ((pa >> s) & 255)) * t);
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
};

let saveT = 0;
function update(realDt) {
  const dt = realDt * G.speed;
  G.t += realDt;
  if (dt > 0) {
    G.time += dt * MIN_PER_SEC;
    if (G.time >= 1440) { G.time -= 1440; G.day++; HOOK.toast(`☀️ 第 ${G.day} 天开始啦`); SFX.play('newday'); }
    const h = G.time / 60;
    G.sky = lerpKeys(SKY, h, mixHex); G.dark = lerpKeys(DARK, h, mixNum);
    G.night = h >= 21 || h < 6;
    for (const d of G.dolls) updateDoll(d, dt);
  }
  for (let i = hearts.length - 1; i >= 0; i--) { hearts[i].t -= realDt; if (hearts[i].t <= 0) hearts.splice(i, 1); }
  saveT += realDt; if (saveT > 5) { saveT = 0; save(); }
}
</script>
<script>
// 人际关系与多人互动：友好度 / 恋爱度、聊天打闹拥抱表白吵架、围观别人弹琴打游戏
// 关系存在 G.rel 里，键是两个小人的永久 id（pid）排序后拼起来

const REL_LEVELS = [[90, '挚友'], [70, '好友'], [40, '朋友'], [20, '认识'], [0, '陌生'], [-100, '不和']];
const LOVE_LEVELS = [[75, '喜欢'], [45, '心动'], [20, '有好感'], [-100, '']];

// 别人正在做这些事时，可以凑过去一起
const JOIN = {
  piano: { verb: '听{n}弹琴', like: 'piano', dance: 0.5, lines: ['好好听～', '🎵 ♪', '再来一首！', '是新曲子吗？'], back: ['谢谢捧场！', '为你弹的～'] },
  dance: { verb: '和{n}一起跳舞', like: 'dance', dance: 1, lines: ['一起跳！', '💃 转圈圈', '跟上节奏！'], back: ['跳得不错嘛！', '耶～'] },
  game:  { verb: '围观{n}打游戏', like: 'game', dance: 0, lines: ['加油加油！', '左边左边！', '好厉害！', '下一局我来！'], back: ['看我的！', '别吵别吵'] },
  tv:    { verb: '陪{n}看电视', like: 'tv', dance: 0, lines: ['这集我看过！', '哈哈哈哈', '📺 嘘——'], back: ['一起看嘛', '零食呢？'] },
  cook:  { verb: '等{n}做饭', like: 'snack', dance: 0, lines: ['好香啊～', '能分我一口吗？', '🤤', '我来帮忙！'], back: ['马上就好～', '给你留了一份'] },
  read:  { verb: '凑过去看{n}的书', like: 'read', dance: 0, lines: ['在看什么书？', '这本好看吗？', '借我看看'], back: ['嘘……', '看完借你'] },
};

// 两人面对面的互动种类
const SOCIAL = {
  chat:  { verb: '和{n}聊天', a: ['你好呀！', '聊点什么呢', '今天天气真好', '真的吗？！'], b: ['嗯嗯！', '哈哈哈', '我也觉得！', '然后呢？'] },
  joke:  { verb: '和{n}打闹', a: ['看招！', '哈哈哈哈', '😂 你好好笑'], b: ['哎呀别闹～', '😆', '哈哈哈停不下来'] },
  hug:   { verb: '和{n}抱抱', a: ['抱一个！', '🤗'], b: ['嘿嘿～', '❤'] },
  flirt: { verb: '向{n}表白', a: ['我……我有话想说', '你今天真好看……', '要不要一起看星星？'], b: [] },
  kiss:  { verb: '和{n}亲亲', a: ['💋', '最喜欢你了'], b: ['❤ ❤', '我也是～'] },
  argue: { verb: '和{n}吵架', a: ['💢 哼！', '都怪你！', '你才是！'], b: ['💢 不理你了', '明明是你！', '哼！'] },
};

function relKey(a, b) { return a.pid < b.pid ? a.pid + '|' + b.pid : b.pid + '|' + a.pid; }
function rel(a, b) {
  const k = relKey(a, b);
  if (!G.rel[k]) G.rel[k] = { f: 10 + Math.round(Math.random() * 15), l: 0, chem: +(0.6 + Math.random() * 0.9).toFixed(2), lovers: false };
  return G.rel[k];
}
const levelOf = (v, table) => table.find(([min]) => v >= min)[1];
function relLabel(r) {
  if (r.lovers) return '💕 恋人';
  const love = levelOf(r.l, LOVE_LEVELS);
  return levelOf(r.f, REL_LEVELS) + (love ? ' · ' + love : '');
}
function loverOf(d) { return G.dolls.find(o => o !== d && rel(d, o).lovers) || null; }

// 改变关系值，跨过关键门槛时弹提示
function bump(a, b, df, dl = 0) {
  const r = rel(a, b), before = levelOf(r.f, REL_LEVELS);
  r.f = Math.max(-100, Math.min(100, r.f + (df > 0 ? df * r.chem : df)));
  r.l = Math.max(0, Math.min(100, r.l + (dl > 0 ? dl * r.chem : dl)));
  const after = levelOf(r.f, REL_LEVELS);
  if (after !== before && df > 0 && ['朋友', '好友', '挚友'].includes(after)) HOOK.toast(`🤝 ${a.name} 和 ${b.name} 成为${after}了`);
  if (after === '不和' && before !== '不和') HOOK.toast(`💢 ${a.name} 和 ${b.name} 闹翻了……`);
  if (r.lovers && r.l < 30) { r.lovers = false; HOOK.toast(`💔 ${a.name} 和 ${b.name} 分手了……`); }
}

function weighted(list) {
  const total = list.reduce((s, [, w]) => s + Math.max(0, w), 0);
  let x = Math.random() * total;
  for (const [v, w] of list) { x -= Math.max(0, w); if (x <= 0) return v; }
  return list[0][0];
}

// 挑一个想去找的人：越熟、越喜欢越容易被挑中
function pickPartner(d, others) {
  return weighted(others.map(o => { const r = rel(d, o); return [o, 12 + Math.max(0, r.f) * 0.6 + r.l * 0.6 + (r.lovers ? 40 : 0)]; }));
}

function chooseKind(d, p) {
  const r = rel(d, p), cranky = d.needs.fun < 25 || p.needs.fun < 25 || d.needs.hunger < 15;
  const single = !loverOf(d) && !loverOf(p);
  return weighted([
    ['chat', 34],
    ['joke', 14 + (d.persona === 'genki' ? 12 : 0) + (r.f > 40 ? 8 : 0)],
    ['hug', r.f >= 55 ? 16 + (d.persona === 'social' ? 8 : 0) : 0],
    ['flirt', r.f >= 45 && single && r.l >= 15 ? 6 + r.l * 0.7 : 0],
    ['kiss', r.lovers ? 26 : 0],
    ['argue', (r.f < 15 ? 10 : 1) + (cranky ? 7 : 0)],
  ]);
}

// 两人到齐后开始互动（由 game.js 的 arrive 调用）
function startSocial(d, p) {
  const kind = chooseKind(d, p), S = SOCIAL[kind], r = rel(d, p);
  const t = 5 + Math.random() * 3;
  d.state = 'act'; d.act = { type: 'chat', kind, partner: p, t, gain: { social: 26, fun: 6 } };
  p.state = 'act'; p.path = []; p.act = { type: 'chat', kind, partner: d, t, gain: { social: 22, fun: 5 }, passive: true };
  face(d, p.x, p.y); face(p, d.x, d.y);
  say(d, pick(S.a));
  let reply = pick(S.b.length ? S.b : ['……']);

  const spark = r.f >= 45 ? 1 : 0;   // 足够熟了，日常相处也会慢慢心动
  if (kind === 'chat') bump(d, p, 5, 1.5 * spark);
  if (kind === 'joke') { bump(d, p, 6, 1.2 * spark); d.needs.fun = Math.min(100, d.needs.fun + 8); p.needs.fun = Math.min(100, p.needs.fun + 8); }
  if (kind === 'hug') { bump(d, p, 5, 3 + 3 * spark); spawnHeart(d); spawnHeart(p); }
  if (kind === 'kiss') { bump(d, p, 2, 6); for (let i = 0; i < 3; i++) spawnHeart(i % 2 ? d : p, '💕'); d.happy = p.happy = 4; }
  if (kind === 'argue') {
    bump(d, p, -9, -5); d.needs.fun = Math.max(0, d.needs.fun - 6); p.needs.fun = Math.max(0, p.needs.fun - 6);
    d.act.gain = p.act.gain = { social: 6 }; spawnHeart(d, '💢'); spawnHeart(p, '💢'); SFX.play('deny');
  }
  if (kind === 'flirt') {
    const chance = Math.min(0.9, (0.15 + r.l / 140 + r.f / 260) * r.chem);
    if (Math.random() < chance) {
      bump(d, p, 3, 14); reply = pick(['嗯……我也是 💕', '其实我也注意你很久了', '好呀 ❤']);
      d.happy = p.happy = 4; for (let i = 0; i < 4; i++) spawnHeart(i % 2 ? d : p, '💗');
      if (r.l >= 70 && !r.lovers) { r.lovers = true; HOOK.toast(`💕 ${d.name} 和 ${p.name} 在一起了！`); SFX.play('newday'); }
      else SFX.play('love');
    } else {
      bump(d, p, -2, -4); reply = pick(['诶？我们还是做朋友吧', '让我想想……', '你、你在说什么呀']);
      d.needs.fun = Math.max(0, d.needs.fun - 10);
      setTimeout(() => d.act && d.act.kind === 'flirt' && say(d, '呜……'), 2600);

  SFX.play(kind === 'argue' ? 'deny' : 'chat');
}

// 互动进行中：偶尔再说一句、冒爱心
function tickSocial(d, dt) {
  const a = d.act, S = SOCIAL[a.kind] || SOCIAL.chat;
  if (a.passive || Math.random() > dt * 0.45) return;
  const who = Math.random() < 0.5 ? d : a.partner;
  const lines = who === d ? S.a : (S.b.length ? S.b : S.a);
  say(who, pick(lines), 1.8);
  if (a.kind === 'argue') spawnHeart(who, '💢');
  else if (a.kind !== 'chat' || rel(d, a.partner).l > 40) spawnHeart(who, rel(d, a.partner).lovers ? '💕' : '❤');
}

/* ---------- 围观 / 一起玩 ---------- */
function joinable(o) { return o.state === 'act' && o.act && JOIN[o.act.type] && o.act.t > 3; }

function startJoin(d, o) {
  const goals = [];
  for (let dx = -2; dx <= 2; dx++) for (let dy = -1; dy <= 2; dy++) {
    if (!dx && !dy) continue;
    goals.push({ x: o.tx + dx, y: o.ty + dy });
  }
  goals.sort((a, b) => Math.hypot(a.x - o.tx, a.y - o.ty) - Math.hypot(b.x - o.tx, b.y - o.ty));
  const taken = new Set(G.dolls.filter(x => x !== d).map(x => x.tx + ',' + x.ty));
  const path = findPath(d.tx, d.ty, goals.filter(g => !taken.has(g.x + ',' + g.y)));
  if (!path) return false;
  d.path = path; d.state = path.length ? 'walk' : 'arrive';
  d.act = { type: 'join', target: o, what: o.act.type };
  return true;
}

// 有人开始表演时，闲着的人会更快拿主意（更可能过来凑热闹）
function nudgeAudience(performer) {
  for (const o of G.dolls) if (o !== performer && (o.state === 'idle' || (o.state === 'walk' && o.act && o.act.type === 'wander'))) {
    if (o.state === 'walk') { o.path = []; o.state = 'idle'; o.act = null; }
    o.think = Math.min(o.think, 0.3 + Math.random() * 1.2);

}

function arriveJoin(d) {
  const a = d.act, o = a.target;

  // 位置被别人占了就换个空位（只换一次）

  a.gain = { fun: 16, social: 10 };

  o.needs.social = Math.min(100, o.needs.social + 6);
  if (Math.random() < 0.6) setTimeout(() => o.act && say(o, pick(J.back)), 1400);
}

function tickJoin(d, dt) {
  const a = d.act, o = a.target;

  if (a.dance) {

    d.hop = d.frame % 2 ? 2 : 0;

}

function socialDoing(d) {
  const a = d.act;
  if (a.type === 'join') return JOIN[a.what].verb.replace('{n}', a.target.name);
  if (a.type === 'chat' && a.partner) {

}

function furnTop(f) { const F = FURNITURE[f.id]; return f.y * T - (F.layer ? 0 : (TALL[f.id] || 0)); }

function drawBuildOverlay(c, t) {

/* ---------- DOM 浮层：对话气泡、名字、爱心 ---------- */

  for (const d of G.dolls) {
    let x = d.x, y = d.y;
    if (d.act && d.act.onFurn && d.state === 'act' && (d.act.furn.id === 'bed' || d.act.furn.id === 'bath')) { x = d.act.furn.x * T + 16; y = d.act.furn.y * T + 14; }

  }

}

  const solid = G.furniture.filter(f => layerOf(f.id) === 'solid').sort((a, b) => (b.y + FURNITURE[b.id].h) - (a.y + FURNITURE[a.id].h));
  for (const f of solid) { const F = FURNITURE[f.id]; if (p.x >= f.x * T && p.x < (f.x + F.w) * T && p.y >= furnTop(f) && p.y < (f.y + F.h) * T) return f; }

      if (B.placing.moved) { B.placing = null; HOOK.refresh(); }
    } else SFX.play('deny');
    return;
  }
  const f = furnAt(p);
  if (!f) return;
  if (B.trash) { removeFurniture(f); rebuild(); SFX.play('trash'); save(); HOOK.toast(`已移除「${FURNITURE[f.id].name}」`); }
  else { removeFurniture(f); rebuild(); B.placing = { id: f.id, moved: true, orig: { x: f.x, y: f.y } }; B.hover = ghostTile(p, f.id); SFX.play('pick'); HOOK.refresh(); }
});
cv.addEventListener('pointermove', e => {
  const p = toWorld(e);
  if (G.mode === 'build') {
    const B = G.build;
    B.hover = B.placing ? ghostTile(p, B.placing.id) : { furn: furnAt(p) };
    cv.style.cursor = B.placing ? 'copy' : B.hover.furn ? (B.trash ? 'not-allowed' : 'grab') : 'default';
    return;
  }
  const hd = dollAt(p); hoverDoll = hd ? hd.uid : null;
  cv.style.cursor = press && press.d ? 'grabbing' : hd ? 'grab' : (G.sel && furnAt(p) && FURNITURE[furnAt(p).id].use ? 'pointer' : 'default');
  if (!press || !press.d) return;
  const d = press.d;
  if (!press.moved && Math.hypot(p.x - press.p.x, p.y - press.p.y) > 3) {
    press.moved = true;
    if (d.act) endAct(d);
    d.path = []; d.state = 'lift'; d.dir = 'down'; G.sel = d.uid; HOOK.select();
    say(d, pick(ACT_LINES.lift), 1.5); SFX.play('lift');
  }
  if (press.moved) { d.x = p.x; d.y = p.y + 12; const g = nearestFree(Math.floor(p.x / T), Math.floor((p.y + 10) / T)); d.liftShadow = g ? g.y * T + 14 : d.y; }
});
cv.addEventListener('pointerup', e => {
  if (G.mode !== 'live' || !press) { press = null; return; }
  const p = toWorld(e), d = press.d;
  if (d && press.moved) {
    const g = nearestFree(Math.floor(p.x / T), Math.floor((p.y + 10) / T));
    if (g) placeDollAt(d, g.x, g.y);
    d.state = 'idle'; d.think = 1.5; d.frame = 0; SFX.play('drop');
  } else if (d) {
    G.sel = d.uid; SFX.play('click'); HOOK.select();
  } else if (press.furn && G.sel) {
    const sd = G.dolls.find(o => o.uid === G.sel);
    if (sd) orderUse(sd, press.furn);
  } else { G.sel = null; HOOK.select(); }
  press = null;
});
cv.addEventListener('pointerleave', () => { hoverDoll = null; if (G.mode === 'build') G.build.hover = null; });

function cancelPlacing() {
  const B = G.build;
  if (B.placing && B.placing.moved && B.placing.orig) {
    const o = B.placing.orig;
    if (canPlace(B.placing.id, o.x, o.y, null)) addFurniture(B.placing.id, o.x, o.y);
    rebuild();
  }
  B.placing = null; HOOK.refresh();
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') cancelPlacing(); });
</script>
<script>
// 界面：住户列表、状态卡、模式切换、布置面板、衣橱，以及主循环
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/* ---------- 提示 ---------- */
let toastTimer = 0;
HOOK.toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); };

/* ---------- 住户列表 + 状态卡 ---------- */
function doingText(d) {
  if (d.state === 'lift') return '被你拎在手里';
  if (d.state === 'wait') return '在等人过来';
  if (!d.act) return ACT_NAMES.idle;
  if (d.state === 'walk' && d.act.type === 'join') return `去找${d.act.target.name}凑热闹`;
  if (d.state === 'walk' && d.act.type === 'chat' && d.act.partner) return `去找${d.act.partner.name}`;
  const sd = d.state === 'act' && socialDoing(d);
  if (sd) return sd;
  const n = ACT_NAMES[d.act.type] || '忙碌中';
  if (d.state === 'walk') return d.act.type === 'wander' ? '闲逛' : `正要去${n.replace(/^在/, '')}`;
  if (d.act.type === 'chat' && d.act.partner) return `和${d.act.partner.name}聊天`;
  return n;
}

function renderDollList() {
  const box = $('#dollList'); box.innerHTML = '';
  for (const d of G.dolls) {
    const b = el('button', 'doll-row' + (d.uid === G.sel ? ' sel' : ''));
    const c = el('canvas'); c.width = 20; c.height = 24; dollPortrait(c, d.look);
    const P = PERSONAS[d.persona];
    const m = el('div', 'meta', `<b>${esc(d.name)} ${P.icon}</b><small data-doing="${d.uid}">${doingText(d)}</small>`);
    b.append(c, m);
    b.onclick = () => { G.sel = d.uid === G.sel ? null : d.uid; SFX.play('click'); HOOK.select(); };
    box.append(b);
  }
  $('#btnAddDoll').style.display = G.dolls.length >= 6 ? 'none' : '';
}

function renderInfo() {
  const card = $('#dollInfo'), d = G.dolls.find(o => o.uid === G.sel);
  if (!d) { card.hidden = true; return; }
  const P = PERSONAS[d.persona];
  card.hidden = false;
  card.innerHTML = `<h3>${esc(d.name)}</h3>
    <div class="persona">${P.icon} ${P.name} · ${P.desc}</div>
    ${NEEDS.map(n => `<div class="need"><span>${n.name}</span><div class="bar"><i data-need="${n.key}" style="background:${n.color}"></i></div></div>`).join('')}
    <div class="doing">正在：<b id="infoDoing"></b></div>
    ${G.dolls.length > 1 ? `<div class="rels"><h4>人际关系</h4>${G.dolls.filter(o => o !== d).map(o => `
      <div class="rel"><div class="rel-top"><span>${esc(o.name)}</span><small data-rl="${o.uid}"></small></div>
      <div class="rel-bars"><span title="友好度">🤝</span><div class="bar"><i data-rf="${o.uid}" style="background:#7cc576"></i></div>
      <span title="恋爱度">💗</span><div class="bar"><i data-rlv="${o.uid}" style="background:#ec6a8a"></i></div></div></div>`).join('')}</div>` : ''}
    <div class="hint" style="margin:4px 0 0">选中后点家具，可以让 TA 去用</div>
    <div class="actions">
      <button class="btn small" id="btnPet">🤚 摸摸头</button>
      <button class="btn small" id="btnDress">👗 换装</button>
      <button class="btn small ghost" id="btnWake">📣 叫 TA</button>
    </div>`;
  $('#btnPet').onclick = () => petDoll(d);
  $('#btnDress').onclick = () => openWardrobe(d.uid);
  $('#btnWake').onclick = () => { if (d.act) endAct(d); d.path = []; d.state = 'idle'; d.think = 3; d.dir = 'down'; say(d, '叫我吗？'); };
  tickInfo();
}

function tickInfo() {
  const d = G.dolls.find(o => o.uid === G.sel);
  if (d && !$('#dollInfo').hidden) {
    for (const i of document.querySelectorAll('[data-need]')) i.style.width = d.needs[i.dataset.need].toFixed(0) + '%';
    const s = $('#infoDoing'); if (s) s.textContent = doingText(d);
    for (const o of G.dolls) {
      if (o === d) continue;
      const r = rel(d, o), lab = document.querySelector(`[data-rl="${o.uid}"]`);
      if (!lab) continue;
      lab.textContent = relLabel(r);
      document.querySelector(`[data-rf="${o.uid}"]`).style.width = Math.max(0, r.f).toFixed(0) + '%';
      document.querySelector(`[data-rlv="${o.uid}"]`).style.width = r.l.toFixed(0) + '%';
    }
  }
  for (const s of document.querySelectorAll('[data-doing]')) {
    const o = G.dolls.find(x => x.uid === +s.dataset.doing); if (o) s.textContent = doingText(o);
  }
}

HOOK.select = () => { renderDollList(); renderInfo(); };

/* ---------- 顶栏 ---------- */
function setMode(m) {
  if (G.mode === 'build' && m !== 'build') cancelPlacing();
  G.mode = m; G.build.trash = false; G.build.placing = null; G.build.hover = null;
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#buildBar').hidden = m !== 'build';
  $('#hint').textContent = m === 'build' ? '布置模式：小人们会继续生活，放好家具 TA 们就会去用' : '点击小人查看状态，按住可以把 TA 拎起来放到别处～';
  if (m === 'build') renderPalette();
  SFX.play('click');
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  G.speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(o => o.classList.toggle('on', o === b));
  SFX.play('click');
});
$('#btnSound').onclick = () => { const on = SFX.toggle(); $('#btnSound').textContent = on ? '🔊' : '🔇'; $('#btnSound').classList.toggle('on', on); };
$('#btnWardrobe').onclick = () => openWardrobe(G.sel || (G.dolls[0] && G.dolls[0].uid));

function updateClock() {
  const m = Math.floor(G.time), h = Math.floor(m / 60), mm = m % 60;
  $('#clock').textContent = `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  $('#dayLabel').textContent = `第 ${G.day} 天`;
  $('#timeIcon').textContent = h >= 21 || h < 6 ? '🌙' : h < 8 ? '🌅' : h >= 18 ? '🌇' : '☀️';
}

/* ---------- 布置面板 ---------- */
let tab = 'furniture';
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(o => o.classList.toggle('on', o === b));
  G.build.placing = null; renderPalette(); SFX.play('click');
});
$('#btnTrash').onclick = () => {
  if (G.build.placing) cancelPlacing();
  G.build.trash = !G.build.trash; $('#btnTrash').classList.toggle('on', G.build.trash);
  $('#buildHint').textContent = G.build.trash ? '删除模式：点击房间里的家具把它移走' : '选择家具后点击房间放置 · 点已有家具可以拿起移动 · 右键/Esc 取消';
  SFX.play('click');
};
$('#btnReset').onclick = () => {
  if (!confirm('把房间恢复成默认布置吗？（住户会保留）')) return;
  const keepDolls = G.dolls.map(d => ({ name: d.name, persona: d.persona, look: d.look, needs: d.needs }));
  const s = JSON.parse(JSON.stringify(DEFAULT_SAVE)); s.dolls = keepDolls; s.time = G.time; s.day = G.day;
  applySave(s); rebuild(); save(); HOOK.select(); renderPalette(); HOOK.toast('房间已恢复默认');
};

const iconCache = {};
function renderPalette() {
  const pal = $('#palette'); pal.innerHTML = '';
  $('#btnTrash').classList.toggle('on', G.build.trash);
  if (tab === 'furniture') {
    for (const id of Object.keys(FURNITURE)) {
      const F = FURNITURE[id];
      const b = el('button', 'item' + (G.build.placing && G.build.placing.id === id && !G.build.placing.moved ? ' on' : ''));
      iconCache[id] = iconCache[id] || furnitureIcon(id);
      const c = el('canvas'); c.width = c.height = 56; c.getContext('2d').drawImage(iconCache[id], 0, 0);
      b.append(c, el('span', null, F.name));
      b.title = F.use ? `${F.name} · ${ACT_NAMES[F.use] || ''}` : F.name;
      b.onclick = () => {
        if (G.build.placing && G.build.placing.moved) cancelPlacing();
        G.build.trash = false;
        G.build.placing = G.build.placing && G.build.placing.id === id ? null : { id };
        SFX.play('click'); renderPalette();
      };
      pal.append(b);
    }
  } else {
    const isWall = tab === 'wall', list = isWall ? WALLS : FLOORS;
    for (const s of list) {
      const b = el('button', 'item' + ((isWall ? G.wall : G.floor) === s.id ? ' on' : ''));
      b.append(swatchIcon(s, isWall), el('span', null, s.name));
      b.onclick = () => { if (isWall) G.wall = s.id; else G.floor = s.id; SFX.play('place'); save(); renderPalette(); };
      pal.append(b);
    }
  }
}
HOOK.refresh = () => { if (G.mode === 'build') renderPalette(); };

/* ---------- 衣橱 ---------- */
let wdUid = null, wdDir = 'down', wdFrame = 0, wdTimer = 0;
const wdDoll = () => G.dolls.find(d => d.uid === wdUid);

function openWardrobe(uid) {
  if (!G.dolls.length) return;
  wdUid = uid || G.dolls[0].uid;
  $('#wardrobe').hidden = false; SFX.play('open');
  renderWardrobe();
}
function closeWardrobe() { $('#wardrobe').hidden = true; HOOK.select(); save(); }
$('#wdClose').onclick = closeWardrobe;
$('#wardrobe').addEventListener('pointerdown', e => { if (e.target.id === 'wardrobe') closeWardrobe(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#wardrobe').hidden) closeWardrobe(); });
document.querySelectorAll('.wd-dir button').forEach(b => b.onclick = () => { wdDir = b.dataset.dir; SFX.play('click'); });
$('#wdName').oninput = e => { const d = wdDoll(); if (d) { d.name = e.target.value.trim() || '无名'; renderWdTabs(); } };
$('#wdRandom').onclick = () => {
  const d = wdDoll(); if (!d) return;
  d.look = randomLook(); SFX.play('love'); renderWardrobe();
};
$('#wdRemove').onclick = () => {
  const d = wdDoll(); if (!d) return;
  if (G.dolls.length <= 1) { HOOK.toast('至少要留一位住户哦'); return; }
  if (!confirm(`真的要让 ${d.name} 搬走吗？`)) return;
  if (d.act) endAct(d);
  for (const o of G.dolls) if (o.act && o.act.partner === d) endAct(o);
  G.dolls = G.dolls.filter(o => o !== d);
  if (G.sel === d.uid) G.sel = null;
  HOOK.toast(`${d.name} 挥挥手搬走了`); wdUid = G.dolls[0].uid; renderWardrobe(); save();
};

function randomLook() {
  const keys = o => Object.keys(o), r = n => (Math.random() * n) | 0;
  const top = pick(keys(OUTFIT.top));
  return {
    skin: r(OUTFIT.skin.length), hair: pick(keys(OUTFIT.hair)), hairColor: r(OUTFIT.hairColor.length),
    top, topColor: r(OUTFIT.clothColor.length), bottom: pick(keys(OUTFIT.bottom)), bottomColor: r(OUTFIT.clothColor.length),
    shoes: r(OUTFIT.shoes.length), acc: pick(keys(OUTFIT.acc)),
  };
}

function renderWdTabs() {
  const box = $('#wdTabs'); box.innerHTML = '';
  for (const d of G.dolls) {
    const b = el('button', d.uid === wdUid ? 'on' : '', esc(d.name));
    b.onclick = () => { wdUid = d.uid; SFX.play('click'); renderWardrobe(); };
    box.append(b);
  }
}

function renderWardrobe() {
  const d = wdDoll(); if (!d) return;
  renderWdTabs();
  $('#wdName').value = d.name;
  const box = $('#wdOptions'); box.innerHTML = '';
  const section = (title, node) => { const s = el('div', 'opt'); s.append(el('h4', null, title), node); box.append(s); };
  const chips = (obj, key) => {
    const w = el('div', 'chips');
    for (const [k, name] of Object.entries(obj)) {
      const b = el('button', 'chip' + (d.look[key] === k ? ' on' : ''), name);
      b.onclick = () => { d.look[key] = k; SFX.play('pop'); renderWardrobe(); };
      w.append(b);
    }
    return w;
  };
  const swatches = (cols, key) => {
    const w = el('div', 'chips');
    cols.forEach((col, i) => {
      const b = el('button', 'swatch' + (d.look[key] === i ? ' on' : ''));
      b.style.background = col; b.setAttribute('aria-label', col);
      b.onclick = () => { d.look[key] = i; SFX.play('pop'); renderWardrobe(); };
      w.append(b);
    });
    return w;
  };
  const pers = el('div', 'chips');
  for (const [k, P] of Object.entries(PERSONAS)) {
    const b = el('button', 'chip' + (d.persona === k ? ' on' : ''), `${P.icon} ${P.name}<small>${P.desc}</small>`);
    b.onclick = () => { d.persona = k; SFX.play('pop'); say(d, pick(P.lines)); renderWardrobe(); };
    pers.append(b);
  }
  section('性格', pers);
  section('肤色', swatches(OUTFIT.skin, 'skin'));
  section('发型', chips(OUTFIT.hair, 'hair'));
  section('发色', swatches(OUTFIT.hairColor, 'hairColor'));
  section('上衣', chips(OUTFIT.top, 'top'));
  section('上衣颜色', swatches(OUTFIT.clothColor, 'topColor'));
  if (d.look.top !== 'dress') section('下装', chips(OUTFIT.bottom, 'bottom'));
  section(d.look.top === 'overall' ? '背带颜色' : '下装颜色', swatches(OUTFIT.clothColor, 'bottomColor'));
  section('鞋子', swatches(OUTFIT.shoes, 'shoes'));
  section('配饰', chips(OUTFIT.acc, 'acc'));
  drawWdPreview();
}
function drawWdPreview() { const d = wdDoll(); if (d) dollPortrait($('#wdCanvas'), d.look, wdDir, wdFrame, 'walk'); }

/* ---------- 新住户 ---------- */
$('#btnAddDoll').onclick = () => {
  if (G.dolls.length >= 6) return;
  const used = new Set(G.dolls.map(d => d.name));
  const name = NAMES.find(n => !used.has(n)) || '新朋友';
  const d = addDoll({ name, persona: pick(Object.keys(PERSONAS)), look: randomLook() });
  G.sel = d.uid; say(d, '大家好，请多关照！'); spawnHeart(d); SFX.play('love');
  HOOK.select(); save(); HOOK.toast(`${name} 搬进来啦！`);
};

/* ---------- 主循环 ---------- */
load(); rebuild(); HOOK.select(); updateClock();
let last = performance.now(), uiT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; updateClock(); tickInfo(); }
  if (!$('#wardrobe').hidden) { wdTimer += dt; if (wdTimer > 0.18) { wdTimer = 0; wdFrame = (wdFrame + 1) % 4; drawWdPreview(); } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('beforeunload', save);
</script>
</body>
