<script>
// 家庭基金、家具商店、仓库、扩建
// 上班的人领工资时自动存 20% 进家庭基金；玩家每天还能号召一次大家凑钱。
// 家具要用基金买，删掉的家具收进仓库可以再拿出来；扩建会让房子真的变宽，并解锁新家具。

// [价格, 需要的房屋等级]
const SHOP = {
  bed: [800, 1], bigbed: [1500, 1], sofa: [900, 1], chair: [150, 1], table: [400, 1], fridge: [1200, 1],
  stove: [1000, 1], shelf: [600, 1], tv: [1500, 1], arcade: [1300, 1], piano: [2500, 1], bath: [1600, 1],
  plant: [120, 1], lamp: [200, 1], catbed: [300, 1], rug: [250, 1], rug2: [200, 1],
  window: [500, 1], painting: [300, 1], clock: [150, 1], poster: [80, 1],
  beanbag: [300, 1], coffee: [450, 1], aquarium: [700, 1], shelfwall: [180, 1],
  desk: [500, 2], pc: [1600, 2], speaker: [900, 2], garland: [220, 2],
  easel: [800, 3], treadmill: [1800, 3],
};

const LEVELS = [null,
  { name: '小屋',     cols: 16, cap: 5 },
  { name: '温馨小家', cols: 20, cap: 6, cost: 3000 },
  { name: '梦想之家', cols: 24, cap: 8, cost: 8000 },
];

const FUND_SHARE = 0.2;                                       // 工资里存进基金的比例
const GENEROSITY = { genki: 0.15, lazy: 0.05, nerd: 0.12, foodie: 0.2, social: 0.25 };

// 房子变宽：改世界宽度，画布跟着变
function setWorldSize(cols) {
  COLS = cols; W = COLS * T;
  HOOK.resize();
  BLOCK = blockedMap();
}

// 放一件家具前调用：优先用仓库里的，否则从基金里买
function acquire(id) {
  if ((G.inv[id] || 0) > 0) { G.inv[id]--; return true; }
  const [price, lv] = SHOP[id];
  if (lv > G.level) { HOOK.toast(`🔒 扩建成「${LEVELS[lv].name}」才能买${FURNITURE[id].name}`, true); return false; }
  if (G.fund < price) { HOOK.toast(`🏦 家庭基金不够，${FURNITURE[id].name}要 ${yuan(price)}`, true); return false; }
  G.fund -= price;
  addLog(`🛒 用家庭基金买了${FURNITURE[id].name}，花了 ${yuan(price)}`);
  return true;
}
function stash(id) { G.inv[id] = (G.inv[id] || 0) + 1; }

// 号召大家凑钱：每人按性格拿出“闲钱”（留 ¥300 生活费）的一部分
function crowdfund() {
  if (G.crowdDay === G.day) { HOOK.toast('今天已经凑过钱了，明天再来吧', true); return; }
  G.crowdDay = G.day;
  let total = 0; const parts = [];
  for (const d of G.dolls) {
    const spare = d.money - 300;
    const amt = spare > 0 ? Math.round(spare * (GENEROSITY[d.persona] || 0.1) / 10) * 10 : 0;
    const home = d.state !== 'away';
    if (amt >= 10) {
      d.money -= amt; total += amt; parts.push(`${d.name} ${yuan(amt)}`);
      if (home) say(d, pick([`我出 ${yuan(amt)}！`, '为了更好的家！', '拿去吧～']));
    } else if (home) say(d, pick(['我……没钱', '下次一定', '钱包空空的']));
  }
  G.fund += total;
  if (total) { addLog(`📣 大家凑钱：${parts.join('、')}，家庭基金 +${yuan(total)}`); HOOK.toast(`📣 凑到了 ${yuan(total)}！`, true); SFX.play('love'); }
  else HOOK.toast('大家都没什么钱了……', true);
  HOOK.refresh();
}

function expand() {
  const next = LEVELS[G.level + 1];
  if (!next) return;
  if (G.fund < next.cost) { HOOK.toast(`🏦 扩建需要 ${yuan(next.cost)}，家庭基金还差 ${yuan(next.cost - G.fund)}`, true); SFX.play('deny'); return; }
  G.fund -= next.cost; G.level++;
  setWorldSize(next.cols);
  const unlocked = Object.keys(SHOP).filter(id => SHOP[id][1] === G.level).map(id => FURNITURE[id].name);
  addLog(`🔨 小屋扩建成「${next.name}」！房子变大了，解锁了${unlocked.join('、')}`);
  HOOK.toast(`🔨 扩建成「${next.name}」！`, true); SFX.play('newday');
  for (const d of G.dolls) if (d.state !== 'away') { say(d, pick(['哇，房子变大了！', '好宽敞！', '可以买新家具了！'])); d.happy = 3; }
  HOOK.refresh(); HOOK.select();
}

// 小人会念叨想要的家具，提示玩家下一步买什么
function wishLine(d) {
  const owned = new Set(G.furniture.map(f => FURNITURE[f.id].use));
  const wants = Object.entries(PERSONAS[d.persona].like)
    .filter(([use, v]) => v >= 20 && !owned.has(use))
    .map(([use]) => Object.keys(SHOP).find(id => FURNITURE[id].use === use))
    .filter(Boolean);
  return wants.length ? `要是家里有${FURNITURE[pick(wants)].name}就好了` : null;
}

<script>
// 卧室：一面带门的隔墙把房子分成左边的卧室和右边的客厅
// 门关上时外面看不到里面——花心的人会趁机把暧昧对象叫进卧室；恋人走进来就会撞破

const BX = 7;           // 隔墙在第 7 列左边（0~6 列是卧室）
const DY = 5;           // 门在第 5 行
G.bedDoor = true;       // 卧室门：true 开着，false 关着

const roomOf = d => (d.ty >= FLOOR_SPLIT ? 'upstairs' : d.tx < BX ? 'bed' : 'living');
const inBedroom = d => d.state !== 'away' && roomOf(d) === 'bed';
// 两个人能不能看见对方：同一个房间，或者门开着
const canSee = (a, b) => roomOf(a) === roomOf(b) || (roomOf(a) !== 'upstairs' && roomOf(b) !== 'upstairs' && G.bedDoor);
// 两个相邻格子之间有没有墙挡着（只有门那一行能穿过去）
const wallBetween = (x1, y1, x2, y2) => (Math.min(y1,y2) === FLOOR_SPLIT - 1 && Math.max(y1,y2) === FLOOR_SPLIT && x1 !== STAIRS_X) || (y1 < FLOOR_SPLIT && y2 < FLOOR_SPLIT && Math.min(x1, x2) === BX - 1 && Math.max(x1, x2) === BX && y1 !== DY);
// 门两边的格子要留出来，不能放实心家具
const isDoorTile = (x, y) => y === DY && (x === BX - 1 || x === BX);
const straddles = (x, w) => x < BX && x + w > BX;

function doorOpenNow() { return G.bedDoor || G.dolls.some(d => d.state !== 'away' && d.ty === DY && (d.tx === BX - 1 || d.tx === BX)); }

// 隔墙按行切成几段，参与“按 y 排序”的绘制，这样小人在墙前墙后都能正确遮挡
function partitionDrawables(c) {
  const out = [], bx = BX * T, ws = WALLS.find(w => w.id === G.wall) || WALLS[0];
  const face = shade(ws.base, -0.12), cap = shade(ws.base, 0.08);
  for (let r = WALL_ROWS; r < FLOOR_SPLIT; r++) {
    if (r === DY) {
      out.push({ y: (r + 1) * T - 0.1, draw: () => {
        R(c, bx - 3, r * T, 6, 2, INK);                                  // 门框上沿
        if (doorOpenNow()) { R(c, bx - 14, r * T + 2, 12, 3, INK); R(c, bx - 13, r * T + 3, 10, 1, WOOD_L); }   // 门往卧室里开着

  setTimeout(() => p.act && p.act.type === 'tryst' && say(p, pick(['嗯……', '好吧', '去哪？'])), 1200);

        return;
      }
    }
  }
}

      if ((r.f >= 40 || r.lovers) && o.money >= 60) { o.money -= 60; bump(o, d, 5, r.lovers ? 5 : 0); addLog(`🎁 ${o.name} 送了 ${d.name} 一份生日礼物`); }
    }

// 状态卡上的一行介绍
function astroLine(d) {

<script>
// 画面渲染 + 指针交互（拎小人、摆家具）
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const lightCv = document.createElement('canvas'); lightCv.width = W; lightCv.height = H;
const lctx = lightCv.getContext('2d');
// 扩建后画布跟着变宽
HOOK.resize = () => {
  cv.width = W; cv.height = H; lightCv.width = W; lightCv.height = H; ctx.imageSmoothingEnabled = false;
  document.getElementById('stage').style.aspectRatio = `${W} / ${H}`;
};
const overlay = document.getElementById('overlay');

const wallSpec = () => WALLS.find(w => w.id === G.wall) || WALLS[0];
const floorSpec = () => FLOORS.find(f => f.id === G.floor) || FLOORS[0];

function dollPose(d) {
  if (d.state === 'lift') return 'lift';
  if (d.state === 'walk') return 'walk';
  if (d.act && d.state === 'act' && d.act.type === 'exercise') return 'walk';
  if (d.act && d.state === 'act' && (d.act.type === 'dance' || (d.act.type === 'join' && d.act.dance))) return 'dance';
  if (d.act && d.act.onFurn && d.state === 'act') return 'sit';
  return 'stand';
}
function drawDollObj(c, d) {
  drawDoll(c, d.x, d.y, d.look, {
    dir: d.dir, frame: d.frame, pose: dollPose(d), hop: d.hop,
    blink: d.blink > 0 || (d.act && d.act.type === 'read' && d.state === 'act' && Math.sin(G.t * 2) > 0.7),
    happy: d.happy > 0 || (d.act && d.state === 'act' && (['dance', 'game', 'tv', 'snack', 'cat', 'join'].includes(d.act.type) || (d.act.type === 'chat' && d.act.kind !== 'argue'))),
  });
}

function render() {
  const c = ctx, t = G.t;
  drawWall(c, wallSpec());
  drawFloor(c, floorSpec());
  c.fillStyle='#4c3543';
  c.fillRect(0,FLOOR_SPLIT*T-2,STAIRS_X*T,4);
  c.fillRect((STAIRS_X+1)*T,FLOOR_SPLIT*T-2,W-(STAIRS_X+1)*T,4);
  c.fillStyle='#cda277';
  for(let i=0;i<5;i++)c.fillRect(STAIRS_X*T+1,(FLOOR_SPLIT-1)*T+i*6,T-2,3);
  c.fillStyle='#4c3543';
  c.font='10px sans-serif';
  c.fillText('一楼',3,(FLOOR_SPLIT-1)*T);
  c.fillText('二楼',3,(FLOOR_SPLIT+1)*T);
  const placing = G.build.placing;

  for (const f of G.furniture) if (layerOf(f.id) === 'wall') DRAW[f.id](c, f.x * T, f.y * T, f, t);
  for (const f of G.furniture) if (layerOf(f.id) === 'floor') DRAW[f.id](c, f.x * T, f.y * T, f, t);

  if (G.mode === 'build') {
    c.fillStyle = 'rgba(59,42,47,.08)';
    for (let x = 1; x < COLS; x++) c.fillRect(x * T, 0, 1, H);
    for (let y = 1; y < ROWS; y++) c.fillRect(0, y * T, W, 1);
  }

  // 家具 + 小人 按“脚底 y”排序，越靠下越后画
  const list = [];
  for (const f of G.furniture) {
    if (layerOf(f.id) !== 'solid') continue;
    const F = FURNITURE[f.id];
    const sleepers = f.users.filter(u => lying(u) && u.act.furn === f);
    f.occ = sleepers.length ? (slot, hx, hy) => {
      const s = sleepers.find(u => (u.act.seat || 0) === slot);
      if (s) drawDoll(c, hx, hy + 1, s.look, { pose: 'head', dir: 'down' });
    } : null;
    list.push({ y: (f.y + F.h) * T, draw: () => DRAW[f.id](c, f.x * T, f.y * T, f, t) });
  }
  for (const d of G.dolls) {
    if (d.state === 'lift' || d.state === 'away') continue;
    if (lying(d)) continue;
    const y = d.state === 'act' && d.act && d.act.onFurn ? (d.act.furn.y + 1) * T + 0.5 : d.y;
    list.push({ y, draw: () => drawDollObj(c, d) });
  }
  list.push(...partitionDrawables(c));
  list.sort((a, b) => a.y - b.y).forEach(o => o.draw());

  // 夜晚：整体压暗，台灯/电视/游戏机处“挖洞”透光
  if (G.dark > 0.01) {
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, W, H);
    lctx.fillStyle = `rgba(18,14,48,${G.dark})`; lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r, a = 1) => {
      const g = lctx.createRadialGradient(x, y, 2, x, y, r);
      g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = g; lctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    for (const f of G.furniture) {
      if (f.id === 'lamp') hole(f.x * T + 8, f.y * T - 10, 54);
      if (f.id === 'garland') for (let i = 0; i < 8; i += 2) hole(f.x * T + 4 + i * 6, f.y * T + 9, 16, .55);
      if (f.id === 'aquarium') hole(f.x * T + 16, f.y * T - 6, 22, .5);
      if (f.id === 'xmastree') hole(f.x * T + 8, f.y * T - 2, 30, .8);
      if (f.id === 'lantern') hole(f.x * T + 8, f.y * T + 9, 22, .7);
      if ((f.id === 'pc' || f.id === 'speaker') && f.active) hole(f.x * T + 12, f.y * T - 10, 24, .7);
      if (f.id === 'tv' && f.active) hole(f.x * T + 16, f.y * T - 4, 34, .8);
      if (f.id === 'arcade') hole(f.x * T + 8, f.y * T - 8, 20, f.active ? .8 : .4);
      if (f.id === 'stove' && f.active) hole(f.x * T + 8, f.y * T - 6, 22, .7);
      if (f.id === 'fridge' && f.active) hole(f.x * T + 8, f.y * T, 24, .7);
    }
    c.drawImage(lightCv, 0, 0);
    c.globalCompositeOperation = 'lighter';
    for (const f of G.furniture) if (f.id === 'lamp') {
      const g = c.createRadialGradient(f.x * T + 8, f.y * T - 10, 1, f.x * T + 8, f.y * T - 10, 36);
      g.addColorStop(0, `rgba(255,190,90,${0.35 * G.dark})`); g.addColorStop(1, 'rgba(255,190,90,0)');
      c.fillStyle = g; c.fillRect(f.x * T - 30, f.y * T - 48, 76, 76);
    }
    c.globalCompositeOperation = 'source-over';
  }

  // 选中的小人头上跳动的小箭头
  const sel = G.dolls.find(d => d.uid === G.sel);
  if (sel && sel.state !== 'lift' && sel.state !== 'away' && G.mode === 'live') {
    let ax = sel.x, ay = sel.y - 30 + Math.round(Math.sin(t * 6));
    if (lying(sel)) { const h = headPos(sel); ax = h.x; ay = h.y - 6; }
    R(c, ax - 3, ay, 7, 1, INK); R(c, ax - 2, ay + 1, 5, 1, INK); R(c, ax - 1, ay + 2, 3, 1, INK); R(c, ax, ay + 3, 1, 1, INK);
    R(c, ax - 2, ay, 5, 1, '#ffd35c'); R(c, ax - 1, ay + 1, 3, 1, '#ffd35c');
  }

  if (G.mode === 'build') drawBuildOverlay(c, t);

  // 被拎起来的小人画在最上面
  for (const d of G.dolls) if (d.state === 'lift') {
    R(c, d.x - 4, d.liftShadow - 1, 8, 2, 'rgba(0,0,0,.25)');
    drawDollObj(c, d);
  }
  updateOverlay();
}

function furnTop(f) { const F = FURNITURE[f.id]; return f.y * T - (F.layer ? 0 : (TALL[f.id] || 0)); }

function drawBuildOverlay(c, t) {
  const B = G.build, hv = B.hover;
  if (B.placing && hv) {
    const F = FURNITURE[B.placing.id];
    const ok = canPlace(B.placing.id, hv.x, hv.y, null);
    c.globalAlpha = 0.75;
    DRAW[B.placing.id](c, hv.x * T, hv.y * T, {}, t);
    c.globalAlpha = 1;
    c.fillStyle = ok ? 'rgba(124,197,118,.35)' : 'rgba(226,109,109,.45)';
    c.fillRect(hv.x * T, hv.y * T, F.w * T, F.h * T);
    c.fillStyle = ok ? '#4f9a4a' : '#c24d4d';
    const x = hv.x * T, y = hv.y * T, w = F.w * T, h = F.h * T;
    c.fillRect(x, y, w, 1); c.fillRect(x, y + h - 1, w, 1); c.fillRect(x, y, 1, h); c.fillRect(x + w - 1, y, 1, h);
  } else if (hv && hv.furn) {
    const f = hv.furn, F = FURNITURE[f.id], top = furnTop(f);
    c.fillStyle = B.trash ? 'rgba(226,109,109,.4)' : 'rgba(255,211,92,.3)';
    c.fillRect(f.x * T, top, F.w * T, (f.y + F.h) * T - top);
  }
}

/* ---------- DOM 浮层：对话气泡、名字、爱心 ---------- */
const domBubbles = new Map();
function updateOverlay() {
  const s = cv.clientWidth / W;
  const alive = new Set();
  for (const d of G.dolls) {
    let el = domBubbles.get(d.uid);
    if (!el) { el = { b: document.createElement('div'), n: document.createElement('div'), id: null }; el.b.className = 'bubble'; el.n.className = 'nametag'; overlay.append(el.b, el.n); domBubbles.set(d.uid, el); }
    alive.add(d.uid);
    let hx = d.x, hy = d.y - 24;
    if (lying(d)) { const h = headPos(d); hx = h.x; hy = h.y - 2; }
    else if (d.state === 'act' && d.act && d.act.onFurn) hy = d.y - 22;
    if (d.bubble && d.state !== 'away') {
      if (el.id !== d.bubble.id) { el.b.textContent = d.bubble.text; el.id = d.bubble.id; el.b.style.animation = 'none'; void el.b.offsetWidth; el.b.style.animation = ''; }
      el.b.style.display = ''; el.b.style.left = hx * s + 'px'; el.b.style.top = (hy - 2) * s + 'px';
    } else el.b.style.display = 'none';
    const showName = d.state !== 'away' && (d.uid === G.sel || d.uid === hoverDoll);
    el.n.style.display = showName ? '' : 'none';
    if (showName) {
      const np = lying(d) ? { x: headPos(d).x, y: headPos(d).y + 17 } : d;
      el.n.textContent = d.name; el.n.style.left = np.x * s + 'px'; el.n.style.top = (np.y + 2) * s + 'px';
    }
  }
  for (const [uid, el] of domBubbles) if (!alive.has(uid)) { el.b.remove(); el.n.remove(); domBubbles.delete(uid); }
  for (const h of hearts) {
    if (!h.el) { h.el = document.createElement('div'); h.el.className = 'heart'; h.el.textContent = h.txt; overlay.append(h.el); h.el.style.left = h.x * s + 'px'; h.el.style.top = h.y * s + 'px'; }
  }
  for (const el of overlay.querySelectorAll('.heart')) if (!hearts.some(h => h.el === el)) el.remove();
}

/* ---------- 指针交互 ---------- */
let hoverDoll = null, press = null;
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function dollAt(p) {
  let best = null;
  for (const d of G.dolls) {
    if (d.state === 'away') continue;
    let x = d.x, y = d.y;
    if (lying(d)) { const h = headPos(d); x = h.x; y = h.y + 14; }
    if (p.x >= x - 7 && p.x <= x + 7 && p.y >= y - 22 && p.y <= y + 1 && (!best || y > best.y)) best = { d, y };
  }
  return best && best.d;
}
function furnAt(p) {
  const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T);
  const solid = G.furniture.filter(f => layerOf(f.id) === 'solid').sort((a, b) => (b.y + FURNITURE[b.id].h) - (a.y + FURNITURE[a.id].h));
  for (const f of solid) { const F = FURNITURE[f.id]; if (p.x >= f.x * T && p.x < (f.x + F.w) * T && p.y >= furnTop(f) && p.y < (f.y + F.h) * T) return f; }
  for (const L of ['wall', 'floor']) for (const f of G.furniture) {
    if (layerOf(f.id) !== L) continue; const F = FURNITURE[f.id];
    if (tx >= f.x && tx < f.x + F.w && ty >= f.y && ty < f.y + F.h) return f;
  }
  return null;
}
function ghostTile(p, id) { const F = FURNITURE[id]; return { x: Math.round(p.x / T - F.w / 2), y: Math.round(p.y / T - F.h / 2) }; }

function removeFurniture(f) {
  for (const u of [...f.users]) endAct(u);
  G.furniture = G.furniture.filter(o => o !== f);
}

cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelPlacing(); });
cv.addEventListener('pointerdown', e => {
  const p = toWorld(e);
  cv.setPointerCapture(e.pointerId);
  if (G.mode === 'live') {
    const d = dollAt(p);
    if (!d && hitBedDoor(p)) { toggleBedDoor(); return; }
    press = { p, d, moved: false, furn: d ? null : furnAt(p) };
    return;
  }
  // 布置模式
  const B = G.build;
  if (B.placing) {
    const g = ghostTile(p, B.placing.id);
    if (canPlace(B.placing.id, g.x, g.y, null)) {
      if (!B.placing.moved && !acquire(B.placing.id)) { SFX.play('deny'); return; }   // 新放的家具要从仓库拿或者花钱买
      addFurniture(B.placing.id, g.x, g.y); HOOK.refresh(); rebuild(); SFX.play('place'); save();
      if (B.placing.moved) { B.placing = null; HOOK.refresh(); }
    } else SFX.play('deny');
    return;
  }
  const f = furnAt(p);
  if (!f) return;
  if (f.id === 'door' && B.trash) { HOOK.toast('大门不能拆哦，可以拿起来换个位置', true); SFX.play('deny'); return; }
  if (B.trash) { removeFurniture(f); stash(f.id); rebuild(); SFX.play('trash'); save(); HOOK.toast(`「${FURNITURE[f.id].name}」收进仓库了`, true); HOOK.refresh(); }
  else { removeFurniture(f); rebuild(); B.placing = { id: f.id, moved: true, orig: { x: f.x, y: f.y } }; B.hover = ghostTile(p, f.id); SFX.play('pick'); HOOK.refresh(); }
});
cv.addEventListener('pointermove', e => {
  const p = toWorld(e);
  if (G.mode === 'build') {
    const B = G.build;
    B.hover = B.placing ? ghostTile(p, B.placing.id) : { furn: furnAt(p) };
    cv.style.cursor = B.placing ? 'copy' : B.hover.furn ? (B.trash ? 'not-allowed' : 'grab') : 'default';
    return;
  }
  const hd = dollAt(p); hoverDoll = hd ? hd.uid : null;
  cv.style.cursor = press && press.d ? 'grabbing' : hd ? 'grab' : (G.sel && furnAt(p) && FURNITURE[furnAt(p).id].use ? 'pointer' : 'default');
  if (!press || !press.d) return;
  const d = press.d;
  if (!press.moved && Math.hypot(p.x - press.p.x, p.y - press.p.y) > 3) {
    press.moved = true;
    if (d.act) endAct(d);
    d.path = []; d.state = 'lift'; d.dir = 'down'; G.sel = d.uid; HOOK.select();
    say(d, pick(ACT_LINES.lift), 1.5); SFX.play('lift');
  }
  if (press.moved) { d.x = p.x; d.y = p.y + 12; const g = nearestFree(Math.floor(p.x / T), Math.floor((p.y + 10) / T)); d.liftShadow = g ? g.y * T + 14 : d.y; }
});
cv.addEventListener('pointerup', e => {
  if (G.mode !== 'live' || !press) { press = null; return; }
  const p = toWorld(e), d = press.d;
  if (d && press.moved) {
    const g = nearestFree(Math.floor(p.x / T), Math.floor((p.y + 10) / T));
    if (g) placeDollAt(d, g.x, g.y);
    d.state = 'idle'; d.think = 1.5; d.frame = 0; SFX.play('drop');
  } else if (d) {
    G.sel = d.uid; SFX.play('click'); HOOK.select();
  } else if (press.furn && G.sel) {
    const sd = G.dolls.find(o => o.uid === G.sel);
    if (sd) orderUse(sd, press.furn);
  } else { G.sel = null; HOOK.select(); }
  press = null;
});
cv.addEventListener('pointerleave', () => { hoverDoll = null; if (G.mode === 'build') G.build.hover = null; });

function cancelPlacing() {
  const B = G.build;
  if (B.placing && B.placing.moved && B.placing.orig) {
    const o = B.placing.orig;
    if (canPlace(B.placing.id, o.x, o.y, null)) addFurniture(B.placing.id, o.x, o.y);
    rebuild();
  }
  B.placing = null; HOOK.refresh();
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') cancelPlacing(); });
</script>
<script>
// 界面：住户列表、状态卡、模式切换、布置面板、衣橱，以及主循环
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/* ---------- 提示 ---------- */
let toastTimer = 0;
HOOK.toast = (msg, quiet) => {
  if (!quiet && !msg.startsWith('☀️')) addLog(msg);   // quiet=true 的是纯界面提示，不进日志          // 新的一天用日志里的日期分隔，不重复记
  const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); };

/* ---------- 住户列表 + 状态卡 ---------- */
function doingText(d) {
  if (d.state === 'lift') return '被你拎在手里';
  if (d.state === 'wait') return '在等人过来';
  if (d.state === 'away') return awayText(d);
  if (d.act && d.act.type === 'leave') return `出门${JOBS[d.job].verb}`;
  if (!d.act) return ACT_NAMES.idle;
  if (d.state === 'walk' && d.act.type === 'join') return `去找${d.act.target.name}凑热闹`;
  if (d.state === 'walk' && d.act.type === 'chat' && d.act.partner) return `去找${d.act.partner.name}`;
  const sd = d.state === 'act' && socialDoing(d);
  if (sd) return sd;
  const n = ACT_NAMES[d.act.type] || '忙碌中';
  if (d.state === 'walk') return d.act.type === 'wander' ? '闲逛' : `正要去${n.replace(/^在/, '')}`;
  if (d.act.type === 'chat' && d.act.partner) return `和${d.act.partner.name}聊天`;
  return n;
}

function renderDollList() {
  const box = $('#dollList'); box.innerHTML = '';
  for (const d of G.dolls) {
    const b = el('button', 'doll-row' + (d.uid === G.sel ? ' sel' : '') + (d.state === 'away' ? ' away' : ''));
    const c = el('canvas'); c.width = 20; c.height = 24; dollPortrait(c, d.look);
    const P = PERSONAS[d.persona];
    const m = el('div', 'meta', `<b>${esc(d.name)} <span class="g-${d.gender}">${d.gender === 'm' ? '♂' : '♀'}</span> ${P.icon}</b><small data-doing="${d.uid}">${doingText(d)}</small>`);
    b.append(c, m);
    b.onclick = () => { G.sel = d.uid === G.sel ? null : d.uid; SFX.play('click'); HOOK.select(); };
    box.append(b);
  }
  $('#btnAddDoll').style.display = G.dolls.length >= LEVELS[G.level].cap ? 'none' : '';
}

function renderInfo() {
  const card = $('#dollInfo'), d = G.dolls.find(o => o.uid === G.sel);
  if (!d) { card.hidden = true; return; }
  const P = PERSONAS[d.persona];
  card.hidden = false;
  card.innerHTML = `<h3>${esc(d.name)}</h3>
    <div class="persona">${P.icon} ${P.name} · ${P.desc}</div>
    <div class="persona">${jobLine(d)}</div>
    <div class="persona">${astroLine(d)}</div>
    <div class="money">💰 存款 <b id="infoMoney"></b></div>
    <div class="persona">${GENDERS[d.gender]} · ${HEARTS[d.heart].icon} ${HEARTS[d.heart].name}：${HEARTS[d.heart].desc}</div>
    ${NEEDS.map(n => `<div class="need"><span>${n.name}</span><div class="bar"><i data-need="${n.key}" style="background:${n.color}"></i></div></div>`).join('')}
    <div class="doing">正在：<b id="infoDoing"></b></div>
    ${G.dolls.length > 1 ? `<div class="rels"><h4>人际关系</h4>${G.dolls.filter(o => o !== d).map(o => `
      <div class="rel"><div class="rel-top"><span>${esc(o.name)} <span class="stars" title="星座 + MBTI 缘分">${compatStars(d, o)}</span></span><small data-rl="${o.uid}"></small></div>
      <div class="rel-bars"><span title="友好度">🤝</span><div class="bar"><i data-rf="${o.uid}" style="background:#7cc576"></i></div>
      <span title="恋爱度">💗</span><div class="bar"><i data-rlv="${o.uid}" style="background:#ec6a8a"></i></div></div></div>`).join('')}</div>` : ''}
    <div class="hint" style="margin:4px 0 0">选中后点家具，可以让 TA 去用</div>
    <div class="actions">
      <button class="btn small" id="btnPet">🤚 摸摸头</button>
      <button class="btn small" id="btnDress">👗 换装</button>
      <button class="btn small ghost" id="btnWake">📣 叫 TA</button>
    </div>`;
  $('#btnPet').onclick = () => petDoll(d);
  $('#btnDress').onclick = () => openWardrobe(d.uid);
  $('#btnWake').onclick = () => { if (d.state === 'away') { HOOK.toast(`${d.name} 不在家哦`, true); return; } if (d.act) endAct(d); d.path = []; d.state = 'idle'; d.think = 3; d.dir = 'down'; say(d, '叫我吗？'); };
  tickInfo();
}

function tickInfo() {
  const d = G.dolls.find(o => o.uid === G.sel);
  if (d && !$('#dollInfo').hidden) {
    for (const i of document.querySelectorAll('[data-need]')) i.style.width = d.needs[i.dataset.need].toFixed(0) + '%';
    const s = $('#infoDoing'); if (s) s.textContent = doingText(d);
    const m = $('#infoMoney'); if (m) { m.textContent = yuan(d.money); m.classList.toggle('neg', d.money < 0); }
    for (const o of G.dolls) {
      if (o === d) continue;
      const r = rel(d, o), lab = document.querySelector(`[data-rl="${o.uid}"]`);
      if (!lab) continue;
      lab.textContent = relLabel(r);
      document.querySelector(`[data-rf="${o.uid}"]`).style.width = Math.max(0, r.f).toFixed(0) + '%';
      document.querySelector(`[data-rlv="${o.uid}"]`).style.width = r.l.toFixed(0) + '%';
    }
  }
  for (const s of document.querySelectorAll('[data-doing]')) {
    const o = G.dolls.find(x => x.uid === +s.dataset.doing); if (o) s.textContent = doingText(o);
  }
}

HOOK.select = () => { renderDollList(); renderInfo(); };

/* ---------- 生活日志 ---------- */
function renderLog() {
  const box = $('#logList'); box.innerHTML = '';
  if (!G.log.length) { box.append(el('div', 'log-empty', '还没有发生什么事～')); return; }
  let day = null;
  for (let i = G.log.length - 1; i >= 0; i--) {
    const e = G.log[i];
    if (e.d !== day) { day = e.d; box.append(el('div', 'log-day', `第 ${e.d} 天 · ${WEEKDAYS[weekday(e.d)]}`)); }
    box.append(el('div', 'log-item', `<time>${hhmm(e.t)}</time><span>${esc(e.text)}</span>`));
  }
}
HOOK.logged = renderLog;
$('#btnLogClear').onclick = () => { G.log = []; renderLog(); save(); };

/* ---------- 顶栏 ---------- */
function setMode(m) {
  if (G.mode === 'build' && m !== 'build') cancelPlacing();
  G.mode = m; G.build.trash = false; G.build.placing = null; G.build.hover = null;
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#buildBar').hidden = m !== 'build';
  $('#hint').textContent = m === 'build' ? '布置模式：小人们会继续生活，放好家具 TA 们就会去用' : '点击小人查看状态，按住可以把 TA 拎起来放到别处～';
  if (m === 'build') renderPalette();
  SFX.play('click');
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  G.speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(o => o.classList.toggle('on', o === b));
  SFX.play('click');
});
$('#btnSound').onclick = () => { const on = SFX.toggle(); $('#btnSound').textContent = on ? '🔊' : '🔇'; $('#btnSound').classList.toggle('on', on); };
$('#btnWardrobe').onclick = () => openWardrobe(G.sel || (G.dolls[0] && G.dolls[0].uid));

function updateClock() {
  const m = Math.floor(G.time), h = Math.floor(m / 60), mm = m % 60;
  $('#clock').textContent = `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  const S = seasonOf(G.day), Hd = holidayOf(G.day);
  $('#dayLabel').textContent = `第 ${G.day} 天 · ${WEEKDAYS[weekday(G.day)]} · ${S.icon}${S.name}${Hd ? ' · ' + Hd.icon + Hd.name : ''}`;
  const sky = h >= 21 || h < 6 ? '🌙' : h < 8 ? '🌅' : h >= 18 ? '🌇' : '☀️';
  $('#timeIcon').textContent = G.weather && G.weather !== 'sunny' ? WEATHER[G.weather].icon : sky;
  $('#timeIcon').title = WEATHER[G.weather || 'sunny'].name;
}

/* ---------- 布置面板 ---------- */
let tab = 'furniture';
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(o => o.classList.toggle('on', o === b));
  G.build.placing = null; renderPalette(); SFX.play('click');
});
$('#btnTrash').onclick = () => {
  if (G.build.placing) cancelPlacing();
  G.build.trash = !G.build.trash; $('#btnTrash').classList.toggle('on', G.build.trash);
  $('#buildHint').textContent = G.build.trash ? '删除模式：点击房间里的家具把它移走' : '选择家具后点击房间放置 · 点已有家具可以拿起移动 · 右键/Esc 取消';
  SFX.play('click');
};
$('#btnReset').onclick = () => {
  if (!confirm('把房间恢复成默认布置吗？（住户会保留）')) return;
  const keepDolls = G.dolls.map(d => ({ pid: d.pid, name: d.name, gender: d.gender, heart: d.heart, zodiac: d.zodiac, mbti: d.mbti, persona: d.persona, job: d.job, money: d.money, look: d.look, needs: d.needs, away: d.state === 'away', awayUntil: d.awayUntil, lastWorkDay: d.lastWorkDay }));
  const keepRel = G.rel;
  const s = JSON.parse(JSON.stringify(DEFAULT_SAVE)); s.dolls = keepDolls; s.time = G.time; s.day = G.day;
  s.rel = keepRel; s.npcMemory = G.npcMemory; applySave(s); rebuild(); save(); HOOK.select(); renderPalette(); HOOK.toast('房间已恢复默认', true);
};

const iconCache = {};
function renderPalette() {
  const pal = $('#palette'); pal.innerHTML = '';
  $('#btnTrash').classList.toggle('on', G.build.trash);
  if (tab === 'furniture') {
    for (const id of Object.keys(FURNITURE)) {
      const F = FURNITURE[id];
      if (F.fixed) continue;
      const [price, lv] = SHOP[id] || [0, 1], have = G.inv[id] || 0, locked = lv > G.level && !have;
      const b = el('button', 'item' + (G.build.placing && G.build.placing.id === id && !G.build.placing.moved ? ' on' : '') + (locked ? ' locked' : ''));
      iconCache[id] = iconCache[id] || furnitureIcon(id);
      const c = el('canvas'); c.width = c.height = 56; c.getContext('2d').drawImage(iconCache[id], 0, 0);
      const tag = have ? `仓库 ×${have}` : locked ? `🔒 ${LEVELS[lv].name}` : yuan(price);
      b.append(c, el('span', null, F.name), el('small', 'price' + (have ? ' own' : price > G.fund && !locked ? ' poor' : ''), tag));
      b.title = F.use ? `${F.name} · ${ACT_NAMES[F.use] || ''}` : F.name;
      b.onclick = () => {
        if (locked) { HOOK.toast(`🔒 扩建成「${LEVELS[lv].name}」才能买${F.name}`, true); SFX.play('deny'); return; }
        if (G.build.placing && G.build.placing.moved) cancelPlacing();
        G.build.trash = false;
        G.build.placing = G.build.placing && G.build.placing.id === id ? null : { id };
        SFX.play('click'); renderPalette();
      };
      pal.append(b);
    }
  } else {
    const isWall = tab === 'wall', list = isWall ? WALLS : FLOORS;
    for (const s of list) {
      const b = el('button', 'item' + ((isWall ? G.wall : G.floor) === s.id ? ' on' : ''));
      b.append(swatchIcon(s, isWall), el('span', null, s.name));
      b.onclick = () => { if (isWall) G.wall = s.id; else G.floor = s.id; SFX.play('place'); save(); renderPalette(); };
      pal.append(b);
    }
  }
}
HOOK.refresh = () => { renderShopBar(); if (G.mode === 'build') renderPalette(); };

/* ---------- 家庭基金与扩建 ---------- */
function renderShopBar() {
  $('#fundAmt').textContent = yuan(G.fund);
  $('#fundTop').textContent = yuan(G.fund);
  const L = LEVELS[G.level], next = LEVELS[G.level + 1];
  $('#houseLv').textContent = `🏠 ${L.name}（Lv${G.level} · 最多 ${L.cap} 人）`;
  const ex = $('#btnExpand');
  ex.textContent = next ? `🔨 扩建成「${next.name}」${yuan(next.cost)}` : '🏰 已经是最大的房子了';
  ex.disabled = !next;
  ex.classList.toggle('ready', !!next && G.fund >= next.cost);
  $('#btnCrowd').disabled = G.crowdDay === G.day;
}
$('#btnCrowd').onclick = () => crowdfund();
$('#btnExpand').onclick = () => expand();

/* ---------- 衣橱 ---------- */
let wdUid = null, wdDir = 'down', wdFrame = 0, wdTimer = 0;
const wdDoll = () => G.dolls.find(d => d.uid === wdUid);

function openWardrobe(uid) {
  if (!G.dolls.length) return;
  wdUid = uid || G.dolls[0].uid;
  $('#wardrobe').hidden = false; SFX.play('open');
  renderWardrobe();
}
function closeWardrobe() { $('#wardrobe').hidden = true; HOOK.select(); save(); }
$('#wdClose').onclick = closeWardrobe;
$('#wardrobe').addEventListener('pointerdown', e => { if (e.target.id === 'wardrobe') closeWardrobe(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#wardrobe').hidden) closeWardrobe(); });
document.querySelectorAll('.wd-dir button').forEach(b => b.onclick = () => { wdDir = b.dataset.dir; SFX.play('click'); });
$('#wdName').oninput = e => { const d = wdDoll(); if (d) { d.name = e.target.value.trim() || '无名'; renderWdTabs(); } };
$('#wdRandom').onclick = () => {
  const d = wdDoll(); if (!d) return;
  d.look = randomLook(); SFX.play('love'); renderWardrobe();
};
$('#wdRemove').onclick = () => {
  const d = wdDoll(); if (!d) return;
  if (G.dolls.length <= 1) { HOOK.toast('至少要留一位住户哦', true); return; }
  if (!confirm(`真的要让 ${d.name} 搬走吗？`)) return;
  if (d.act) endAct(d);
  for (const o of G.dolls) if (o.act && o.act.partner === d) endAct(o);
  G.dolls = G.dolls.filter(o => o !== d);
  if (G.sel === d.uid) G.sel = null;
  HOOK.toast(`${d.name} 挥挥手搬走了`); wdUid = G.dolls[0].uid; renderWardrobe(); save();
};

function randomLook() {
  const keys = o => Object.keys(o), r = n => (Math.random() * n) | 0;
  const top = pick(keys(OUTFIT.top));
  return {
    skin: r(OUTFIT.skin.length), hair: pick(keys(OUTFIT.hair)), hairColor: r(OUTFIT.hairColor.length),
    top, topColor: r(OUTFIT.clothColor.length), bottom: pick(keys(OUTFIT.bottom)), bottomColor: r(OUTFIT.clothColor.length),
    shoes: r(OUTFIT.shoes.length), acc: pick(keys(OUTFIT.acc)),
  };
}

function renderWdTabs() {
  const box = $('#wdTabs'); box.innerHTML = '';
  for (const d of G.dolls) {
    const b = el('button', d.uid === wdUid ? 'on' : '', esc(d.name));
    b.onclick = () => { wdUid = d.uid; SFX.play('click'); renderWardrobe(); };
    box.append(b);
  }
}

function renderWardrobe() {
  const d = wdDoll(); if (!d) return;
  renderWdTabs();
  $('#wdName').value = d.name;
  const box = $('#wdOptions'); box.innerHTML = '';
  const section = (title, node) => { const s = el('div', 'opt'); s.append(el('h4', null, title), node); box.append(s); };
  const chips = (obj, key) => {
    const w = el('div', 'chips');
    for (const [k, name] of Object.entries(obj)) {
      const b = el('button', 'chip' + (d.look[key] === k ? ' on' : ''), name);
      b.onclick = () => { d.look[key] = k; SFX.play('pop'); renderWardrobe(); };
      w.append(b);
    }
    return w;
  };
  const swatches = (cols, key) => {
    const w = el('div', 'chips');
    cols.forEach((col, i) => {
      const b = el('button', 'swatch' + (d.look[key] === i ? ' on' : ''));
      b.style.background = col; b.setAttribute('aria-label', col);
      b.onclick = () => { d.look[key] = i; SFX.play('pop'); renderWardrobe(); };
      w.append(b);
    });
    return w;
  };
  const pers = el('div', 'chips');
  for (const [k, P] of Object.entries(PERSONAS)) {
    const b = el('button', 'chip' + (d.persona === k ? ' on' : ''), `${P.icon} ${P.name}<small>${P.desc}</small>`);
    b.onclick = () => { d.persona = k; SFX.play('pop'); say(d, pick(P.lines)); renderWardrobe(); };
    pers.append(b);
  }
  section('性格', pers);
  const jobs = el('div', 'chips');
  for (const [k, J] of Object.entries(JOBS)) {
    const sub = J.start == null ? (k === 'artist' ? '不用出门 · 偶尔卖画' : '不用出门 · 没有收入') : `${hhmm(J.start)}–${hhmm(J.end)} · ${yuan(J.wage)}/天${k === 'student' ? ' · 不谈恋爱' : ''}`;
    const b = el('button', 'chip' + (d.job === k ? ' on' : ''), `${J.icon} ${J.name}<small>${sub}</small>`);
    b.onclick = () => {
      d.job = k; SFX.play('pop');
      if (k === 'student') { clearRomance(d); HOOK.toast('学生不参与恋爱剧情，和 TA 有关的恋爱关系已清零', true); }
      renderWardrobe();
    };
    jobs.append(b);
  }
  section('职业', jobs);
  const gen = el('div', 'chips');
  for (const [k, n] of Object.entries(GENDERS)) {
    const b = el('button', 'chip' + (d.gender === k ? ' on' : ''), n);
    b.onclick = () => { d.gender = k; SFX.play('pop'); renderWardrobe(); };
    gen.append(b);
  }
  section('性别', gen);
  const zs = el('div', 'chips');
  for (const z of ZODIAC) {
    const b = el('button', 'chip' + (d.zodiac === z.id ? ' on' : ''), `${z.icon} ${z.name}<small>${ELEMENTS[z.el].icon}${ELEMENTS[z.el].name}</small>`);
    b.onclick = () => { d.zodiac = z.id; SFX.play('pop'); renderWardrobe(); };
    zs.append(b);
  }
  section('星座', zs);
  const ms = el('div', 'chips');
  MBTI_AXES.forEach(([a, b, na, nb], i) => {
    for (const [letter, label] of [[a, na], [b, nb]]) {
      const btn = el('button', 'chip' + (mb(d)[i] === letter ? ' on' : ''), `${letter} ${label}`);
      btn.onclick = () => { const m = mb(d).split(''); m[i] = letter; d.mbti = m.join(''); SFX.play('pop'); renderWardrobe(); };
      ms.append(btn);
    }
    if (i < 3) ms.append(el('span', 'mbti-sep', '·'));
  });
  section(`MBTI：${mb(d)} ${MBTI_NAMES[mb(d)]}`, ms);
  const hearts = el('div', 'chips');
  for (const [k, H] of Object.entries(HEARTS)) {
    const b = el('button', 'chip' + (d.heart === k ? ' on' : ''), `${H.icon} ${H.name}<small>${H.desc}</small>`);
    b.onclick = () => { d.heart = k; SFX.play('pop'); renderWardrobe(); };
    hearts.append(b);
  }
  section('感情观', hearts);
  section('肤色', swatches(OUTFIT.skin, 'skin'));
  section('发型', chips(OUTFIT.hair, 'hair'));
  section('发色', swatches(OUTFIT.hairColor, 'hairColor'));
  section('上衣', chips(OUTFIT.top, 'top'));
  section('上衣颜色', swatches(OUTFIT.clothColor, 'topColor'));
  if (d.look.top !== 'dress') section('下装', chips(OUTFIT.bottom, 'bottom'));
  section(d.look.top === 'overall' ? '背带颜色' : '下装颜色', swatches(OUTFIT.clothColor, 'bottomColor'));
  section('鞋子', swatches(OUTFIT.shoes, 'shoes'));
  section('配饰', chips(OUTFIT.acc, 'acc'));
  drawWdPreview();
}
function drawWdPreview() { const d = wdDoll(); if (d) dollPortrait($('#wdCanvas'), d.look, wdDir, wdFrame, 'walk'); }

/* ---------- 新住户 ---------- */
$('#btnAddDoll').onclick = () => {
  if (G.dolls.length >= LEVELS[G.level].cap) { HOOK.toast(`房子住满了，扩建后才能邀请更多人`, true); return; }
  const used = new Set(G.dolls.map(d => d.name));
  const name = NAMES.find(n => !used.has(n)) || '新朋友';
  const d = addDoll({ name, persona: pick(Object.keys(PERSONAS)), job: pick(Object.keys(JOBS)), zodiac: randomZodiac(), mbti: randomMbti(), heart: Math.random() < 0.25 ? 'fickle' : Math.random() < 0.5 ? 'loyal' : 'normal', look: randomLook() });
  G.sel = d.uid; say(d, '大家好，请多关照！'); spawnHeart(d); SFX.play('love');
  HOOK.select(); save(); HOOK.toast(`${name} 搬进来啦！`);
};

/* ---------- 主循环 ---------- */
load(); rebuild(); HOOK.select(); updateClock(); renderLog(); renderShopBar();
let last = performance.now(), uiT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; updateClock(); tickInfo(); renderShopBar(); }
  if (!$('#wardrobe').hidden) { wdTimer += dt; if (wdTimer > 0.18) { wdTimer = 0; wdFrame = (wdFrame + 1) % 4; drawWdPreview(); } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('beforeunload', save);

document.getElementById('dailyPaper').onclick=showHousePaper;
document.getElementById('paperCopy').onclick=async event=>{
  try{await navigator.clipboard.writeText(document.getElementById('paperText').textContent);event.target.textContent='已复制';}
  catch{event.target.textContent='请选中日报文字复制';}
};
const paperAuto=document.getElementById('paperAuto');
paperAuto.checked=localStorage.getItem('house-paper-auto')!=='off';
paperAuto.onchange=()=>localStorage.setItem('house-paper-auto',paperAuto.checked?'on':'off');
</script>
</body>
