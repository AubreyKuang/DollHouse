<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素小屋</title>
<style>
:root{
  --bg:#f4e9d8;
  --bg-2:#ead9bf;
  --panel:#fffaf0;
  --panel-2:#f6ead6;
  --ink:#3b2a2f;
  --muted:#8a7366;
  --line:#3b2a2f;
  --accent:#e26d7d;
  --accent-ink:#fff;
  --sel:#ffd35c;
  --good:#7cc576;
  --warn:#f0a64a;
  --bad:#e26d6d;
  --shadow:#3b2a2f;
  --backdrop:rgba(40,28,34,.5);
  --font-display:"PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-pixel:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221b26;--bg-2:#2c2332;--panel:#2f2637;--panel-2:#3b3044;--ink:#f3e8da;--muted:#b6a394;
    --line:#120d15;--shadow:#0a070c;--backdrop:rgba(5,3,8,.65);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221b26;--bg-2:#2c2332;--panel:#2f2637;--panel-2:#3b3044;--ink:#f3e8da;--muted:#b6a394;
  --line:#120d15;--shadow:#0a070c;--backdrop:rgba(5,3,8,.65);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(var(--bg-2) 1.5px,transparent 1.5px);
  background-size:18px 18px;
  color:var(--ink);font-family:var(--font-body);
  display:flex;flex-direction:column;min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0}

.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);
  border-bottom:3px solid var(--line);
}
.topbar h1{font-size:24px;letter-spacing:2px;color:var(--accent)}
.clock{font-family:var(--font-pixel);font-size:14px;display:flex;gap:8px;align-items:center;
  background:var(--panel-2);border:2px solid var(--line);padding:3px 10px;border-radius:6px}
.clock #dayLabel{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.modes,.speed{display:flex;gap:6px}
.modes{margin-left:auto}
.modes button,.speed button,.btn,.tab{
  background:var(--panel-2);border:2px solid var(--line);border-radius:6px;
  padding:6px 12px;box-shadow:0 3px 0 var(--shadow);transition:transform .05s;
}
.modes button:active,.speed button:active,.btn:active,.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.modes button.on,.speed button.on,.tab.on{background:var(--sel);color:#3b2a2f}
.speed button{padding:6px 9px}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger,.btn.on{background:var(--accent);color:var(--accent-ink)}

.layout{flex:1;display:flex;gap:16px;padding:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#stageWrap{flex:1 1 560px;max-width:900px;min-width:0}
#stage{
  position:relative;width:100%;aspect-ratio:4/3;
  border:3px solid var(--line);border-radius:6px;overflow:hidden;
  box-shadow:0 6px 0 var(--shadow);background:#000;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#overlay{position:absolute;inset:0;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}

.bubble{
  position:absolute;transform:translate(-50%,-100%);
  background:#fffaf0;color:#3b2a2f;border:2px solid #3b2a2f;border-radius:8px;
  padding:3px 8px;font-size:13px;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.25);animation:pop .18s ease-out;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;
  border:5px solid transparent;border-top-color:#3b2a2f;border-bottom:0}
.nametag{position:absolute;transform:translate(-50%,0);font-size:11px;padding:1px 6px;border-radius:4px;
  background:rgba(59,42,47,.8);color:#fff;white-space:nowrap}
.heart{position:absolute;font-size:14px;animation:floatUp 1s ease-out forwards}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
@keyframes floatUp{to{transform:translateY(-28px);opacity:0}}

#side{flex:0 1 270px;min-width:240px;display:flex;flex-direction:column;gap:10px}
#side h2{font-size:20px}
#dollList{display:flex;flex-direction:column;gap:6px}
.doll-row{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--panel);
  border:2px solid var(--line);border-radius:6px;cursor:pointer;text-align:left;width:100%}
.doll-row.sel{background:var(--sel);color:#3b2a2f}
.doll-row.away canvas{opacity:.35}
.g-m{color:#4a8fd8}.g-f{color:#e26d7d}
.doll-row.sel .g-m,.doll-row.sel .g-f{color:inherit}
.doll-row.away .meta b::after{content:" · 外出";font-weight:400;font-size:12px;opacity:.7}
.doll-row canvas{width:30px;height:36px;image-rendering:pixelated;flex:none}
.doll-row .meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.doll-row .meta b{font-weight:600}
.doll-row .meta small{opacity:.75;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px;box-shadow:0 4px 0 var(--shadow)}
.card h3{margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:18px}
.card .persona{font-size:13px;color:var(--muted);margin-bottom:8px}
.need{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center;font-size:12px;margin:5px 0}
.bar{height:10px;border:2px solid var(--line);border-radius:3px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.card .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card .doing{font-size:13px;margin:6px 0 2px}
.card .money{font-size:13px;margin:-2px 0 8px}
.card .money b{font-family:var(--font-pixel);color:#4f9a4a}
.card .money b.neg{color:var(--bad)}
.rels{margin-top:10px;border-top:2px dashed var(--panel-2);padding-top:8px}
.rels h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.rel{margin:0 0 8px}
.rel-top{display:flex;justify-content:space-between;font-size:13px}
.rel-top small{color:var(--muted)}
.rel-top .stars{color:#e8a33a;font-size:11px;letter-spacing:-1px}
.mbti-sep{align-self:center;color:var(--muted)}
.rel-bars{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px;align-items:center;font-size:11px;margin-top:2px}
.rel-bars .bar{height:8px}

.log-card{padding:10px 12px}
.log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.log-head h3{margin:0}
.log-list{max-height:300px;overflow-y:auto;font-size:13px;line-height:1.4;padding-right:4px}
.log-day{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:12px;font-weight:600;padding:6px 0 3px;border-bottom:2px solid var(--panel-2)}
.log-item{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:4px 0;border-bottom:1px dashed var(--panel-2)}
.log-item time{font-family:var(--font-pixel);color:var(--muted);font-size:12px}
.log-empty{color:var(--muted);font-size:13px;padding:8px 0}
.shop-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-bottom:8px}
.shop-bar .fund b{font-family:var(--font-pixel);color:#4f9a4a}
.shop-bar .house{color:var(--muted);font-size:13px}
.shop-bar .spacer{flex:1}
.shop-bar button:disabled{opacity:.5;cursor:default}
#btnExpand.ready{background:var(--good);color:#fff}
.fund-pill{font-size:13px}
.item small.price{font-size:11px;font-family:var(--font-pixel);color:var(--muted)}
.item small.price.own{color:#4f9a4a}
.item small.price.poor{color:var(--bad)}
.item.locked{opacity:.5}
.item.locked canvas{filter:grayscale(1)}
#buildBar{background:var(--panel);border-top:3px solid var(--line);padding:10px 16px 12px;position:sticky;bottom:0}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs .spacer{flex:1}
.palette{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px}
.item{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--panel-2);border:2px solid var(--line);border-radius:6px;padding:6px 4px;font-size:12px}
.item.on{background:var(--sel);color:#3b2a2f}
.item canvas{width:56px;height:56px;image-rendering:pixelated}

.modal{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal[hidden],#buildBar[hidden],.card[hidden]{display:none}
.modal-card{background:var(--panel);border:3px solid var(--line);border-radius:8px;box-shadow:0 8px 0 var(--shadow);
  width:min(820px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.wd-tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.wd-tabs button{background:var(--panel-2);border:2px solid var(--line);border-radius:6px;padding:3px 10px}
.wd-tabs button.on{background:var(--sel);color:#3b2a2f}
.wd-body{display:flex;gap:16px;padding:14px;overflow:auto;flex-wrap:wrap}
.wd-preview{flex:0 0 200px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto}
#wdCanvas{width:200px;height:240px;image-rendering:pixelated;border:2px solid var(--line);border-radius:6px;
  background:repeating-conic-gradient(var(--panel-2) 0 25%,var(--panel) 0 50%) 0 0/20px 20px}
.wd-dir{display:flex;gap:4px}
.wd-dir button{border:2px solid var(--line);background:var(--panel-2);border-radius:4px;width:34px;height:28px}
.wd-name{font-size:13px;display:flex;gap:6px;align-items:center}
.wd-name input{width:110px;font:inherit;padding:3px 6px;border:2px solid var(--line);border-radius:4px;background:var(--panel-2);color:var(--ink)}
.wd-options{flex:1 1 360px;display:flex;flex-direction:column;gap:12px;min-width:0}
.opt h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 10px;font-size:13px}
.chip.on{background:var(--sel);color:#3b2a2f}
.chip small{display:block;font-size:11px;opacity:.7}
.swatch{width:26px;height:26px;border:2px solid var(--line);border-radius:5px;padding:0}
.swatch.on{outline:3px solid var(--accent);outline-offset:1px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:6px;font-size:14px;
  transition:all .25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:700px){
  .topbar{padding:8px 16px;gap:8px}
  .topbar h1{font-size:20px}
  .modes{margin-left:0;order:3;width:100%}
  .modes button{flex:1;padding:6px 4px}
  .layout{padding:12px 16px;gap:12px}
  #side{flex:1 1 100%}
  .bubble{font-size:11px;padding:2px 6px}
}
</style>
</head>
<body>
<header class="topbar">
  <h1>像素小屋</h1>
  <div class="clock" title="游戏时间">
    <span id="dayLabel">第 1 天</span>
    <span id="clock">08:00</span>
    <span id="timeIcon">☀️</span>
  </div>
  <div class="clock fund-pill" title="家庭基金">🏦 <span id="fundTop"></span></div>
  <nav class="modes" aria-label="模式">
    <button class="mode on" data-mode="live">🏠 生活</button>
    <button class="mode" data-mode="build">🪑 布置</button>
    <button id="btnWardrobe">👗 衣橱</button>
  </nav>
  <div class="speed" aria-label="速度">
    <button data-speed="0" title="暂停">⏸</button>
    <button data-speed="1" class="on" title="正常">▶</button>
    <button data-speed="3" title="快进">⏩</button>
    <button id="btnSound" title="声音">🔇</button>
  </div>
</header>

<main class="layout">
  <div id="stageWrap">
    <div id="stage">
      <canvas id="cv" width="256" height="192"></canvas>
      <div id="overlay"></div>
    </div>
    <p id="hint" class="hint">点击小人查看状态，按住可以把 TA 拎起来放到别处～</p>
  </div>

  <aside id="side">
    <h2>住户</h2>
    <div id="dollList"></div>
    <div id="dollInfo" class="card" hidden></div>
    <button id="btnAddDoll" class="btn ghost">＋ 邀请新住户</button>
    <div class="card log-card">
      <div class="log-head"><h3>📜 生活日志</h3><button id="btnLogClear" class="btn small ghost">清空</button></div>
      <div id="logList" class="log-list"></div>
    </div>
  </aside>
</main>

<div style="padding:.5rem"><button type="button" id="dailyPaper">📰 小屋日报</button></div>
<dialog id="paperDialog"><form method="dialog"><button aria-label="关闭">关闭</button></form><h2>小屋日报</h2><label><input id="paperAuto" type="checkbox"> 每日自动打开</label><pre id="paperText" style="white-space:pre-wrap"></pre><button type="button" id="paperCopy">复制日报</button></dialog>
<section id="buildBar" hidden>
  <div class="shop-bar">
    <span class="fund">🏦 家庭基金 <b id="fundAmt"></b></span>
    <span class="house" id="houseLv"></span>
    <span class="spacer"></span>
    <button id="btnCrowd" class="btn small">📣 号召大家凑钱</button>
    <button id="btnExpand" class="btn small"></button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="furniture">家具</button>
    <button class="tab" data-tab="wall">墙纸</button>
    <button class="tab" data-tab="floor">地板</button>
    <span class="spacer"></span>
    <button id="btnTrash" class="btn small" title="点击家具删除">🗑 删除模式</button>
    <button id="btnReset" class="btn small ghost">恢复默认</button>
  </div>
  <div id="palette" class="palette"></div>
  <p id="buildHint" class="hint">选择家具后点击房间放置 · 点已有家具可以拿起移动 · 右键/Esc 取消</p>
</section>

<div id="wardrobe" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>👗 衣橱</h2>
      <div id="wdTabs" class="wd-tabs"></div>
      <button id="wdClose" class="btn small" aria-label="关闭">✕</button>
    </div>
    <div class="wd-body">
      <div class="wd-preview">
        <canvas id="wdCanvas" width="20" height="24"></canvas>
        <div class="wd-dir">
          <button data-dir="left">◀</button>
          <button data-dir="down">●</button>
          <button data-dir="right">▶</button>
          <button data-dir="up">▲</button>
        </div>
        <label class="wd-name">名字 <input id="wdName" maxlength="8"></label>
        <button id="wdRandom" class="btn small">🎲 随机搭配</button>
        <button id="wdRemove" class="btn small ghost">请 TA 搬走</button>
      </div>
      <div id="wdOptions" class="wd-options"></div>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
// 静态数据：房间尺寸、家具、性格、服装选项、默认存档
const T = 16;              // 每格像素
let COLS = 16;              // 房子宽度，扩建时会变大
const FLOOR_SPLIT = 12;
const STAIRS_X = 14;
const ROWS = 20;
const WALL_ROWS = 3;       // 上面三行是墙
let W = COLS * T;
const H = ROWS * T;

// use: 小人能做的事；mode: on=坐/躺在家具上, front=站在家具前
// layer: floor=地毯(可走), wall=挂在墙上, 其它为普通家具
const FURNITURE = {
  bed:      { name: '小床',   w: 2, h: 2, use: 'sleep', mode: 'on',    need: { energy: 26 } },
  bigbed:   { name: '双人床', w: 3, h: 2, use: 'sleep', mode: 'on',    need: { energy: 26 } },
  sofa:     { name: '沙发',   w: 2, h: 1, use: 'sit',   mode: 'on',    need: { energy: 6, fun: 4 } },
  chair:    { name: '椅子',   w: 1, h: 1, use: 'sit',   mode: 'on',    need: { energy: 5 } },
  table:    { name: '餐桌',   w: 2, h: 1, use: 'meal', mode: 'front', cap: 4, need: { hunger: 32, social: 12 } },
  fridge:   { name: '冰箱',   w: 1, h: 1, use: 'snack', mode: 'front', need: { hunger: 22 } },
  stove:    { name: '灶台',   w: 1, h: 1, use: 'cook',  mode: 'front', need: { hunger: 34, fun: 4 } },
  shelf:    { name: '书架',   w: 2, h: 1, use: 'read',  mode: 'front', need: { fun: 14 } },
  tv:       { name: '电视',   w: 2, h: 1, use: 'tv',    mode: 'front', need: { fun: 18, energy: 2 } },
  arcade:   { name: '游戏机', w: 1, h: 1, use: 'game',  mode: 'front', need: { fun: 24, energy: -4 } },
  piano:    { name: '钢琴',   w: 2, h: 1, use: 'piano', mode: 'front', need: { fun: 20 } },
  bath:     { name: '浴缸',   w: 2, h: 1, use: 'bath',  mode: 'on',    need: { energy: 10, fun: 10 } },
  plant:    { name: '盆栽',   w: 1, h: 1, use: 'water', mode: 'front', need: { fun: 6 } },
  lamp:     { name: '落地灯', w: 1, h: 1, use: null },
  catbed:   { name: '猫窝',   w: 1, h: 1, use: 'cat',   mode: 'front', need: { fun: 12, social: 10 } },
  rug:      { name: '圆地毯', w: 3, h: 2, use: null, layer: 'floor' },
  rug2:     { name: '条纹毯', w: 2, h: 2, use: null, layer: 'floor' },
  door:     { name: '大门',   w: 1, h: 2, use: null, layer: 'wall', fixed: true },
  window:   { name: '窗户',   w: 2, h: 2, use: null, layer: 'wall' },
  painting: { name: '挂画',   w: 1, h: 1, use: null, layer: 'wall' },
  clock:    { name: '挂钟',   w: 1, h: 1, use: null, layer: 'wall' },
  poster:   { name: '海报',   w: 1, h: 2, use: null, layer: 'wall' },
};

const NEEDS = [
  { key: 'energy', name: '精力', color: '#f2c33a' },
  { key: 'hunger', name: '饱腹', color: '#ef9a4f' },
  { key: 'fun',    name: '快乐', color: '#ec6a8a' },
  { key: 'social', name: '社交', color: '#6aa9ec' },
];

// decay: 每游戏小时下降量；like: 偏好的活动加分；speed: 走路速度(格/秒)
const PERSONAS = {
  genki: {
    name: '元气', icon: '⚡', desc: '停不下来，喜欢游戏和跳舞',
    speed: 3.2, decay: { energy: 5, hunger: 4, fun: 7, social: 3 },
    like: { game: 40, dance: 45, piano: 15, wander: 20, chat: 5, sleep: -15 },
    dur: { sit: 0.5, read: 0.5, sleep: 0.8, dance: 1.4, game: 1.3 },
    chat: ['我们去跳舞吧！', '比赛谁先跑到门口！', '今天也超——有精神！', '好无聊，来玩嘛！'],
    lines: ['冲呀！', '今天也好有精神～', '来跳舞吧！', '嘿嘿嘿', '好无聊，想玩！'],
  },
  lazy: {
    name: '懒懒', icon: '💤', desc: '能躺着绝不坐着',
    speed: 1.5, decay: { energy: 7, hunger: 3, fun: 3, social: 2 },
    like: { sleep: 40, sit: 40, tv: 30, bath: 20, chat: -5, dance: -25, game: -10 },
    dur: { sit: 2.2, sleep: 1.5, tv: 1.8, bath: 1.6 },
    chat: ['嗯……（打哈欠）', '聊天好累哦', '你说，我听着……zzz', '要不我们躺着聊？'],
    lines: ['好困……', '再睡五分钟', '沙发是我的', '哈啊～', '不想动'],
  },
  nerd: {
    name: '书虫', icon: '📚', desc: '书架是 TA 的宝藏',
    speed: 2.2, decay: { energy: 4, hunger: 3, fun: 5, social: 1.5 },

// 家具在 y 方向的视觉顶部（用于选中高亮、图标裁切）

<script>
// 小人像素绘制：12×20 的小人，头身比偏大，按层叠画出 腿→身体→手→头→头发→配饰

function dollColors(L) {
  return {
    skin: OUTFIT.skin[L.skin] || OUTFIT.skin[0],
    hair: OUTFIT.hairColor[L.hairColor] || OUTFIT.hairColor[0],
    top: OUTFIT.clothColor[L.topColor] || OUTFIT.clothColor[0],
    bot: OUTFIT.clothColor[L.bottomColor] || OUTFIT.clothColor[0],

}

// 头发形状（相对小人左上角的矩形），会自动加一圈描边
const HAIR = {
  down: {
    base: [[1, 0, 10, 3], [1, 3, 1, 3], [10, 3, 1, 3]],
    short: [[2, 3, 3, 1], [7, 3, 2, 1]],
    long: [[2, 3, 3, 1], [7, 3, 2, 1], [0, 2, 2, 11], [10, 2, 2, 11]],
    twin: [[2, 3, 3, 1], [7, 3, 2, 1], [-2, 3, 3, 7], [11, 3, 3, 7]],
    bun: [[2, 3, 3, 1], [7, 3, 2, 1], [4, -3, 4, 3]],
    spiky: [[2, -2, 2, 2], [5, -3, 2, 3], [8, -2, 2, 2], [2, 3, 2, 1], [5, 3, 2, 1], [8, 3, 1, 1]],
    bob: [[2, 3, 8, 1], [0, 2, 2, 7], [10, 2, 2, 7]],
  },
  up: {
    base: [[1, 0, 10, 9]],
    short: [], long: [[0, 2, 12, 11]], twin: [[-2, 3, 3, 7], [11, 3, 3, 7]],
    bun: [[4, -3, 4, 3]], spiky: [[2, -2, 2, 2], [5, -3, 2, 3], [8, -2, 2, 2]], bob: [[0, 2, 12, 7]],
  },
  right: {
    base: [[1, 0, 10, 3], [1, 2, 4, 6], [8, 3, 2, 1]],
    short: [], long: [[0, 2, 4, 11]], twin: [[-2, 3, 3, 7]],
    bun: [[3, -3, 4, 3]], spiky: [[2, -2, 2, 2], [5, -3, 2, 3], [8, -2, 2, 2]], bob: [[0, 2, 5, 7], [6, 3, 4, 1]],
  },
};

function blob(c, x, y, rects, col) {
  for (const [a, b, w, h] of rects) R(c, x + a - 1, y + b - 1, w + 2, h + 2, INK);
  for (const [a, b, w, h] of rects) R(c, x + a, y + b, w, h, col);
}

/* o: { dir, frame, pose: stand|walk|sit|lift|dance|head, hop, blink, happy } */
function drawDoll(c, cx, by, L, o = {}) {
  const dir = o.dir || 'down', fr = o.frame || 0, pose = o.pose || 'stand';
  const C = dollColors(L);
  const x = Math.round(cx) - 6;
  let y = Math.round(by) - 20 - (o.hop || 0);
  const view = dir === 'left' ? 'right' : dir;

  if (pose !== 'lift' && pose !== 'sit' && pose !== 'head')
    R(c, x + 2, Math.round(by) - 1, 8, 2, 'rgba(0,0,0,.22)');

  c.save();
  if (dir === 'left') { c.translate(x * 2 + 12, 0); c.scale(-1, 1); }

  if (pose === 'head') { y = Math.round(by) - 9; drawHead(c, x, y, L, C, view, { sleep: true }); c.restore(); return; }

  const walking = pose === 'walk';
  const bob = walking && fr % 2 === 1 ? -1 : 0;
  const isDress = L.top === 'dress';
  const legCol = L.bottom === 'pants' && !isDress ? C.bot : C.skin;

  // 腿
  if (pose === 'sit') {
    R(c, x + 3, y + 15, 6, 2, legCol); R(c, x + 3, y + 17, 2, 1, C.shoe); R(c, x + 7, y + 17, 2, 1, C.shoe);
  } else {
    let upL = 0, upR = 0;
    if (walking) { upL = fr === 1 ? 1 : 0; upR = fr === 3 ? 1 : 0; }
    if (pose === 'lift') { upL = fr % 2; upR = 1 - fr % 2; }
    if (pose === 'dance') { upL = fr % 2 ? 2 : 0; }
    const leg = (lx, up) => {
      R(c, x + lx - 1, y + 15, 4, 5 - up, INK);
      R(c, x + lx, y + 15, 2, 4 - up, legCol);
      if (L.bottom === 'shorts' && !isDress) R(c, x + lx, y + 15, 2, 1, C.bot);
      R(c, x + lx, y + 19 - up, 2, 1, C.shoe);
    };
    if (view === 'right') { leg(4 + (walking ? (fr === 1 ? -1 : fr === 3 ? 1 : 0) : 0), upL); leg(6 - (walking ? (fr === 1 ? -1 : fr === 3 ? 1 : 0) : 0), upR); }
    else { leg(3, upL); leg(7, upR); }
  }

  // 身体
  const yb = y + bob;
  box(c, x + 2, yb + 9, 8, 7, C.top);
  const front = view === 'down';
  if (L.top === 'tee' && front) R(c, x + 5, yb + 10, 2, 1, C.skin);
  if (L.top === 'hoodie') { R(c, x + 3, yb + 13, 6, 1, shade(C.top, -0.15)); if (front) { R(c, x + 5, yb + 10, 1, 2, '#fff'); R(c, x + 7, yb + 10, 1, 2, '#fff'); } }

  if (L.top === 'suit' && front) { R(c, x + 5, yb + 10, 2, 3, '#ffffff'); R(c, x + 5, yb + 11, 1, 2, '#e26d7d'); }
  // 下装（连衣裙自带裙摆）
  if (isDress || L.bottom === 'skirt') {
    const sc = isDress ? C.top : C.bot;
    R(c, x + 1, yb + 14, 10, 4, INK); R(c, x + 2, yb + 14, 8, 3, sc); R(c, x + 2, yb + 16, 8, 1, shade(sc, -0.15));
  } else if (pose !== 'sit') { R(c, x + 3, yb + 14, 6, 1, C.bot); }

  // 手臂
  const sleeve = L.top === 'hoodie' || L.top === 'suit' || L.top === 'stripe' ? 3 : 2;
  const arm = (ax, dy, up) => {
    if (up) { R(c, x + ax - 1, yb + 5, 3, 7, INK); R(c, x + ax, yb + 6, 1, 5, C.top); R(c, x + ax, yb + 5, 1, 1, C.skin); return; }
    R(c, x + ax - 1, yb + 9 + dy, 3, 6, INK);
    R(c, x + ax, yb + 10 + dy, 1, sleeve, L.top === 'overall' ? '#fffaf0' : C.top);
    R(c, x + ax, yb + 10 + dy + sleeve, 1, 4 - sleeve, C.skin);
  };
  const sw = walking ? (fr === 1 ? 1 : fr === 3 ? -1 : 0) : 0;
  if (view === 'right') arm(6, sw, pose === 'lift' || (pose === 'dance' && fr % 2));

}

function drawHead(c, x, y, L, C, view, o) {
  box(c, x + 1, y + 1, 10, 9, C.skin);
  if (view === 'down') {
    if (L.acc === 'glasses') { R(c, x + 3, y + 4, 3, 3, INK); R(c, x + 6, y + 4, 3, 3, INK); R(c, x + 4, y + 5, 1, 1, '#cfeaf7'); R(c, x + 7, y + 5, 1, 1, '#cfeaf7'); }
    if (o.sleep || o.blink) { R(c, x + 3, y + 6, 2, 1, INK); R(c, x + 7, y + 6, 2, 1, INK); }
    else if (L.acc === 'glasses') { R(c, x + 4, y + 5, 1, 1, INK); R(c, x + 7, y + 5, 1, 1, INK); }
    else { R(c, x + 4, y + 5, 1, 2, INK); R(c, x + 7, y + 5, 1, 2, INK); }
    R(c, x + 2, y + 7, 2, 1, '#f59aa8'); R(c, x + 8, y + 7, 2, 1, '#f59aa8');
    if (o.happy) R(c, x + 5, y + 8, 2, 1, '#c0505a');

    if (L.acc === 'glasses') { R(c, x + 6, y + 4, 3, 3, INK); R(c, x + 7, y + 5, 1, 1, '#cfeaf7'); }

  blob(c, x, y, rects, C.hair);
  if (view !== 'up') R(c, x + 3, y + 1, 3, 1, shade(C.hair, 0.18)); // 头发高光
  drawAcc(c, x, y, L, C, view);
}

function drawAcc(c, x, y, L, C, view) {
  const a = L.acc;
  if (a === 'cap') {
    blob(c, x, y, [[1, -1, 10, 3]], C.top);
    if (view === 'down') R(c, x + 1, y + 2, 10, 1, shade(C.top, -0.25));
    if (view === 'right') blob(c, x, y, [[9, 2, 4, 1]], shade(C.top, -0.2));
  } else if (a === 'bow') {
    const bx = view === 'right' ? 2 : 7;
    blob(c, x, y, [[bx, -1, 2, 3], [bx + 3, -1, 2, 3]], '#e26d7d'); R(c, x + bx + 2, y, 1, 1, '#c24d60');
  } else if (a === 'phones') {
    R(c, x + 1, y - 2, 10, 1, '#3b3a4a');
    if (view === 'down') { blob(c, x, y, [[0, 4, 1, 3], [11, 4, 1, 3]], C.top); }
    else if (view === 'right') blob(c, x, y, [[4, 3, 2, 3]], C.top);
  } else if (a === 'cat') {
    blob(c, x, y, [[1, -2, 3, 2], [8, -2, 3, 2]], C.hair);
    R(c, x + 2, y - 1, 1, 1, '#f59aa8'); R(c, x + 9, y - 1, 1, 1, '#f59aa8');

<script>
// 所有声音都用 WebAudio 振荡器和噪声现场合成，没有任何音频文件
const SFX = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let on = false, musicTimer = null, nextNote = 0, step = 0;
  let rainWanted = false, rainSrc = null, rainGain = null;

  // 下雨时的沙沙声：一段循环的带通白噪声
  function updateRain() {
    if (on && rainWanted && !rainSrc) {
      rainSrc = ctx.createBufferSource(); rainSrc.buffer = noiseBuf; rainSrc.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.6;
      rainGain = ctx.createGain(); rainGain.gain.value = 0.0001; rainGain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 1.5);
      rainSrc.connect(f); f.connect(rainGain); rainGain.connect(master); rainSrc.start();
    } else if ((!on || !rainWanted) && rainSrc) {
      rainSrc.stop(); rainSrc = null;
    }
  }

  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
    // 一秒白噪声，用来做“噗”“沙沙”的声音
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  const hz = n => 440 * Math.pow(2, (n - 69) / 12); // MIDI 音高 → 频率

  function tone(freq, t, dur, type = 'square', vol = 0.2, bus = sfxBus, slide = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.02);
  }

  function noise(t, dur, vol = 0.2, freq = 1200, q = 1) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.02);
  }

  const SOUNDS = {
    click: t => tone(hz(84), t, 0.05, 'square', 0.08),
    pop: t => tone(hz(79), t, 0.08, 'sine', 0.18, sfxBus, 1.6),
    place: t => { tone(hz(45), t, 0.12, 'triangle', 0.35, sfxBus, 0.6); noise(t, 0.08, 0.15, 400); },
    pick: t => tone(hz(67), t, 0.1, 'triangle', 0.2, sfxBus, 1.5),
    trash: t => { noise(t, 0.25, 0.3, 900, 0.7); tone(hz(60), t, 0.2, 'square', 0.08, sfxBus, 0.4); },
    deny: t => { tone(hz(50), t, 0.09, 'square', 0.1); tone(hz(47), t + 0.1, 0.12, 'square', 0.1); },
    lift: t => tone(hz(72), t, 0.18, 'sine', 0.2, sfxBus, 2),
    drop: t => { tone(hz(62), t, 0.1, 'sine', 0.2, sfxBus, 0.5); noise(t + 0.05, 0.05, 0.1, 500); },
    love: t => [76, 79, 84].forEach((n, i) => tone(hz(n), t + i * 0.07, 0.18, 'triangle', 0.18)),
    eat: t => [0, 0.12, 0.24].forEach(d => noise(t + d, 0.06, 0.18, 2500, 3)),
    cook: t => noise(t, 0.4, 0.08, 4000, 0.5),
    piano: t => { const sc = [60, 62, 64, 67, 69, 72]; tone(hz(sc[(Math.random() * 6) | 0]), t, 0.5, 'triangle', 0.2); },
    game: t => { const n = 72 + ((Math.random() * 12) | 0); tone(hz(n), t, 0.06, 'square', 0.07); tone(hz(n + 7), t + 0.06, 0.06, 'square', 0.07); },
    splash: t => noise(t, 0.3, 0.15, 1500, 0.8),
    meow: t => tone(hz(81), t, 0.3, 'sawtooth', 0.06, sfxBus, 0.75),
    chat: t => { for (let i = 0; i < 3; i++) tone(hz(70 + ((Math.random() * 8) | 0)), t + i * 0.07, 0.05, 'square', 0.05); },
    snore: t => noise(t, 0.6, 0.05, 300, 1),
    step: t => noise(t, 0.03, 0.04, 2000, 2),
    newday: t => [72, 76, 79, 84].forEach((n, i) => tone(hz(n), t + i * 0.1, 0.25, 'triangle', 0.15)),
    open: t => [67, 72].forEach((n, i) => tone(hz(n), t + i * 0.06, 0.1, 'triangle', 0.15)),
  };

  // 背景音乐：C–Am–F–G 的和弦循环，三角波低音 + 方波琶音 + 偶尔的旋律
  const CHORDS = [[48, 52, 55, 60], [45, 48, 52, 57], [41, 45, 48, 53], [43, 47, 50, 55]];
  const MELODY = [76, 0, 79, 0, 76, 74, 72, 0, 72, 0, 74, 76, 74, 0, 0, 0,
                  77, 0, 76, 0, 74, 72, 69, 0, 71, 0, 72, 74, 72, 0, 0, 0];
  function schedule() {
    const night = typeof G !== 'undefined' && G.night;
    const spb = night ? 0.28 : 0.2; // 每个十六分音符的秒数，晚上慢一点
    while (nextNote < ctx.currentTime + 0.3) {
      const chord = CHORDS[Math.floor(step / 16) % 4], s = step % 16;
      if (s % 8 === 0) tone(hz(chord[0] - 12), nextNote, spb * 7, 'triangle', 0.32, musicBus);
      if (s % 2 === 0) tone(hz(chord[(s / 2) % 4] + 12), nextNote, spb * 1.6, night ? 'sine' : 'square', night ? 0.08 : 0.035, musicBus);
      const m = MELODY[step % 32];
      if (m && !night) tone(hz(m), nextNote, spb * 1.8, 'triangle', 0.09, musicBus);
      if (!night && s % 4 === 2) noise(nextNote, 0.03, 0.03, 6000, 1);
      nextNote += spb; step++;
    }
  }

  return {
    get on() { return on; },
    setRain(v) { rainWanted = v; if (ctx) updateRain(); },
    play(name) {
      if (!on || !ctx || !SOUNDS[name]) return;
      SOUNDS[name](ctx.currentTime + 0.005);
    },
    toggle() {
      init();
      on = !on;
      if (on) {
        ctx.resume();
        nextNote = ctx.currentTime + 0.1;
        musicTimer = setInterval(schedule, 100);
        SOUNDS.open(ctx.currentTime);
      } else { clearInterval(musicTimer); musicTimer = null; }
      updateRain();
      return on;
    },
  };
})();
</script>
<script>
// Deterministic NPC memory. Store the ledger with the game's save data.
const NPCMemory = (() => {
  const SHORT_LIMIT = 32;
  const LONG_LIMIT = 50;
  const WEIGHTS = { emotion: .35, relationship: .2, impact: .25, novelty: .1, goal: .1 };
  const ledgers = new WeakMap();
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const empty = () => ({ short: [], long: [], life: [] });

  function ledger(world) {
    return world.npcMemory ||= { version: 1, sequence: 0, events: {}, people: {} };
  }

  function index(data, person) {
    if (!ledgers.has(data)) ledgers.set(data, new Map());
    const people = ledgers.get(data);
    if (!people.has(person)) {
      const bySubject = new Map();
      const memory = Object.hasOwn(data.people, person) ? data.people[person] : empty();
      for (const entry of [...memory.short, ...memory.long]) {
        if (!bySubject.has(entry.subject)) bySubject.set(entry.subject, []);
        bySubject.get(entry.subject).push(entry);
      }
      people.set(person, bySubject);
    }
    return people.get(person);
  }

  function promote(memory, entry) {
    memory.long.push(entry);
    memory.long.sort((a, b) => b.importance - a.importance || b.sequence - a.sequence);
    memory.long.length = Math.min(LONG_LIMIT, memory.long.length);
    memory.life = memory.long.slice(0, 8).map(({ sources, interpretation }) => ({
      sources, interpretation
    }));
  }

  function remember(data, event, view) {
    const person = String(view.person);
    if (!Object.hasOwn(data.people, person)) {
      Object.defineProperty(data.people, person, { value: empty(), enumerable: true });
    }
    const memory = data.people[person];
    const subject = String(view.subject);
    const related = index(data, person).get(subject) || [];
    const confidence = clamp(view.confidence ?? 1, 0, 1);
    const signals = {
      emotion: Math.abs(view.emotion) * 100,
      relationship: view.relationship ?? 50,
      impact: view.impact ?? 50,
      novelty: related.some(entry => entry.type === event.type) ? 15 : 90,
      goal: view.goal ?? 50
    };
    const importance = Math.round(Object.entries(WEIGHTS).reduce(
      (total, [key, weight]) => total + clamp(signals[key], 0, 100) * weight, 0));
    if (importance < 25) return;
    const entry = {
      sources: [event.id], sequence: event.sequence, time: event.time,
      type: event.type, subject, interpretation: view.interpretation,
      emotion: view.emotion, confidence, importance, channel: view.channel || 'participant'
    };
    if (importance >= 72) {
      promote(memory, entry);
    } else {
      memory.short.push(entry);
      const similar = memory.short.filter(item =>
        item.subject === subject && item.type === event.type &&
        Math.sign(item.emotion) === Math.sign(entry.emotion));
      if (similar.length >= 3) {
        const merged = {
          ...entry, sources: similar.flatMap(item => item.sources),
          importance: Math.max(60, ...similar.map(item => item.importance)),
          emotion: similar.reduce((sum, item) => sum + item.emotion, 0) / similar.length,
          confidence: Math.min(...similar.map(item => item.confidence)),
          interpretation: entry.interpretation,
          occurrences: similar.length
        };
        memory.short = memory.short.filter(item => !similar.includes(item));
        promote(memory, merged);
      }
      while (memory.short.length > SHORT_LIMIT) {
        memory.short.sort((a, b) => a.importance - b.importance || a.sequence - b.sequence);
        const oldest = memory.short.shift();
        if (oldest.importance >= 62) promote(memory, oldest);
      }
    }
    ledgers.get(data).delete(person);
  }

  function record(world, facts, views) {
    const data = ledger(world);
    const sequence = facts.sequence ?? data.sequence + 1;
    // Events arrive in order. The watermark also rejects duplicates after compaction.
    if (sequence <= data.sequence) return null;
    if (sequence !== data.sequence + 1) throw new Error('NPC memory event sequence gap');
    const event = { ...facts, id: `event-${sequence}`, sequence };
    data.sequence = sequence;
    data.events[event.id] = event;
    const observers = new Set();
    for (const view of views) {
      const person = String(view.person);
      if (observers.has(person)) continue;
      observers.add(person);
      remember(data, event, view);
    }
    // Keep all retained memory sources and the most recent objective events.
    if (sequence % 64 === 0) {
      const retained = new Set(Object.values(data.people).flatMap(memory =>
        [...memory.short, ...memory.long].flatMap(entry => entry.sources)));
      for (const [id, source] of Object.entries(data.events)) {
        if (source.sequence <= sequence - 64 && !retained.has(id)) delete data.events[id];
      }
    }
    return event;
  }

  function influence(world, person, subject) {
    if (!world.npcMemory) return 0;
    const entries = index(world.npcMemory, String(person)).get(String(subject)) || [];
    return clamp(entries.reduce((total, entry) =>
      total + entry.emotion * entry.confidence * entry.importance / 100 *
        (entry.importance >= 60 ? 2 : 1), 0), -4, 4);
  }

  function recall(world, person) {
    const memory = world.npcMemory?.people[String(person)];
    return memory ? [...memory.short, ...memory.long].sort((a, b) => b.sequence - a.sequence) : [];
  }

  return { record, influence, recall };
})();
</script>
<script>
/* Shared snapshot storage. The primary key remains readable by older builds. */
const SaveManager = (() => {
  const version = 1;
  function decode(raw, valid) {
    try {
      const data = JSON.parse(raw);
      if (!data || (data.saveVersion != null && data.saveVersion !== version) || !valid(data)) return null;
      return data;
    } catch {
      return null;
    }
  }

  function load(storage, key, valid) {
    try {
      return decode(storage.getItem(key), valid) || decode(storage.getItem(key + ':backup'), valid);
    } catch {
      return null;
    }
  }

  function save(storage, key, data, valid) {
    try {
      const next = JSON.stringify({ ...data, saveVersion: version });
      if (!decode(next, valid)) return false;
      const previous = storage.getItem(key);
      if (previous === next) return true;
      if (decode(previous, valid)) storage.setItem(key + ':backup', previous);
      storage.setItem(key, next);
      return true;
    } catch {
      return false;
    }
  }

  return { load, save };
})();
</script>
<script>
function countHouseDay(kind, label) {
  const counters = (G.daily[kind] ||= {});
  const count=Object.hasOwn(counters,label)?counters[label]:0;
  Object.defineProperty(counters,label,{value:count+1,enumerable:true,writable:true,configurable:true});
}

function houseRelations(){
  return Object.fromEntries(Object.entries(G.rel).map(([key,value])=>[key,value.f]));
}

function finishHouseDay() {
  const lines = [`第 ${G.day} 天 · ${WEEKDAYS[weekday(G.day)]}`];
  const labels = { social:'社交', meal:'用餐', study:'书桌', audience:'钢琴围观', partners:'游戏伙伴', groom:'整理仪容' };
  for (const [kind,title] of Object.entries(labels)) {
    const top = Object.entries(G.daily[kind] || {}).sort((a,b)=>b[1]-a[1])[0];
    if (top) lines.push(`${title}　${top[0]} · ${top[1]} 次`);
  }
  const now=houseRelations();
  for(const [key,friendship] of Object.entries(now)){
    const delta=friendship-(G.dayRelations[key]??friendship);
    if(Math.abs(delta)<8)continue;
    const people=key.split('|').map(id=>G.dolls.find(person=>person.pid===id)?.name);
    if(people.every(Boolean))lines.push(`关系变化　${people.join('与')}：友好 ${delta>0?'+':''}${Math.round(delta)}`);
  }
  G.dayRelations=now;
  for (const entry of G.log.filter(entry=>entry.d===G.day).slice(-8)) lines.push(entry.text);
  if (lines.length===1) lines.push('今天小屋里很安静。');
  G.paper.push(lines.join('\n'));
  if (G.paper.length>30) G.paper.shift();
  G.daily={};
  if (document.getElementById('paperAuto')?.checked) showHousePaper();
}

function showHousePaper() {

  document.getElementById('paperText').textContent=G.paper.slice(-7).reverse().join('\n\n')||'今晚结束后会生成第一份日报。';
  if (!dialog.open) dialog.showModal();
}

function shareHouseNews(speaker, listener) {
  if (rel(speaker,listener).f<45) return;
  const now=absNow();
  const heard=NPCMemory.recall(G,listener.pid);
  const source=NPCMemory.recall(G,speaker.pid).find(entry=>
    entry.channel==='witness'&&now-entry.time>=360&&entry.subject!==listener.pid&&
    !heard.some(memory=>memory.sources.some(id=>id===entry.sources[0]||G.npcMemory.events[id]?.original===entry.sources[0])));
  if(!source)return;
  const misunderstood=Math.random()<.25;
  NPCMemory.record(G,{type:'rumor',time:now,participants:[speaker.pid,listener.pid],original:source.sources[0],outcome:'retold'},[
    {person:listener.pid,subject:source.subject,channel:'hearsay',confidence:misunderstood?.35:.65,
      emotion:source.emotion,impact:65,interpretation:misunderstood?'听说有人闹得很厉害，但详情我也不确定。':`听${speaker.name}说：${source.interpretation}`}
  ]);
  addLog(`💬 ${speaker.name} 向 ${listener.name} 说起了一件旧事`);
}

const validHouseSave=s=>Array.isArray(s.furniture)&&Array.isArray(s.dolls);

      floorsV: 1, paper: G.paper, daily: G.daily, dayRelations: G.dayRelations,

function addFurniture(id, x, y) {
  const f = { uid: G.uid++, id, x, y, active: false, users: [] };
  G.furniture.push(f);
  return f;
}
const layerOf = id => FURNITURE[id].layer || 'solid';

function canPlace(id, x, y, ignore) {
  const d = FURNITURE[id], L = layerOf(id);
  if (x < 0 || x + d.w > COLS) return false;
  if(L==='solid'&&x<=STAIRS_X&&x+d.w>STAIRS_X&&y<FLOOR_SPLIT+1&&y+d.h>FLOOR_SPLIT-1)return false;

  if (L === 'wall') { if (y < 0 || y + d.h > WALL_ROWS) return false; if (id === 'door' && y !== WALL_ROWS - 2) return false; }
  else if (y < WALL_ROWS || y + d.h > ROWS) return false;
  if (y < FLOOR_SPLIT && straddles(x, d.w)) return false;                                   // 不能骑在卧室隔墙上
  if (L === 'solid') for (let i = 0; i < d.w; i++) for (let j = 0; j < d.h; j++) if (isDoorTile(x + i, y + j)) return false;
  for (const f of G.furniture) {
    if (f === ignore || layerOf(f.id) !== L) continue;
    const e = FURNITURE[f.id];
    if (x < f.x + e.w && x + d.w > f.x && y < f.y + e.h && y + d.h > f.y) return false;
  }
  return true;
}

// 能走的格子：地板区域里没有实心家具
function blockedMap() {
  const m = [];
  for (let x = 0; x < COLS; x++) { m[x] = []; for (let y = 0; y < ROWS; y++) m[x][y] = y < WALL_ROWS; }
  for (const f of G.furniture) {
    if (layerOf(f.id) !== 'solid') continue;
    const d = FURNITURE[f.id];
    for (let i = 0; i < d.w; i++) for (let j = 0; j < d.h; j++) m[f.x + i][f.y + j] = true;
  }
  return m;
}
let BLOCK = null;
function rebuild() {
  BLOCK = blockedMap();
  // 被家具压住的小人挪到最近的空地
  for (const d of G.dolls) {
    if (d.state === 'away' || (d.state === 'act' && d.act.onFurn)) continue;
    if (BLOCK[d.tx] && BLOCK[d.tx][d.ty]) { const p = nearestFree(d.tx, d.ty); if (p) placeDollAt(d, p.x, p.y); }
    d.path = []; if (d.state === 'walk') d.state = 'idle';
  }
}
const free = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !BLOCK[x][y];

function nearestFree(x, y) {
  x = Math.max(0, Math.min(COLS - 1, x)); y = Math.max(WALL_ROWS, Math.min(ROWS - 1, y));
  const seen = new Set([x + ',' + y]), q = [[x, y]];
  while (q.length) {
    const [cx, cy] = q.shift();
    if (free(cx, cy)) return { x: cx, y: cy };
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy, k = nx + ',' + ny;
      if (nx < 0 || ny < WALL_ROWS || nx >= COLS || ny >= ROWS || seen.has(k)) continue;
      seen.add(k); q.push([nx, ny]);
    }
  }
  return null;
}

// BFS 寻路：从 (sx,sy) 走到 goals 里任意一个格子
function findPath(sx, sy, goals) {
  const goalSet = new Set(goals.filter(g => free(g.x, g.y)).map(g => g.x + ',' + g.y));
  if (!goalSet.size) return null;
  const prev = new Map([[sx + ',' + sy, null]]), q = [[sx, sy]];
  while (q.length) {
    const [cx, cy] = q.shift(), k = cx + ',' + cy;
    if (goalSet.has(k)) {
      const path = []; let cur = k;
      while (cur) { const [a, b] = cur.split(',').map(Number); path.unshift({ x: a, y: b }); cur = prev.get(cur); }
      path.shift(); return path;
    }
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]].sort(() => Math.random() - 0.5);
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy, nk = nx + ',' + ny;
      if (!free(nx, ny) || prev.has(nk) || wallBetween(cx, cy, nx, ny)) continue;
      prev.set(nk, k); q.push([nx, ny]);
    }
  }
  return null;
}

// 使用家具时站的位置：优先家具正下方，其次左右两侧
function approachTiles(f) {
  const d = FURNITURE[f.id], out = [];
  for (let i = 0; i < d.w; i++) out.push({ x: f.x + i, y: f.y + d.h });
  if (d.mode === 'on') for (let j = 0; j < d.h; j++) { out.push({ x: f.x - 1, y: f.y + j }); out.push({ x: f.x + d.w, y: f.y + j }); }
  return out;
}

/* ---------------- 小人 ---------------- */
function addDoll(src) {
  const d = {
    uid: G.uid++, pid: src.pid || Math.random().toString(36).slice(2, 10), name: src.name, persona: src.persona, look: { ...src.look },
    needs: src.needs ? { ...src.needs } : { energy: 60 + Math.random() * 40, hunger: 50 + Math.random() * 40, fun: 50 + Math.random() * 40, social: 50 + Math.random() * 40 },
    x: 0, y: 0, tx: 0, ty: 0, dir: 'down', frame: 0, ft: 0, state: 'idle', path: [], act: null,
    think: Math.random() * 2, bubble: null, blink: 0, blinkT: 2 + Math.random() * 3, hop: 0, happy: 0,
    gender: src.gender || (Math.random() < 0.5 ? 'f' : 'm'), heart: src.heart || 'normal',
    // 老存档没有星座/MBTI：开局的四位用设定好的，其他人随机
    zodiac: src.zodiac || (DEFAULT_SAVE.dolls.find(o => o.pid === src.pid) || {}).zodiac || randomZodiac(),
    mbti: src.mbti || (DEFAULT_SAVE.dolls.find(o => o.pid === src.pid) || {}).mbti || randomMbti(),
    job: src.job || 'none', money: src.money ?? Math.round((START_MONEY[src.job || 'none'] || 600) + Math.random() * 500), awayUntil: src.awayUntil || 0, lastWorkDay: src.lastWorkDay || 0, leaveJitter: src.leaveJitter || 0, overtime: !!src.overtime,
  };
  G.dolls.push(d);
  if (!BLOCK) BLOCK = blockedMap();
  const p = nearestFree(2 + ((Math.random() * (COLS - 4)) | 0), WALL_ROWS + 1 + ((Math.random() * (ROWS - WALL_ROWS - 2)) | 0));
  if (p) placeDollAt(d, p.x, p.y);
  if(Number.isInteger(src.tx)&&Number.isInteger(src.ty)&&free(src.tx,src.ty))placeDollAt(d,src.tx,src.ty);
  if(src.dir)d.dir=src.dir;
  if (src.away) d.state = 'away';
  return d;
}
function placeDollAt(d, x, y) { d.tx = x; d.ty = y; d.x = x * T + 8; d.y = y * T + 14; }

function say(d, text, dur = 2.6) { if (text) { d.bubble = { text, t: dur, id: Math.random() }; SFX.play('pop'); } }
const pick = a => a[(Math.random() * a.length) | 0];

function endAct(d) {
  const a = d.act;
  if (a && a.furn) {
    a.furn.users = a.furn.users.filter(u => u !== d);
    a.furn.active = a.furn.users.length > 0;
    if (a.onFurn) placeDollAt(d, a.back.x, a.back.y);
  }
  if (a && a.partner && a.partner.act && a.partner.act.partner === d) { a.partner.act = null; a.partner.state = 'idle'; a.partner.think = 1; }
  d.act = null; d.state = 'idle'; d.hop = 0; d.think = 1 + Math.random() * 2;
}

function decide(d) {
  const P = PERSONAS[d.persona], N = d.needs, opts = [];
  const want = (gain) => Object.entries(gain).reduce((s, [k, v]) => s + Math.max(0, v) * Math.pow(1 - N[k] / 100, 1.5) * 3, 0);
  for (const f of G.furniture) {
    const F = FURNITURE[f.id];
    if (!F.use) continue;
    const cap = F.cap ?? (f.id === 'sofa' || f.id === 'bigbed' ? 2 : 1);
    if (f.users.length >= cap) continue;
    if (PRICES[F.use] && !canAfford(d, PRICES[F.use])) continue;   // 买不起就不去了
    const lover = loverOf(d);
    // 双人床只和恋人一起睡
    if (f.id === 'bigbed' && f.users.length && !f.users.every(u => u === lover)) continue;
    let s = want(F.need) + (P.like[F.use] || 0) + traitBonus(d, F.use) + Math.random() * 25 * noiseMul(d);   // 性格 + 星座/MBTI + 随机
    if (F.use === 'sleep') s += G.night ? 70 : (N.energy > 45 ? -60 : 0);
    else if (G.night && N.energy < 60) s -= 20;
    if (f.id === 'bigbed' && lover) s += f.users.includes(lover) ? 60 : 20;
    if (F.use === 'paint' && d.job === 'artist') s += 40;          // 画家要画画才卖得出画
    if (F.use === 'study' && d.job === 'student') s += 15;
    if (F.use === 'exercise' && N.energy < 30) s -= 40;
    if (F.use === 'party') s += isHolidayParty() ? 50 : -10;           // 圣诞节大家围着圣诞树过节
    if(F.use==='meal'){
      const evening=G.time>=17*60&&G.time<21*60;
      s+=evening?18+f.users.length*12:0;
    }
    if(F.use==='groom'&&['romantic','social','genki'].includes(d.persona))s+=18;
    s -= (Math.abs(f.x - d.tx) + Math.abs(f.y - d.ty)) * 1.2;
    opts.push({ s, type: F.use, furn: f });
  }
  // 只有闲着、闲逛、或在做不重要的小事的人可以被拉去聊天；表演中的人只能被围观
  const others = G.dolls.filter(o => o !== d && (o.state === 'idle' || (o.state === 'walk' && o.act && o.act.type === 'wander') ||
    (o.state === 'act' && o.act && !o.act.onFurn && !JOIN[o.act.type] && o.act.type !== 'chat' && o.act.type !== 'join')));
  if (others.length) {
    const p = pickPartner(d, others), r = rel(d, p);
    opts.push({ s: want({ social: 30 }) + (P.like.chat || 0) + traitBonus(d, 'chat') + Math.random() * 25 * noiseMul(d) + Math.max(0, r.f) * 0.12 + r.l * 0.15 + (r.lovers ? 15 : 0) + (G.furniture.some(f=>f.id==='sofa'&&Math.hypot(f.x-d.tx,f.y-d.ty)<5)?12:0), type: 'chat', partner: p });
  }
  // 恋人在家就想黏在一起；花心的人会去找暧昧对象，对象不在家时更大胆
  const lover = loverOf(d), lvBusy = lover && (lover.state === 'away' || lying(lover));
  if (d.jealousOf && d.jealousOf.until > absNow() && others.includes(d.jealousOf.who)) opts.push({ s: 999, type: 'chat', partner: d.jealousOf.who, kind: 'argue', jealous: true });
  if (lover && others.includes(lover)) opts.push({ s: want({ social: 30 }) + 28 + rel(d, lover).l * 0.25 + Math.random() * 20, type: 'chat', partner: lover });
  if (d.heart === 'fickle') {
    const crush = others.filter(o => o !== lover && rel(d, o).l >= 15).sort((a, b) => rel(d, b).l - rel(d, a).l)[0];
    if (crush) opts.push({ s: 18 + rel(d, crush).l * 0.5 + (lvBusy ? 30 : lover ? 0 : 10) + Math.random() * 20, type: 'chat', partner: crush });
    if (crush && canTryst(d, crush)) opts.push({ s: 30 + rel(d, crush).l * 0.6 + (lvBusy ? 25 : 0) + Math.random() * 20, type: 'tryst', partner: crush });
  }
  for (const o of G.dolls) {
    if (o === d || !joinable(o) || !canSee(d,o)) continue;
    const J = JOIN[o.act.type], r = rel(d, o);
    opts.push({ s: want({ fun: 16, social: 12 }) + (P.like[J.like] || 0) * 0.7 + (P.like.chat || 0) * 0.4 + r.f * 0.25 + r.l * 0.2 + 8 + traitBonus(d, 'join') + Math.random() * 20 * noiseMul(d) - (G.night ? 15 : 0), type: 'join', target: o });
  }
  opts.push({ s: want({ fun: 10 }) + (P.like.dance || 0) + traitBonus(d, 'dance') + Math.random() * 15 * noiseMul(d) - (G.night ? 20 : 0), type: 'dance' });
  opts.push({ s: 12 + (P.like.wander || 0) + traitBonus(d, 'wander') + Math.random() * 20 * noiseMul(d), type: 'wander' });
  opts.sort((a, b) => b.s - a.s);
  for (const o of opts.slice(0, 4)) if (startAct(d, o)) return;
  d.think = 2;
}

// 让小人去做某件事；成功规划路线返回 true
function startAct(d, o) {
  if (o.type === 'dance') { d.state = 'act'; d.act = { type: 'dance', t: 9 + Math.random() * 4 }; nudgeAudience(d); say(d, pick(ACT_LINES.dance)); return true; }
  if (o.type === 'wander') {
    const goal = nearestFree((Math.random() * COLS) | 0, WALL_ROWS + ((Math.random() * (ROWS - WALL_ROWS)) | 0));
    const path = goal && findPath(d.tx, d.ty, [goal]);
    if (!path || !path.length) return false;
    d.path = path; d.state = 'walk'; d.act = { type: 'wander' };
    if (Math.random() < 0.25) say(d, pick(PERSONAS[d.persona].lines));
    return true;
  }
  if (o.type === 'join') return startJoin(d, o.target);
  if (o.type === 'tryst') return startTryst(d, o.partner);
  if (o.type === 'chat') {
    // 优先站到对方左右两边，这样两个人不会上下叠在一起
    const p = o.partner, side = [[1, 0], [-1, 0]].map(([a, b]) => ({ x: p.tx + a, y: p.ty + b }));
    const path = findPath(d.tx, d.ty, side) || findPath(d.tx, d.ty, [[0, 1], [0, -1]].map(([a, b]) => ({ x: p.tx + a, y: p.ty + b })));
    if (!path) return false;
    d.path = path; d.state = 'walk'; d.act = { type: 'chat', partner: p, pending: true, kind: o.kind, jealous: o.jealous };
    if (o.jealous) { d.jealousOf = null; say(d, `${p.name}，你过来一下！`); }
    if (p.state === 'idle' || (p.state === 'walk' && p.act && p.act.type === 'wander')) { p.path = []; p.act = null; p.state = 'wait'; p.waitT = 8; }
    return true;
  }
  const f = o.furn, F = FURNITURE[f.id];
  const capacity=F.cap ?? (f.id==='sofa'||f.id==='bigbed'?2:1);
  if(f.users.length>=capacity)return false;
  const tiles = approachTiles(f).filter(tile=>F.use!=='meal'||!f.users.some(user=>{
    const destination=user.path.at(-1)||user;
    return tile.x===(destination.tx??destination.x)&&tile.y===(destination.ty??destination.y);
  }));
  const here = tiles.find(t => t.x === d.tx && t.y === d.ty);
  const path = here ? [] : findPath(d.tx, d.ty, tiles);
  if (!path) return false;
  f.users.push(d);
  d.path = path; d.state = path.length ? 'walk' : 'arrive';
  d.act = { type: F.use, furn: f, gain: F.need, mode: F.mode };
  return true;
}

function arrive(d) {
  const a = d.act;
  if (a && a.type === 'join') { arriveJoin(d); return; }
  if (a && a.type === 'leave') { exitHome(d); return; }
  if (a && a.type === 'tryst') { arriveTryst(d); return; }
  if (!a || a.type === 'wander') { d.act = null; d.state = 'idle'; d.think = 0.5 + Math.random() * 2; return; }
  if (a.type === 'chat') {
    const p = a.partner;
    if (!G.dolls.includes(p) || p.state === 'lift' || (p.act && p.act.onFurn)) { endAct(d); return; }
    if (p.act && p.act.type === 'chat' && p.act.partner !== d) { say(d, '在忙呢，下次吧'); endAct(d); return; }
    if (p.act && (p.act.furn || p.act.type === 'join')) endAct(p);
    startSocial(d, p);
    return;
  }
  const f = a.furn, F = FURNITURE[f.id];
  if (!G.furniture.includes(f)) { endAct(d); return; }
  if (PRICES[a.type] && !pay(d, PRICES[a.type], PRICE_NAME[a.type])) { say(d, '钱不够了……'); endAct(d); d.think = 4; return; }
  d.state = 'act';
  a.t = a.type === 'sleep' ? 28 + Math.random() * 10 : 7 + Math.random() * 5;
  if (JOIN[a.type] && a.type !== 'read') { a.t = 16 + Math.random() * 8; nudgeAudience(d); }
  const PDur = PERSONAS[d.persona].dur; if (PDur && PDur[a.type]) a.t *= PDur[a.type];
  a.t *= durMul(d);   // J 型更专注，P 型更容易换下一件事
  a.back = { x: d.tx, y: d.ty };
  f.active = true;
  if (F.mode === 'on') {
    a.onFurn = true;
    if (f.id === 'sofa' || f.id === 'bigbed') {
      const left = !f.users.some(u => u !== d && u.act && u.act.seat === 0); a.seat = left ? 0 : 1;
      if (f.id === 'sofa') { d.x = f.x * T + 8 + a.seat * 16; d.y = f.y * T + 13; }
    }
    else if (f.id === 'chair' || f.id === 'beanbag') { d.x = f.x * T + 8; d.y = f.y * T + (f.id === 'chair' ? 10 : 12); }
    d.dir = 'down';
    if (f.id === 'treadmill') { d.x = f.x * T + 18; d.y = f.y * T + 11; d.dir = 'left'; }
  } else {
    // 站在家具前：朝家具的方向
    const cx = (f.x + F.w / 2) * T, cy = (f.y + F.h / 2) * T;
    face(d, cx, cy);
  }
  countHouseDay(a.type,d.name);
  if(a.type==='meal'&&f.users.some(o=>o!==d&&o.state==='act'))addLog(`🍲 ${d.name} 和室友一起用餐`);
  const mate = f.id === 'bigbed' && f.users.find(u => u !== d && lying(u));
  say(d, mate ? pick(['晚安～💕', '往里挪一点嘛', '抱着睡～']) : pick(ACT_LINES[a.type] || ['…']));
  if (f.id === 'bigbed' && !mate) inviteLover(d, f);
  if (mate && !(f.coupleLogAt > absNow() - 600)) { f.coupleLogAt = absNow(); addLog(`🛏 ${mate.name} 和 ${d.name} 一起睡了`); }   // 一晚只记一次
  const snd = { snack: 'eat', cook: 'cook', piano: 'piano', game: 'game', bath: 'splash', cat: 'meow', water: 'splash' }[a.type];
  if (snd) SFX.play(snd);
}

function face(d, x, y) {
  const dx = x - d.x, dy = y - d.y;
  d.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

/* ---------------- 每帧更新 ---------------- */
function updateDoll(d, dt) {
  const P = PERSONAS[d.persona], N = d.needs;
  for (const k in N) N[k] = Math.max(0, N[k] - P.decay[k] * decayMul(d, k) * MIN_PER_SEC / 60 * dt);
  d.blinkT -= dt; if (d.blinkT < 0) { d.blink = 0.15; d.blinkT = 2 + Math.random() * 4; }
  if (d.blink > 0) d.blink -= dt;
  if (d.happy > 0) d.happy -= dt;
  if (d.bubble) { d.bubble.t -= dt; if (d.bubble.t <= 0) d.bubble = null; }
  if (d.state === 'lift') { d.ft += dt; if (d.ft > 0.2) { d.ft = 0; d.frame = (d.frame + 1) % 2; } return; }
  if (workTick(d, dt)) return;

  if (d.state === 'wait') { d.waitT -= dt; if (d.waitT <= 0) d.state = 'idle'; return; }
  if (d.state === 'arrive') { arrive(d); return; }

  if (d.state === 'walk') {
    const n = d.path[0];
    if (!n) { arrive(d); return; }
    if (!free(n.x, n.y)) { d.path = []; if (d.act && d.act.furn) endAct(d); else { d.state = 'idle'; d.act = null; } return; }
    const gx = n.x * T + 8, gy = n.y * T + 14, dx = gx - d.x, dy = gy - d.y, dist = Math.hypot(dx, dy);
    const sp = P.speed * T * dt * (N.energy < 20 ? 0.6 : 1);
    if (dist > 0.01) face(d, gx, gy);
    if (dist <= sp) { d.x = gx; d.y = gy; d.tx = n.x; d.ty = n.y; d.path.shift(); if (!d.path.length) arrive(d); }
    else { d.x += dx / dist * sp; d.y += dy / dist * sp; }
    d.ft += dt; if (d.ft > 0.13) { d.ft = 0; d.frame = (d.frame + 1) % 4; }
    return;
  }
  d.frame = 0;

  if (d.state === 'act') {
    const a = d.act;
    if (a.gain) for (const k in a.gain) N[k] = Math.max(0, Math.min(100, N[k] + a.gain[k] / (a.type === 'sleep' ? 10 : 8) * dt));
    if (a.type === 'sleep') N.energy = Math.min(100, N.energy + 2.2 * dt);
    if (a.type === 'dance') { d.ft += dt; if (d.ft > 0.25) { d.ft = 0; d.frame = (d.frame + 1) % 4; d.dir = ['down', 'right', 'up', 'left'][d.frame]; } d.hop = d.frame % 2 ? 2 : 0; N.fun = Math.min(100, N.fun + 2 * dt); }
    if (a.type === 'chat') tickSocial(d, dt);
    if (a.type === 'join') { tickJoin(d, dt); if (!d.act) return; }
    if (a.type !== 'chat' && a.type !== 'join' && a.type !== 'sleep' && Math.random() < dt * 0.12) say(d, pick(ACT_LINES[a.type] || ['♪']));
    if (a.type === 'sleep' && Math.random() < dt * 0.15) { d.bubble = { text: 'Zzz…', t: 2, id: Math.random() }; SFX.play('snore'); }
    if (a.type === 'sleep' && a.furn.id === 'bigbed') {
      const mate = a.furn.users.find(u => u !== d && lying(u));
      if (mate && rel(d, mate).lovers) { const r = rel(d, mate); r.l = Math.min(100, r.l + 0.3 * dt); if (Math.random() < dt * 0.08) spawnHeart(d, '💕'); }
    }
    if (a.type === 'piano' && Math.random() < dt * 3) SFX.play('piano');
    if (a.type === 'exercise') { d.ft += dt; if (d.ft > 0.09) { d.ft = 0; d.frame = (d.frame + 1) % 4; } }
    if (a.type === 'paint' && d.job === 'artist') d.paintedDay = G.day;
    if (a.type === 'music' && Math.random() < dt * 2) SFX.play('game');
    if (a.type === 'game' && Math.random() < dt * 2) SFX.play('game');
    a.t -= dt;
    const wake = a.type === 'sleep' && !G.night && N.energy > 92;
    if (a.t <= 0 || wake) endAct(d);
    return;
  }

  // 发呆中：偶尔自言自语，到时间就决定下一件事
  d.think -= dt;
  // 懒懒会站着打盹
  if (d.persona === 'lazy' && Math.random() < dt * 0.04) { d.blink = 3; d.think += 3; say(d, pick(['💤 呼……', '（站着睡着了）', 'zzz'])); }
  if (Math.random() < dt * 0.04) {

    say(d, low[1] < 25 ? sad[low[0]] : (Math.random() < 0.3 && wishLine(d)) || pick(P.lines));
  }
  if (d.think <= 0) decide(d);
}

const hearts = [];
function spawnHeart(d, txt = '❤') {
  const p = lying(d) ? { x: headPos(d).x, y: headPos(d).y + 14 } : d;
  hearts.push({ x: p.x + (Math.random() * 8 - 4), y: p.y - 24, t: 1, txt, id: Math.random() });
}

function petDoll(d) {
  if (d.state === 'lift' || d.state === 'away') return;
  if (d.act && d.act.type === 'sleep') { say(d, '唔……别吵'); return; }
  d.needs.fun = Math.min(100, d.needs.fun + 12); d.needs.social = Math.min(100, d.needs.social + 15);
  d.happy = 2; say(d, pick(ACT_LINES.pet)); spawnHeart(d); spawnHeart(d); SFX.play('love');

}

// 选中的小人被点到的家具上去
function orderUse(d, f) {
  const F = FURNITURE[f.id];
  if (!F.use) { say(d, '这个不能用哦'); return false; }
  if (d.state === 'lift') return false;
  if (d.act) endAct(d);

  say(d, '好的～', 1.2);

}

/* ---------------- 时间与天色 ---------------- */
const SKY = [[0, '#1d2348'], [5, '#2b3366'], [6.2, '#f6b38a'], [8, '#9fd3f0'], [17, '#9fd3f0'], [18.6, '#f59a7a'], [20, '#3a3a78'], [24, '#1d2348']];
const DARK = [[0, .55], [5, .5], [7, 0], [17, 0], [19, .25], [21, .5], [24, .55]];
function lerpKeys(keys, h, mix) {
  for (let i = 0; i < keys.length - 1; i++) {
    const [h0, v0] = keys[i], [h1, v1] = keys[i + 1];
    if (h >= h0 && h <= h1) return mix(v0, v1, (h - h0) / (h1 - h0));
  }
  return keys[0][1];
}
const mixNum = (a, b, t) => a + (b - a) * t;
const mixHex = (a, b, t) => {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) + (((pb >> s) & 255) - ((pa >> s) & 255)) * t);
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
};

let saveT = 0;
function update(realDt) {
  const dt = realDt * G.speed;
  G.t += realDt;
  if (dt > 0 && !document.getElementById('paperDialog')?.open) {
    G.time += dt * MIN_PER_SEC;
    if (G.time >= 1440) { finishHouseDay(); G.time -= 1440; G.day++; HOOK.toast(`☀️ 第 ${G.day} 天开始啦`); nightlyBills(); seasonNewDay(); SFX.play('newday'); }
    const h = G.time / 60;
    G.sky = lerpKeys(SKY, h, mixHex); G.dark = lerpKeys(DARK, h, mixNum);
    G.night = h >= 21 || h < 6;
    seasonTick();
    for (const d of G.dolls) updateDoll(d, dt);
  }
  updateDoors(realDt);
  if (dt > 0 && !document.getElementById('paperDialog')?.open) { socialTick(dt); trystTick(); }
  for (let i = hearts.length - 1; i >= 0; i--) { hearts[i].t -= realDt; if (hearts[i].t <= 0) hearts.splice(i, 1); }
  saveT += realDt; if (saveT > 5) { saveT = 0; save(); }
}

<script>
// 人际关系与多人互动：友好度 / 恋爱度、聊天打闹拥抱表白吵架、围观别人弹琴打游戏

const LOVE_LEVELS = [[75, '喜欢'], [45, '心动'], [20, '有好感'], [-100, '']];

// 别人正在做这些事时，可以凑过去一起
const JOIN = {
  piano: { verb: '听{n}弹琴', like: 'piano', dance: 0.5, lines: ['好好听～', '🎵 ♪', '再来一首！', '是新曲子吗？'], back: ['谢谢捧场！', '为你弹的～'] },
  dance: { verb: '和{n}一起跳舞', like: 'dance', dance: 1, lines: ['一起跳！', '💃 转圈圈', '跟上节奏！'], back: ['跳得不错嘛！', '耶～'] },

};

// 两人面对面的互动种类
const SOCIAL = {
  chat:  { verb: '和{n}聊天', a: ['你好呀！', '聊点什么呢', '今天天气真好', '真的吗？！'], b: ['嗯嗯！', '哈哈哈', '我也觉得！', '然后呢？'] },

  hug:   { verb: '和{n}抱抱', a: ['抱一个！', '🤗'], b: ['嘿嘿～', '❤'] },

  kiss:  { verb: '和{n}亲亲', a: ['💋', '最喜欢你了'], b: ['❤ ❤', '我也是～'] },
  argue: { verb: '和{n}吵架', a: ['💢 哼！', '都怪你！', '你才是！'], b: ['💢 不理你了', '明明是你！', '哼！'] },

function relKey(a, b) { return a.pid < b.pid ? a.pid + '|' + b.pid : b.pid + '|' + a.pid; }
function rel(a, b) {
  const k = relKey(a, b);
  if (!G.rel[k]) G.rel[k] = { f: 10 + Math.round(Math.random() * 15), l: 0, chem: +(0.6 + Math.random() * 0.9).toFixed(2), lovers: false };

}
const levelOf = (v, table) => table.find(([min]) => v >= min)[1];
function relLabel(r) {
  if (r.lovers) return '💕 恋人';

}
function loverOf(d) { return G.dolls.find(o => o !== d && rel(d, o).lovers) || null; }

// 改变关系值，跨过关键门槛时弹提示

function clearRomance(d) {

  if (after === '不和' && before !== '不和') HOOK.toast(`💢 ${a.name} 和 ${b.name} 闹翻了……`);
  if (r.lovers && r.l < 30) { r.lovers = false; HOOK.toast(`💔 ${a.name} 和 ${b.name} 分手了……`); }

function weighted(list) {
  const total = list.reduce((s, [, w]) => s + Math.max(0, w), 0);
  let x = Math.random() * total;
  for (const [v, w] of list) { x -= Math.max(0, w); if (x <= 0) return v; }
  return list[0][0];
}

// 挑一个想去找的人：越熟、越喜欢越容易被挑中
function pickPartner(d, others) {
  const lv = loverOf(d), lvAway = lv && (lv.state === 'away' || lying(lv));
  return weighted(others.map(o => {
    const r = rel(d, o);
    let w = 12 + Math.max(0, r.f) * 0.6 + r.l * 0.6 + (r.lovers ? 40 : 0);
    if (d.heart === 'fickle' && lv && o !== lv) w += r.l * (lvAway ? 1.6 : 0.5);   // 花心的人趁对象不在去找暧昧对象
    return [o, Math.max(1, w + 5 * NPCMemory.influence(G, d.pid, o.pid)) * compat(d, o)];

}

function chooseKind(d, p) {
  const r = rel(d, p), cranky = d.needs.fun < 25 || p.needs.fun < 25 || d.needs.hunger < 15;

  const ld = loverOf(d), lp = loverOf(p);
  const free_ = (x, l, other) => !l || l === other || x.heart === 'fickle';

}

  const jealousTalk = !!(d.act && d.act.jealous);   // 吃醋后来“算账”的那次吵架
  let kind = (d.act && d.act.kind) || chooseKind(d, p);

      if (ld && ld !== p || lp && lp !== d) {
        // 背着对象暧昧：变成“地下情”，玩家能看到，但当事人的恋人不知道……除非被撞见
        if (!r.secret) HOOK.toast(`🤫 ${d.name} 和 ${p.name} 背着别人偷偷暧昧……`);

  if (jealousTalk) say(d, pick(['刚才那是怎么回事？', '😤 你给我解释清楚', '你是不是喜欢上别人了？']));

  const routine = r.lovers && (kind === 'hug' || kind === 'kiss') && r.logAt > absNow() - 240;

  if(kind==='chat'&&Math.random()<.32)shareHouseNews(d,p);

    ];
    if (kind === 'argue' || kind === 'joke' || kind === 'kiss') {

  if (kind === 'flirt') addLog(`💌 ${d.name} 向 ${p.name} 表白${flirtOk ? '，对方答应了' : '，被拒绝了'}`);

}

// 有人背着恋人和别人亲密时，看看恋人在不在附近——在的话就被撞见了

}

  L.needs.fun = Math.max(0, L.needs.fun - (isF(L) ? 20 : 12) * (zodiacOf(L).el === 'water' ? 1.3 : 1));   // F 型、水象更受伤
  face(L, cheater.x, cheater.y);
  say(L, pick(['😤 哼！抱那么久干嘛', '……我吃醋了', `你和${third.name}关系很好嘛？`]), 3);
  spawnHeart(L, '😤');
  // 记下来：等这次互动结束，就去找恋人算账
  L.jealousOf = { who: cheater, until: absNow() + 240 };
  if (L.state === 'idle' || (L.act && !L.act.onFurn && L.act.type !== 'chat')) { if (L.act) endAct(L); L.state = 'idle'; L.think = 0.5; }
  HOOK.toast(`😤 ${L.name} 看到 ${cheater.name} 和 ${third.name} 很亲密，吃醋了`);
}

function caught(L, cheater, third) {
  const r = rel(L, cheater), r3 = rel(cheater, third);
  r.f = Math.max(-100, r.f - 35); r.l = Math.max(0, r.l - 45);
  const t3 = rel(L, third); t3.f = Math.max(-100, t3.f - 40); t3.l = 0;
  r3.secret = false;
  L.needs.fun = Math.max(0, L.needs.fun - 40);
  face(L, cheater.x, cheater.y);
  say(L, pick(['💢 你们在干什么！', `${cheater.name}！你太过分了！`, '我都看见了！']), 3);
  spawnHeart(L, '💔'); spawnHeart(L, '💢');
  setTimeout(() => say(cheater, pick(['我、我可以解释！', '不是你想的那样……', '……'])), 1200);
  setTimeout(() => say(third, pick(['……', '对不起……', '我先走了'])), 2200);
  SFX.play('deny');
  if (r.l < 30 && r.lovers) {
    r.lovers = false;
    HOOK.toast(`💔 ${L.name} 撞见 ${cheater.name} 和 ${third.name}，两人分手了！`);
  } else HOOK.toast(`💢 ${L.name} 撞见 ${cheater.name} 和 ${third.name} 在一起！`);
  NPCMemory.record(G, {
    type: 'caught-affair', time: absNow(), location: { x: L.x, y: L.y },
    participants: [L.pid, cheater.pid, third.pid], outcome: r.lovers ? 'confronted' : 'separated'
  }, [
    { person: L.pid, subject: cheater.pid, channel: 'witness',
      interpretation: `我撞见${cheater.name}和${third.name}亲密`, emotion: -1, impact: 100 },
    { person: cheater.pid, subject: L.pid,
      interpretation: `${L.name}撞见了我和${third.name}`, emotion: -.9, impact: 90 },
    { person: third.pid, subject: L.pid,
      interpretation: `${L.name}撞见了我和${cheater.name}`, emotion: -.7, impact: 80 }
  ]);
}

// 能被打断去做别的事（不在睡觉、不在聊天、不在出门路上）
const interruptible = x => x.state === 'idle' || (x.state === 'walk' && x.act && x.act.type === 'wander') ||
  (x.state === 'act' && x.act && !x.act.onFurn && x.act.type !== 'chat' && x.act.type !== 'leave');

// 每帧：花心的人对恋人的感情会慢慢变淡；专一的人反而越来越深
function socialTick(dt) {
  // 保险：学生和任何人之间都不留恋爱关系
  for (const d of G.dolls) if (isStudent(d)) for (const o of G.dolls) if (o !== d) {
    const r = rel(d, o); if (r.l || r.lovers || r.secret) { r.l = 0; r.lovers = false; r.secret = false; }
  }
  // 吃醋的人：等双方都有空，就立刻去找恋人算账
  for (const d of G.dolls) {
    const j = d.jealousOf;
    if (!j) continue;
    if (j.until < absNow() || !G.dolls.includes(j.who)) { d.jealousOf = null; continue; }
    if (!interruptible(d) || !interruptible(j.who)) continue;
    if (d.act) endAct(d);
    d.state = 'idle'; d.path = [];
    startAct(d, { type: 'chat', partner: j.who, kind: 'argue', jealous: true });
  }
  for (const k in G.rel) {
    const r = G.rel[k];
    if (!r.lovers && !r.secret) continue;
    const [pa, pb] = k.split('|');
    const a = G.dolls.find(d => d.pid === pa), b = G.dolls.find(d => d.pid === pb);
    if (!a || !b) continue;
    const fickle = (a.heart === 'fickle') + (b.heart === 'fickle');
    if (r.lovers && fickle) r.l = Math.max(0, r.l - 0.05 * fickle * dt);
    if (r.lovers && !fickle && a.heart === 'loyal' && b.heart === 'loyal') r.l = Math.min(100, r.l + 0.02 * dt);
    if (r.lovers && r.l < 30) { r.lovers = false; HOOK.toast(`💔 ${a.name} 和 ${b.name} 感情淡了，分手了`); }
  }
}

// 互动进行中：偶尔再说一句、冒爱心
function tickSocial(d, dt) {
  const a = d.act, S = SOCIAL[a.kind] || SOCIAL.chat;
  if (a.passive || Math.random() > dt * 0.45) return;
  const who = Math.random() < 0.5 ? d : a.partner;
  const lines = who === d ? S.a : (S.b.length ? S.b : S.a);
  say(who, pick(lines), 1.8);
  if (a.kind === 'argue') spawnHeart(who, '💢');
  else if (a.kind !== 'chat' || rel(d, a.partner).l > 40) spawnHeart(who, rel(d, a.partner).lovers ? '💕' : '❤');
}

// 先躺上双人床的人会叫恋人一起来睡
function inviteLover(d, f) {
  const lv = loverOf(d);
  if (!lv || f.users.length >= 2 || lv.state === 'lift' || lying(lv)) return;
  if (!G.night && lv.needs.energy > 70) return;
  if (lv.act && (lv.act.type === 'chat' || lv.act.onFurn)) return;
  if (lv.act) endAct(lv);
  lv.path = []; lv.state = 'idle';
  if (startAct(lv, { type: 'sleep', furn: f })) {
    setTimeout(() => say(d, `${lv.name}，一起睡吧～`), 900);
    setTimeout(() => lv.act && say(lv, pick(['来啦 💕', '马上就来～', '好～'])), 2000);
  }
}

/* ---------- 围观 / 一起玩 ---------- */
function joinable(o) { return o.state === 'act' && o.act && JOIN[o.act.type] && o.act.t > 3; }

function startJoin(d, o) {
  const goals = [];
  for (let dx = -2; dx <= 2; dx++) for (let dy = -1; dy <= 2; dy++) {
    if (!dx && !dy) continue;
    goals.push({ x: o.tx + dx, y: o.ty + dy });
  }
  goals.sort((a, b) => Math.hypot(a.x - o.tx, a.y - o.ty) - Math.hypot(b.x - o.tx, b.y - o.ty));
  const taken = new Set(G.dolls.filter(x => x !== d).map(x => x.tx + ',' + x.ty));
  const path = findPath(d.tx, d.ty, goals.filter(g => !taken.has(g.x + ',' + g.y)));
  if (!path) return false;
  d.path = path; d.state = path.length ? 'walk' : 'arrive';
  d.act = { type: 'join', target: o, what: o.act.type };
  return true;
}

// 有人开始表演时，闲着的人会更快拿主意（更可能过来凑热闹）
function nudgeAudience(performer) {
  for (const o of G.dolls) if (o !== performer && canSee(o,performer) && (o.state === 'idle' || (o.state === 'walk' && o.act && o.act.type === 'wander'))) {
    if (o.state === 'walk') { o.path = []; o.state = 'idle'; o.act = null; }
    o.think = Math.min(o.think, 0.3 + Math.random() * 1.2);
  }
}

function arriveJoin(d) {
  const a = d.act, o = a.target;
  if (!G.dolls.includes(o) || !o.act || o.act.type !== a.what || o.state !== 'act') { say(d, '诶，结束了？'); endAct(d); return; }
  // 位置被别人占了就换个空位（只换一次）
  if (!a.moved && G.dolls.some(x => x !== d && x.tx === d.tx && x.ty === d.ty && x.state !== 'lift')) {
    a.moved = true;
    if (startJoin(d, o)) { d.act.moved = true; return; }
  }
  const J = JOIN[a.what];
  d.state = 'act'; a.t = Math.min(o.act.t + 1, 6 + Math.random() * 4);
  a.dance = Math.random() < J.dance + (d.persona === 'genki' ? 0.3 : 0);
  a.gain = { fun: 16, social: 10 };
  face(d, o.x, o.y);
  say(d, pick(J.lines));
  bump(d, o, 3, rel(d, o).f >= 45 ? 1.5 : 0);
  o.needs.social = Math.min(100, o.needs.social + 6);
  if (Math.random() < 0.6) setTimeout(() => o.act && say(o, pick(J.back)), 1400);
  if(a.what==='game'||a.what==='piano'){
    countHouseDay(a.what==='piano'?'audience':'partners',o.name);
    NPCMemory.record(G,{type:'company',time:absNow(),participants:[o.pid,d.pid],outcome:a.what},[
      {person:o.pid,subject:d.pid,emotion:.55,impact:55,interpretation:`${d.name}来陪我${a.what==='game'?'玩游戏':'弹琴'}`},
      {person:d.pid,subject:o.pid,emotion:.55,impact:55,interpretation:`我和${o.name}一起${a.what==='game'?'玩游戏':'听钢琴'}`}
    ]);
  }
  if (a.what === 'piano' && !o.act.logged) { o.act.logged = true; addLog(`🎵 ${o.name} 弹起了钢琴，${d.name} 过来听`); }
}

function tickJoin(d, dt) {
  const a = d.act, o = a.target;
  if (!o.act || o.act.type !== a.what) { endAct(d); return; }
  if (a.dance) {
    d.ft += dt;
    if (d.ft > 0.25) { d.ft = 0; d.frame = (d.frame + 1) % 4; d.dir = ['down', 'right', 'up', 'left'][d.frame]; }
    d.hop = d.frame % 2 ? 2 : 0;
  } else face(d, o.x, o.y);
  if (Math.random() < dt * 0.3) { say(d, pick(JOIN[a.what].lines), 2); if (rel(d, o).l > 50) spawnHeart(d); }
}

// 状态卡上显示“正在做什么”
function socialDoing(d) {
  const a = d.act;
  if (a.type === 'join') return JOIN[a.what].verb.replace('{n}', a.target.name);
  if (a.type === 'chat' && a.partner) {
    if (a.kind === 'flirt' && a.passive) return `被${a.partner.name}表白`;
    return (SOCIAL[a.kind] || SOCIAL.chat).verb.replace('{n}', a.partner.name);
  }
  return null;
}
</script>
<script>
// 职业与作息：到点从大门出门，在外面待一段时间，每天回家的时间都不太一样
// 时间用“绝对分钟” abs = (第几天-1)*1440 + 当天分钟，这样夜班跨过午夜也好算

const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const weekday = day => (day - 1) % 7;               // 第 1 天是周一
const absNow = () => (G.day - 1) * 1440 + G.time;
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

// start/end 是当天分钟；end < start 表示下班在第二天（夜班）；off 是休息的星期几
const JOBS = {
  student: { name: '学生', icon: '🎒', start: 480, end: 960, off: [5, 6], verb: '上学', wage: 40, wageName: '拿到零花钱',
    go: ['去上学啦！', '书包带了吗……带了！', '要迟到啦！'], back: ['放学啦～', '今天学了好多', '作业好多……'], tired: '今天考试……' },
  office: { name: '上班族', icon: '💼', start: 540, end: 1080, off: [5, 6], verb: '上班', wage: 320,
    go: ['上班去了……', '又是元气满满的一天（假的）', '挤地铁去咯'], back: ['终于下班了！', '我回来啦', '今天开了好多会'], tired: '加班好累……' },
  baker: { name: '面包师', icon: '🥐', start: 330, end: 780, off: [0], verb: '烤面包', wage: 240,
    go: ['去烤面包！', '面团在等我', '早起的面包师有面包吃'], back: ['带了面包回来～', '香喷喷地回来啦', '今天的可颂很成功'], tired: '今天订单好多' },
  barista: { name: '咖啡师', icon: '☕', start: 600, end: 1140, off: [2], verb: '做咖啡', wage: 210,
    go: ['去咖啡店啦', '今天也要好好拉花', '出门咯～'], back: ['今天拉花很成功！', '一身咖啡香地回来了', '我回来啦～'], tired: '客人好多……' },
  night: { name: '夜班店员', icon: '🌙', start: 1320, end: 360, off: [6], verb: '值夜班', wage: 280,
    go: ['值夜班去了', '晚上见……不对，早上见', '出门啦'], back: ['困死了……', '天亮了，我回来了', '要去补觉了'], tired: '今晚好多客人' },
  artist: { name: '自由画家', icon: '🎨', start: null, verb: '在家画画' },
  none: { name: '宅在家', icon: '🏠', start: null, verb: '宅家' },
};

const isWorkday = (job, day) => job.start != null && !job.off.includes(weekday(day));
const doorOf = () => G.furniture.find(f => f.id === 'door');
function doorTile() {
  const d = doorOf();
  return d ? { x: d.x, y: WALL_ROWS } : { x: Math.floor(COLS / 2), y: WALL_ROWS };
}

// 老存档没有门：找一块墙边空位装上
function ensureDoor() {
  if (doorOf()) return;
  const b = blockedMap();
  for (const x of [6, 3, 7, 11, 12, 10, 1, 14, 0, 15, 2, 4, 5, 8, 9, 13])
    if (canPlace('door', x, 1, null) && !b[x][WALL_ROWS]) { addFurniture('door', x, 1); return; }
  for (let x = 0; x < COLS; x++) if (canPlace('door', x, 1, null)) { addFurniture('door', x, 1); return; }
}

// 今天应该出门的时间（绝对分钟），不用上班返回 null
function leaveAbs(d) {
  const J = JOBS[d.job] || JOBS.none;
  if (!isWorkday(J, G.day) || d.lastWorkDay === G.day) return null;
  return (G.day - 1) * 1440 + J.start - 30 + (d.leaveJitter || 0);
}

function startLeave(d) {
  const J = JOBS[d.job];
  if (d.act) endAct(d);
  d.path = [];
  const t = doorTile();
  const goals = [t, { x: t.x - 1, y: t.y }, { x: t.x + 1, y: t.y }, { x: t.x, y: t.y + 1 }];
  const path = (d.tx === t.x && d.ty === t.y) ? [] : findPath(d.tx, d.ty, goals);
  if (!path) { d.state = 'idle'; d.think = 3; return; }
  d.path = path; d.state = path.length ? 'walk' : 'arrive';
  d.act = { type: 'leave' };
  say(d, G.weather === 'rain' ? pick(['下雨了，带上伞！', '雨好大……']) : G.weather === 'snow' ? pick(['外面好冷……', '围巾戴好！']) : pick(J.go));
}

function exitHome(d) {
  const J = JOBS[d.job], door = doorOf();
  d.act = null; d.path = []; d.bubble = null;
  d.state = 'away'; d.lastWorkDay = G.day;
  if (door) door.openT = 0.8;
  // 回家时间：正常下班后 0~80 分钟到家，偶尔早退，15% 概率加班
  const startAbs = (G.day - 1) * 1440 + J.start;
  let len = (J.end - J.start + 1440) % 1440;
  let back = startAbs + len + 15 + Math.random() * 65;
  d.overtime = Math.random() < 0.15;
  if (d.overtime) back += 120 + Math.random() * 60;
  else if (Math.random() < 0.15) back -= 60 + Math.random() * 40;
  d.awayUntil = Math.round(back);
  d.leaveJitter = leaveJitterFor(d);  // 明天出门时间也稍微变一变：J 型准时，P 型常常踩点
  SFX.play('open');
  HOOK.toast(`${J.icon} ${d.name} ${J.verb}去了，大约 ${hhmm(d.awayUntil)} 回家`);
  if (G.sel === d.uid) HOOK.select();
}

function comeHome(d) {
  const J = JOBS[d.job], door = doorOf(), t = doorTile();
  const p = free(t.x, t.y) ? t : nearestFree(t.x, t.y);
  if (p) placeDollAt(d, p.x, p.y);
  d.state = 'idle'; d.dir = 'down'; d.think = 2 + Math.random() * 2; d.away = false;
  if (door) door.openT = 0.8;
  say(d, d.overtime ? J.tired : pick(J.back));
  if (G.weather === 'rain' && Math.random() < 0.4) { d.needs.fun = Math.max(0, d.needs.fun - 8); setTimeout(() => say(d, '淋湿了……阿嚏！'), 1600); }
  payday(d);
  SFX.play('newday');
  HOOK.toast(`🏠 ${d.name} 回家了`);
  // 在家的人打招呼；恋人会过来抱抱
  const lover = loverOf(d);
  for (const o of G.dolls) {
    if (o === d || o.state === 'away' || lying(o) || o.state === 'lift') continue;
    if (o === lover && (o.state === 'idle' || (o.act && !o.act.onFurn && o.act.type !== 'chat'))) {
      if (o.act) endAct(o);
      o.state = 'idle';
      if (startAct(o, { type: 'chat', partner: d })) { o.act.kind = 'hug'; say(o, '欢迎回家 💕'); d.path = []; d.state = 'wait'; d.waitT = 8; }
    } else if (rel(d, o).f >= 40 && Math.random() < 0.6) {
      setTimeout(() => o.state !== 'away' && say(o, pick(['欢迎回来～', '回来啦！', `${d.name}辛苦啦`])), 600 + Math.random() * 900);
    }
  }
  if (G.sel === d.uid) HOOK.select();
}

// 每帧在 updateDoll 里调用；返回 true 表示这帧不用再做别的
function workTick(d, dt) {
  const N = d.needs;
  if (d.state === 'away') {
    // 在外面：会累、会饿，但和同事也算有社交
    N.energy = Math.max(0, N.energy - 3 * MIN_PER_SEC / 60 * dt);
    N.hunger = Math.max(0, N.hunger - 1.5 * MIN_PER_SEC / 60 * dt);
    N.social = Math.min(100, N.social + 6 * MIN_PER_SEC / 60 * dt);
    if (absNow() >= d.awayUntil) comeHome(d);
    return true;
  }
  if (d.state === 'lift' || (d.act && d.act.type === 'leave')) return false;
  const la = leaveAbs(d), now = absNow();
  if (la != null && now >= la && now < la + 180) {
    if (lying(d)) say(d, '要迟到啦！');
    startLeave(d);
    return true;
  }
  return false;
}

function updateDoors(dt) { for (const f of G.furniture) if (f.openT > 0) f.openT -= dt; }

// 状态卡里的作息说明
function jobLine(d) {
  const J = JOBS[d.job] || JOBS.none;
  if (J.start == null) return `${J.icon} ${J.name}`;
  const off = J.off.map(i => WEEKDAYS[i]).join('、');
  return `${J.icon} ${J.name} · ${hhmm(J.start)}–${hhmm(J.end)} · ${off}休息 · ${J.wageName ? '零花钱' : '日薪'} ${yuan(J.wage)}`;
}
function awayText(d) {
  const J = JOBS[d.job] || JOBS.none;
  return `${J.verb}中，约 ${hhmm(d.awayUntil)} 回家`;
}

/* ---------------- 收入与储蓄 ----------------
   上班的人每天下班领日薪（加班多拿 50%），学生有零花钱，自由画家偶尔卖画；
   吃零食、买菜要花钱，每晚 0 点每人交房租水电。钱不够时，恋人或好朋友会帮忙付。 */
const PRICES = { snack: 12, cook: 25 };
const PRICE_NAME = { snack: '零食钱', cook: '买菜钱' };
const RENT = 50;
const START_MONEY = { office: 4000, baker: 2500, barista: 2000, night: 2500, student: 300, artist: 1500, none: 600 };
const yuan = n => (n < 0 ? '-¥' : '¥') + Math.abs(Math.round(n)).toLocaleString('en-US');

function helperFor(d, amount) {
  return G.dolls
    .filter(o => o !== d && o.state !== 'away' && o.money >= amount && (rel(d, o).lovers || rel(d, o).f >= 50))
    .sort((a, b) => (rel(d, b).lovers - rel(d, a).lovers) || (rel(d, b).f - rel(d, a).f))[0];
}
const canAfford = (d, amount) => d.money >= amount || !!helperFor(d, amount);

function pay(d, amount, what) {
  if (d.money >= amount) { d.money -= amount; return true; }
  const h = helperFor(d, amount);
  if (!h) return false;
  h.money -= amount; bump(d, h, 3);
  setTimeout(() => say(h, pick(['我来付吧', '这顿我请～', '拿去用，不用还'])), 400);
  addLog(`💸 ${d.name} 钱不够，${h.name} 帮忙付了${what} ${yuan(amount)}`);
  return true;
}

function payday(d) {
  const J = JOBS[d.job];
  if (!J.wage) return;
  const w = Math.round(J.wage * (d.overtime ? 1.5 : 1));
  const c = d.job === 'student' ? 0 : Math.round(w * FUND_SHARE);   // 工资的 20% 存进家庭基金
  d.money += w - c; G.fund += c;
  addLog(`💰 ${d.name} ${J.wageName || '领到工资'} ${yuan(w)}${d.overtime ? '（含加班费）' : ''}${c ? `，${yuan(c)} 存进家庭基金` : ''}，个人存款 ${yuan(d.money)}`);
}

function nightlyBills() {
  const payers = G.dolls.filter(d => d.job !== 'student');   // 学生不用交房租
  for (const d of payers) d.money -= RENT;
  if (payers.length) addLog(`🏠 ${payers.map(d => d.name).join('、')} 交了房租水电，每人 ${yuan(RENT)}`);
  const sb = seasonBill();
  if (sb && payers.length) { for (const d of payers) d.money -= sb[1]; addLog(`${sb[0] === '暖气费' ? '🔥' : '🧊'} 每人还交了${sb[0]} ${yuan(sb[1])}`); }
  for (const d of G.dolls) if (d.job === 'artist' && Math.random() < (d.paintedDay >= G.day - 1 ? 0.7 : 0.25)) {
    const v = 200 + Math.round(Math.random() * 6) * 100;
    d.money += v; addLog(`🎨 ${d.name} 的画卖出去了，收入 ${yuan(v)}`);
  }
  // 欠债太多的人会出去找工作
  for (const d of G.dolls) if ((d.job === 'none' || d.job === 'artist') && d.money < -500 && Math.random() < 0.3) {
    d.job = pick(['barista', 'night', 'office']);
    addLog(`💼 ${d.name} 欠了 ${yuan(-d.money)}，终于去找了份工作：${JOBS[d.job].name}`);
  }
  const broke = G.dolls.filter(d => d.money < 0);
  for (const d of broke) d.needs.fun = Math.max(0, d.needs.fun - 20);
  if (broke.length) addLog(`😰 ${broke.map(d => d.name).join('、')} 的存款见底了`);
}
